<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0812">
<title>Horde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Tiny5&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0d0812; --night: #08060d; --panel: #150f1c; --panel2: #1f1629; --iron: #4a3d58; --iron2: #6f5d83; --bone: #eadfc4; --dim: #9a8aa8; --faint: #6a5c78;
    --blood: #d02c3c; --blood2: #7a1424; --gold: #f2c14e; --gold2: #b07a24; --violet: #b77cff; --violet2: #7b4dd8; --xp: #8fd8ff; --xp2: #3a7ad8; --hud: 58px; --tray: 86px; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); color: var(--bone); font: 400 16px/1.35 Tiny5, ui-monospace, monospace; overflow: hidden; -webkit-font-smoothing: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  canvas.px { image-rendering: crisp-edges; image-rendering: pixelated; }
  #c { position: fixed; left: 0; top: var(--hud); display: block; background: #08060d; touch-action: none; cursor: crosshair; }
  .goth { font-family: 'Jacquard 24', Tiny5, serif; font-weight: 400; letter-spacing: .01em; }

  /* the top bar: the hero's health, its level creeping toward ascension, its kit, and the night's clock */
  #hud { position: fixed; left: 0; right: 0; top: 0; height: calc(var(--hud) + env(safe-area-inset-top)); z-index: 5; display: flex; align-items: center; gap: 12px; box-sizing: border-box;
    padding: env(safe-area-inset-top) max(10px, env(safe-area-inset-right)) 0 max(70px, calc(env(safe-area-inset-left) + 66px)); background: var(--panel);
    box-shadow: inset 0 -2px 0 var(--ink), inset 0 -4px 0 var(--iron), 0 2px 0 var(--ink); }
  #who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
  #who canvas { flex: none; width: 28px; height: 32px; }
  #who .nm { font-size: 22px; line-height: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--bone); }
  #who .sub { font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; margin-top: 3px; }
  #bars { flex: 1 1 260px; min-width: 120px; max-width: 460px; display: flex; flex-direction: column; gap: 4px; }
  .bar { position: relative; height: 14px; background: var(--ink); box-shadow: 0 0 0 2px var(--iron); }
  .bar i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; }
  .bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font: 400 8px/1 Silkscreen, monospace; text-transform: uppercase; text-shadow: 1px 1px 0 var(--ink), -1px 0 0 var(--ink); }
  #hp i { background: linear-gradient(var(--blood) 0 3px, #a8202e 3px 7px, var(--blood2) 7px); transition: width .12s steps(4); }
  #hp i.ghost { background: #f4d0b0; transition: width .5s .25s; }
  #hp.hit { animation: hit .25s steps(2); }
  @keyframes hit { 50% { box-shadow: 0 0 0 2px #fff; } }
  #xp { height: 8px; }
  #xp i { background: linear-gradient(var(--xp) 0 2px, var(--xp2) 2px); top: 2px; bottom: 2px; transition: width .2s steps(3); }
  #xp b { display: none; }
  #lvrow { display: flex; justify-content: space-between; font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #lvrow b { color: var(--xp); font-weight: 400; }
  #lvrow .asc { color: var(--gold); }
  #kit { display: grid; grid-template-columns: repeat(4, 20px); grid-auto-rows: 22px; gap: 1px 3px; flex: none; }
  .slot { position: relative; width: 20px; height: 20px; background: var(--ink); box-shadow: inset 0 0 0 1px var(--iron); }
  .slot canvas { position: absolute; left: 1px; top: 1px; width: 18px; height: 18px; }
  .slot u { position: absolute; left: 1px; right: 1px; bottom: -2px; height: 2px; display: flex; gap: 1px; }
  .slot u s { flex: 1; background: var(--faint); } .slot u s.on { background: var(--gold); }
  .slot.new { animation: newslot .9s steps(3); }
  @keyframes newslot { 0%, 60% { box-shadow: inset 0 0 0 1px var(--gold), 0 0 0 2px var(--gold); } }
  #clock { flex: none; display: flex; align-items: center; gap: 7px; margin-left: auto; text-align: right; }
  #clock canvas { width: 24px; height: 24px; }
  #clock .t { font: 400 24px/1 Tiny5, monospace; font-variant-numeric: tabular-nums; }
  #clock .l { font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #clock.late .t { color: var(--gold); animation: late 1s steps(2) infinite; }
  @keyframes late { 50% { color: #fff3c8; } }
  .ib { width: 34px; height: 34px; flex: none; display: grid; place-items: center; padding: 0; cursor: pointer; background: var(--panel2); border: 0; box-shadow: inset 0 0 0 2px var(--iron), inset 0 -4px 0 var(--ink); }
  .ib:hover { background: #2a1f36; } .ib:active { transform: translateY(1px); }
  .ib svg { width: 18px; height: 18px; shape-rendering: crispEdges; }
  #bsound .x { display: none; } #bsound.off .w { display: none; } #bsound.off .x { display: inline; }

  /* the tray: your essence, what you can raise, and the flag */
  #tray { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tray) + env(safe-area-inset-bottom)); z-index: 5; display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box;
    padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); background: var(--panel);
    box-shadow: inset 0 2px 0 var(--ink), inset 0 4px 0 var(--iron), 0 -2px 0 var(--ink); }
  #ess { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #ess .n { font: 400 24px/1 Tiny5, monospace; color: var(--violet); font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 var(--ink); }
  #ess .l { font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); letter-spacing: 0; }
  #ess .bar { width: 58px; height: 6px; box-shadow: 0 0 0 1px var(--iron); }
  #ess .bar i { left: 1px; top: 1px; bottom: 1px; background: var(--violet); }
  #cards { display: flex; gap: 5px; min-width: 0; }
  .mc { position: relative; flex: none; width: 54px; height: 66px; padding: 0; border: 0; cursor: pointer; background: var(--panel2); box-shadow: inset 0 0 0 2px var(--iron), inset 0 -5px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 7px; box-sizing: border-box; transition: transform .08s steps(2); }
  .mc canvas { width: auto; height: auto; margin-bottom: auto; margin-top: 7px; }
  .mc .cost { font: 400 16px/1 Tiny5, monospace; color: var(--violet); text-shadow: 1px 1px 0 var(--ink); }
  .mc .n { position: absolute; right: 4px; top: 4px; font: 400 8px/1 Silkscreen, monospace; color: var(--dim); }
  .mc .k { position: absolute; left: 5px; top: 4px; font: 400 8px/1 Silkscreen, monospace; color: var(--faint); }
  body.touch .mc .k { display: none; }
  .mc:hover { background: #2a1f36; }
  .mc.sel { background: #2c1d3e; box-shadow: inset 0 0 0 2px var(--violet), 0 0 0 2px var(--ink), 0 0 0 4px var(--violet2), inset 0 -5px 0 var(--ink); transform: translateY(-4px); }
  .mc.poor canvas { filter: grayscale(.8) brightness(.6); } .mc.poor .cost { color: #8a5a6a; }
  .mc.locked { cursor: default; background: var(--ink); } .mc.locked canvas { filter: brightness(0); opacity: .7; } .mc.locked .cost { color: var(--faint); font: 400 8px/1 Silkscreen, monospace; }
  .mc.newly { animation: newly 1.2s steps(4) 3; }
  @keyframes newly { 50% { box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 2px var(--ink), 0 0 0 4px var(--gold); } }
  #hunt { flex: none; width: 66px; height: 66px; padding: 0; border: 0; cursor: pointer; background: var(--panel2); box-shadow: inset 0 0 0 2px var(--iron), inset 0 -5px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 400 8px/1 Silkscreen, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  #hunt canvas { width: 24px; height: 28px; }
  #hunt.on { color: #ff8a7a; box-shadow: inset 0 0 0 2px var(--blood), inset 0 -5px 0 var(--ink); background: #2a1218; }
  #hunt small { font-size: 8px; letter-spacing: 0; color: var(--faint); }

  /* the hero levels up and picks a card, in the top of the field */
  #pick { position: fixed; left: 50%; top: calc(var(--hud) + env(safe-area-inset-top) + 10px); transform: translateX(-50%); z-index: 6; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #pick .who { font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); text-shadow: 1px 1px 0 var(--ink); }
  #pick .row { display: flex; gap: 6px; }
  .pc { width: 74px; padding: 6px 4px 5px; background: var(--panel); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--iron); text-align: center; font-size: 16px; line-height: 1; transition: transform .15s steps(3), opacity .3s steps(3); }
  .pc canvas { display: block; margin: 0 auto 3px; width: 27px; height: 27px; }
  .pc .lv { display: block; color: var(--dim); font: 400 8px/1 Silkscreen, monospace; text-transform: uppercase; margin-top: 4px; }
  .pc.chosen { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold), 0 0 0 6px var(--ink); transform: translateY(-3px); background: #2a2014; }
  .pc.chosen .lv { color: var(--gold); }
  .pc.not { opacity: .35; transform: translateY(2px); }

  #hint { position: fixed; left: 50%; bottom: calc(var(--tray) + env(safe-area-inset-bottom) + 14px); transform: translate(-50%, 6px); max-width: min(460px, calc(100% - 32px)); box-sizing: border-box; padding: 8px 12px; z-index: 6;
    background: var(--panel); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--violet2), 0 0 0 6px var(--ink); text-align: center; font-size: 16px; line-height: 1.3; pointer-events: none; opacity: 0; transition: opacity .3s steps(3), transform .3s steps(3); }
  #hint.on { opacity: 1; transform: translate(-50%, 0); }
  #hint b { color: var(--violet); font-weight: 400; }
  #toast { position: fixed; left: 50%; top: 27%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center; opacity: 0; white-space: nowrap; }
  #toast .big { font-size: clamp(40px, 11vw, 84px); line-height: .9; color: var(--bone); text-shadow: 3px 3px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
  #toast small { display: block; margin-top: 8px; font-size: 16px; color: var(--dim); text-shadow: 1px 1px 0 var(--ink); }
  #toast.on { animation: toast 3s steps(12) forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%); } 10%, 80% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -54%); } }

  /* cards: the title, each hero's file, the end of a night, the pause */
  #card { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(8, 6, 13, .55); touch-action: pan-y; }
  #cbox { position: relative; width: min(500px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 24px 24px 20px; text-align: center; -webkit-overflow-scrolling: touch;
    background: var(--panel); box-shadow: 0 0 0 2px var(--ink), 0 0 0 5px var(--iron), 0 0 0 7px var(--ink), 8px 8px 0 7px rgba(0, 0, 0, .45);
    clip-path: polygon(0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px)); }
  #cbox { clip-path: none; }
  #cbox .eye { margin: 0; font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; letter-spacing: .2em; color: var(--dim); }
  #cbox .logo { margin: 2px 0 0; font-size: 104px; line-height: .8; color: var(--blood); text-shadow: 4px 4px 0 var(--ink), 0 -3px 0 #ff6a5a; }
  #cbox .tt { margin: 6px 0 4px; font-size: 52px; line-height: .9; color: var(--bone); text-shadow: 3px 3px 0 var(--ink); }
  #cbox .tt.red { color: var(--blood); } #cbox .tt.gold { color: var(--gold); } #cbox .tt.violet { color: var(--violet); }
  #cbox .lede { margin: 8px auto 12px; max-width: 420px; font-size: 16px; line-height: 1.4; color: var(--bone); }
  #cbox .how { text-align: left; margin: 12px auto 6px; padding: 0; list-style: none; font-size: 16px; line-height: 1.35; max-width: 430px; }
  #cbox .how li { position: relative; padding-left: 20px; margin-bottom: 7px; color: #d8cbe0; }
  #cbox .how li::before { content: ''; position: absolute; left: 3px; top: .42em; width: 8px; height: 8px; background: var(--violet); box-shadow: 2px 2px 0 var(--ink); }
  #cbox .how b { color: var(--violet); font-weight: 400; }
  #cbox .file { display: flex; gap: 16px; align-items: center; text-align: left; margin: 10px 0 6px; }
  #cbox .file canvas { flex: none; background: radial-gradient(closest-side, #3a2a1a, transparent); }
  #cbox .file .tx { font-size: 16px; line-height: 1.35; }
  #cbox .file .tx p { margin: 0 0 6px; }
  #cbox .file .tx .k { font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: block; margin-bottom: 2px; }
  #cbox .new { display: flex; gap: 12px; align-items: center; text-align: left; margin: 12px 0 4px; padding: 10px 12px; background: #23173a; box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--violet2); font-size: 16px; line-height: 1.3; }
  #cbox .new canvas { flex: none; }
  #cbox .new b { font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); display: block; margin-bottom: 3px; }
  #cbox .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin: 14px 0 6px; }
  #cbox .stats div { font: 400 8px/1.2 Silkscreen, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #cbox .stats b { display: block; font: 400 24px/1.1 Tiny5, monospace; color: var(--bone); letter-spacing: 0; text-transform: none; margin-bottom: 2px; }
  #cbox .build { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin: 8px 0 2px; }
  #cbox .tip { margin: 12px auto 0; max-width: 420px; font-size: 16px; color: #d8cbe0; padding: 8px 10px; background: var(--panel2); box-shadow: 0 0 0 2px var(--ink); }
  #cbox .tip b { color: var(--gold); font-weight: 400; }
  #cbox .small { margin: 12px 0 0; font-size: 16px; color: var(--dim); }
  #cbox .nights { display: flex; gap: 6px; justify-content: center; margin: 14px 0 2px; flex-wrap: wrap; }
  .nb { width: 44px; height: 44px; padding: 0; border: 0; cursor: pointer; background: var(--panel2); box-shadow: inset 0 0 0 2px var(--iron), inset 0 -4px 0 var(--ink); font: 400 24px/1 'Jacquard 24', serif; color: var(--bone); }
  .nb.won { color: var(--gold); } .nb.cur { box-shadow: inset 0 0 0 2px var(--violet), inset 0 -4px 0 var(--ink), 0 0 0 2px var(--violet2); }
  .nb:disabled { cursor: default; color: var(--faint); background: var(--ink); }
  #cbox .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .btn { min-height: 46px; padding: 0 20px; border: 0; cursor: pointer; background: var(--panel2); font: 400 16px/1 Tiny5, monospace; letter-spacing: .04em; text-transform: uppercase;
    box-shadow: inset 0 0 0 2px var(--iron), inset 0 -5px 0 var(--ink), 0 0 0 2px var(--ink); }
  .btn:hover { background: #2a1f36; } .btn:active { transform: translateY(2px); }
  .btn.go { background: var(--blood2); color: #ffe6dc; box-shadow: inset 0 0 0 2px var(--blood), inset 0 -5px 0 #3a0610, 0 0 0 2px var(--ink); }
  .btn.go:hover { background: #8e1a2c; }
  kbd { font: 400 8px/1 Silkscreen, monospace; padding: 3px 5px 4px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--iron), inset 0 -2px 0 var(--ink); }
  body.touch .keys { display: none; } body:not(.touch) .touchonly { display: none; }
  body.demo #hint, body.demo #pick { display: none; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; z-index: 30; background: var(--night); }

  @media (max-width: 760px) {
    :root { --hud: 76px; --tray: 82px; }
    #hud { flex-wrap: wrap; align-content: center; gap: 4px 8px; padding-top: calc(env(safe-area-inset-top) + 6px); padding-bottom: 6px; padding-left: max(66px, calc(env(safe-area-inset-left) + 62px)); }
    #who { order: 1; flex: 1 1 0; } #who .sub { display: none; } #who .nm { font-size: 22px; }
    #clock { order: 2; } #clock .l { display: none; } #clock canvas { width: 18px; height: 18px; } #clock .t { font-size: 16px; }
    #btns { order: 3; }
    #bars { order: 4; flex: 1 1 100%; max-width: none; margin-left: -56px; flex-direction: row; align-items: center; gap: 8px; }
    #bars .bar#hp { flex: 1 1 auto; }
    #bars .xpw { flex: 0 0 38%; display: flex; flex-direction: column; gap: 2px; }
    #kit { display: none; }
    .ib { width: 32px; height: 32px; }
    .mc { width: 46px; height: 62px; } .mc .n { right: 3px; }
    #ess { width: 50px; } #ess .n { font-size: 24px; } #ess .bar { width: 46px; }
    #hunt { width: 52px; height: 62px; } #hunt small { display: none; }
    #cbox { padding: 18px 16px 16px; } #cbox .logo { font-size: 84px; } #cbox .tt { font-size: 42px; } 
    #cbox .file { gap: 10px; }
  }
  @media (max-width: 400px) { #cards { gap: 3px; } .mc { width: 42px; } #tray { gap: 5px; } #ess { width: 44px; } #ess .bar { width: 40px; } }
  @media (max-height: 520px) and (min-width: 600px) {
    :root { --hud: 46px; --tray: 70px; }
    #who canvas { display: none; } #who .sub { display: none; } #kit { grid-auto-rows: 20px; grid-template-columns: repeat(8, 20px); }
    .mc { height: 56px; } #hunt { height: 56px; width: 56px; } #hunt small { display: none; }
    #cbox { padding: 14px 16px; } #cbox .logo { font-size: 64px; } #cbox .tt { font-size: 36px; } #cbox .how li { margin-bottom: 3px; }
  }
</style>
</head>
<body>
<canvas id="c" class="px" aria-label="A dark field at night: a hero with a lantern, and the monsters you raise closing in from the edges"></canvas>

<div id="hud">
  <div id="who"><canvas id="face" class="px" width="14" height="16"></canvas><div><div class="nm goth" id="hname">—</div><div class="sub" id="hnight">—</div></div></div>
  <div id="bars">
    <div class="bar" id="hp"><i class="ghost" id="hpg"></i><i id="hpf"></i><b><span>Hero</span><span id="hpn">0</span></b></div>
    <div class="xpw"><div class="bar" id="xp"><i id="xpf"></i></div><div id="lvrow"><span>Lv <b id="lv">1</b></span><span class="asc" id="asc">ascends at 20</span></div></div>
  </div>
  <div id="kit" aria-label="The hero's weapons and charms"></div>
  <div id="clock"><canvas id="moon" class="px" width="12" height="12"></canvas><div><div class="t" id="tleft">5:00</div><div class="l">to dawn</div></div></div>
  <div id="btns" style="display:flex;gap:6px">
    <button class="ib" id="bsound" aria-label="Sound on or off" title="Sound (M)"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M1 4h2l3-3v10L3 8H1z"/><path class="w" d="M8 3h1v1h1v4H9v1H8V8h1V4H8z"/><path class="x" d="M7 4h1v1h1V4h1v1H9v1h1v1H9v1H8V7H7V6h1V5H7z"/></svg></button>
    <button class="ib" id="bmenu" aria-label="Pause" title="Pause (Esc)"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 2h2v8H3zM7 2h2v8H7z"/></svg></button>
  </div>
</div>

<div id="tray">
  <div id="ess"><span class="n" id="essn">0</span><div class="bar"><i id="essf"></i></div><span class="l">essence</span></div>
  <div id="cards"></div>
  <button id="hunt" title="Send everything at the hero (Space)"><canvas id="huntc" class="px" width="12" height="14"></canvas><span id="huntl">Hunt</span><small class="keys">Space</small></button>
</div>

<div id="pick" hidden><div class="who" id="pickwho"></div><div class="row" id="pickrow"></div></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="card" hidden><div id="cbox"></div></div>
<div id="err" hidden></div>

<script type="module" src="main.js"></script>
</body>
</html>
