<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ten of Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #04060d; --night: #0a1433; --paper: #e9e4d4; --dim: #8e9bc4; --line: rgba(140, 165, 235, .28); --gold: #ffc94d; --red: #ff5a6a; --panel: rgba(9, 14, 34, .9); }
  html, body { height: 100%; margin: 0; }
  body { background: #050816; color: var(--paper); font: 500 15px/1.35 Oswald, 'Arial Narrow', system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  svg { display: block; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border: 1.5px solid var(--line); background: rgba(20, 30, 66, .85); border-radius: 8px; cursor: pointer; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn:hover { background: rgba(34, 50, 104, .95); border-color: rgba(170, 195, 255, .5); }
  .btn:active { transform: translateY(1px); }
  .btn.go { background: var(--gold); color: #1b1404; border-color: #ffe08a; }
  .btn.go:hover { background: #ffd56e; }
  .btn.warn { border-color: rgba(255, 90, 106, .6); }
  .btn svg { width: 18px; height: 18px; }
  kbd { font: 500 11px/1 Oswald, sans-serif; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--dim); text-transform: none; }

  /* the top: floor name (beside the Home button), the clock, the buttons */
  #top { position: fixed; top: 0; left: 0; right: 0; height: 64px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 0; box-sizing: content-box; pointer-events: none; z-index: 5; display: flex; align-items: flex-start; }
  #title { margin-left: max(66px, calc(env(safe-area-inset-left) + 60px)); padding-top: 4px; min-width: 0; flex: 1; }
  #title b { display: block; font-size: 21px; line-height: 1.05; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title span { display: block; font-size: 13px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  #clock { position: absolute; left: 50%; top: max(6px, env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; }
  #secs { display: block; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  #secs small { font-size: 20px; color: var(--dim); font-weight: 500; }
  #secs.low { color: var(--red); }
  #runno { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-top: 1px; }
  #btns { display: flex; gap: 6px; pointer-events: auto; padding-top: 2px; margin-left: auto; }
  #btns .btn { padding: 0 11px; min-height: 38px; }
  #bfast.on { background: rgba(95, 200, 255, .25); border-color: #5fc8ff; }

  /* the bottom: the timeline, and on phones the buttons either side of it */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center; gap: 14px;
    padding: 6px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); pointer-events: none; }
  #tlwrap { flex: 1; max-width: 900px; height: 96px; position: relative; pointer-events: auto; }
  #tl { width: 100%; height: 100%; display: block; cursor: pointer; }
  #tlcap { position: absolute; left: 22px; top: -17px; font-size: 11px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }
  .pad { display: none; gap: 10px; pointer-events: auto; }
  .pad button { width: 66px; height: 66px; border-radius: 14px; border: 2px solid rgba(160, 185, 255, .35); background: rgba(16, 26, 60, .78); display: grid; place-items: center; touch-action: none; padding: 0; }
  .pad button svg { width: 30px; height: 30px; }
  .pad button.on { background: rgba(255, 201, 77, .3); border-color: var(--gold); }
  .pad .grab { width: 76px; height: 76px; border-radius: 50%; background: rgba(255, 201, 77, .2); border-color: rgba(255, 201, 77, .65); }
  #rpad .ud { display: flex; flex-direction: column; gap: 8px; }
  #rpad .ud button { height: 56px; }
  #rpad { align-items: flex-end; }
  body.touch .pad { display: flex; }
  body.touch #tlwrap { height: 60px; align-self: center; }
  body.touch #hint, body.touch kbd { display: none; }
  /* a phone held upright: the timeline gets its own row */
  body.touch.tall #bottom { flex-wrap: wrap; justify-content: space-between; row-gap: 22px; }
  body.touch.tall #tlwrap { order: -1; flex-basis: 100%; max-width: none; height: 64px; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(86px, calc(env(safe-area-inset-bottom) + 80px)); font-size: 13px; color: var(--dim); letter-spacing: .04em; pointer-events: none; z-index: 4; white-space: nowrap; transition: opacity .6s; }
  #turn { position: fixed; left: 50%; transform: translateX(-50%); z-index: 4; font-size: 13px; color: var(--dim); pointer-events: none; text-align: center; white-space: nowrap; }

  /* a word in the middle of the floor: move to start, out of time, etc. */
  #msg { position: fixed; left: 50%; transform: translateX(-50%); z-index: 6; padding: 6px 16px; border-radius: 20px; background: rgba(4, 6, 13, .7); border: 1px solid var(--line); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
  #msg b { color: var(--gold); font-weight: 600; }

  /* the bar at the end of a run */
  #bar { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); z-index: 7; width: min(560px, calc(100% - 20px)); box-sizing: border-box; padding: 12px 14px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); text-align: center; }
  #bar h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #bar p { margin: 3px 0 10px; color: var(--dim); font-size: 15px; font-weight: 400; }
  #bar .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #bar.alarm { border-color: rgba(255, 90, 106, .7); } #bar.alarm h3 { color: var(--red); }

  /* cards: a floor's start, a floor won, the menu */
  #card { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(3, 5, 14, .72); touch-action: pan-y; }
  #cbox { width: min(520px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 22px 22px 20px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); text-align: center; -webkit-overflow-scrolling: touch; }
  #cbox .no { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  #cbox h2 { margin: 2px 0 10px; font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  #cbox p { margin: 0 0 12px; font-size: 17px; line-height: 1.45; font-weight: 400; color: #cfd6ee; }
  #cbox .par { font-size: 14px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  #cbox .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  #cbox .floors { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 12px 0 4px; text-align: left; }
  #cbox .floors button { padding: 8px 10px; border: 1.5px solid var(--line); background: rgba(20, 30, 66, .7); border-radius: 8px; cursor: pointer; text-align: left; }
  #cbox .floors button b { display: block; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #cbox .floors button span { font-size: 12px; color: var(--dim); }
  #cbox .floors button.cur { border-color: var(--gold); }
  #cbox .floors button:disabled { opacity: .35; cursor: default; }
  #cbox .floors button .ok { color: #5be0a6; }
  #cbox .how { text-align: left; font-size: 15px; color: #cfd6ee; margin: 0 0 6px; padding-left: 18px; font-weight: 400; }
  #cbox .how li { margin: 0 0 6px; }
  #cbox .tapes { display: flex; gap: 4px; justify-content: center; margin: 4px 0 12px; }
  #cbox .tapes i { width: 16px; height: 22px; border-radius: 3px; border: 1.5px solid rgba(255, 255, 255, .25); }
  #cbox .tapes i.off { opacity: .15; }

  @media (max-width: 640px) {
    #title b { font-size: 16px; } #title span { font-size: 11px; }
    #secs { font-size: 32px; } #secs small { font-size: 16px; } #runno { font-size: 10px; }
    #btns .btn .lbl, #btns kbd { display: none; }
    #btns .btn { padding: 0 8px; min-height: 36px; }
    #clock { left: auto; right: 50%; transform: translateX(50%); }
    #cbox h2 { font-size: 27px; } #cbox p { font-size: 16px; }
  }
  @media (max-width: 420px) { #title { display: none; } #clock { left: max(66px, calc(env(safe-area-inset-left) + 60px)); right: auto; transform: none; text-align: left; } #btns { gap: 5px; } #btns .btn { padding: 0 7px; } }
  @media (max-height: 460px) {
    #top { height: 50px; } #secs { font-size: 30px; } #secs small { font-size: 15px; } #runno { font-size: 10px; }
    #title b { font-size: 16px; } #title span { font-size: 11px; }
    #btns .btn .lbl, #btns kbd { display: none; } #btns .btn { padding: 0 8px; min-height: 34px; }
    .pad button { width: 58px; height: 58px; } .pad .grab { width: 66px; height: 66px; } #rpad .ud button { height: 46px; }
    #cbox { padding: 16px; } #cbox h2 { font-size: 24px; margin-bottom: 6px; } #cbox p { font-size: 15px; margin-bottom: 8px; } #cbox .row { margin-top: 10px; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="A museum at night, seen side-on"></canvas>

<div id="top">
  <div id="title"><b id="fname">Ten of Me</b><span id="fno"></span></div>
  <div id="clock"><span id="secs">30</span><span id="runno">Run 1 of 10</span></div>
  <div id="btns">
    <button class="btn" id="bstop" title="End this run here; this copy waits where it stands (Enter)"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg><span class="lbl">Stop</span><kbd>Enter</kbd></button>
    <button class="btn" id="bredo" title="Play this run again (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg><span class="lbl">Redo</span><kbd>R</kbd></button>
    <button class="btn" id="bfast" title="Hold to hurry time along (F)" aria-label="Fast forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6l8 6-8 6zM12 6l8 6-8 6z"/></svg></button>
    <button class="btn" id="bmenu" title="Floors and help (Esc)" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</div>

<div id="msg" hidden></div>
<div id="hint">Arrows or WASD to move and climb · Space to grab · Enter to stop · R to redo · hold F to hurry</div>
<div id="turn" hidden>Turn your phone sideways for a bigger museum</div>

<div id="bottom">
  <div class="pad" id="lpad">
    <button data-k="L" aria-label="Left"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 4L6 12l9 8z"/></svg></button>
    <button data-k="R" aria-label="Right"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4l9 8-9 8z"/></svg></button>
  </div>
  <div id="tlwrap"><span id="tlcap">The ten runs</span><canvas id="tl" aria-label="Timeline of your ten runs"></canvas></div>
  <div class="pad" id="rpad">
    <div class="ud">
      <button data-k="U" aria-label="Climb up"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 15l8-9 8 9z"/></svg></button>
      <button data-k="D" aria-label="Climb down"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9l8 9 8-9z"/></svg></button>
    </div>
    <button data-k="A" class="grab" aria-label="Grab or put down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V12"/><path d="M14 11.5V6a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L3.3 15a1.6 1.6 0 0 1 2.4-2.1L8 15"/></svg></button>
  </div>
</div>

<div id="bar" hidden></div>
<div id="card" hidden><div id="cbox"></div></div>

<script type="module" src="main.js"></script>
</body>
</html>
