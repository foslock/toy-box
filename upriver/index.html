<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Upriver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#2a2118; --paper:#f4ecd8; --card:#fbf6ea; --kraft:#c9a877; --red:#c7412b; --mustard:#d9a43a; --teal:#2f6b63; --dim:#7a6a55; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:#1a140e; color:var(--ink); font:17px/1.4 'Courier Prime', 'Courier New', monospace; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; }
body { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; position:fixed; inset:0; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; background:none; border:0; padding:0; }
[hidden] { display:none !important; }
h1, h2, h3, .serif { font-family:'Young Serif', Georgia, serif; font-weight:400; margin:0; }
:focus-visible { outline:3px solid var(--teal); outline-offset:3px; }

#app { position:absolute; inset:0; display:grid; grid-template-rows:minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); }
#stage { position:relative; overflow:hidden; touch-action:none; min-height:0; }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
#stage.aim { cursor:crosshair; }

/* top bar: reel name and the film counter */
#top { position:absolute; left:0; right:0; top:0; display:flex; align-items:flex-start; gap:10px; padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(62px, calc(env(safe-area-inset-left) + 60px)); pointer-events:none; z-index:4; }
#top > * { pointer-events:auto; }
.slip { background:var(--card); border:2px solid var(--ink); padding:4px 10px 3px; box-shadow:3px 3px 0 rgba(0,0,0,.35); transform:rotate(-1deg); }
#reelname { font-size:15px; line-height:1.15; min-width:0; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#reelname b { font-family:'Young Serif', serif; font-weight:400; font-size:19px; display:block; overflow:hidden; text-overflow:ellipsis; }
#film { margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; transform:rotate(1deg); flex:none; }
#film .strip { width:86px; height:18px; background:#2a2118; position:relative; border-radius:2px; overflow:hidden; }
#film .strip i { position:absolute; left:0; top:4px; bottom:4px; background:var(--mustard); }
#film .strip::before, #film .strip::after { content:''; position:absolute; left:0; right:0; height:3px; background:repeating-linear-gradient(90deg, #f4ecd8 0 4px, transparent 4px 9px); z-index:1; }
#film .strip::before { top:0.5px; } #film .strip::after { bottom:0.5px; }
#film.low { color:var(--red); }
.ib { width:46px; height:46px; display:grid; place-items:center; background:var(--card); border:2px solid var(--ink); box-shadow:3px 3px 0 rgba(0,0,0,.35); flex:none; }
.ib svg { width:24px; height:24px; fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.ib:active { transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.35); }

/* the kit and the record button */
#controls { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:flex-end; justify-content:space-between; padding:0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); pointer-events:none; z-index:4; }
#controls > * { pointer-events:auto; }
#kit { display:flex; gap:10px; }
.tool { position:relative; width:74px; height:74px; background:var(--card); border:2px solid var(--ink); box-shadow:3px 3px 0 rgba(0,0,0,.4); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:13px; font-weight:700; overflow:hidden; }
.tool:nth-child(1) { transform:rotate(-1.5deg); } .tool:nth-child(2) { transform:rotate(1deg); } .tool:nth-child(3) { transform:rotate(-0.5deg); }
.tool svg { width:36px; height:36px; }
.tool kbd { position:absolute; right:4px; top:2px; font:700 12px 'Courier Prime', monospace; color:var(--dim); }
.tool .cd { position:absolute; left:0; right:0; bottom:0; background:rgba(42,33,24,.32); height:0; pointer-events:none; }
.tool:active { translate:2px 2px; box-shadow:1px 1px 0 rgba(0,0,0,.4); }
.tool.call { animation:call 1.1s ease-in-out infinite; }
@keyframes call { 50% { background:#ffe6a6; } }
#right { display:flex; align-items:flex-end; gap:10px; }
#zoom { display:flex; flex-direction:column; gap:8px; }
#zoom button { width:50px; height:50px; background:var(--card); border:2px solid var(--ink); box-shadow:3px 3px 0 rgba(0,0,0,.4); font:700 26px/1 'Courier Prime', monospace; }
#zoom button:active { translate:2px 2px; }
#rec { width:104px; height:104px; border-radius:50%; background:var(--red); color:var(--card); border:3px solid var(--ink); box-shadow:4px 4px 0 rgba(0,0,0,.45); display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; font-size:20px; letter-spacing:.06em; line-height:1; touch-action:none; }
#rec small { font-size:12px; letter-spacing:.04em; margin-top:4px; opacity:.85; }
#rec.on { background:#e8553b; box-shadow:1px 1px 0 rgba(0,0,0,.45); translate:3px 3px; }
#rec.on::before { content:''; width:12px; height:12px; border-radius:50%; background:var(--card); margin-bottom:5px; animation:blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }
#rec.empty { background:#8d7f6c; }
.mouse #controls .tool, .mouse #zoom button { width:auto; min-width:68px; height:62px; }
.mouse #rec { width:86px; height:86px; font-size:17px; }

/* phones held upright: kit and record button get their own strip under the picture */
.portrait #controls { position:static; grid-row:2; background:#2a2118; padding-top:10px; border-top:3px solid #120d08; }
.portrait #controls { padding-left:max(10px, env(safe-area-inset-left)); padding-right:max(10px, env(safe-area-inset-right)); }
.portrait #kit { gap:7px; }
.portrait .tool { width:62px; height:66px; font-size:12px; }
.portrait .tool svg { width:30px; height:30px; }
.portrait #rec { width:84px; height:84px; font-size:18px; }
.portrait #zoom { gap:6px; }
.portrait #zoom button { width:42px; height:40px; font-size:22px; }
.portrait #right { gap:7px; }
.portrait #top { padding-left:max(58px, calc(env(safe-area-inset-left) + 56px)); gap:6px; }
.portrait #reelname { font-size:12px; } .portrait #reelname b { font-size:16px; }
.portrait #film .strip { width:44px; }
.portrait .ib { width:42px; height:42px; }
.squat .tool { width:60px; height:60px; font-size:12px; } .squat .tool svg { width:28px; height:28px; }
.squat #rec { width:80px; height:80px; font-size:17px; }
.squat #zoom button { width:44px; height:44px; }

/* take results that slide in */
#toast { position:absolute; left:50%; bottom:124px; transform:translateX(-50%) rotate(-1deg); background:var(--card); border:2px solid var(--ink); box-shadow:4px 4px 0 rgba(0,0,0,.4); padding:7px 14px 6px; z-index:6; pointer-events:none; font-size:16px; line-height:1.25; text-align:center; width:max-content; max-width:min(460px, calc(100vw - 24px)); opacity:0; transition:opacity .2s, translate .2s; translate:0 -8px; }
#toast.show { opacity:1; translate:0 0; }
#toast b { font-family:'Young Serif', serif; font-weight:400; font-size:19px; }
#toast .st { color:var(--mustard); letter-spacing:2px; font-size:18px; }

/* the producer's index card (tutorial) */
#coach { position:absolute; left:50%; top:max(64px, calc(env(safe-area-inset-top) + 58px)); transform:translateX(-50%) rotate(0.6deg); width:min(400px, calc(100% - 20px)); background:var(--card) repeating-linear-gradient(transparent 0 23px, rgba(80,120,170,.25) 23px 24px); background-position:0 30px; border:2px solid var(--ink); box-shadow:5px 5px 0 rgba(0,0,0,.42); padding:8px 14px 10px; z-index:5; pointer-events:none; font-size:16px; line-height:24px; }
#coach::before { content:''; position:absolute; left:50%; top:-12px; width:70px; height:22px; margin-left:-35px; background:rgba(230,214,160,.85); transform:rotate(-3deg); }
#coach h3 { font-size:18px; color:var(--red); line-height:24px; }
#coach .step { color:var(--dim); font-size:13px; float:right; }
#coach .row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:4px; }
#coach button { pointer-events:auto; }
#coach .skip { text-decoration:underline; font-size:14px; color:var(--dim); padding:6px 4px 2px 0; }
#coach .go { background:var(--red); color:var(--card); border:2px solid var(--ink); padding:6px 14px; font-weight:700; box-shadow:2px 2px 0 var(--ink); }
.portrait #coach { top:max(62px, calc(env(safe-area-inset-top) + 56px)); }
.squat #coach { font-size:14px; line-height:20px; width:min(360px, calc(100% - 20px)); padding:5px 12px 6px; background:var(--card) repeating-linear-gradient(transparent 0 19px, rgba(80,120,170,.25) 19px 20px); background-position:0 25px; } .squat #coach h3 { font-size:16px; line-height:20px; }
.portrait #toast { bottom:12px; }
.squat #toast { bottom:88px; }

/* sheets: title, reels, guide, cutting room, results, pause */
.sheet { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:max(60px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom)); background:rgba(26,20,14,.55); overflow:auto; }
.sheet.clear { background:transparent; }
.board { position:relative; background:var(--paper); border:2px solid var(--ink); box-shadow:7px 7px 0 rgba(0,0,0,.45); width:min(560px, 100%); padding:20px 22px 22px; margin:auto; }
.board::after { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%); }
.board h2 { font-size:30px; line-height:1.1; }
.board .kick { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--red); font-weight:700; }
.board p { margin:10px 0; }
.btns { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.btn { background:var(--card); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); min-height:48px; padding:8px 18px; font-weight:700; font-size:17px; }
.btn.red { background:var(--red); color:var(--card); }
.btn:active { translate:2px 2px; box-shadow:1px 1px 0 var(--ink); }
@media (hover:hover) { .btn:hover { background:#fff; } .btn.red:hover { background:#d94e35; } }
.btn.small { min-height:40px; padding:5px 12px; font-size:15px; }

#title .board { width:min(620px, 100%); text-align:center; padding-top:28px; transform:rotate(-0.4deg); }
#title h1 { font-size:clamp(52px, 13vw, 92px); line-height:.95; letter-spacing:-.01em; color:var(--ink); }
#title .sub { font-family:'Young Serif', serif; font-size:19px; color:var(--teal); margin-top:6px; }
#title .credit { font-size:14px; color:var(--dim); margin-top:14px; line-height:1.5; }
#title .btns { justify-content:center; }
.toggles { display:flex; gap:14px; justify-content:center; margin-top:14px; font-size:15px; flex-wrap:wrap; }
.toggles button { text-decoration:underline; text-underline-offset:3px; padding:6px 2px; }

#reels .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:14px; }
.can { position:relative; background:var(--card); border:2px solid var(--ink); padding:10px 10px 12px; text-align:left; display:flex; gap:10px; align-items:center; box-shadow:3px 3px 0 rgba(0,0,0,.3); min-height:92px; }
.can .disc { width:58px; height:58px; border-radius:50%; flex:none; border:3px solid var(--ink); display:grid; place-items:center; font:22px 'Young Serif', serif; color:var(--card); }
.can .disc::after { content:''; }
.can b { font-family:'Young Serif', serif; font-weight:400; font-size:18px; display:block; line-height:1.15; }
.can small { color:var(--dim); font-size:13px; display:block; }
.can .st { color:var(--mustard); font-size:16px; letter-spacing:2px; }
.can[disabled] { opacity:.55; cursor:default; }
.can[disabled]::before { content:''; position:absolute; left:-6px; right:-6px; top:44%; height:20px; background:rgba(214,196,140,.9); transform:rotate(-4deg); }

#guide .board { width:min(760px, 100%); padding:16px 16px 18px; }
#guide .tabs { display:flex; gap:6px; margin:10px 0 12px; flex-wrap:wrap; }
#guide .tabs button { border:2px solid var(--ink); padding:4px 10px; background:var(--card); font-size:14px; font-weight:700; }
#guide .tabs button.on { background:var(--ink); color:var(--card); }
.spp { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.spc { background:var(--card); border:2px solid var(--ink); padding:8px 9px 9px; font-size:13.5px; line-height:1.3; min-width:0; }
.spc canvas { width:100%; height:auto; aspect-ratio:16/10; display:block; background:#efe4cb; border:1px solid rgba(42,33,24,.25); }
.spc h3 { font-size:17px; margin-top:6px; line-height:1.1; }
.spc i { color:var(--dim); font-size:12.5px; display:block; }
.spc ul { list-style:none; padding:0; margin:6px 0 0; }
.spc li { padding:3px 0; border-top:1px dashed rgba(42,33,24,.3); display:flex; gap:6px; }
.spc li .s { color:var(--mustard); flex:none; width:44px; letter-spacing:1px; }
.spc li.no { color:var(--dim); }
.spc li.no .s { color:#b8a888; }
#guide .count { float:right; font-weight:700; font-size:15px; margin-top:6px; }

#cutting .board { width:min(820px, 100%); padding:16px 16px 18px; background:#e9e0c8; }
.takes { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; margin-top:12px; }
.take { position:relative; background:#1d1712; border:2px solid var(--ink); padding:6px; color:var(--card); text-align:left; font-size:13.5px; line-height:1.25; }
.take canvas { width:100%; aspect-ratio:16/9; height:auto; display:block; background:#000; }
.take .lab { margin-top:5px; min-height:34px; }
.take .lab b { font-family:'Young Serif', serif; font-weight:400; font-size:15px; display:block; }
.take .pts { color:var(--mustard); }
.take.sel { outline:4px solid var(--mustard); outline-offset:-1px; }
.take.sel::after { content:'IN'; position:absolute; right:-8px; top:-10px; background:var(--mustard); color:var(--ink); font-weight:700; padding:1px 8px; border:2px solid var(--ink); transform:rotate(5deg); }
.take:not(.sel) canvas { opacity:.5; }
#cutting .note { font-size:15px; color:var(--dim); }

#results .board { text-align:center; }
#results .big { font-size:44px; color:var(--mustard); letter-spacing:6px; line-height:1.1; text-shadow:1px 1px 0 var(--ink); }
#results .quote { font-family:'Young Serif', serif; font-size:20px; margin:8px 0 2px; }
#results .by { font-size:13px; color:var(--dim); }
#results table { width:100%; border-collapse:collapse; margin-top:12px; font-size:14.5px; text-align:left; }
#results td { padding:4px 2px; border-top:1px dashed rgba(42,33,24,.35); }
#results td:last-child { text-align:right; white-space:nowrap; }
#results .new { margin-top:10px; font-size:14.5px; color:var(--teal); text-align:left; }
#results .btns { justify-content:center; }

/* the screening */
#screen { position:absolute; inset:0; z-index:8; pointer-events:none; }
#subs { position:absolute; left:50%; transform:translateX(-50%); width:min(760px, calc(100% - 28px)); text-align:center; color:#f2e8cf; font:clamp(17px, 2.4vw, 22px)/1.4 'Young Serif', Georgia, serif; text-shadow:0 1px 2px #000; min-height:3em; }
#scrctl { position:absolute; right:max(12px, env(safe-area-inset-right)); bottom:max(12px, env(safe-area-inset-bottom)); display:flex; gap:8px; pointer-events:auto; }
#scrctl button { background:rgba(244,236,216,.92); border:2px solid var(--ink); padding:6px 12px; font-weight:700; font-size:15px; min-height:44px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="top" hidden>
      <div id="reelname" class="slip"><span id="reelno">Reel 1</span><b id="reeltitle">The Misty Wood</b></div>
      <div id="film" class="slip" title="Film left on the reel"><div class="strip"><i id="filmbar"></i></div><span id="filmtxt">90s</span></div>
      <button id="pause" class="ib" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
    <div id="toast"></div>
    <div id="coach" hidden></div>
    <div id="screen" hidden><div id="subs"></div><div id="scrctl"><button id="voice">Voice: on</button><button id="skip">Skip ▸</button></div></div>
  </div>
  <div id="controls" hidden>
    <div id="kit">
      <button class="tool" id="t-fruit" aria-label="Throw fruit (1)"><kbd>1</kbd>
        <svg viewBox="0 0 40 40"><path d="M20 13c-7-3-14 1-14 10 0 7 6 13 14 11 8 2 14-4 14-11 0-9-7-13-14-10z" fill="#d9483a" stroke="#2a2118" stroke-width="2"/><path d="M20 13c0-4 1-6 3-8" stroke="#5a3a1c" stroke-width="2.4" fill="none"/><path d="M22 9c4-3 8-2 9 0-3 3-6 3-9 0z" fill="#5f8a34" stroke="#2a2118" stroke-width="1.6"/></svg>Fruit<i class="cd"></i></button>
      <button class="tool" id="t-whistle" aria-label="Whistle (2)"><kbd>2</kbd>
        <svg viewBox="0 0 40 40"><path d="M6 17h18a8 8 0 1 1-8 9H6z" fill="#d9a43a" stroke="#2a2118" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="25" r="3" fill="#2a2118"/><path d="M28 10c3-2 6-2 8 0M30 5c3-1 5 0 6 1" stroke="#2a2118" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Whistle<i class="cd"></i></button>
      <button class="tool" id="t-bubbles" aria-label="Blow bubbles (3)"><kbd>3</kbd>
        <svg viewBox="0 0 40 40"><circle cx="15" cy="23" r="9" fill="#cfe9ef" stroke="#2a2118" stroke-width="2"/><circle cx="28" cy="13" r="6" fill="#cfe9ef" stroke="#2a2118" stroke-width="2"/><circle cx="31" cy="28" r="4" fill="#cfe9ef" stroke="#2a2118" stroke-width="2"/><path d="M10 19a5 5 0 0 1 4-3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Bubbles<i class="cd"></i></button>
    </div>
    <div id="right">
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
      <button id="rec" aria-label="Hold to film">REC<small>HOLD</small></button>
    </div>
  </div>
  <div id="sheets"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
