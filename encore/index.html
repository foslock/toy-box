<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Encore</title>
<meta name="description" content="A rhythm dungeon on a light-up disco floor, where every relic adds a part to the song and every part is a power.">
<meta name="theme-color" content="#120c0e">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #120c0e; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<canvas id="cv" aria-label="Encore: a rhythm dungeon on a light-up disco floor"></canvas>
<div id="safe"></div>
<script type="module" src="main.js"></script>
</body>
</html>
