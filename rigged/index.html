<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rigged Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bangers&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a1a10; --ink-2: #5a3a24; --ink-3: #8f6a48; --tin: #f3e3c3; --tin-2: #e6cfa0; --tin-3: #c9a670;
    --rust: #b8492a; --gold: #ffc21a; --good: #4f9e3c; --bad: #d23a2c; --line: #2a1a10;
    --card: 56px;
  }
  html, body { height: 100%; margin: 0; }
  html, body { touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { background: #e9b66c; color: var(--ink); font: 500 15px/1.35 Fredoka, system-ui, sans-serif; overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  #c.grabbing { cursor: grabbing; } #c.placing { cursor: crosshair; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }

  /* chunky cartoon buttons: thick dark outline, a shadow they press down into */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 16px; box-sizing: border-box; cursor: pointer; white-space: nowrap;
    border: 3px solid var(--line); border-radius: 14px; background: var(--tin); color: var(--ink); font: 600 16px/1 Fredoka, system-ui, sans-serif;
    box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s, background-color .15s; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.go { background: var(--gold); min-width: 120px; font-size: 19px; font-weight: 700; }
  .btn.go.ready { animation: ready 1.4s ease-in-out infinite; }
  @keyframes ready { 50% { background: #ffe07a; } }
  .btn.round { width: 42px; height: 42px; padding: 0; border-radius: 50%; }
  .btn.small { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 11px; box-shadow: 0 3px 0 var(--line); }
  .btn.on { background: #ffe07a; }
  @media (hover: hover) and (pointer: fine) { .btn:hover:not(:disabled) { background: #fff3d8; } .btn.go:hover:not(:disabled) { background: #ffd54a; } }

  /* the level's name, beside the Home button */
  .top { position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top)); left: 60px; right: max(10px, env(safe-area-inset-right)); display: flex; align-items: flex-start; gap: 8px; pointer-events: none; }
  .title { flex: 1; min-width: 0; margin: 0; color: #fff; text-shadow: 0 2px 0 var(--line), 2px 0 0 var(--line), -2px 0 0 var(--line), 0 -2px 0 var(--line), 0 3px 8px rgba(0, 0, 0, .3); }
  .title b { display: block; font: 400 26px/1.05 Bangers, Fredoka, sans-serif; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title small { display: block; margin-top: 1px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 7px; pointer-events: auto; }
  .tools .x { display: none; } .tools .muted .x { display: inline; } .tools .muted .w { display: none; }

  /* the goal, under the name */
  .goal { position: fixed; z-index: 5; left: max(10px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 54px); display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 20px); pointer-events: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 3px; box-sizing: border-box; border: 3px solid var(--line); border-radius: 17px; background: var(--tin);
    box-shadow: 0 3px 0 var(--line); font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .chip .f { width: 26px; height: 26px; flex: none; }
  .chip .ok { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; background: #ddd; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; line-height: 1; }
  .chip.yes .ok { background: var(--good); } .chip.yes .ok::after { content: '✓'; }
  .chip.no .ok { background: var(--bad); } .chip.no .ok::after { content: '✗'; }
  .chip.lead { padding-left: 10px; background: #fff8e6; font-size: 13px; }

  /* the standings: down the left on wide screens, along the top on narrow */
  .board { position: fixed; z-index: 4; margin: 0; padding: 0; list-style: none; display: flex; gap: 5px; pointer-events: auto; }
  .board li { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: transform .25s; }
  .board .n { width: 22px; font: 400 20px/1 Bangers, Fredoka, sans-serif; color: #fff; text-align: center; text-shadow: 0 2px 0 var(--line), 1.5px 0 0 var(--line), -1.5px 0 0 var(--line), 0 -1.5px 0 var(--line); }
  .board .f { width: 34px; height: 34px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--line), 0 3px 0 2.5px var(--line); }
  .board .nm { font-weight: 600; font-size: 14px; color: #fff; text-shadow: 0 1.5px 0 var(--line), 1px 0 0 var(--line), -1px 0 0 var(--line), 0 -1px 0 var(--line); white-space: nowrap; }
  .board .it { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); box-sizing: border-box; padding: 2px; background: var(--c, #888); flex: none; }
  .board .it svg { width: 100%; height: 100%; }
  .board li.goal-who .f { box-shadow: 0 0 0 2.5px var(--line), 0 3px 0 2.5px var(--line), 0 0 0 6px var(--gold); }
  .board li.done .n { color: var(--gold); }
  body.wide .board { left: max(10px, env(safe-area-inset-left)); flex-direction: column; }
  body:not(.wide) .board { left: 8px; right: 8px; flex-direction: row; justify-content: center; flex-wrap: nowrap; }
  body:not(.wide) .board .nm { display: none; }
  body:not(.wide) .board li { flex-direction: column; gap: 2px; position: relative; }
  body:not(.wide) .board .n { position: absolute; left: -4px; top: -6px; width: auto; font-size: 17px; z-index: 1; }
  body:not(.wide) .board .f { width: 30px; height: 30px; }
  body:not(.wide) .board .it { position: absolute; right: -6px; bottom: -4px; width: 18px; height: 18px; border-radius: 5px; padding: 1px; border-width: 1.5px; }

  /* badges over the karts, and the traps' buttons */
  .tag { position: fixed; z-index: 3; left: 0; top: 0; pointer-events: none; display: flex; align-items: center; gap: 3px; transform: translate(-50%, -100%); will-change: transform; }
  .tag b { min-width: 20px; height: 20px; padding: 0 4px; box-sizing: border-box; border-radius: 10px; border: 2px solid var(--line); background: var(--c); color: #fff; font: 400 15px/16px Bangers, Fredoka, sans-serif; text-align: center; text-shadow: 0 1px 0 var(--line); }
  .tag i { width: 18px; height: 18px; box-sizing: border-box; border-radius: 6px; border: 2px solid var(--line); padding: 1px; background: var(--ic, #888); }
  .tag i svg { width: 100%; height: 100%; }
  .tag.goal-who b { box-shadow: 0 0 0 3px var(--gold); }
  .trap { position: fixed; z-index: 4; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; transform: translate(-50%, -50%); pointer-events: auto; }
  .trap button { width: 44px; height: 44px; padding: 5px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--line); background: var(--c); box-shadow: 0 4px 0 var(--line); cursor: pointer; }
  .trap button svg { width: 100%; height: 100%; filter: drop-shadow(0 1.5px 0 rgba(42, 26, 16, .5)); }
  .trap button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .trap span { padding: 1px 7px; border-radius: 9px; border: 2px solid var(--line); background: var(--tin); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .trap.off button { filter: grayscale(1) brightness(1.1); opacity: .6; }
  .trap.armed button { animation: armed .5s ease-in-out infinite alternate; }
  @keyframes armed { from { box-shadow: 0 4px 0 var(--line), 0 0 0 4px #ff3a2a; } to { box-shadow: 0 4px 0 var(--line), 0 0 0 9px rgba(255, 58, 42, .35); } }
  .trap.armed span { background: #ff5a3d; color: #fff; }
  .trap.shut button { background: #8a7a60; }

  /* the dock: what you have, and the race's controls */
  .dock { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); width: min(760px, calc(100vw - 16px)); box-sizing: border-box;
    padding: 8px 10px 10px; border: 3px solid var(--line); border-radius: 18px; background: var(--tin);
    background-image: repeating-linear-gradient(90deg, rgba(160, 110, 50, .07) 0 3px, transparent 3px 22px), radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, .45), transparent 70%);
    box-shadow: 0 5px 0 var(--line), inset 0 0 0 3px var(--tin-2);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "status status" "tray actions"; gap: 4px 8px; align-items: center; }
  .dock .status { grid-area: status; } .dock .tray { grid-area: tray; } .dock .actions { grid-area: actions; }
  /* narrow: the buttons up beside the lap, the cards across the whole width below */
  @media (max-width: 600px) { .dock { grid-template-areas: "status actions" "tray tray"; padding-top: 6px; } .dock .status .grow { display: none; } .dock .status { flex-wrap: wrap; gap: 0 8px; } }
  .dock .rivets { position: absolute; inset: 5px; pointer-events: none; }
  .status { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 0 4px; }
  .status .lap { font: 400 21px/1 Bangers, Fredoka, sans-serif; letter-spacing: .04em; color: var(--rust); }
  .status .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status .clock { font-variant-numeric: tabular-nums; }
  .tray { min-width: 0; display: flex; gap: 9px; overflow-x: auto; overflow-y: visible; padding: 10px 4px 6px; scrollbar-width: none; touch-action: pan-x; }
  .tray::-webkit-scrollbar { display: none; }
  .actions { display: flex; gap: 7px; flex: none; }
  .actions .btn.small { width: 44px; height: 44px; padding: 0; border-radius: 14px; box-shadow: 0 4px 0 var(--line); }
  .actions .btn.small:active:not(:disabled) { box-shadow: 0 1px 0 var(--line); }
  .actions #bSpeed { font: 700 15px/1 Fredoka, sans-serif; }

  /* a card: a coloured tile with its icon, name and how many */
  .card { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; width: var(--card); height: calc(var(--card) + 6px);
    box-sizing: border-box; padding: 4px 2px 3px; border: 3px solid var(--line); border-radius: 12px; background: var(--c, #ccc); color: #fff; cursor: grab;
    box-shadow: 0 4px 0 var(--line); touch-action: none; transition: transform .12s, box-shadow .12s, filter .15s; }
  .card svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 1.5px 0 rgba(42, 26, 16, .5)); }
  .card span { font: 700 10.5px/1 Fredoka, sans-serif; text-shadow: 0 1px 0 rgba(42, 26, 16, .7); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .card .n { position: absolute; right: -8px; top: -9px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 11px; border: 2.5px solid var(--line);
    background: #fff; color: var(--ink); font: 700 12px/17px Fredoka, sans-serif; text-align: center; text-shadow: none; }
  .card.out { filter: grayscale(1) brightness(1.15); opacity: .45; cursor: default; }
  .card.sel { transform: translateY(-6px) scale(1.06); box-shadow: 0 0 0 4px var(--gold), 0 6px 0 var(--line); }
  .card.trapc { border-radius: 50% 50% 12px 12px; }
  .card.armed { box-shadow: 0 0 0 4px #ff3a2a, 0 4px 0 var(--line); }
  .card.new { animation: newcard 1.1s ease-in-out 3; }
  @keyframes newcard { 50% { transform: translateY(-7px) rotate(-4deg); box-shadow: 0 0 0 4px var(--gold), 0 8px 0 var(--line); } }
  .card.ghost { position: fixed; z-index: 50; left: 0; top: 0; margin: 0; pointer-events: none; transition: none; animation: none; box-shadow: 0 10px 18px rgba(0, 0, 0, .3), 0 4px 0 var(--line); }
  .why { position: fixed; z-index: 51; left: 0; top: 0; padding: 4px 9px; border-radius: 10px; border: 2.5px solid var(--line); background: #ff5a3d; color: #fff; font-size: 13px; font-weight: 600; pointer-events: none; white-space: nowrap; transform: translate(-50%, -130%); }
  @media (max-width: 520px) { :root { --card: 50px; } .card svg { width: 26px; height: 26px; } .card span { font-size: 9.5px; } .btn.go { min-width: 92px; font-size: 17px; padding: 0 10px; } .title b { font-size: 22px; } .tray { gap: 8px; } }
  @media (max-width: 380px) { :root { --card: 46px; } .card span { display: none; } }

  /* big words over the track: the count down, a new lap */
  .banner { position: fixed; z-index: 9; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; color: #fff;
    font: 400 72px/1 Bangers, Fredoka, sans-serif; letter-spacing: .05em; text-shadow: 0 5px 0 var(--line), 4px 0 0 var(--line), -4px 0 0 var(--line), 0 -4px 0 var(--line), 3px 3px 0 var(--line), -3px 3px 0 var(--line), 0 10px 20px rgba(0, 0, 0, .3); opacity: 0; }
  .banner small { display: block; font: 600 19px/1.2 Fredoka, sans-serif; letter-spacing: 0; margin-top: 6px; text-shadow: 0 2px 0 var(--line), 2px 0 0 var(--line), -2px 0 0 var(--line), 0 -2px 0 var(--line); }
  .banner.show { animation: bang 1.1s ease-out forwards; }
  .banner.stay { animation: bangin .35s ease-out forwards; }
  @keyframes bang { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2) rotate(-6deg); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05) rotate(-3deg); } }
  @keyframes bangin { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2) rotate(-6deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); } }

  /* messages */
  .toast { position: fixed; z-index: 8; left: 50%; transform: translate(-50%, 0); max-width: min(440px, calc(100vw - 24px)); box-sizing: border-box;
    padding: 10px 14px; border: 3px solid var(--line); border-radius: 16px; background: var(--tin); box-shadow: 0 5px 0 var(--line); text-align: center; font-size: 15px; transition: opacity .25s, transform .25s; }
  .toast.away { opacity: 0; transform: translate(-50%, -12px); pointer-events: none; }
  .toast b { display: block; font-size: 18px; margin-bottom: 2px; }
  .toast p { margin: 0; color: var(--ink-2); }
  .toast .row { display: flex; justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .toast.bad b { color: #b8322a; } .toast.good b { color: #2f7a28; }
  .tip { position: fixed; z-index: 7; display: flex; gap: 10px; align-items: flex-start; left: 50%; transform: translateX(-50%); width: min(460px, calc(100vw - 20px)); box-sizing: border-box; padding: 10px 12px 11px 10px;
    border: 3px solid var(--line); border-radius: 16px; background: #fffaf0; box-shadow: 0 5px 0 var(--line); transition: opacity .25s, transform .25s; }
  .tip.away { opacity: 0; transform: translate(-50%, -8px); pointer-events: none; }
  .tip .f { width: 46px; height: 46px; flex: none; }
  .tip .words { flex: 1; font-size: 15px; line-height: 1.35; }
  .tip .who { display: block; font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .tip .row { display: flex; justify-content: flex-end; margin-top: 7px; }

  /* sheets over everything: a race's start and end, the racers, the events, help */
  .veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 12px; box-sizing: border-box; background: rgba(60, 30, 10, .45); }
  .sheet { position: relative; width: min(470px, 100%); max-height: calc(100% - 4px); overflow: auto; box-sizing: border-box; padding: 20px 20px 18px; border: 3px solid var(--line); border-radius: 20px;
    background: var(--tin); background-image: radial-gradient(120% 60% at 50% 0%, rgba(255, 255, 255, .5), transparent 70%); box-shadow: 0 7px 0 var(--line), 0 30px 60px -20px rgba(0, 0, 0, .6); text-align: center;
    -webkit-user-select: text; user-select: text; touch-action: pan-y; overscroll-behavior: contain; }
  .sheet h2 { margin: 0 0 4px; font: 400 36px/1 Bangers, Fredoka, sans-serif; letter-spacing: .04em; color: var(--rust); text-shadow: 0 2px 0 rgba(42, 26, 16, .2); }
  .sheet .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .sheet p { margin: 0 0 10px; color: var(--ink-2); font-size: 15.5px; }
  .sheet .row { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
  .note { display: flex; gap: 10px; align-items: flex-start; text-align: left; margin: 8px 0 12px; padding: 10px 12px; border: 2.5px dashed var(--tin-3); border-radius: 14px; background: #fff8e8; }
  .note .f { width: 52px; height: 52px; flex: none; }
  .note p { margin: 0; font-size: 15px; color: var(--ink); font-style: italic; }
  .note small { display: block; margin-top: 4px; font-style: normal; color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
  .goalline { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; font-weight: 700; font-size: 17px; }
  .goalline .f { width: 30px; height: 30px; }
  .lineup { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0 4px; }
  .lineup button { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; padding: 4px 2px; border: 0; background: none; cursor: pointer; border-radius: 12px; }
  .lineup button:hover { background: rgba(255, 255, 255, .5); }
  .lineup .f { width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--line), 0 3px 0 2.5px var(--line); }
  .lineup b { font-size: 12.5px; }
  .lineup .tr { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; } .lineup .tr em { font-style: normal; font-size: 10px; padding: 0 4px; border-radius: 6px; background: var(--tin-2); color: var(--ink-2); font-weight: 700; }
  .sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 9px 12px; margin: 12px 0 4px; text-align: left; align-items: center; }
  .sheet dt .card { cursor: default; }
  .sheet dd { margin: 0; font-size: 14.5px; color: var(--ink-2); }
  .sheet dd b { color: var(--ink); }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; text-align: left; margin: 10px 0; font-size: 13.5px; font-weight: 600; align-items: center; }
  .stats .bar { height: 12px; border: 2px solid var(--line); border-radius: 7px; background: #fff; overflow: hidden; }
  .stats .bar i { display: block; height: 100%; background: var(--c); }
  .results { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 5px; text-align: left; }
  .results li { display: flex; align-items: center; gap: 9px; padding: 3px 10px 3px 6px; border-radius: 12px; background: rgba(255, 255, 255, .45); font-weight: 600; }
  .results li.goal-who { background: #fff2c4; box-shadow: inset 0 0 0 2.5px var(--gold); }
  .results .p { width: 26px; font: 400 22px/1 Bangers, Fredoka, sans-serif; color: var(--rust); text-align: center; }
  .results .f { width: 30px; height: 30px; }
  .results .tm { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 13.5px; }
  .stars { font-size: 38px; letter-spacing: 6px; margin: 2px 0 4px; color: var(--gold); text-shadow: 0 3px 0 var(--line), 2px 0 0 var(--line), -2px 0 0 var(--line), 0 -2px 0 var(--line); }
  .stars .dim { color: #d8c8a8; }
  .events h3 { margin: 16px 0 6px; font: 400 22px/1 Bangers, Fredoka, sans-serif; letter-spacing: .05em; color: var(--ink-2); text-align: left; }
  .events .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .ev { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; border: 3px solid var(--line); border-radius: 14px; background: #fff8e6; box-shadow: 0 3px 0 var(--line); cursor: pointer; font-weight: 600; font-size: 13px; text-align: center; line-height: 1.15; }
  .ev .num { font: 400 24px/1 Bangers, Fredoka, sans-serif; color: var(--rust); }
  .ev .st { font-size: 14px; color: var(--gold); letter-spacing: 1px; text-shadow: 0 1px 0 var(--line); }
  .ev.locked { opacity: .45; cursor: default; }
  .ev.now { box-shadow: 0 3px 0 var(--line), 0 0 0 4px var(--gold); }
  .fade { position: fixed; inset: 0; z-index: 30; background: #e9b66c; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .fade.on { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c" aria-label="The race track, seen from above"></canvas>

<header class="top" id="top">
  <h1 class="title"><b id="lvName">Rigged Racer</b><small id="lvWhere"></small></h1>
  <div class="tools">
    <button class="btn round" id="bHelp" type="button" aria-label="How to play" title="How to play"></button>
    <button class="btn round" id="bSound" type="button" aria-label="Sound off" title="Sound"></button>
    <button class="btn round" id="bMenu" type="button" aria-label="All the races" title="All the races"></button>

<div class="goal" id="goal" aria-label="The goal"></div>
<ol class="board" id="board" aria-label="Standings"></ol>
<div id="tags"></div>
<div id="traps"></div>
