<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,500&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #040302; color: #efe3d2; overflow: hidden; font-family: Figtree, system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(0, 0, 0, .55) 100%); }
  .name { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 60px; margin: 0; pointer-events: none;
    font: italic 500 28px/1 "EB Garamond", Georgia, serif; color: rgba(239, 227, 210, .85); }
  .ui { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: calc(100% - 32px); text-align: center; }
  .mic { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(239, 227, 210, .35);
    background: rgba(20, 14, 10, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: inherit;
    font: 500 14px/1 Figtree, system-ui, sans-serif; letter-spacing: .02em; cursor: pointer; }
  .mic:hover { border-color: rgba(239, 227, 210, .65); }
  .mic:focus-visible, .reset:focus-visible { outline: 2px solid #efe3d2; outline-offset: 3px; }
  .mic[aria-pressed="true"] { cursor: default; }
  .mic:disabled { opacity: .55; cursor: default; }
  .meter { width: 46px; height: 4px; border-radius: 2px; background: rgba(239, 227, 210, .18); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: #f3b35a; }
  .note { margin: 0; font-size: 12.5px; letter-spacing: .02em; color: rgba(239, 227, 210, .62); text-wrap: balance; }
  .reset { position: fixed; right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); padding: 6px 8px; border: 0; background: none;
    color: rgba(239, 227, 210, .45); font: 12.5px Figtree, system-ui, sans-serif; cursor: pointer; }
  .reset:hover { color: rgba(239, 227, 210, .85); }
  @media (max-width: 560px) { .reset { top: max(18px, env(safe-area-inset-top)); bottom: auto; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A white candle burning in a brass chamberstick on a wooden table"></canvas>
<div class="vignette"></div>
<p class="name">Candle</p>
<div class="ui">
  <button class="mic" id="mic" type="button" aria-pressed="false"><span id="micLabel">Turn on microphone</span><span class="meter" id="meter" hidden><i id="level"></i></span></button>
  <p class="note" id="note">Then blow toward your screen. Or hold Space to blow. Audio never leaves this device.</p>
</div>
<button class="reset" id="reset" type="button">New candle</button>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rr = (a, b) => a + Math.random() * (b - a);
const hashI = (x, y) => { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hashI(xi, yi), b = hashI(xi + 1, yi), c = hashI(xi, yi + 1), d = hashI(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s / (1 - 0.5 ** o); }
const noise1 = t => vnoise(t, 0.5) * 2 - 1;
// 3D value noise that also writes its gradient into g (the smoke's flow is the curl of three of these)
const hash3 = (x, y, z) => { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1440662683)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function vnoise3(x, y, z, g) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), fx = x - xi, fy = y - yi, fz = z - zi;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const a = hash3(xi, yi, zi), b = hash3(xi + 1, yi, zi), c = hash3(xi, yi + 1, zi), d = hash3(xi + 1, yi + 1, zi);
  const e = hash3(xi, yi, zi + 1), f = hash3(xi + 1, yi, zi + 1), h = hash3(xi, yi + 1, zi + 1), k = hash3(xi + 1, yi + 1, zi + 1);
  const k1 = b - a, k2 = c - a, k3 = e - a, k4 = a - b - c + d, k5 = a - c - e + h, k6 = a - b - e + f, k7 = -a + b + c - d + e - f - h + k;
  g.x = 6 * fx * (1 - fx) * (k1 + k4 * uy + k6 * uz + k7 * uy * uz);
  g.y = 6 * fy * (1 - fy) * (k2 + k5 * uz + k4 * ux + k7 * uz * ux);
  g.z = 6 * fz * (1 - fz) * (k3 + k6 * ux + k5 * uy + k7 * ux * uy);
  return a + k1 * ux + k2 * uy + k3 * uz + k4 * ux * uy + k5 * uy * uz + k6 * uz * ux + k7 * ux * uy * uz;
}
const angTo = (a, b) => { const d = (a - b) % TAU; return d > Math.PI ? d - TAU : d < -Math.PI ? d + TAU : d; };
const V2 = (x, y) => new THREE.Vector2(x, y), V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------- the candle, in centimetres ---------- */
const DISH_FLOOR = 0.45, SOCKET_TOP = 3.3;
const CANDLE_R = 1.35, CANDLE_BASE = 0.9, CANDLE_H0 = 13;
const FRONT = Math.atan2(44, 4), FRONT_ARC = 0.85;         // the side of the candle facing the camera; wax only runs down here
const BURN_SECONDS = 3600, MIN_FRAC = 0.25;              // an hour of flame takes it down to a quarter, then it stops shrinking
const candleHeight = burn => CANDLE_H0 * (1 - (1 - MIN_FRAC) * Math.min(1, burn / BURN_SECONDS));

// Burn time and drips persist in this browser, so the candle picks up where it left off.
const STORE = 'toy-box/candle', Q = new URLSearchParams(location.search);
const PREVIEW = Q.has('burn');                             // ?burn=0.4 shows a part-burned candle (used for the preview image)
let state = { burn: 0, drips: [] };
if (PREVIEW) state = { burn: clamp(Number(Q.get('burn')) || 0, 0, 1) * BURN_SECONDS, drips: [] };
else { try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && typeof s.burn === 'number' && Array.isArray(s.drips)) state = s; } catch {} }
for (const d of state.drips) if (Math.abs(angTo(d.phi, FRONT)) > FRONT_ARC) d.phi = FRONT + (d.seed * 2 - 1) * FRONT_ARC;   // older saves dripped all the way round
const save = () => { if (PREVIEW) return; try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} };

/* ---------- renderer, camera, lights ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#030201');
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 600);

// A dim room for reflections: dark walls and a cool window to the left.
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.012, 0.009, 0.007), side: THREE.BackSide })));
  const win = new THREE.Mesh(new THREE.PlaneGeometry(22, 28), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.22, 0.27, 0.42) }));
  win.position.set(-32, 22, -24); win.lookAt(0, 5, 0); env.add(win);
  const warm = new THREE.Mesh(new THREE.SphereGeometry(15, 24, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 1.2, 0.45) }));
  warm.position.set(0, 34, 6); env.add(warm);   // stands in for the flame overhead
  // the candlelit tabletop and the wall behind, brightest near the candle, so the brass has something warm to mirror
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.3, '#6a6a6a'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const pool = new THREE.CanvasTexture(c);
  const tableGlow = new THREE.Mesh(new THREE.CircleGeometry(42, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 0.24, 0.09), map: pool }));
  tableGlow.position.y = -7; env.add(tableGlow);
  const wallGlow = new THREE.Mesh(new THREE.PlaneGeometry(80, 56), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.2, 0.1, 0.045), map: pool }));
  wallGlow.position.set(0, 9, -38); env.add(wallGlow);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.035).texture;
  pm.dispose();
}

const flameLight = new THREE.PointLight('#ffae62', 0, 0, 2);
flameLight.castShadow = true;
flameLight.shadow.mapSize.set(2048, 2048);
flameLight.shadow.camera.near = 0.2; flameLight.shadow.camera.far = 200;
flameLight.shadow.bias = -0.002; flameLight.shadow.normalBias = 0.02;
scene.add(flameLight);
const windowLight = new THREE.DirectionalLight('#8ea4d6', 0.7);   // faint moonlight through a window, for a long soft shadow
windowLight.position.set(-42, 58, -36);
windowLight.castShadow = true;
windowLight.shadow.mapSize.set(2048, 2048);
Object.assign(windowLight.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 200 });
windowLight.shadow.bias = -0.0006; windowLight.shadow.normalBias = 0.03;
scene.add(windowLight, windowLight.target);
scene.add(new THREE.HemisphereLight('#1c1e2a', '#0b0705', 0.6));

/* ---------- procedural textures ---------- */
function canvasTex(w, h, fill, { srgb = false, wrap = THREE.RepeatWrapping } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) fill(x, y, img.data, (y * w + x) * 4);
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = wrap; t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// A varnished walnut tabletop: five planks, warped growth rings, fine fibres, dark seams.
function woodMaps() {
  const N = 1024, PL = 5, col = [], rough = [], bump = [];
  const tone = Array.from({ length: PL }, (_, i) => 0.78 + hashI(i, 77) * 0.38);
  const at = (x, y) => {
    const pf = y / N * PL, p = Math.floor(pf), py = pf - p, seam = Math.min(py, 1 - py) * N / PL, u = x / N, v = y / N;
    const g = v * 34 + fbm(u * 1.6 + p * 7.1, v * 6 + p * 3.3, 4) * 7 + fbm(u * 0.5 + p, v * 1.5, 2) * 3 + p * 13.7;
    const ring = Math.pow(0.5 + 0.5 * Math.sin(g * TAU), 2.2), fiber = vnoise(u * 900, v * 60 + p * 40);
    const t = clamp(0.35 + ring * 0.45 + (fiber - 0.5) * 0.25, 0, 1), k = seam < 2.2 ? 0.35 + 0.65 * seam / 2.2 : 1;
    return { r: lerp(50, 126, t) * tone[p] * k, g: lerp(29, 76, t) * tone[p] * k, b: lerp(17, 43, t) * tone[p] * k,
      rough: seam < 2.2 ? 0.9 : 0.26 + ring * 0.12 + vnoise(u * 12, v * 12) * 0.22, bump: (0.55 + ring * 0.2 + (fiber - 0.5) * 0.25) * (seam < 2.2 ? seam / 2.2 : 1) };
  };
  const cache = new Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) cache[y * N + x] = at(x, y);
  const opt = { wrap: THREE.MirroredRepeatWrapping };
  return {
    map: canvasTex(N, N, (x, y, d, i) => { const s = cache[y * N + x]; d[i] = s.r; d[i + 1] = s.g; d[i + 2] = s.b; d[i + 3] = 255; }, { ...opt, srgb: true }),
    roughnessMap: canvasTex(N, N, (x, y, d, i) => { const s = cache[y * N + x]; d[i] = d[i + 1] = d[i + 2] = s.rough * 255; d[i + 3] = 255; }, opt),
    bumpMap: canvasTex(N, N, (x, y, d, i) => { const s = cache[y * N + x]; d[i] = d[i + 1] = d[i + 2] = s.bump * 255; d[i + 3] = 255; }, opt),
  };
}
// Wax: faint vertical pour streaks and a fine grain.
const waxBump = canvasTex(256, 512, (x, y, d, i) => { const v = 0.5 + 0.22 * (fbm(x * 0.05, y * 0.004, 3) - 0.5) + 0.1 * (vnoise(x * 0.5, y * 0.5) - 0.5); d[i] = d[i + 1] = d[i + 2] = v * 255; d[i + 3] = 255; });
// Old brass: soft tarnish clouds, a few darker spots where hands have been, and fine rings left by the lathe.
function brassMaps() {
  const W = 512, H = 256, tone = new Float32Array(W * H), rough = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = x / W, v = y / H, cloud = fbm(u * 16, v * 8, 4), spot = smoothstep(0.6, 0.82, fbm(u * 38 + 9, v * 19 + 3, 3)), rings = vnoise(0.5, v * 700);
    tone[y * W + x] = clamp(0.86 + 0.2 * (cloud - 0.5) - 0.12 * spot, 0, 1);
    rough[y * W + x] = clamp(0.7 + 0.45 * (cloud - 0.5) + 0.35 * spot + 0.18 * (rings - 0.5), 0, 1);
  }
  return {
    map: canvasTex(W, H, (x, y, d, i) => { const t = tone[y * W + x]; d[i] = 255 * t; d[i + 1] = 255 * t ** 1.18; d[i + 2] = 255 * t ** 1.5; d[i + 3] = 255; }, { srgb: true }),
    roughnessMap: canvasTex(W, H, (x, y, d, i) => { d[i] = d[i + 1] = d[i + 2] = 255 * rough[y * W + x]; d[i + 3] = 255; }),
  };
}

/* ---------- table and wall ---------- */
const wood = woodMaps();
for (const t of Object.values(wood)) t.repeat.set(2.2, 1.25);
const table = new THREE.Mesh(new THREE.PlaneGeometry(220, 125), new THREE.MeshPhysicalMaterial({
  ...wood, roughness: 1, bumpScale: 0.7, clearcoat: 0.55, clearcoatRoughness: 0.22,
}));
table.rotation.x = -Math.PI / 2; table.position.z = 17.5; table.receiveShadow = true;
scene.add(table);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(260, 140), new THREE.MeshStandardMaterial({
  color: '#3b322b', roughness: 0.95, bumpMap: canvasTex(256, 256, (x, y, d, i) => { const v = 0.5 + 0.35 * (fbm(x * 0.06, y * 0.06, 4) - 0.5); d[i] = d[i + 1] = d[i + 2] = v * 255; d[i + 3] = 255; }), bumpScale: 0.6,
}));
wall.material.bumpMap.repeat.set(6, 3);
wall.position.set(0, 70, -45); wall.receiveShadow = true;
scene.add(wall);

/* ---------- brass chamberstick: a spun dish with a rolled rim, a turned cup, and a strap ring with a thumb rest ---------- */
const brass = new THREE.MeshPhysicalMaterial({ color: '#d6aa5c', metalness: 1, roughness: 0.34, ...brassMaps(), clearcoat: 0.2, clearcoatRoughness: 0.2, side: THREE.DoubleSide });
const CUP_MOUTH = 1.46;
const HOLDER = [
  // underside, from the centre out: a shallow recess, the foot ring it stands on, then up to the rim
  [0, 0.16], [3.7, 0.16], [3.95, 0.11], [4.12, 0.02], [4.3, 0], [4.62, 0], [4.8, 0.05], [4.95, 0.12], [5.7, 0.21], [6.45, 0.34], [6.98, 0.51], [7.3, 0.72], [7.48, 0.92],
  // the rolled rim
  [7.58, 1.05], [7.62, 1.16], [7.59, 1.27], [7.5, 1.34], [7.38, 1.36], [7.28, 1.31], [7.22, 1.21],
  // down the inside of the dish to its floor, with two rings turned into it
  [7.12, 1.02], [6.9, 0.84], [6.5, 0.68], [5.9, 0.56], [5.2, 0.48], [4.6, DISH_FLOOR], [4.36, DISH_FLOOR], [4.31, 0.42], [4.26, DISH_FLOOR],
  [4.13, DISH_FLOOR], [4.08, 0.42], [4.03, DISH_FLOOR], [3.35, DISH_FLOOR],
  // a bead at the foot of the cup, its vase-shaped body, a bead at the neck, and the flared lip that catches drips
  [3.16, 0.47], [3.03, 0.53], [2.96, 0.62], [2.94, 0.7], [2.87, 0.76], [2.72, 0.8], [2.5, 0.85], [2.28, 0.99], [2.1, 1.22], [2.0, 1.5], [1.97, 1.8], [2.0, 2.1],
  [2.06, 2.4], [2.06, 2.62], [1.99, 2.8], [2.03, 2.86], [2.12, 2.9], [2.15, 2.97], [2.12, 3.04], [2.05, 3.08], [2.14, 3.14], [2.4, 3.2], [2.66, 3.26], [2.8, 3.32],
  [2.85, 3.38], [2.82, 3.43], [2.72, 3.46], [2.4, 3.43], [2.0, 3.38], [1.7, 3.34], [1.52, 3.31], [CUP_MOUTH, 3.27],
  // and down inside the cup to where the candle stands
  [1.43, 3.15], [1.42, CANDLE_BASE + 0.05], [1.36, CANDLE_BASE], [0, CANDLE_BASE],
];
// The outside of the cup from its mouth down to the dish floor: the way a drip runs over it.
const CUP_RUN = HOLDER.slice(HOLDER.findIndex(p => p[0] === 3.35), HOLDER.findIndex(p => p[0] === CUP_MOUTH) + 1).reverse();
const holder = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.LatheGeometry(HOLDER.map(([r, y]) => V2(r, y)), 160, Math.PI), brass);   // seam at the back
  // a flat strap bent into a finger ring: a lathe of a rounded rectangle, stood on edge
  const R = 1.1, T = 0.1, W = 0.27, C = 0.07, band = [];
  for (const [cx, cy, a0] of [[R + T - C, -W + C, -Math.PI / 2], [R + T - C, W - C, 0], [R - T + C, W - C, Math.PI / 2], [R - T + C, -W + C, Math.PI]])
    for (let k = 0; k <= 5; k++) { const a = a0 + k / 5 * Math.PI / 2; band.push(V2(cx + Math.cos(a) * C, cy + Math.sin(a) * C)); }
  band.push(band[0].clone());
  const ring = new THREE.Mesh(new THREE.LatheGeometry(band, 72).rotateX(Math.PI / 2), brass);
  ring.position.set(8.8, 1.38, 0);
  const joint = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.32, 0.5), brass);
  joint.position.set(7.62, 1.22, 0);
  // a leaf-shaped thumb rest on top of the ring
  const leaf = new THREE.Shape();
  leaf.moveTo(0, -0.3);
  leaf.bezierCurveTo(0.7, -0.34, 1.2, -0.9, 1.8, -0.74);
  leaf.bezierCurveTo(2.4, -0.58, 2.4, 0.58, 1.8, 0.74);
  leaf.bezierCurveTo(1.2, 0.9, 0.7, 0.34, 0, 0.3);
  leaf.lineTo(0, -0.3);
  const thumbGeo = new THREE.ExtrudeGeometry(leaf, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.05, bevelSegments: 3, curveSegments: 24 }).rotateX(Math.PI / 2);
  const uv = thumbGeo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 0.08, uv.getY(i) * 0.08);   // extrude UVs are in centimetres; spread the tarnish out to match the dish
  const thumb = new THREE.Mesh(thumbGeo, brass);
  thumb.position.set(7.95, 2.6, 0); thumb.rotation.z = 0.2;
  const handle = new THREE.Group(); handle.add(ring, joint, thumb); handle.rotation.y = -0.55;
  holder.add(body, handle);
  holder.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}
scene.add(holder);

/* ---------- wax: light from the flame glows through the top of the candle ---------- */
const WAX = { uFlamePos: { value: new THREE.Vector3() }, uFlameI: { value: 0 }, uTopY: { value: 10 } };
function waxMaterial({ clip = false, glow = 1, ...opts } = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: '#f2ede3', roughness: 0.5, sheen: 0.6, sheenRoughness: 0.55, sheenColor: new THREE.Color('#fff1dc'), ...opts });

  for (let i = 0; i < THREADS * TP; i++) { smokeS[i * 2] = -1; smokeS[i * 2 + 1] = 1; }
}
const SMOKE = { uWick: { value: new THREE.Vector3() }, uEmber: { value: 0 }, uFlame: { value: 0 } };
const smokeMesh = new THREE.Mesh(smokeGeo, new THREE.ShaderMaterial({
  uniforms: SMOKE, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `attribute float aA, aS, aL, aW; varying float vA, vS, vL, vW; varying vec3 vP;
    void main() { vA = aA; vS = aS; vL = aL; vW = aW; vP = position; gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 uWick; uniform float uEmber, uFlame;
    varying float vA, vS, vL, vW; varying vec3 vP;
    float h11(float n) { return fract(sin(n) * 43758.5453); }
    float n11(float x) { float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(h11(i), h11(i + 1.0), f); }
    void main() {

      float strands = n11(vS * (1.2 + vW * 8.0) + vL + 17.0) * 0.6 + n11(vS * (2.5 + vW * 18.0) - vL * 1.7 + 3.0) * 0.4;
      float a = vA * exp(-vS * vS * 3.5) * mix(1.0, smoothstep(0.2, 0.85, strands), clamp(vW * 2.5, 0.0, 0.85));
      if (a < 0.002) discard;

      float d = distance(vP, uWick);
      vec3 c = vec3(0.36, 0.4, 0.5) + vec3(1.0, 0.36, 0.08) * uEmber * 2.4 * exp(-d * 1.2) + vec3(1.0, 0.6, 0.3) * uFlame * 1.3 / (1.0 + d * 0.3);

smokeMesh.frustumCulled = false; smokeMesh.renderOrder = 8;
scene.add(smokeMesh);
const threads = [1, 0.7, 0.5, 0.36, 0.26].map((weight, i) => ({ pts: [], acc: 0, gap: true, n: 0, weight, seed: i * 7.31 + 1.7 }));
const G1 = {}, G2 = {}, G3 = {}, C1 = new THREE.Vector3(), C2 = new THREE.Vector3(), drift = new THREE.Vector3();
const _toCam = new THREE.Vector3(), _tan = new THREE.Vector3(), _side = new THREE.Vector3();
function curl(x, y, z, out) {
  vnoise3(x, y, z, G1); vnoise3(x + 31.4, y - 17.2, z + 5.9, G2); vnoise3(x - 11.3, y + 47.9, z - 23.1, G3);
  return out.set(G3.y - G2.z, G1.z - G3.x, G2.x - G1.y);
}
let smokeLive = false;
function updateSmoke(dt, t, strength, origin, wickY) {
  if (!smokeLive && strength <= 0) return;
  drift.set(noise1(t * 0.17) * 0.9, 0, noise1(t * 0.13 + 7) * 0.6).addScaledVector(awayDir, wind * 22);   // a faint draft in the room, and your breath
  const onset = 3 + 1.6 * noise1(t * 0.21 + 5);             // how high the thread stays smooth wavers
  smokeLive = false;
  threads.forEach((th, ti) => {
    const emit = dens => {
      if (th.pts.length >= TP) th.pts.shift();
      const a = th.seed + t * 0.9;
      th.pts.push({ p: origin.clone().add(V3(Math.cos(a) * 0.03, 0.02, Math.sin(a) * 0.03)), age: 0, life: rr(4.2, 5.6), dens, w0: 0.03 + 0.05 * dens, mix: 0, l: th.n++ * 0.035 });   // the first puff is thicker
    };
    // a break in the thread is a pair of invisible points, so a new puff doesn't join onto the last one
    if (strength * th.weight > 0.003) {
      if (th.gap) { emit(0); th.gap = false; th.acc = 0; }
      th.acc += EMIT_HZ * dt;
      while (th.acc >= 1) { th.acc -= 1; emit(strength * th.weight); }
    } else if (!th.gap) { emit(0); th.gap = true; }
    for (const q of th.pts) {
      q.age += dt;
      const h = q.p.y - wickY, turb = smoothstep(onset, onset + 5.5, h), wave = smoothstep(0.5, onset, h), dk = smoothstep(0, 4, h);
      curl(q.p.x * 0.3, (q.p.y - t * 3) * 0.3, q.p.z * 0.3 + t * 0.06, C1);
      curl(q.p.x * 0.8 + th.seed, (q.p.y - t * 4) * 0.8, q.p.z * 0.8 - th.seed + t * 0.12, C2);
      const A1 = 0.9 * wave + 6 * turb, A2 = 3.2 * turb, up = 3 + 8 * Math.exp(-q.age / 1.1);   // hot and quick at the wick, slowing as it cools
      q.p.x += (drift.x * dk + C1.x * A1 + C2.x * A2) * dt;
      q.p.y += (up + (C1.y * A1 + C2.y * A2) * 0.5) * dt;
      q.p.z += (drift.z * dk + C1.z * A1 + C2.z * A2) * dt;
      q.mix += turb * dt;
    }
    while (th.pts.length && th.pts[0].age > th.pts[0].life) th.pts.shift();
    const n = th.pts.length, base = ti * TP;
    if (n) smokeLive = true;
    for (let i = 0; i < TP; i++) {
      const j = (base + i) * 2;
      if (i >= n) {                                          // unused slots collapse onto the newest point, invisibly
        smokeA[j] = smokeA[j + 1] = 0;
        const e = n ? th.pts[n - 1].p : origin;
        for (let k = 0; k < 2; k++) { smokePos[j * 3 + k * 3] = e.x; smokePos[j * 3 + k * 3 + 1] = e.y; smokePos[j * 3 + k * 3 + 2] = e.z; }
        continue;
      }
      const q = th.pts[i], prev = th.pts[Math.max(0, i - 1)], next = th.pts[Math.min(n - 1, i + 1)];
      _tan.subVectors(next.p, prev.p); if (_tan.lengthSq() < 1e-8) _tan.set(0, 1, 0);
      _toCam.subVectors(camera.position, q.p);
      const w = q.w0 + 0.06 * q.age + 0.8 * q.mix;          // it spreads as it goes, fastest once it's turbulent
      _side.crossVectors(_tan, _toCam).normalize().multiplyScalar(w);
      smokePos[j * 3] = q.p.x - _side.x; smokePos[j * 3 + 1] = q.p.y - _side.y; smokePos[j * 3 + 2] = q.p.z - _side.z;
      smokePos[j * 3 + 3] = q.p.x + _side.x; smokePos[j * 3 + 4] = q.p.y + _side.y; smokePos[j * 3 + 5] = q.p.z + _side.z;
      const a = q.dens * 0.55 * smoothstep(0, 0.12, q.age) * (1 - smoothstep(q.life * 0.45, q.life, q.age)) / (1 + 4 * (w - q.w0));   // and thins as it spreads
      smokeA[j] = smokeA[j + 1] = a; smokeL[j] = smokeL[j + 1] = q.l; smokeW[j] = smokeW[j + 1] = w;

  });

}

/* ---------- blowing: the microphone, or Space / press-and-hold as a stand-in ---------- */
let analyser = null, samples = null, floorDb = -60, hold = false;
const micBtn = $('mic'), note = $('note');
micBtn.addEventListener('click', async () => {
  if (analyser) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    await ac.resume();
    analyser = ac.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0;
    ac.createMediaStreamSource(stream).connect(analyser);
    samples = new Float32Array(analyser.fftSize);
    micBtn.setAttribute('aria-pressed', 'true');
    $('micLabel').textContent = 'Listening'; $('meter').hidden = false;
    note.textContent = 'Blow toward your screen to make it flicker. Blow hard to put it out.';
  } catch {
    micBtn.disabled = true; $('micLabel').textContent = 'Microphone unavailable';
    note.textContent = 'Hold Space, or press and hold the candle, to blow instead.';
  }
});
function micWind(dt) {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(samples);
  let sum = 0; for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
  const db = 20 * Math.log10(Math.sqrt(sum / samples.length) + 1e-8);
  floorDb += (db - floorDb) * Math.min(1, dt * (db < floorDb ? 4 : 0.08));    // learn the room's background level
  $('level').style.width = `${clamp((db + 70) / 60, 0, 1) * 100}%`;
  return smoothstep(10, 28, db - Math.max(floorDb, -75));                     // only sound well above the room counts
}
addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { hold = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space') hold = false; });
canvas.addEventListener('pointerdown', e => { hold = true; try { canvas.setPointerCapture(e.pointerId); } catch {} });
addEventListener('pointerup', () => { hold = false; });
addEventListener('blur', () => { hold = false; });
let pointerX = 0, pointerY = 0;
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { pointerX = e.clientX / innerWidth * 2 - 1; pointerY = e.clientY / innerHeight * 2 - 1; } });

$('reset').addEventListener('click', () => {
  drips.splice(0).forEach(removeDripObject);
  state = { burn: 0, drips: [] }; save();
  buildCap(rimAmp(), topY()); buildCollar();
  if (!lit) { outTimer = 0; }
});

/* ---------- camera ---------- */
const look = new THREE.Vector3();
function placeCamera(dt) {
  const aspect = innerWidth / innerHeight, frac = candleHeight(state.burn) / CANDLE_H0;
  const dist = 44 * Math.max(1, 0.95 / aspect);
  const k = 1 - Math.exp(-dt * 2);
  look.lerp(V3(0, lerp(4.2, 7.2, frac), 0), dt ? k : 1);
  camera.position.set(4 + pointerX * 2.5, look.y + 12 - pointerY * 1.5, 0).setZ(dist);
  camera.lookAt(look);
}

/* ---------- life of the flame ---------- */
let lit = true, ignite = PREVIEW ? 1 : 0.2, outTimer = 0, emberGlow = 0, smokeT = 99, wind = 0, blowAcc = 0, hold01 = 0, disturb = 0;
let nextDrip = rr(35, 80), lastBlowDrip = -99, saveT = 0, T = 0, adapt = 0;
const tip = new THREE.Vector3(), awayDir = new THREE.Vector3(), lean = new THREE.Vector3();
function extinguish() {
  lit = false; outTimer = rr(3, 5); emberGlow = 1; smokeT = 0; blowAcc = 0;
  if (Math.random() < 0.5 && T - lastBlowDrip > 6) { lastBlowDrip = T; spawnDrip(true); }
}
function live(dt) {
  hold01 = hold ? Math.min(1, hold01 + dt * 1.8) : hold01 * Math.exp(-dt * 5);
  const target = Math.max(micWind(dt), hold01);
  wind += (target - wind) * (1 - Math.exp(-dt * (target > wind ? 16 : 3.5)));  // gusts arrive fast and fade slowly
  if (lit) {
    blowAcc = Math.max(0, blowAcc + (wind > 0.6 ? (wind - 0.6) * 5 : -1.5) * dt);
    if (blowAcc > 1 || wind > 0.97) extinguish();
    else if (wind > 0.6 && T - lastBlowDrip > 8) { lastBlowDrip = T; spawnDrip(true); }  // a gust spills the melt pool
  } else {
    outTimer -= dt;
    if (outTimer <= 0 && wind < 0.4) { lit = true; ignite = 0; }

  ignite = lit ? Math.min(1, ignite + dt / 0.9) : 0;

  smokeT += dt;
  disturb = Math.max(disturb * Math.exp(-dt * 2), lit && wind > 0.45 ? wind : 0);
  if (lit) {
    state.burn += dt;
    if ((nextDrip -= dt) <= 0) { nextDrip = rr(50, 130); spawnDrip(); }
  }
}

/* ---------- render ---------- */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.25, 0.35, 1.1);
// Cap how much any one pixel feeds the glow: the wax right under the flame is far brighter than the flame itself, and
// uncapped it would bloom into a big hot halo.
bloom.materialHighPassFilter.fragmentShader = bloom.materialHighPassFilter.fragmentShader
  .replace('gl_FragColor = mix( outputColor, texel, alpha );', 'gl_FragColor = mix( outputColor, texel * min( 1.0, 2.5 / max( v, 1e-4 ) ), alpha );');

composer.addPass(new OutputPass());
function fit() {
  renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', fit);
fit();
buildCap(rimAmp(), topY()); buildCollar();
placeCamera(0);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

let last = performance.now() / 1000, lastCapAmp = rimAmp();
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now; T += dt;
  live(dt);
  const ty = topY(), H = ty - CANDLE_BASE;
  candleBody.scale.y = H - CAP_SKIRT; waxBump.repeat.set(1, H / 6);
  top.position.y = ty;
  if (Math.abs(rimAmp() - lastCapAmp) > 0.01) { lastCapAmp = rimAmp(); buildCap(lastCapAmp, ty); }
  tip.copy(WICK_TIP); tip.y += ty + POOL_Y + 0.1;
  ember.material.color.setRGB(4, 1.2, 0.25).multiplyScalar(lit ? 0.35 : emberGlow);

  // wind pushes the flame away from you, with a little sideways turbulence
  placeCamera(dt);
  awayDir.set(-camera.position.x, 0, -camera.position.z).normalize();
  const side = V3(-awayDir.z, 0, awayDir.x);
  const drift = noise1(T * 0.35) * 0.05 + noise1(T * 1.7 + 4) * 0.02;
  lean.copy(awayDir).multiplyScalar(wind * 1.7 + noise1(T * 3.1) * wind * 0.3).addScaledVector(side, drift + noise1(T * 5.3 + 9) * wind * 0.6);

  FL.uLean.value.copy(lean);
  FL.uH.value = 2.7 * flick * (1 - wind * 0.35) * Math.max(0.05, grow);
  FL.uFlick.value = 0.35 + wind * 2.4;
  FL.uBright.value = bright;
  FL.uTime.value = T;
  flame.visible = bright > 0.01;
  const mid = FL.uBase.value.clone().add(V3(0, FL.uH.value * 0.4, 0)).addScaledVector(lean, FL.uH.value * 0.25);
  halo.position.copy(mid); halo.scale.setScalar(7 + 1.5 * flick); halo.material.opacity = bright * 0.22;
  flameLight.position.copy(FL.uBase.value).add(V3(0, FL.uH.value * 0.6, 0)).addScaledVector(lean, FL.uH.value * 0.4);   // light comes from the whole flame, not just its base
  flameLight.intensity = 700 * bright * flick + 6 * emberGlow;
  scene.environmentIntensity = 0.35 + 0.65 * bright;
  flameLight.color.setRGB(1, 0.62 - wind * 0.08, 0.3);
  WAX.uFlamePos.value.copy(mid); WAX.uFlameI.value = bright; WAX.uTopY.value = ty;
  poolMat.roughness = lit ? 0.06 : Math.min(0.45, poolMat.roughness + dt * 0.02);

  // a snuffed wick pours out a thick puff, then a thinning thread until it's relit; a flame blown about sheds a little soot
  const smokeOn = !lit ? Math.exp(-smokeT / 0.7) + 0.45 * Math.exp(-smokeT / 3.5) : disturb > 0.5 ? 0.3 * disturb : 0;

  // eyes adjust to the dark when the flame goes out, and snap back when it's relit
  adapt += ((lit ? 0 : 1) - adapt) * (1 - Math.exp(-dt / (lit ? 0.35 : 2.2)));
  renderer.toneMappingExposure = 1 + 0.8 * adapt;
  updateDrips(dt, ty);

  if ((saveT += dt) > 5) { saveT = 0; save(); }
  bloom.strength = 0.18 + 0.1 * bright;
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.toyboxReady?.();                                // clears the Toy Box loading bar once that first frame is up
</script>
