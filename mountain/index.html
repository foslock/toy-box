<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #1b1232; overflow: hidden; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: .55; mix-blend-mode: overlay; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(135% 105% at 55% 40%, transparent 58%, rgba(22, 6, 26, .45) 100%); }
  .name { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 60px; margin: 0; pointer-events: none;
    font: italic 500 28px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .01em; color: rgba(255, 236, 218, .8);
    text-shadow: 0 1px 16px rgba(40, 10, 40, .4); }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A painted sunrise: a great dark mountain against an orange, red and purple sky with slow clouds, a lake and pine trees below. Two tiny hikers climb the long ridge toward the summit."></canvas>
<div class="grain" id="grain"></div>
<div class="vignette"></div>
<p class="name">First Light</p>
<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hash1 = n => { let h = Math.imul(n | 0, 374761393) ^ 0x2545F491; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const noise1 = x => { const i = Math.floor(x), f = x - i; return lerp(hash1(i), hash1(i + 1), f * f * (3 - 2 * f)) * 2 - 1; };
const hex = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${+a.toFixed(3)})`;
// Piecewise colour ramp: stops are [position, colour]; returns the colour at p.
function ramp(stops, p) {
  if (p <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (p <= stops[i][0]) return mix(stops[i - 1][1], stops[i][1], (p - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
  return stops[stops.length - 1][1];
}
const hexStops = list => list.map(([p, c]) => [p, hex(c)]);

/* ---------- the world ----------
   World units: y points down, and the painting's reference frame is one unit tall
   (the summit sits near y = 0.17, the lake starts at y = 0.8). x = 0 is just left of the summit.
   Everything, hikers included, is drawn in these units, so they always share one scale. */
const Q = new URLSearchParams(location.search);
const START = clamp(Number(Q.get('t')) || 0, 0, 3600);      // ?t=190 starts partway through (used for the preview image)
const RATE = clamp(Number(Q.get('rate')) || 1, 0.1, 60);    // ?rate=10 fast-forwards, for checking the pacing

const HIKER_H = 0.0105;          // one hiker, boots to head: about 1/95 of the frame
const WATER_Y = 0.8;
const CAM_BASE = -0.1;           // world x at the centre of the screen when everything fits
const MIN_VIEW_W = 0.7;          // narrowest slice of world we show: the whole climb and the sun, even on a phone
const DX = 0.0008, X_MIN = -2.4, X_MAX = 2.4;
const NX = Math.round((X_MAX - X_MIN) / DX) + 1;

// A skyline from control points [x, y, roughness of the stretch to the next point]:
// midpoint displacement for the rock, damped at small scales so the trail stays walkable.
function skyline(ctrl, seed, minSeg = 0.0025) {
  const rng = mulberry32(seed), pts = [[ctrl[0][0], ctrl[0][1]]];
  const sub = (x0, y0, x1, y1, r) => {
    const len = x1 - x0;
    if (len < minSeg) { pts.push([x1, y1]); return; }
    const xm = (x0 + x1) / 2 + (rng() - 0.5) * len * 0.2;
    const ym = lerp(y0, y1, (xm - x0) / len) + (rng() - 0.5) * len * r * Math.min(1, Math.pow(len / 0.05, 0.45));
    sub(x0, y0, xm, ym, r); sub(xm, ym, x1, y1, r);
  };
  for (let i = 0; i < ctrl.length - 1; i++) sub(ctrl[i][0], ctrl[i][1], ctrl[i + 1][0], ctrl[i + 1][1], ctrl[i][2] ?? 0.3);
  const ys = new Float32Array(NX);
  for (let i = 0, j = 0; i < NX; i++) {
    const x = X_MIN + i * DX;
    while (j < pts.length - 2 && pts[j + 1][0] < x) j++;
    const [xa, ya] = pts[j], [xb, yb] = pts[j + 1];
    ys[i] = x <= xa ? ya : x >= xb ? yb : lerp(ya, yb, (x - xa) / (xb - xa));
  }
  return ys;
}
const yAt = (ys, x) => { const f = (clamp(x, X_MIN, X_MAX - 1e-6) - X_MIN) / DX, i = Math.floor(f); return lerp(ys[i], ys[i + 1], f - i); };
// Rocks and spires added on top of a skyline: superellipse bumps (p < 1 gives a spire, p > 2 a block).
function addRocks(ys, rocks) {
  for (const [rx, w, h, p = 2] of rocks) {
    const i0 = Math.max(0, Math.floor((rx - w - X_MIN) / DX)), i1 = Math.min(NX - 1, Math.ceil((rx + w - X_MIN) / DX));
    for (let i = i0; i <= i1; i++) { const q = Math.abs((X_MIN + i * DX - rx) / w); if (q < 1) ys[i] -= h * Math.pow(1 - Math.pow(q, p), 1 / p); }
  }
}

const H = HIKER_H;
// The mountain is modelled on Mount Hood seen at dawn: a broad volcanic cone, long even ridges,
// a shoulder on the right. The hikers take the long left ridge.
const MAIN = skyline([
  [-2.4, 0.74, 0.15], [-1.3, 0.715, 0.15], [-0.95, 0.67, 0.12], [-0.78, 0.635, 0.1], [-0.64, 0.595, 0.08], [-0.54, 0.555, 0.08],
  [-0.46, 0.515, 0.08], [-0.39, 0.476, 0.08], [-0.33, 0.44, 0.06], [-0.27, 0.402, 0.05], [-0.225, 0.379, 0.04], [-0.19, 0.368, 0.06],
  [-0.15, 0.338, 0.07], [-0.11, 0.303, 0.07], [-0.07, 0.268, 0.06], [-0.035, 0.235, 0.05], [-0.008, 0.2055, 0], [0.014, 0.2035, 0.1],
  [0.03, 0.214, 0.15], [0.06, 0.238, 0.18], [0.1, 0.262, 0.2], [0.135, 0.28, 0.2], [0.17, 0.288, 0.2], [0.21, 0.3, 0.2],
  [0.25, 0.322, 0.15], [0.32, 0.365, 0.12], [0.42, 0.42, 0.12], [0.55, 0.48, 0.12], [0.7, 0.54, 0.12], [0.88, 0.59, 0.12],
  [1.1, 0.625, 0.15], [1.5, 0.69, 0.15], [2.4, 0.73, 0.15],
], 11);
addRocks(MAIN, [
  // boulders on the trail, each a fraction of a hiker tall
  [-0.415, 0.8 * H, 0.3 * H, 2.4], [-0.36, 0.6 * H, 0.25 * H], [-0.298, 1.0 * H, 0.4 * H, 3], [-0.2, 0.7 * H, 0.25 * H],
  [-0.13, 0.9 * H, 0.35 * H, 2.5], [-0.06, 0.7 * H, 0.3 * H],
  // summit cairn
  [0.0175, 0.2 * H, 0.38 * H, 2.2],
  // broken rock along the right shoulder
  [0.078, 0.003, 0.004, 1], [0.152, 0.004, 0.005, 1.2], [0.192, 0.003, 0.003, 1], [0.27, 0.005, 0.004, 1.3],
]);
const FAR = skyline([
  [-2.4, 0.64, 0.3], [-1.5, 0.6, 0.3], [-1.2, 0.575, 0.3], [-0.95, 0.605, 0.3], [-0.6, 0.63, 0.3], [0, 0.645, 0.3],
  [0.5, 0.615, 0.3], [0.8, 0.585, 0.3], [1.05, 0.61, 0.3], [1.5, 0.6, 0.3], [2.4, 0.64, 0.3],
], 23);
const HILL_A = skyline([[-2.4, 0.7, 0.2], [-1.0, 0.68, 0.2], [-0.55, 0.668, 0.2], [-0.25, 0.645, 0.2], [-0.05, 0.658, 0.2], [0.2, 0.68, 0.2], [0.6, 0.69, 0.2], [1.2, 0.67, 0.2], [2.4, 0.7, 0.2]], 41);
const HILL_B = skyline([[-2.4, 0.78, 0.15], [-1.0, 0.752, 0.15], [-0.5, 0.775, 0.15], [0.0, 0.8, 0.15], [0.4, 0.772, 0.15], [0.8, 0.748, 0.15], [2.4, 0.78, 0.15]], 43);

/* ---------- palette ---------- */
// Sky from the top of the frame down to the horizon, early (k = 0) and a few minutes on (k = 1).
const SKY_A = hexStops([[-0.6, '#1a1330'], [-0.25, '#2c1f40'], [-0.06, '#43294b'], [0.03, '#5e2f50'], [0.1, '#8c3650'], [0.17, '#bf4242'], [0.26, '#e4582a'], [0.38, '#f67c24'], [0.52, '#ffa532'], [0.7, '#ffc152']]);
const SKY_B = hexStops([[-0.6, '#251a3a'], [-0.25, '#3a284a'], [-0.06, '#5a3456'], [0.03, '#7c3a56'], [0.1, '#ae4250'], [0.17, '#dc5038'], [0.26, '#f86a28'], [0.38, '#ff902c'], [0.52, '#ffb842'], [0.7, '#ffd068']]);
// The mountain, by height. The hikers take their colour from this too, so they sit in the same air.
const MTN = hexStops([[0.15, '#432a43'], [0.35, '#4b3047'], [0.5, '#56374e'], [0.6, '#6a4557'], [0.68, '#8f5d68'], [0.74, '#b07672']]);
const FAR_C = hexStops([[0.56, '#8c5568'], [0.64, '#b87070'], [0.7, '#d8906f']]);
const HILL_A_C = hexStops([[0.63, '#362234'], [0.7, '#43293d'], [0.76, '#5c3a48']]);
const HILL_B_C = hexStops([[0.73, '#211420'], [0.82, '#261824']]);
const FORE_C = hex('#110a12');
const MIST = hex('#f3a37f');
// Warm rim light along anything on the skyline, by distance from the sun.
const RIM = [[0, hex('#fff0c4'), 0.95], [0.08, hex('#ffd08c'), 0.8], [0.25, hex('#ff9a5c'), 0.5], [0.55, hex('#e8666a'), 0.22], [1, hex('#c85070'), 0]];
function rimAt(d) {
  if (d >= 1) return [RIM[4][1], 0];
  for (let i = 1; i < RIM.length; i++) if (d <= RIM[i][0]) { const f = (d - RIM[i - 1][0]) / (RIM[i][0] - RIM[i - 1][0]); return [mix(RIM[i - 1][1], RIM[i][1], f), lerp(RIM[i - 1][2], RIM[i][2], f)]; }
}

/* ---------- the climb ---------- */
const PATH_X0 = -0.45, PATH_X1 = 0.008;   // where the leader starts, and where they stop on the summit
const T_LEAD = 204;                        // seconds from load until the leader tops out
const PATH = (() => {
  const xs = [], ys = [], s = [];
  let acc = 0;
  for (let x = PATH_X0 - 0.07; x <= PATH_X1 + 0.03; x += DX / 4) {
    const y = yAt(MAIN, x);
    if (xs.length) acc += Math.hypot(x - xs[xs.length - 1], y - ys[ys.length - 1]);
    xs.push(x); ys.push(y); s.push(acc);
  }
  return { xs, ys, s, n: xs.length };
})();
function bsearch(arr, v) { let lo = 0, hi = arr.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (arr[m] <= v) lo = m; else hi = m; } return lo; }
function pathAt(sq) {
  const i = bsearch(PATH.s, sq), j = Math.min(i + 1, PATH.n - 1), span = PATH.s[j] - PATH.s[i], f = span > 0 ? clamp((sq - PATH.s[i]) / span, 0, 1) : 0;
  return { x: lerp(PATH.xs[i], PATH.xs[j], f), y: lerp(PATH.ys[i], PATH.ys[j], f) };
}
const sOfX = x => { const i = bsearch(PATH.xs, x); return lerp(PATH.s[i], PATH.s[i + 1], (x - PATH.xs[i]) / (PATH.xs[i + 1] - PATH.xs[i])); };
const S0 = sOfX(PATH_X0), S1 = sOfX(PATH_X1);
const slopeAt = s => { const a = pathAt(s - 0.5 * H), b = pathAt(s + 0.5 * H); return (a.y - b.y) / Math.max(1e-6, Math.hypot(b.x - a.x, b.y - a.y)); }; // + is uphill
// Relative seconds per unit of trail: steep stretches are slow, and nobody keeps a perfectly even pace.
const effort = s => (1 + 1.1 * clamp(slopeAt(s), 0, 1) ** 2) * (1 + 0.12 * noise1(s / H * 0.35));

// The leader: a fixed schedule with three rests on the flattest ground near 30%, 56% and 84% of the way.
const LEAD = (() => {
  const ds = 0.05 * H;
  const pauses = [[0.3, 6], [0.56, 7.5], [0.84, 5]].map(([f, d]) => {
    const c = S0 + f * (S1 - S0); let best = c, bs = Infinity;
    for (let s = c - 0.05 * (S1 - S0); s <= c + 0.05 * (S1 - S0); s += ds) { const sl = Math.abs(slopeAt(s)); if (sl < bs) { bs = sl; best = s; } }
    return [best, d];
  });
  let moving = 0;
  for (let s = S0; s < S1; s += ds) moving += effort(s) * Math.min(ds, S1 - s);
  const k = (T_LEAD - pauses.reduce((a, p) => a + p[1], 0)) / moving;   // seconds per unit of effort
  const ts = [0], ss = [S0];
  let t = 0, pi = 0;
  for (let s = S0; s < S1 - 1e-9;) {
    const next = Math.min(S1, s + ds);
    if (pi < pauses.length && pauses[pi][0] <= next) {
      const sp = pauses[pi][0];
      t += effort(s) * (sp - s) * k; ts.push(t); ss.push(sp);
      t += pauses[pi][1]; ts.push(t); ss.push(sp);
      s = sp; pi++; continue;
    }
    t += effort(s) * (next - s) * k; ts.push(t); ss.push(next); s = next;
  }
  return { ts, ss, k, end: t };
})();
function leadS(t) {
  if (t <= 0) return S0;
  if (t >= LEAD.end) return S1;
  const i = bsearch(LEAD.ts, t), span = LEAD.ts[i + 1] - LEAD.ts[i];
  return lerp(LEAD.ss[i], LEAD.ss[i + 1], span > 0 ? (t - LEAD.ts[i]) / span : 0);
}
const walkSpeed = s => 1 / (effort(s) * LEAD.k);   // trail units per second at a normal pace

// The follower keeps a loose, wandering gap, catches up while the leader rests, and hangs back a moment
// before setting off again. Simulated once up front so the whole climb is known in advance.
const FOLLOW = (() => {
  const dt = 0.05, n = Math.ceil(480 / dt) + 1, out = new Float32Array(n);
  let s2 = S0 - 2.3 * H, resting = false, arrive = Infinity;
  for (let i = 0; i < n; i++) {
    const t = i * dt;
    out[i] = s2;
    const s1 = leadS(t), gap = s1 - s2, atTop = t >= LEAD.end;
    const gMin = atTop ? 1.1 * H : 0.95 * H;
    if (resting) {
      if (!atTop && gap > gMin + 0.7 * H) resting = false;
      else { if (atTop && arrive === Infinity) arrive = t; continue; }
    }
    if (gap <= gMin + 1e-6) { resting = true; continue; }
    const want = H * (2.1 + 0.7 * noise1(t * 0.045 + 7));
    s2 = Math.min(s2 + walkSpeed(s2) * (1 + 0.35 * clamp((gap - want) / want, -1, 1)) * dt, s1 - gMin);
  }
  return { out, dt, arrive };
})();
const followS = t => { const f = clamp(t / FOLLOW.dt, 0, FOLLOW.out.length - 1.001), i = Math.floor(f); return lerp(FOLLOW.out[i], FOLLOW.out[i + 1], f - i); };
const TA1 = LEAD.end, TA2 = FOLLOW.arrive;

// Gait phase along the trail (one unit = a full left-right stride); shorter steps on the steep bits.
const PHASE = (() => {
  const ph = new Float32Array(PATH.n);
  for (let i = 1; i < PATH.n; i++) {
    const L = H * (0.3 - 0.1 * clamp(slopeAt(PATH.s[i]), 0, 1));
    ph[i] = ph[i - 1] + (PATH.s[i] - PATH.s[i - 1]) / (2 * L);
  }
  return ph;
})();
const phaseAt = s => { const i = bsearch(PATH.s, s), span = PATH.s[i + 1] - PATH.s[i]; return lerp(PHASE[i], PHASE[i + 1], span > 0 ? clamp((s - PATH.s[i]) / span, 0, 1) : 0); };
const sOfPhase = p => { const i = bsearch(PHASE, p), span = PHASE[i + 1] - PHASE[i]; return lerp(PATH.s[i], PATH.s[i + 1], span > 0 ? clamp((p - PHASE[i]) / span, 0, 1) : 0); };

/* ---------- the hikers ----------
   Built in "hiker units" (1 = boots to head, y up is negative) around the point of trail under them,
   then drawn as one flat silhouette in the mountain's own colour with the same rim light as the ridge. */
function ik(ax, ay, bx, by, l1, l2, bend) {          // two-bone limb: returns the knee/elbow
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  if (d < 1e-6) return [ax, ay + l1];
  const dm = Math.min(d, (l1 + l2) * 0.999), a = (l1 * l1 - l2 * l2 + dm * dm) / (2 * dm), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  let px = -uy, py = ux;
  if (px * bend < 0) { px = -px; py = -py; }
  return [ax + ux * a + px * h, ay + uy * a + py * h];
}
const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const POSE_KEYS = ['footL', 'footR', 'kneeL', 'kneeR', 'hip', 'neck', 'head', 'packA', 'packB', 'shL', 'shR', 'elL', 'elR', 'haL', 'haR', 'poL', 'poR'];
function blendPose(a, b, t) { if (t <= 0) return a; if (t >= 1) return b; const o = {}; for (const k of POSE_KEYS) o[k] = lerp2(a[k], b[k], t); o.packW = lerp(a.packW, b.packW, t); o.torsoW = lerp(a.torsoW, b.torsoW, t); o.poles = lerp(a.poles, b.poles, t); return o; }

function hikerPose(hk, sun) {
  const hs = H * hk.scale, base = pathAt(hk.s);
  const loc = p => [(p.x - base.x) / hs, (p.y - base.y) / hs];
  const gnd = lx => (yAt(MAIN, base.x + lx * hs) - base.y) / hs;

  // Walking, in profile, facing uphill (+x).
  const ph = phaseAt(hk.s), mv = hk.move, lean = 0.08 + 0.24 * clamp(slopeAt(hk.s), 0, 1);
  const [fA, fB] = [0, 0.5].map(o => {
    const q = ph + o, k = Math.floor(q), f = q - k;
    if (f < 0.5) return loc(pathAt(sOfPhase(k + 0.25 - o)));
    const w = (f - 0.5) / 0.5, e = w * w * (3 - 2 * w);
    const p = loc(pathAt(lerp(sOfPhase(k + 0.25 - o), sOfPhase(k + 1.25 - o), e)));
    return [p[0], p[1] - Math.sin(Math.PI * w) * 0.14 * mv];
  });
  const lo = Math.max(fA[1], fB[1]), hi = Math.min(fA[1], fB[1]);
  const hip = [0.03 + lean * 0.12, lo * 0.65 + hi * 0.35 - 0.48 + 0.018 * mv * Math.cos(ph * TAU * 2)];
  const U = [Math.sin(lean), -Math.cos(lean)], F = [Math.cos(lean), Math.sin(lean)];
  const at = (a, b) => [hip[0] + U[0] * a + F[0] * b, hip[1] + U[1] * a + F[1] * b];
  const neck = at(0.3, 0), head = at(0.42, 0.03);
  const big = hk.big;
  const arm = o => {
    const sw = Math.sin(TAU * (ph + o)) * mv;
    const sh = at(0.27, 0.01), ha = [sh[0] + 0.1 + 0.11 * sw, sh[1] + 0.26 - 0.03 * sw];
    const tipX = ha[0] + 0.13 + 0.1 * sw;
    return { sh, el: ik(sh[0], sh[1], ha[0], ha[1], 0.16, 0.15, -1), ha, po: [tipX, gnd(tipX)] };
  };
  const aL = arm(0.5), aR = arm(0);
  const walk = {
    footL: fA, footR: fB, kneeL: ik(hip[0], hip[1], fA[0], fA[1], 0.25, 0.26, 1), kneeR: ik(hip[0], hip[1], fB[0], fB[1], 0.25, 0.26, 1),
    hip, neck, head, packA: at(0.08, big ? -0.13 : -0.11), packB: at(big ? 0.36 : 0.3, big ? -0.13 : -0.11), packW: big ? 0.19 : 0.15, torsoW: 0.19,
    shL: aL.sh, shR: aR.sh, elL: aL.el, elR: aR.el, haL: aL.ha, haR: aR.ha, poL: aL.po, poR: aR.po, poles: 1,
  };
  if (hk.turn <= 0) return { pose: walk, base, hs };

  // Standing on top, turned to face the sunrise (so we see their backs), then maybe arms up, pointing, sitting.
  const g1 = gnd(-0.07), g2 = gnd(0.07), bh = [0, Math.max(g1, g2) - 0.49];

    footL: [-0.07, g1], footR: [0.07, g2], kneeL: [-0.07, bh[1] + 0.25], kneeR: [0.07, bh[1] + 0.25], hip: bh,

/* ---------- the sun ----------

function build() {

    const sl = (yAt(MAIN, x + 0.02) - yAt(MAIN, x - 0.02)) / 0.04, d = Math.hypot(1, sl);

  };
  const perW = (2 * halfW + 0.4) / 2.2;
  add('high', Math.round(5 * perW), y0, 0.1, 0.4, 1.1, 0.02, 0.05, 0.0016);
  add('wisp', Math.round(12 * perW), y0 + 0.04, 0.2, 0.25, 0.8, 0.014, 0.036, 0.0024);
  add('bar', Math.round(10 * perW), 0.2, 0.5, 0.35, 1.0, 0.012, 0.038, 0.0021);

  stars = [];
  for (let i = 0; i < 70; i++) stars.push({ x: lerp(-halfW - 0.2, halfW + 0.2, rng()) + CAM_BASE, y: lerp(y0, 0.16, Math.pow(rng(), 0.8)), r: 0.5 + rng() * 0.8, a: 0.4 + rng() * 0.6, tw: rng() * TAU });

  mists = [];
  const mist = (n, ya, yb, band, amax) => {
    const xl0 = cam - halfW, span = 2 * halfW;
    for (let i = 0; i < n; i++) {
      const w = 0.25 + rng() * 0.45, period = span + w + 0.1, left = xl0 - w - 0.05;
      mists.push({ x: left + rng() * period, y: lerp(ya, yb, rng()), w, h: 0.02 + rng() * 0.035, a: amax * (0.5 + rng() * 0.5), band, v: 0.0012 + rng() * 0.0012, left, period });
    }
  };
  mist(Math.round(9 * perW), 0.6, 0.67, 0, 0.3);
  mist(Math.round(8 * perW), 0.68, 0.76, 1, 0.26);
}

/* ---------- each frame ---------- */
function hikersAt(t) {
  const mv = (fn, s) => clamp((fn(t + 0.25) - fn(t - 0.25)) / 0.5 / walkSpeed(s), 0, 1);
  const sA = leadS(t), sB = followS(t);
  return [
    { s: sB, move: mv(followS, sB), scale: 0.93, big: false, turn: smoothstep(TA2 + 0.8, TA2 + 2.4, t), arms: 0,
      point: smoothstep(TA2 + 7, TA2 + 8, t) * (1 - smoothstep(TA2 + 12.5, TA2 + 13.6, t)), sit: smoothstep(TA2 + 23, TA2 + 25, t) },
    { s: sA, move: mv(leadS, sA), scale: 1, big: true, turn: smoothstep(TA1 + 1.2, TA1 + 2.8, t),
      arms: smoothstep(TA1 + 3.5, TA1 + 4.4, t) * (1 - smoothstep(TA1 + 8.5, TA1 + 9.6, t)), point: 0, sit: smoothstep(TA2 + 22, TA2 + 24, t) },
  ];
}
const wrapX = o => o.left + (((o.x - o.left + o.v * tNow) % o.period) + o.period) % o.period;
let tNow = START;

function draw(t) {
  if (!ready) return;
  tNow = t;
  const c = ctx, sun = sunAt(t), k = smoothstep(-20, 330, t);
  const gI = 0.6 + 0.3 * smoothstep(0, 240, t) + 0.4 * sun.vis;
  const rimI = 0.6 + 0.4 * smoothstep(40, 220, t) + 0.6 * sun.vis;
  const hk = hikersAt(t);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;

  // Sky
  const sky = c.createLinearGradient(0, (-0.6 - y0) * S, 0, (0.7 - y0) * S);
  for (let i = 0; i < SKY_A.length; i++) sky.addColorStop((SKY_A[i][0] + 0.6) / 1.3, rgba(mix(SKY_A[i][1], SKY_B[i][1], k)));
  c.fillStyle = sky; c.fillRect(0, 0, cv.width, cv.height);

  // The last stars, fading
  const starFade = 1 - smoothstep(0, 110, t);
  if (starFade > 0) for (const st of stars) {
    const a = st.a * starFade * (1 - smoothstep(-0.12, 0.16, st.y)) * (0.75 + 0.25 * Math.sin(t * 1.3 + st.tw));
    if (a <= 0.01) continue;
    c.fillStyle = `rgba(255,236,226,${a.toFixed(3)})`;
    c.beginPath(); c.arc(toScreenX(st.x), (st.y - y0) * S, st.r * dpr, 0, TAU); c.fill();
  }

  // Sun glow, then the disc (still behind the mountain for most of the climb)
  worldTransform(c, Lr.main);
  c.globalCompositeOperation = 'screen';
  let rg = c.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 0.95);
  rg.addColorStop(0, `rgba(255,196,120,${Math.min(1, 0.5 * gI)})`); rg.addColorStop(0.3, `rgba(255,140,70,${Math.min(1, 0.24 * gI)})`); rg.addColorStop(1, 'rgba(255,120,60,0)');
  c.fillStyle = rg; c.fillRect(sun.x - 1, sun.y - 1, 2, 2);
  rg = c.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 0.16);
  rg.addColorStop(0, `rgba(255,244,214,${Math.min(1, 0.85 * gI)})`); rg.addColorStop(0.35, `rgba(255,214,150,${Math.min(1, 0.4 * gI)})`); rg.addColorStop(1, 'rgba(255,190,120,0)');
  c.fillStyle = rg; c.fillRect(sun.x - 0.2, sun.y - 0.2, 0.4, 0.4);
  c.globalCompositeOperation = 'source-over';
  rg = c.createRadialGradient(sun.x, sun.y, SUN_R * 0.85, sun.x, sun.y, SUN_R * 1.25);
  rg.addColorStop(0, '#fff6dc'); rg.addColorStop(1, 'rgba(255,230,180,0)');
  c.fillStyle = rg; c.beginPath(); c.arc(sun.x, sun.y, SUN_R * 1.25, 0, TAU); c.fill();

  // Cloud streaks, drifting; the ones near the sun pick up its light
  c.setTransform(1, 0, 0, 1, 0, 0);
  for (const cl of clouds) {
    const x = wrapX(cl);
    if (x > cam + halfW + 0.05 || x + cl.w < cam - halfW - 0.05) continue;
    const dx = Math.max(0, Math.abs(sun.x - (x + cl.w / 2)) - cl.w / 2), d = Math.hypot(dx, sun.y - cl.y);
    const lit = Math.pow(clamp(1 - d / 0.8, 0, 1), 1.3) * Math.min(1, 0.55 + 0.45 * gI);
    const sx = toScreenX(x + cl.spr.ox), sy = (cl.y + cl.spr.oy - y0) * S, sw = cl.spr.sw * S, sh = cl.spr.sh * S;
    c.globalAlpha = 1; c.drawImage(cl.spr.shade, sx, sy, sw, sh);
    if (lit > 0.01) { c.globalAlpha = lit; c.drawImage(cl.spr.lit, sx, sy, sw, sh); }
  }
  c.globalAlpha = 1;

  // Far range, the mountain, its rim of light, and the two climbers on it
  c.drawImage(Lr.far.c, ...layerAt(Lr.far));
  c.drawImage(Lr.main.c, ...layerAt(Lr.main));
  worldTransform(c, Lr.main);
  rg = c.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 1);
  for (const [p, col, a] of RIM) rg.addColorStop(p, rgba(col, Math.min(1, a * rimI)));
  c.strokeStyle = rg; c.lineWidth = rimW; c.lineJoin = 'round'; c.stroke(rimPath);
  for (const h of hk) drawHiker(c, h, sun, rimI, S);
  if (sun.vis > 0) {                                  // glare once the sun is out
    c.globalCompositeOperation = 'screen';
    rg = c.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 0.03 + 0.12 * sun.vis);
    rg.addColorStop(0, `rgba(255,244,214,${0.85 * sun.vis})`); rg.addColorStop(1, 'rgba(255,200,140,0)');
    c.fillStyle = rg; c.fillRect(sun.x - 0.2, sun.y - 0.2, 0.4, 0.4);
    c.globalCompositeOperation = 'source-over';
  }

  // Valley mist, foothills, forest, framing trees
  c.setTransform(1, 0, 0, 1, 0, 0);
  const mistBand = band => {
    for (const ms of mists) {
      if (ms.band !== band) continue;
      const x = wrapX(ms);
      c.globalAlpha = ms.a * (0.85 + 0.15 * Math.sin(t * 0.07 + ms.y * 90));
      c.drawImage(MIST_SPR, toScreenX(x), (ms.y - ms.h / 2 - y0) * S, ms.w * S, ms.h * S);
    }
    c.globalAlpha = 1;
  };
  mistBand(0);
  c.drawImage(Lr.hillA.c, ...layerAt(Lr.hillA));
  mistBand(1);
  c.drawImage(Lr.hillB.c, ...layerAt(Lr.hillB));
  c.drawImage(Lr.fore.c, ...layerAt(Lr.fore));
}

let ready = false;
function layout() {
  if (!innerWidth || !innerHeight) return;
  ready = true;
  VW = innerWidth; VH = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  u = Math.min(VH, VW / MIN_VIEW_W); S = u * dpr; halfW = VW / (2 * u);
  y0 = (1 - VH / u) / 2; yBot = y0 + VH / u;
  cam = clamp(CAM_BASE, VIEW_X1 - halfW, VIEW_X0 + halfW);
  build();
}

// Oil-on-canvas grain, laid over everything by CSS.
(() => {
  const n = 160, c = mk(n, n), g = c.getContext('2d'), img = g.createImageData(n, n), r = mulberry32(3);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = (y * n + x) * 4, v = 128 + (r() - 0.5) * 60 + Math.sin(x * 1.9) * Math.sin(y * 1.9) * 16;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

const T0 = performance.now(), clock = () => START + (performance.now() - T0) / 1000 * RATE;
let last = -1e9, resizeTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 31) return;                        // ~30 fps is plenty for a scene this slow
  last = now; draw(clock());
}
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout(); draw(clock()); }, 120); });
layout(); draw(clock());
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
