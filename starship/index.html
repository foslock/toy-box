<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --ink: #e8ecf4; --ink-2: #a8b2c4; --ink-3: #6c7890; --panel: rgba(14, 17, 25, .86); --edge: #6c7890; --green: #6ad26a; --amber: #ffd24a; --red: #ff5a3a; }
  html, body { height: 100%; margin: 0; }
  body { background: #04050d; color: var(--ink); font: 400 15px/1.35 'Pixelify Sans', ui-monospace, monospace; overflow: hidden; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; image-rendering: pixelated; }
  #c:focus-visible { box-shadow: inset 0 0 0 2px rgba(255, 210, 74, .6); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* FTL-ish panels: dark, square, a light rim */
  .panel { background: var(--panel); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #1c2230, 0 6px 24px -8px rgba(0, 0, 0, .8); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border: 2px solid var(--edge); background: #1a1f2c;
    font: 400 12px/1 Silkscreen, monospace; letter-spacing: .04em; cursor: pointer; text-transform: uppercase; }
  .btn:hover { background: #252c3e; border-color: #9aa6bc; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 16px; height: 16px; }

  .name { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 60px; margin: 0; pointer-events: none; }
  .name h1 { margin: 0; font: 400 22px/28px Silkscreen, monospace; letter-spacing: .06em; color: #fff; text-shadow: 0 2px 0 #000; }
  .name p { margin: 0; font-size: 13px; color: var(--ink-2); text-shadow: 0 1px 0 #000; }
  .name #shipName { color: var(--amber); }

  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; align-items: stretch; gap: 8px; }
  .clockbox { display: flex; flex-direction: column; justify-content: center; padding: 3px 12px; min-width: 116px; }
  #clock { font: 400 20px/1 Silkscreen, monospace; color: #fff; }
  #watch { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  #crewCount { color: var(--amber); }

  #notice { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -8px); max-width: min(460px, calc(100% - 520px)); margin: 0; padding: 7px 12px;
    font-size: 14px; color: var(--ink); opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; text-align: center; }
  #notice.on { opacity: 1; transform: translate(-50%, 0); }

  /* the systems bar, bottom left: an icon per system with a pip for everyone on duty in it */
  .dock { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 8px; }
  #systems { display: flex; align-items: flex-end; gap: 3px; padding: 6px 7px 5px; }
  .sys { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 25px; padding: 2px 0; border: 0; background: none; cursor: pointer; }
  .sys canvas { display: block; width: 15px; height: 15px; image-rendering: pixelated; padding: 3px; border: 2px solid #3a4254; background: #121620; }
  .sys:hover canvas { border-color: var(--amber); }
  .sys.broken canvas { border-color: var(--red); animation: blink .6s steps(2) infinite; }
  @keyframes blink { 50% { border-color: #5a1a10; } }
  .bars { display: flex; flex-direction: column-reverse; gap: 2px; }
  .bars i { display: block; width: 13px; height: 4px; background: #2a3242; }
  .bars i.on { background: var(--green); box-shadow: 0 0 4px rgba(106, 210, 106, .6); }
  #ftl { display: flex; flex-direction: column; gap: 5px; padding: 7px 9px; width: 132px; }
  #ftl .lbl { display: flex; justify-content: space-between; font: 400 11px/1 Silkscreen, monospace; color: var(--ink-2); }
  .meter { height: 8px; border: 2px solid #3a4254; background: #121620; }
  #ftlFill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, #5ac8ff 0 6px, #2a6a9a 6px 8px); }
  #ftl.ready #ftlFill { background: repeating-linear-gradient(90deg, #6ad26a 0 6px, #2e7a2e 6px 8px); }
  #jump { height: 26px; font-size: 11px; }
  #ftl.ready #jump { border-color: var(--green); color: #caffca; }

  /* the caption sits in the space between the systems dock and the crew card */
  .lane { position: fixed; left: 560px; right: max(12px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; }
  body.carded .lane { right: 326px; }
  #bar { margin: 0; padding: 8px 14px; font-size: 15px; text-align: center; color: var(--ink); }

  /* crew card, bottom right */
  #card { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); width: 300px; padding: 10px 12px 12px; box-sizing: border-box; }
  #card .head { display: flex; gap: 10px; align-items: center; }
  #cardPic canvas { display: block; image-rendering: pixelated; border: 2px solid #3a4254; background: #121620; }
  #cardName { margin: 0; font: 400 14px/1.2 Silkscreen, monospace; color: #fff; }
  #cardRole { margin: 2px 0 0; font-size: 13px; color: var(--d, var(--ink-2)); }
  #cardNow { margin: 10px 0 2px; font-size: 15px; color: var(--ink); }
  #cardNext { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
  #card .row { display: flex; gap: 6px; }
  #cardClose { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--ink-2); font: 400 14px/1 Silkscreen, monospace; }
  #cardClose:hover { color: #fff; }

  /* crew roster drawer */
  #roster { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 50px); right: max(12px, env(safe-area-inset-right)); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 150px);
    width: 300px; display: flex; flex-direction: column; box-sizing: border-box; }
  #roster header { display: flex; justify-content: space-between; align-items: center; padding: 8px 8px 6px 12px; border-bottom: 2px solid #232a3a; font: 400 13px/1 Silkscreen, monospace; }
  #rosterList { overflow-y: auto; padding: 4px 8px 10px; scrollbar-color: #3a4254 transparent; }
  #rosterList h3 { margin: 10px 4px 4px; font: 400 11px/1 Silkscreen, monospace; letter-spacing: .06em; color: var(--d); }
  .crew { display: flex; align-items: center; gap: 8px; width: 100%; padding: 3px 4px; border: 0; background: none; text-align: left; cursor: pointer; }
  .crew:hover, .crew.sel { background: #1c2232; }
  .crew.sel { box-shadow: inset 2px 0 0 var(--green); }
  .crew canvas { flex: none; image-rendering: pixelated; }
  .crew .txt { display: flex; flex-direction: column; min-width: 0; }
  .crew b { font-weight: 500; font-size: 14px; }
  .crew small { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rosterClose { width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--ink-2); }

  @media (max-width: 1100px) { .lane, body.carded .lane { left: 12px; right: 12px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 92px); } #notice { max-width: calc(100% - 40px); top: calc(max(12px, env(safe-area-inset-top)) + 64px); } }
  @media (max-width: 640px) {
    .name { top: calc(max(12px, env(safe-area-inset-top)) + 46px); left: 14px; } .name h1 { font-size: 15px; line-height: 20px; } .name p { font-size: 11px; }
    .top { gap: 6px; } .clockbox { min-width: 0; padding: 3px 8px; } #clock { font-size: 16px; } #watch { font-size: 10px; }
    .btn { padding: 0 8px; } .btn .t { display: none; }
    #systems { max-width: calc(100vw - 180px); overflow-x: auto; }
    #ftl { width: 104px; }
    #card { left: 12px; right: 12px; width: auto; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 96px); }
    #roster { left: 12px; width: auto; top: calc(max(12px, env(safe-area-inset-top)) + 96px); }
  }
  @media (prefers-reduced-motion: reduce) { #notice { transition: none; } .sys.broken canvas { animation: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="A cutaway of a starship, bow to the right. Click a room to look inside; click outside it to step back. Arrow keys move to the next room. Click a crew member to see who they are and follow them."></canvas>
<div class="name">
  <h1>All Hands</h1>
  <p><span id="shipName"></span> · <span id="shipClass"></span></p>
</div>
<div class="top">
  <div class="clockbox panel" role="group" aria-label="Ship time"><span id="clock">06:00</span><span id="watch">Alpha watch</span></div>
  <button class="btn" id="speed" type="button">1×</button>
  <button class="btn" id="rosterBtn" type="button" aria-controls="roster" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h3v3H4zM9 2h3v3H9zM3 6h5v5H3zM8 6h5v5H8zM4 11h3v3H4zM9 11h3v3H9z" fill="currentColor"/></svg><span class="t">Crew</span> <span id="crewCount"></span></button>
  <button class="btn" id="newShip" type="button" title="Build another ship"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h12v12H2z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 5h2v2H5zM9 9h2v2H9zM9 5h2v2H9zM5 9h2v2H5z" fill="currentColor"/></svg><span class="t">New ship</span></button>
</div>
<p id="notice" class="panel" role="status" aria-live="polite"></p>
<div class="dock">
  <div id="systems" class="panel" role="group" aria-label="Ship systems: green pips are crew on duty"></div>
  <div id="ftl" class="panel">
    <span class="lbl"><span>FTL drive</span></span>
    <div class="meter"><div id="ftlFill"></div></div>
    <button class="btn" id="jump" type="button">Charging</button>
  </div>
</div>
<div class="lane"><p id="bar" class="panel" aria-live="polite"></p></div>
<aside id="roster" class="panel" hidden aria-label="Crew roster">
  <header><span>Crew roster</span><button id="rosterClose" type="button" aria-label="Close the roster">×</button></header>
  <div id="rosterList"></div>
</aside>
<section id="card" class="panel" hidden aria-live="polite">
  <button id="cardClose" type="button" aria-label="Close">×</button>
  <div class="head"><div id="cardPic"></div><div><p id="cardName"></p><p id="cardRole"></p></div></div>
  <p id="cardNow"></p>
  <p id="cardNext"></p>
  <div class="row"><button class="btn" id="follow" type="button" aria-pressed="false">Follow</button></div>
</section>
<script type="module" src="main.js"></script>
</body>
</html>
