<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pop-Up</title>
<meta name="description" content="Three-second microgames on a cluttered 2003 desktop: close the real pop-up, punch the monkey, save before the blue screen.">
<meta name="theme-color" content="#245edb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #3a7bd5; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; font-family: Tahoma, Verdana, sans-serif; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* keeps the WordArt font warm before the first slam */
  #warm { position: fixed; left: -999px; top: 0; font: 20px Anton; }
</style>
</head>
<body>
<canvas id="cv" aria-label="Pop-Up: microgames on an old desktop"></canvas>
<div id="safe"></div>
<div id="warm">CLOSE IT!</div>
<script type="module" src="main.js"></script>
</body>
</html>
