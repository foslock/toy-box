<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tables &amp; Chairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2f2620; --ink-2: rgba(47, 38, 32, .72); --ink-3: rgba(47, 38, 32, .5); --card: rgba(255, 251, 243, .8); --line: rgba(47, 38, 32, .12);
    --accent: #3f8f86; --heat: 0; }
  html, body { height: 100%; margin: 0; }
  body { background: #cfe1ee; color: var(--ink); font: 400 15px/1.4 Fredoka, system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: crosshair; }
  #c:focus-visible { box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .7); }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .glass { background: var(--card); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 6px 24px -12px rgba(40, 30, 20, .45), inset 0 0 0 1px rgba(255, 255, 255, .55); }

  .name { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 60px; margin: 0; pointer-events: none;
    font: 700 25px/40px Fredoka, system-ui, sans-serif; letter-spacing: .01em; color: #fffaf1; text-shadow: 0 1px 2px rgba(40, 30, 20, .35), 0 0 18px rgba(40, 30, 20, .18); }

  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 6px; }
  .stats { display: flex; align-items: stretch; border-radius: 16px; padding: 5px 6px; }
  .stat { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 58px; padding: 0 9px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { font-weight: 600; font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat.big b { font-size: 25px; color: color-mix(in oklab, var(--accent), #c8322c calc(var(--heat) * 100%)); }
  .stat small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .round { display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; }
  .round svg { width: 20px; height: 20px; }
  .round:hover { background: #fff; }

  .queue { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 68px); right: max(12px, env(safe-area-inset-right)); width: 150px; border-radius: 18px; padding: 10px 10px 4px; box-sizing: border-box; }
  .queue h2 { margin: 0 2px 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .queue ol { list-style: none; margin: 0; padding: 0; }
  .queue li { margin: 0 0 8px; }
  .queue canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; background: radial-gradient(120% 90% at 50% 30%, #fffdf8, #efe6d6); }
  .queue li:first-child canvas { box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--accent), #c8322c calc(var(--heat) * 100%)); }
  .queue .nm { display: block; margin: 4px 2px 0; font-size: 13.5px; font-weight: 500; line-height: 1.15; }
  .queue .sz { display: block; margin: 0 2px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .map { position: fixed; left: max(12px, env(safe-area-inset-left)); top: calc(max(12px, env(safe-area-inset-top)) + 58px); width: 64px; height: min(36vh, 280px); border-radius: 14px; }

  .bottom { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: calc(100% - 24px); pointer-events: none; }
  .controls { display: flex; gap: 8px; pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 18px; border: 0; border-radius: 999px; box-sizing: border-box;
    font: 600 15.5px/1 Fredoka, system-ui, sans-serif; cursor: pointer; transition: transform .1s, background-color .15s; }
  .pill:hover { background: #fff; }
  .pill:active { transform: translateY(1px); }
  .pill svg { width: 19px; height: 19px; flex: none; }
  .pill.solid { background: var(--ink); color: #fffaf1; min-width: 120px; box-shadow: 0 6px 20px -8px rgba(40, 30, 20, .6); }
  .pill.solid:hover { background: #1f1814; }
  .pill:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint { margin: 0; padding: 6px 14px; border-radius: 999px; font-size: 13.5px; color: var(--ink-2); text-align: center; }
  .hint kbd { font: 600 12px/1 Fredoka, system-ui, sans-serif; padding: 2px 6px; border-radius: 6px; background: rgba(47, 38, 32, .08); box-shadow: inset 0 -1px 0 rgba(47, 38, 32, .15); color: var(--ink); }

  .card { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(30, 24, 20, .22); }
  .panel { width: min(430px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 26px 28px 22px; border-radius: 26px; background: rgba(255, 251, 243, .94);
    box-shadow: 0 24px 60px -24px rgba(40, 30, 20, .6); -webkit-user-select: text; user-select: text; }
  .panel h1 { margin: 0 0 6px; font-size: 32px; font-weight: 700; line-height: 1.1; }
  .panel p { margin: 0 0 12px; color: var(--ink-2); }
  .panel .big { font-size: 19px; color: var(--ink); }
  .panel dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 4px 0 18px; font-size: 14px; }
  .panel dt { font-weight: 600; }
  .panel dd { margin: 0; color: var(--ink-2); }
  .panel .pill.solid { width: 100%; height: 50px; font-size: 17px; }
  .panel .fine { margin: 12px 0 0; font-size: 12.5px; text-align: center; color: var(--ink-3); }
  .new { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: #c8322c; color: #fff; font-size: 12px; font-weight: 600; vertical-align: 3px; }

  @media (max-width: 640px) {
    .name { display: none; }
    .stat { min-width: 44px; padding: 0 6px; }
    .stat b { font-size: 16px; }
    .stat.big b { font-size: 20px; }
    .stat small { font-size: 9.5px; }
    .round { width: 38px; height: 38px; }
    .queue { width: auto; top: calc(max(12px, env(safe-area-inset-top)) + 58px); padding: 6px 6px 2px; border-radius: 14px; }
    .queue h2 { display: none; }
    .queue ol { display: flex; gap: 6px; }
    .queue li { width: 60px; margin: 0 0 4px; }
    .queue canvas { border-radius: 9px; }
    .queue .nm, .queue .sz { display: none; }
    .map { width: 44px; height: min(28vh, 180px); top: calc(max(12px, env(safe-area-inset-top)) + 58px); }
    .pill { height: 46px; padding: 0 16px; }
    .pill.solid { min-width: 100px; }
    .hint { font-size: 12.5px; }
  }
  @media (max-height: 520px) { .hint { display: none; } .map { display: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="A tower of tables and chairs. Move the next piece with the mouse, a finger, or the left and right arrow keys. Click, tap, or press Space to drop it. F flips it, R turns it."></canvas>
<p class="name">Tables &amp; Chairs</p>
<canvas id="map" class="map glass" aria-hidden="true"></canvas>
<div class="hud">
  <div class="stats glass" role="group" aria-label="Score">
    <div class="stat big"><b id="height">0.00</b><small>metres</small></div>
    <div class="stat"><b id="count">0</b><small>stacked</small></div>
    <div class="stat"><b id="best">–</b><small>best</small></div>
  </div>
  <button class="round glass" id="sound" type="button" aria-pressed="false" aria-label="Mute">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="cross" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/></svg>
  </button>
</div>
<aside class="queue glass" aria-labelledby="qh">
  <h2 id="qh">Up next</h2>
  <ol id="queue"></ol>
</aside>
<div class="bottom">
  <p class="hint glass" id="hint"></p>
  <div class="controls">
    <button class="pill glass" id="flip" type="button" aria-label="Flip the piece (F)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7 3 12l5 5V7z"/><path d="M16 7l5 5-5 5V7z"/></svg>Flip</button>
    <button class="pill solid" id="drop" type="button" aria-label="Drop the piece (Space)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13"/><path d="m6 11 6 6 6-6"/><path d="M5 21h14"/></svg>Drop</button>
    <button class="pill glass" id="turn" type="button" aria-label="Turn the piece a quarter (R)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>Turn</button>
  </div>
</div>
<div class="card" id="card" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <h1 id="cardTitle"></h1>
    <div id="cardBody"></div>
    <button class="pill solid" id="go" type="button"></button>
    <p class="fine" id="cardFine"></p>
  </div>
</div>
<p class="sr" id="live" aria-live="polite"></p>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "planck": "https://cdn.jsdelivr.net/npm/planck@1.5.0/dist/planck.mjs"
} }</script>
<script type="module" src="game.js"></script>
</body>
</html>
