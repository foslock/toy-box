<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switchboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #15110d; color: #eee2c4; overflow: hidden; font-family: Oswald, "Arial Narrow", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .name { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 60px; margin: 0; font-weight: 500; font-size: 23px; line-height: 1.2; letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 16px;
    font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(238, 226, 196, .72); }
  .hud b { font-weight: 600; font-size: 21px; letter-spacing: 0; color: #fff4d8; margin-right: 5px; }
  .pips { display: inline-flex; gap: 5px; align-items: center; }
  .pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgba(238, 226, 196, .5); box-sizing: border-box; }
  .pips i.on { background: #ff5238; border-color: #ff5238; box-shadow: 0 0 8px #ff5238; }
  .sound { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3);
    background: rgba(16, 12, 20, .38); color: rgba(255, 255, 255, .88); cursor: pointer; transition: background-color .15s, border-color .15s; }
  .sound:hover { background: rgba(16, 12, 20, .6); border-color: rgba(255, 255, 255, .65); color: #fff; }
  .sound:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .sound svg { width: 18px; height: 18px; }
  .hint { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0; width: max-content; max-width: calc(100% - 32px);
    text-align: center; font: 14px/1.35 "Special Elite", "Courier New", monospace; color: rgba(238, 226, 196, .75); pointer-events: none; }
  .card { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(10, 8, 6, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .card[hidden] { display: none; }
  .paper { width: min(450px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 24px 28px 20px; border-radius: 3px; color: #2c2219;
    background: #f1e8d0 repeating-linear-gradient(transparent 0 23px, rgba(70, 110, 170, .14) 23px 24px); box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    font: 15px/24px "Special Elite", "Courier New", monospace; -webkit-user-select: text; user-select: text; }
  .paper h1 { margin: 0 0 8px; font: 600 30px/40px Oswald, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #a8322a; border-bottom: 2px solid #a8322a; }
  .paper p { margin: 0 0 12px; }
  .paper ol { margin: 0 0 16px; padding-left: 1.4em; }
  .paper .big { font: 600 24px/32px Oswald, sans-serif; letter-spacing: .04em; margin-bottom: 6px; }
  .paper .fine { margin: 12px 0 0; font-size: 12px; text-align: center; opacity: .7; }
  #go { display: block; width: 100%; padding: 12px 16px; border: 0; border-radius: 5px; background: #b3342b; color: #fbf1dc; cursor: pointer;
    font: 600 17px/1 Oswald, sans-serif; letter-spacing: .14em; text-transform: uppercase; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); }
  #go:hover { background: #c43d33; }
  #go:focus-visible { outline: 3px solid #2f86d2; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 600px) { .name { display: none; } .hud { gap: 11px; font-size: 11px; } .hud b { font-size: 18px; } .hint { font-size: 12px; } .paper { padding: 18px 18px 16px; font-size: 14px; } }
  @media (max-height: 520px) { .hint { display: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="A telephone operator's cord switchboard with two boards of jacks and a shelf of cords. Arrow keys move between jacks, Space plugs your headset in to listen, Enter plugs in a cord, Escape lets go."></canvas>
<p class="name">Switchboard</p>
<div class="hud">
  <span><b id="made">0</b>put through</span>
  <span><b id="crossed">0</b>crossed</span>
  <span class="pips" id="pips" role="img" aria-label="No missed calls"></span>
  <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Mute sound">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="cross" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/></svg>
  </button>
</div>
<p class="hint" id="hint"></p>
<p class="sr" id="live" aria-live="polite"></p>
<div class="card" id="card">
  <div class="paper" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <h1 id="cardTitle">Switchboard</h1>
    <div id="cardBody"></div>
    <button id="go" type="button">Start shift</button>
    <p class="fine" id="cardFine">Sound on · headphones help</p>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
function mulberry(a) { return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DEMO = new URLSearchParams(location.search).has('demo');   // ?demo sets up a busy board with no sound (used for the preview image)
let rand = DEMO ? mulberry(12) : Math.random;
const rr = (a, b) => a + rand() * (b - a);
const pick = arr => arr[rand() * arr.length | 0];

const COLS = 8, ROWS = 5, PAIRS = 8, STRIKES = 5;
const BOARDS = ['Klondike', 'Butterfield'];
const ROW_NAMES = 'ABCDE';
const BLINK = 1.2;             // seconds for every ringing lamp on a board to take its turn
const WRONG_PENALTY = 8;       // seconds of patience a caller loses when you cross their line
const TAP = matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Click';

/* ---------- voices ----------
   A call has one voice, and both ends of it talk in that voice: that's how the operator knows who goes with whom.
   A voice is six traits. Voices ringing at the same time always sit at least 2 apart (about two clear traits), and
   as the shift wears on, new callers are more often picked to sit just past that line from someone already waiting:
   same pitch and same pattern, say, but a buzzier tone and a faster clip. */
const REGISTERS = [98, 134, 180, 238];            // Hz: low, low-middle, high-middle, high
const TEMPOS = [.25, .185, .14];                  // seconds per short syllable: unhurried, chatty, gabbling
// gains: loudness by register, measured so every voice comes down the line at about the same level
// (the line cuts the bottom out of low voices, and the resonant filters ring hotter on some than others).
const TIMBRES = [
  // trombone with a plunger mute: the classic wah
  { wave: 'saw', q: 5, open: 1500, fHz: 1100, fQ: 1.2, fGain: 3, scoop: 2.5, gains: [.88, .72, .64, .52] },
  // buzzy and nasal, like talking through a comb and paper
  { wave: 'pulse', q: 2.5, open: 2300, fHz: 1350, fQ: 3.5, fGain: 10, scoop: 1, gains: [.8, .71, .55, .5] },
  // hollow and hooty, with breath in it
  { wave: 'hoot', q: 11, open: 800, fHz: 600, fQ: 1, fGain: 4, scoop: 3.5, gains: [.88, .52, .43, .29], breath: .25 },
  // gravelly: the same horn, rattling
  { wave: 'saw', q: 4, open: 1150, fHz: 900, fQ: 1, fGain: 2, scoop: 2, gains: [1.23, 1.07, .93, .8], breath: .1, growl: .6 },
];
// Syllable lengths in short-syllable units; each inner list is said in one breath.
const RHYTHMS = [
  [[1, 1, 2], [1, 1, 2]],        // wa-wa-WAAH, wa-wa-WAAH
  [[2], [1, 1, 1, 1, 2]],        // WAAH, wa-wa-wa-wa-WAAH
  [[1, 1, 1], [1, 1, 1], [3]],   // wa-wa-wa, wa-wa-wa, WAAAH
  [[1, 2, 1, 2, 1, 2]],          // wa-WAH-wa-WAH-wa-WAH
  [[2, 2], [1, 1, 1, 1]],        // WAAH WAAH, wa-wa-wa-wa
  [[1, 1, 1, 1, 1, 1, 1, 2]],    // one long breathless run
];
const CHAT_RHYTHMS = [...RHYTHMS, [[1, 2]], [[2, 1, 1]], [[1, 1, 3]], [[1, 1], [1, 1, 2]]];
const MELODIES = 4;              // level, question, sing-song, tumbling down

function voiceDistance(a, b) {
  const dr = Math.abs(a.reg - b.reg), dt = Math.abs(a.tempo - b.tempo);
  return (dr ? (dr > 1 ? 1.5 : 1) : 0) + (dt ? (dt > 1 ? 1.3 : .9) : 0)
    + (a.timbre !== b.timbre) * 1.1 + (a.melody !== b.melody) * .9 + (a.rhythm !== b.rhythm) * 1 + (a.wobble !== b.wobble) * .5;
}
function pickVoice(others, nearP, far) {
  const near = others.length > 0 && rand() < nearP;
  let best = null, bestScore = -Infinity;
  for (let k = 0; k < 400; k++) {
    const t = { reg: rand() * 4 | 0, tempo: rand() * 3 | 0, timbre: rand() * 4 | 0, melody: rand() * MELODIES | 0, rhythm: rand() * RHYTHMS.length | 0, wobble: rand() < .3 ? 1 : 0 };
    const d = others.length ? Math.min(...others.map(o => voiceDistance(t, o))) : 9;
    if (d < 2) continue;
    const score = near ? -Math.abs(d - 2.2) + rand() * .3 : Math.min(d, far) + rand() * .5;
    if (score > bestScore) { bestScore = score; best = t; }
  }
  return makeVoice(best || { reg: 0, tempo: 0, timbre: 0, melody: 0, rhythm: 0, wobble: 0 });
}
function makeVoice(t) {
  const seed = rand() * 2 ** 31 | 0, R = mulberry(seed), T = TIMBRES[t.timbre];
  const v = { ...t, seed, f0: REGISTERS[t.reg] * 2 ** ((R() - .5) * 1.2 / 12), open: T.open * (1 + t.reg * .07) * (.9 + R() * .22), level: T.gains[t.reg] };
  v.phrase = phrase(v, 0);
  return v;
}
// The phrase a voice keeps repeating while it waits (variant 0), or one line of a conversation (variant 1, 2, …).
function phrase(v, variant) {
  const R = mulberry(v.seed * 31 + variant * 7919);
  const rhythm = variant ? CHAT_RHYTHMS[R() * CHAT_RHYTHMS.length | 0] : RHYTHMS[v.rhythm];
  const melody = variant ? R() * MELODIES | 0 : v.melody, unit = TEMPOS[v.tempo], n = rhythm.flat().length;
  const syl = [];
  rhythm.forEach((group, g) => group.forEach((u, j) => {
    const i = syl.length, last = i === n - 1;
    let st = 0, glide = 0;
    if (melody === 0) { st = (u > 1 ? 1.2 : 0) + (R() - .5) * 1.4; if (last) glide = -2.5; }
    else if (melody === 1) { st = (R() - .5) + (g === rhythm.length - 1 ? j * 1.6 : 0); if (last) glide = 6; }
    else if (melody === 2) { st = (i % 2 ? 4 : 0) + (R() - .5) * .8; if (last) glide = -1.5; }
    else { st = 7 - 10 * i / Math.max(1, n - 1) + (R() - .5) * 1.2; if (last) glide = -3; }
    syl.push({ d: u * unit * (.9 + R() * .2), st, glide, acc: u > 1 ? 1 : j === 0 ? .85 : .62 + R() * .2, vow: .82 + R() * .36,
      gap: j === group.length - 1 ? unit * 1.3 : .012, onset: j === 0 });
  }));
  syl[n - 1].gap = variant ? 0 : unit * 3 + .45;
  const starts = []; let t = 0;
  for (const s of syl) { starts.push(t); t += s.d + s.gap; }
  return { syl, starts, cycle: t };
}

/* ---------- sound: everything is synthesised ---------- */
let ac = null, master = null, noiseBuf = null, WAVES = null, SHAPE = null, muted = false, line = null;
try { muted = localStorage.getItem('switchboard.muted') === '1'; } catch {}
function audio() {
  if (DEMO) return null;
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = .004; comp.release.value = .2;
    master = ac.createGain(); master.gain.value = muted ? 0 : .85;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const wave = (re, im) => ac.createPeriodicWave(Float32Array.from(re), Float32Array.from(im));
    const pulse = [0], hoot = [0, 1, .5, .32, .14, .07, .03];
    for (let n = 1; n < 48; n++) pulse.push(2 / (n * Math.PI) * Math.sin(n * Math.PI * .2));
    WAVES = { pulse: wave(pulse, pulse.map(() => 0)), hoot: wave(hoot.map(() => 0), hoot) };
    SHAPE = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; SHAPE[i] = Math.tanh(1.8 * x) / Math.tanh(1.8); }
  }
  if (ac.state === 'suspended' && !G.paused) ac.resume();
  return ac;
}
function biquad(type, f, q, gain) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; if (gain != null) b.gain.value = gain; return b; }
function out(pan) {
  if (!ac.createStereoPanner) return master;
  const p = ac.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); p.connect(master); return p;
}
function tone(f, t, dur, { type = 'sine', vol = .2, attack = .004, to = 0, dest = master } = {}) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .02);

function noise(t, dur, { f = 2000, q = 1, vol = .2, attack = 0, to = 0, type = 'bandpass', dest = master } = {}) {
  const s = ac.createBufferSource(), b = biquad(type, f, q), g = ac.createGain();
  s.buffer = noiseBuf; if (to) b.frequency.exponentialRampToValueAtTime(to, t + dur);
  if (attack) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); } else g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  s.connect(b); b.connect(g); g.connect(dest); s.start(t, Math.random() * 1.5); s.stop(t + dur + .02);
}
function bell(f, t, dur, vol, dest) { tone(f, t, dur, { vol, dest }); tone(f * 2.76, t, dur * .35, { vol: vol * .25, dest }); tone(f * 5.4, t, dur * .12, { vol: vol * .08, dest }); }
const panX = x => clamp((x / innerWidth) * 2 - 1, -1, 1) * .6;
function play(fn) { return pan => { const c = audio(); if (c && c.state === 'running') fn(c.currentTime, out(pan)); }; }
const sfx = {
  plug: play((t, d) => { noise(t, .03, { f: 3000, q: 1.2, vol: .5, dest: d }); tone(170, t, .09, { vol: .45, to: 70, dest: d }); }),
  unplug: play((t, d) => { noise(t, .04, { f: 1600, q: 2, vol: .3, dest: d }); tone(620, t, .05, { vol: .08, to: 300, dest: d }); }),
  lift: play((t, d) => noise(t, .02, { f: 5200, q: 3, vol: .18, dest: d })),
  home: play((t, d) => { noise(t, .36, { f: 2400, to: 500, q: .9, vol: .1, attack: .08, dest: d }); tone(120, t + .34, .1, { vol: .35, to: 60, dest: d }); noise(t + .34, .03, { f: 1200, vol: .25, dest: d }); }),
  ring: play((t, d) => { noise(t, .012, { f: 2800, q: 5, vol: .4, dest: d }); noise(t + .08, .012, { f: 2400, q: 5, vol: .3, dest: d }); tone(880, t, .16, { type: 'square', vol: .012, dest: d }); }),
  ok: play((t, d) => { noise(t, .02, { f: 2000, vol: .3, dest: d }); bell(1175, t + .02, 1.1, .17, d); bell(1568, t + .14, 1.3, .15, d); }),
  bad: play((t, d) => {
    const lp = biquad('lowpass', 1400, .7); lp.connect(d);
    for (const f of [104, 111]) tone(f, t, .5, { type: 'sawtooth', vol: .12, attack: .01, dest: lp });
    noise(t, .03, { f: 1500, vol: .3, dest: d });
  }),
  hang: play((t, d) => { noise(t, .05, { f: 900, vol: .35, dest: d }); tone(494, t + .06, .2, { vol: .07, dest: d }); tone(370, t + .26, .32, { vol: .07, dest: d }); }),
  done: play((t, d) => { noise(t, .02, { f: 2600, q: 3, vol: .25, dest: d }); tone(1320, t, .09, { vol: .03, dest: d }); }),
  nope: play((t, d) => tone(92, t, .14, { type: 'square', vol: .06, dest: d })),
  tick: play((t, d) => { noise(t, .012, { f: 2200, q: 3, vol: .22, dest: d }); tone(900, t, .015, { vol: .03, dest: d }); }),
  over: play((t, d) => { [523, 415, 330].forEach((f, i) => bell(f, t + i * .28, .9, .14, d)); }),

// The headset line: whoever is on it goes through a narrow, slightly overdriven telephone band, over a little hiss.
class Line {
  constructor() {
    const t = ac.currentTime;
    this.in = ac.createGain();
    this.out = ac.createGain(); this.out.gain.setValueAtTime(0, t); this.out.gain.linearRampToValueAtTime(1, t + .06);
    this.pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    const hp = biquad('highpass', 290, .7), lp = biquad('lowpass', 3200, .9), pk = biquad('peaking', 1800, 1, 4), sh = ac.createWaveShaper();
    sh.curve = SHAPE;
    this.in.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(sh); sh.connect(this.out);
    if (this.pan) { this.out.connect(this.pan); this.pan.connect(master); } else this.out.connect(master);
    this.hiss = ac.createBufferSource(); this.hiss.buffer = noiseBuf; this.hiss.loop = true;
    const hb = biquad('bandpass', 2200, .5), hg = ac.createGain(); hg.gain.value = .012;
    this.hiss.connect(hb); hb.connect(hg); hg.connect(this.out); this.hiss.start(t, Math.random());
    this.talker = null; this.key = null; this.nextPop = t + rr(.3, 1.5);
  }
  setPan(v) { if (this.pan) this.pan.pan.setTargetAtTime(v, ac.currentTime, .03); }
  set(src) {
    const key = src ? src.key : null;
    if (key === this.key) return;
    this.key = key;
    if (this.talker) { this.talker.stop(); this.talker = null; noise(ac.currentTime, .015, { f: 2500, q: 2, vol: .12, dest: this.in }); }
    if (src) this.talker = new Talker(this, src.voice, src.gen(), src.delay);
  }
  tick() {
    if (this.talker) this.talker.tick();
    const now = ac.currentTime;
    if (now > this.nextPop) { noise(now + .02, rr(.003, .012), { f: rr(1200, 3000), q: .7, vol: rr(.05, .16), dest: this.in }); this.nextPop = now + rr(.2, 2.2); }
  }
  close() {
    const t = ac.currentTime;
    if (this.talker) this.talker.stop();
    this.out.gain.setTargetAtTime(0, t, .02); this.hiss.stop(t + .15);
    setTimeout(() => { try { (this.pan || this.out).disconnect(); } catch {} }, 300);
  }
}

// One voice on the line. Its syllables are scheduled a moment ahead on a single oscillator, so the pitch slides
// between them like a trombone; a resonant low-pass that opens and closes on every syllable is the plunger mute.
class Talker {
  constructor(line, v, gen, delay) {
    const t = ac.currentTime, T = TIMBRES[v.timbre];
    this.v = v; this.T = T; this.gen = gen; this.nextT = t + delay; this.nodes = [];
    const osc = this.osc = ac.createOscillator();
    if (T.wave === 'saw') osc.type = 'sawtooth'; else osc.setPeriodicWave(WAVES[T.wave]);
    osc.frequency.value = v.f0;
    const lfo = ac.createOscillator(), lfoG = ac.createGain();
    lfo.frequency.value = v.wobble ? 6.2 : 4.8; lfoG.gain.value = v.wobble ? 40 : 7;   // cents: a quaver, or a hint of life
    lfo.connect(lfoG); lfoG.connect(osc.detune);
    this.mute = biquad('lowpass', 300, T.q);
    const form = biquad('peaking', T.fHz * (1 + v.reg * .06), T.fQ, T.fGain);
    this.env = ac.createGain(); this.env.gain.value = 0;
    let src = osc;
    if (T.growl) {
      const am = ac.createGain(), amo = ac.createOscillator(), amd = ac.createGain();
      am.gain.value = 1 - T.growl / 2; amd.gain.value = T.growl / 2; amo.frequency.value = 29 + v.reg * 5;
      amo.connect(amd); amd.connect(am.gain); osc.connect(am); src = am; amo.start(t); this.nodes.push(amo);
    }
    src.connect(this.mute);
    if (T.breath) {

/* ---------- plugs and cords ---------- */

/* ---------- drawing, every frame ---------- */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(stat, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const hj = kbd.on ? kbd.j : hover && hover.kind === 'jack' ? hover.j : -1;
  if (hj >= 0 && G.running) {

    g.moveTo(P.rowX + (P.rowRight ? -.26 : .26) * S, J.y); g.lineTo(J.x + (P.rowRight ? .24 : -.24) * S, J.y); g.stroke();

}

/* ---------- input ---------- */

  }

  if (Math.abs(x - Sh.hs.x) < .6 * S && y > Sh.hs.tip - .25 * S && y < Sh.hs.tip + 1.5 * S) return { kind: 'headset' };
  for (let i = 0; i < PAIRS; i++) if (Math.abs(x - Sh.px[i]) < Sh.sp / 2) {
    if (y > Sh.tip[0] - .25 * S && y < Sh.tip[1] - .08 * S) return { kind: 'rest', end: cords[i].ends[0] };
    if (y >= Sh.tip[1] - .08 * S && y < Sh.tip[1] + .8 * S) return { kind: 'rest', end: cords[i].ends[1] };
  }
  if (Math.hypot(x - L.dial.x, y - L.dial.y) < L.dial.r) return { kind: 'dial' };
  return null;
}
const cordFree = cord => cord.state === 'free' && cord.ends.every(e => e.st === 'rest');
// One click (or tap, or the end of a drag) on whatever t is. Returns true if it picked something up.
function act(t) {
  if (!t && !hand) return false;
  if (t && t.kind === 'dial' && !hand) { dialAt(ptr.x, ptr.y); return false; }
  if (!G.running) return false;
  if (!hand) {
    if (t.kind === 'rest') { if (cordFree(t.end.cord)) { grab(t.end); return true; } sfx.nope(panX(ptr.x)); return false; }
    if (t.kind === 'headset') {
      if (headset.st === 'rest') { hand = { kind: 'headset' }; headset.st = 'held'; sfx.lift(panX(ptr.x)); return true; }
      unplugHeadset(); return false;
    }
    if (t.kind === 'jack') { if (headset.st === 'in' && headset.jack === t.j) unplugHeadset(); else plugHeadset(t.j); }
    return false;
  }
  if (hand.kind === 'headset') { if (t && t.kind === 'jack') plugHeadset(t.j); else unplugHeadset(); return false; }
  const end = hand.end, cord = end.cord, other = cord.ends[1 - end.k];
  if (t && t.kind === 'jack') {
    const J = jacks[t.j];
    if (J.plug) { if (J.plug === other) sendHome(cord); else sfx.nope(panX(J.x)); return false; }
    insert(end, t.j); return false;
  }
  if (t && t.kind === 'rest' && other.st === 'rest' && t.end.cord !== cord && cordFree(t.end.cord)) { sendHome(cord, true); grab(t.end); return true; }
  sendHome(cord);
  return false;
}
function setPtr(e) { const r = cv.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.type = e.pointerType || 'mouse'; }
function setCursor() {
  const live = hover && (hover.kind === 'dial' || G.running && !(hover.kind === 'rest' && !cordFree(hover.end.cord)));
  cv.style.cursor = hand && ptr.type === 'mouse' ? 'none' : live ? 'pointer' : 'default';
}
cv.addEventListener('pointerdown', e => {
  setPtr(e); kbd.on = false;
  if (e.button === 2) { dropHand(); return; }
  audio();
  const t = hitTest(ptr.x, ptr.y);
  ptr.down = { x: ptr.x, y: ptr.y, grabbed: act(t) };
  try { cv.setPointerCapture(e.pointerId); } catch {}
});
cv.addEventListener('pointermove', e => { setPtr(e); if (ptr.type === 'mouse') kbd.on = false; hover = hitTest(ptr.x, ptr.y); setCursor(); });
cv.addEventListener('pointerup', e => {
  setPtr(e);
  const d = ptr.down; ptr.down = null;
  if (!d || !d.grabbed || !hand || Math.hypot(ptr.x - d.x, ptr.y - d.y) < 12) return;
  const t = hitTest(ptr.x, ptr.y);                  // dragged a plug somewhere: drop it there if it's a jack
  if (t && t.kind === 'jack') act(t);
});
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (!$('card').hidden || !G.running || e.metaKey || e.ctrlKey || e.altKey || e.target.closest('button')) return;
  const J = jacks[kbd.j], k = e.key;
  // The two boards are one big grid for the arrow keys.
  let gc = L.portrait ? J.c : J.p * COLS + J.c, gr = L.portrait ? J.p * ROWS + J.r : J.r;
  const move = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (move) {
    e.preventDefault();
    if (kbd.on) { gc = clamp(gc + move[0], 0, L.portrait ? COLS - 1 : 2 * COLS - 1); gr = clamp(gr + move[1], 0, L.portrait ? 2 * ROWS - 1 : ROWS - 1); }
    const p = L.portrait ? Math.floor(gr / ROWS) : Math.floor(gc / COLS);
    kbd.j = jackAt(p, gc % COLS, gr % ROWS); kbd.on = kbd.used = true;
    if (hand) { const F = jacks[kbd.j]; ptr.x = F.x + S * .28; ptr.y = holeY(F) + S * .1; }   // the plug in hand follows the focus
  } else if (k === ' ') {
    e.preventDefault(); kbd.on = kbd.used = true;
    if (headset.st === 'in' && headset.jack === kbd.j) unplugHeadset(); else plugHeadset(kbd.j);
  } else if (k === 'Enter') {
    e.preventDefault(); kbd.on = kbd.used = true;
    const j = jacks[kbd.j]; ptr.x = j.x; ptr.y = holeY(j);
    if (!hand || hand.kind === 'headset') {
      const cord = cords.find(cordFree);
      if (!cord) { sfx.nope(panX(j.x)); announce('Every cord is in use.'); return; }
      if (hand) unplugHeadset();
      grab(cord.ends[0]);
    }
    act({ kind: 'jack', j: kbd.j });
  } else if (k === 'Escape') dropHand();
  else if (k === 'p' || k === 'P') pause();
});

/* ---------- HUD, hints, cards ---------- */
function hud() {
  $('made').textContent = G.made; $('crossed').textContent = G.crossed;
  $('pips').innerHTML = Array.from({ length: STRIKES }, (_, i) => `<i class="${i < G.missed ? 'on' : ''}"></i>`).join('');
  $('pips').setAttribute('aria-label', `${G.missed} of ${STRIKES} missed calls`);
}
let hintShown = null;
function hint() {
  let h = '';
  if (G.running && !DEMO) {
    if (hand && hand.kind === 'cord') h = hand.end.cord.ends.some(e => e.st === 'in') ? `Now ${TAP.toLowerCase()} the caller on the other board who sounds the same` : `${TAP} a caller’s jack to plug in this end`;
    else if (hand) h = `${TAP} a jack to listen in`;
    else if (G.made === 0 && !G.heardAny) h = `A row lamp and a column lamp blink together: the caller is where they cross. ${TAP} that jack to listen`;
    else if (G.made === 0 && !G.heardPair) h = 'Remember that voice, then find the one on the other board who talks just like it';
    else if (G.made === 0) h = `That’s the pair! Pick up a cord from the shelf, then ${TAP.toLowerCase()} both of their jacks`;
    else h = kbd.used ? 'Arrows move · Space listens · Enter plugs in a cord · Esc lets go' : `${TAP} a jack to listen · Pick up a cord and ${TAP.toLowerCase()} two jacks to connect them`;
  }
  if (h !== hintShown) { hintShown = h; $('hint').textContent = h; }
}
let liveTimer = 0;
function announce(text) { clearTimeout(liveTimer); $('live').textContent = ''; liveTimer = setTimeout(() => { $('live').textContent = text; }, 50); }
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function showCard(kind) {
  const body = $('cardBody');
  if (kind === 'intro') {
    $('cardTitle').textContent = 'Switchboard';
    body.innerHTML = `<p>You're on the board tonight. Callers ring in on both boards, and each one wants the caller on the <em>other</em> board who talks just like them.</p>
      <ol><li>A row lamp and a column lamp blink together: the caller is on the jack where they cross.</li>
      <li>${TAP} it to plug in your headset and listen.</li>
      <li>Found their match? Pick up a cord from the shelf and ${TAP.toLowerCase()} both jacks.</li>
      <li>Callers hang up if they wait too long. ${STRIKES} missed calls and your shift is over.</li></ol>`;
    $('go').textContent = 'Start shift'; $('cardFine').textContent = 'Sound on · headphones help';
  } else if (kind === 'paused') {
    $('cardTitle').textContent = 'On a break';
    body.innerHTML = `<p>The callers will hold. ${G.made} put through so far.</p>`;
    $('go').textContent = 'Back to the board'; $('cardFine').textContent = '';
  } else {
    $('cardTitle').textContent = 'Shift over';
    const beat = G.made > 0 && G.made >= best;
    body.innerHTML = `<p class="big">${G.made} ${G.made === 1 ? 'call' : 'calls'} put through</p>
      <p>${[`${G.crossed} crossed ${G.crossed === 1 ? 'line' : 'lines'}`, `${mmss(G.t)} on the board`, beat ? 'your best yet' : best ? `best ${best}` : ''].filter(Boolean).join(' · ')}</p>`;
    $('go').textContent = 'Another shift'; $('cardFine').textContent = '';
  }
  $('card').dataset.kind = kind; $('card').hidden = false;
  setTimeout(() => $('go').focus(), 30);
}
$('go').addEventListener('click', () => { if ($('card').dataset.kind === 'paused') resume(); else startShift(); });
function startShift() {
  audio();
  for (const J of jacks) { J.end = null; J.plug = null; J.flash = null; J.freedAt = -99; }
  for (const cord of cords) { cord.state = 'free'; cord.call = null; for (const e of cord.ends) { e.st = 'rest'; e.jack = -1; } }
  Object.assign(headset, { st: 'rest', jack: -1 }); hand = null; floaters.length = 0;
  Object.assign(G, { running: true, paused: false, over: false, t: 0, calls: [], seq: 0, nextSpawn: 1.2, made: 0, crossed: 0, missed: 0, heardAny: false, heardPair: false });
  $('card').hidden = true; hud(); cv.focus();
}
function endShift() {
  G.running = false; G.over = true;
  for (const c of G.calls) clearCall(c);
  G.calls = [];
  dropHand();
  for (const cord of cords) if (cord.state !== 'free') sendHome(cord, true);
  unplugHeadset();
  if (G.made > best) { best = G.made; try { localStorage.setItem('switchboard.best', String(best)); } catch {} } else best = Math.max(best, G.made);
  sfx.over(0);
  announce(`Shift over. ${G.made} calls put through.`);
  setTimeout(() => showCard('over'), 1200);
}
function pause() {
  if (!G.running || G.paused) return;
  G.paused = true; if (ac) ac.suspend();
  showCard('paused');
}
function resume() {
  G.paused = false; $('card').hidden = true;
  if (ac) ac.resume();
  cv.focus();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
$('sound').addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('switchboard.muted', muted ? '1' : '0'); } catch {}
  if (master) master.gain.setTargetAtTime(muted ? 0 : .85, ac.currentTime, .02);
  soundButton();
});
function soundButton() {
  $('sound').setAttribute('aria-pressed', String(muted)); $('sound').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  $('waves').style.display = muted ? 'none' : ''; $('cross').style.display = muted ? '' : 'none';
}

/* ---------- ?demo: a busy moment on the board ---------- */
function demo() {
  Object.assign(G, { running: true, t: 95, made: 14, crossed: 2, missed: 1, seq: 0 });
  const call = (a, b, state) => {
    const voice = pickVoice([], 0, 3), c = { id: ++G.seq, voice, state, deadline: Infinity, patience: 40, penalty: 0, ends: [], cord: null, until: 999 };
    for (const [p, j] of [[0, a], [1, b]]) { const e = { call: c, p, jack: j, appearAt: 0, shown: true, slot: -1, heard: false, phase: 0 }; jacks[j].end = e; c.ends.push(e); }
    G.calls.push(c); return c;
  };
  const plugIn = (end, j) => { end.st = 'in'; end.jack = j; end.t0 = -9; end.from = { x: 0, y: 0 }; jacks[j].plug = end; };
  [[jackAt(0, 1, 3), jackAt(1, 5, 1), 0], [jackAt(0, 6, 0), jackAt(1, 2, 4), 1], [jackAt(0, 4, 4), jackAt(1, 7, 3), 3], [jackAt(0, 0, 1), jackAt(1, 3, 2), 6]].forEach(([a, b, ci]) => {
    const c = call(a, b, 'talk'), cord = cords[ci];
    plugIn(cord.ends[0], a); plugIn(cord.ends[1], b); cord.state = 'talk'; cord.call = c; c.cord = cord;
  });
  const w = [call(jackAt(0, 2, 2), jackAt(1, 0, 0), 'wait'), call(jackAt(0, 5, 1), jackAt(1, 6, 2), 'wait'), call(jackAt(0, 7, 3), jackAt(1, 4, 4), 'wait')];
  w[0].deadline = G.t + 30; w[1].deadline = G.t + 14; w[2].deadline = G.t + 5;
  const held = cords[2];
  plugIn(held.ends[0], jackAt(0, 5, 1)); held.ends[1].st = 'held'; held.state = 'half'; hand = { kind: 'cord', end: held.ends[1] };
  const tgt = jacks[jackAt(1, 6, 2)]; ptr.x = tgt.x - S * .7; ptr.y = holeY(tgt) + S * .35;
  Object.assign(headset, { st: 'in', jack: jackAt(0, 2, 2), t0: -9, from: { x: 0, y: 0 } });
  $('card').hidden = true; hud();
}

/* ---------- go ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; rt += dt;
  if (G.running && !G.paused && !DEMO) update(dt);
  animate();
  if (!DEMO) updateLine();
  render(); hint();
  requestAnimationFrame(frame);
}
addEventListener('resize', layout);
layout();
if (document.fonts) document.fonts.ready.then(() => drawStatic());
soundButton(); hud();
if (DEMO) demo(); else showCard('intro');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
