<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #eeeae4; --ink-2: rgba(238, 234, 228, .72); --ink-3: rgba(238, 234, 228, .48); --line: rgba(238, 234, 228, .15);
    --glass: rgba(21, 20, 23, .7); --bg: #0a0a0c; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.35 Figtree, system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas.held { cursor: grabbing; }
  button { font-family: inherit; }
  [hidden]:not(.toast) { display: none !important; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .fade { position: fixed; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .fade.on { opacity: 1; }
  .name { position: fixed; top: max(15px, env(safe-area-inset-top)); left: 60px; margin: 0; pointer-events: none;
    font: 600 24px/34px Cinzel, Georgia, serif; letter-spacing: .16em; color: var(--ink); }
  .sub { position: fixed; top: calc(max(15px, env(safe-area-inset-top)) + 33px); left: 61px; margin: 0; pointer-events: none; font-size: 13.5px; color: var(--ink-2); letter-spacing: .01em; }

  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; box-sizing: border-box;
    border: 1px solid var(--line); background: none; color: var(--ink); font: 500 15px/1 Figtree, system-ui, sans-serif; white-space: nowrap; cursor: pointer;
    transition: background-color .15s, border-color .15s, opacity .15s; }
  .pill:hover { border-color: rgba(238, 234, 228, .4); background: rgba(238, 234, 228, .05); }
  .pill.solid { background: var(--ink); border-color: var(--ink); color: #151417; font-weight: 600; }
  .pill.solid:hover { background: #fff; }
  .pill:disabled { opacity: .45; cursor: default; }
  .pill svg { width: 17px; height: 17px; flex: none; }
  .pill.icon { width: 42px; padding: 0; }

  .show-btn { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); height: 38px; padding: 0 12px 0 14px;
    background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: rgba(238, 234, 228, .14); font-size: 12.5px; font-weight: 600; }

  .dock { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(740px, calc(100% - 32px));
    display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  .dock > * { pointer-events: auto; }
  .hint { margin: 0; max-width: 100%; text-align: center; font-size: 13.5px; letter-spacing: .02em; color: var(--ink-2); pointer-events: none; text-shadow: 0 1px 10px rgba(0, 0, 0, .8); transition: opacity .6s; }
  .hint.gone { opacity: 0; }
  .toast { margin: 0; padding: 8px 14px; border-radius: 999px; background: rgba(238, 234, 228, .92); color: #151417; font-size: 14px; font-weight: 500; transition: opacity .3s, transform .3s; }
  .toast[hidden] { display: block; opacity: 0; transform: translateY(6px); pointer-events: none; }
  .panel { width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .7); }
  .stage[hidden] { display: none; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }

  .presets { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -2px -16px 12px; padding: 2px 16px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
  .presets::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--ink-2);
    font: 500 13.5px/1 Figtree, system-ui, sans-serif; white-space: nowrap; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: rgba(238, 234, 228, .35); }
  .chip[aria-checked="true"] { background: rgba(238, 234, 228, .14); color: var(--ink); border-color: rgba(238, 234, 228, .45); }

  .cups { display: flex; gap: 6px; }
  .cup { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; padding: 2px 0; border: 0; background: none; color: var(--ink-2); cursor: pointer; }
  .cup:hover .dot { transform: translateY(-2px); }
  .cup .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .cup .fin { font-size: 11px; color: var(--ink-3); margin-top: -4px; }
  .dot { position: relative; width: 38px; height: 38px; border-radius: 50%; background: var(--c); transition: transform .15s;
    box-shadow: inset 0 -5px 9px rgba(0, 0, 0, .28), inset 0 2px 3px rgba(255, 255, 255, .22), 0 0 0 1px rgba(255, 255, 255, .12); overflow: hidden; }
  .dot::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 32%); }
  .dot[data-f="1"]::after { content: ""; position: absolute; inset: 0; background: conic-gradient(from 200deg, rgba(255, 190, 220, .35), rgba(170, 220, 255, .35), rgba(210, 255, 210, .3), rgba(255, 230, 170, .35), rgba(255, 190, 220, .35)); mix-blend-mode: soft-light; }
  .dot[data-f="2"]::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, .3) 60%, rgba(255, 255, 255, .35)); }
  .dot[data-f="3"]::after { content: ""; position: absolute; inset: 0; background:
      radial-gradient(circle at 30% 60%, #111 0 1.6px, transparent 2px), radial-gradient(circle at 62% 38%, #f4f1ec 0 1.8px, transparent 2.2px),
      radial-gradient(circle at 70% 72%, #222 0 2.2px, transparent 2.6px), radial-gradient(circle at 44% 24%, #1a1a1a 0 1.3px, transparent 1.7px),
      radial-gradient(circle at 22% 38%, #efe9e2 0 1.4px, transparent 1.8px), radial-gradient(circle at 52% 58%, rgba(0,0,0,.6) 0 1.5px, transparent 2px); }
  .dot[data-f="4"]::after { content: ""; position: absolute; inset: 0; background:
      radial-gradient(circle at 30% 60%, #fff 0 1px, transparent 1.6px), radial-gradient(circle at 62% 38%, #fff8dd 0 1.2px, transparent 1.8px),
      radial-gradient(circle at 70% 72%, #fff 0 .9px, transparent 1.5px), radial-gradient(circle at 44% 30%, #fff 0 .8px, transparent 1.4px),
      radial-gradient(circle at 25% 36%, #fffbe8 0 1px, transparent 1.6px), radial-gradient(circle at 55% 55%, #fff 0 .8px, transparent 1.4px); }
  .dot i { position: absolute; left: 0; right: 0; top: 0; height: var(--empty, 0%); background: rgba(21, 20, 23, .82); transition: height .2s linear; }

  .status { margin: 0 0 7px; font-size: 14.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; border-radius: 2px; background: rgba(238, 234, 228, .12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 2px; }
  .mini { display: flex; gap: 5px; }
  .mini .dot { width: 26px; height: 26px; }
  .piece { margin: 0; font: 600 18px/1.25 Cinzel, Georgia, serif; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pop { position: fixed; z-index: 20; width: 272px; box-sizing: border-box; padding: 14px; border-radius: 18px; background: rgba(28, 27, 31, .94); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 20px 50px -12px rgba(0, 0, 0, .8); }
  .pop[hidden] { display: none; }
  .pop h3 { margin: 0 0 10px; font: 500 13px/1 Figtree, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .sw { aspect-ratio: 1; width: 100%; padding: 0; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; box-shadow: inset 0 -3px 5px rgba(0, 0, 0, .25), 0 0 0 1px rgba(255, 255, 255, .12); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px #1c1b1f, 0 0 0 4px var(--ink); }
  .sw.custom { position: relative; overflow: hidden; background: conic-gradient(#e44, #ec4, #4c4, #4ce, #44e, #c4e, #e44); }
  .sw.custom input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); opacity: 0; cursor: pointer; }
  .fins { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .fins .chip { height: 28px; padding: 0 10px; font-size: 13px; }

  .drawer { position: fixed; z-index: 10; top: 0; right: 0; bottom: 0; width: min(430px, 100%); box-sizing: border-box; display: flex; flex-direction: column;
    background: rgba(18, 17, 20, .9); border-left: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    transform: translateX(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); visibility: hidden; }
  .drawer.open { transform: none; visibility: visible; }
  .drawer header { display: flex; align-items: center; justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 16px 12px 20px; }
  .drawer h2 { margin: 0; font: 600 20px/1 Cinzel, Georgia, serif; letter-spacing: .14em; }
  .drawer .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 16px 20px; }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
  .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: #16151a; box-shadow: 0 0 0 1px var(--line); transition: transform .15s; }
  .card:hover img { transform: translateY(-2px); }
  .card b { display: block; margin-top: 7px; font: 600 13.5px/1.2 Cinzel, Georgia, serif; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }
  .card[aria-current="true"] img { box-shadow: 0 0 0 2px var(--ink); }
  .empty { margin: 40px 10px; text-align: center; color: var(--ink-2); line-height: 1.5; }
  .fine { margin: 0; padding: 10px 20px max(16px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); }

  @media (max-width: 640px) {
    .name { font-size: 20px; }
    .sub { font-size: 12.5px; }
    .panel { padding: 12px; border-radius: 20px; }
    .presets { margin: -2px -12px 10px; padding: 2px 12px; }
    .row.wrap { flex-wrap: wrap; }
    .row.wrap .cups { width: 100%; justify-content: space-between; }
    .row.wrap .pill { flex: 1; }
    .cup { width: auto; flex: 1; }
    .pill { height: 40px; padding: 0 14px; font-size: 14.5px; }
    .mini .dot { width: 20px; height: 20px; }
    .piece { font-size: 16px; }
    .row.acts { flex-wrap: wrap; }
    .row.acts .grow { flex-basis: 100%; }
    .row.acts .pill { flex: 1; }
    .grid { gap: 10px; }
  }
  @media (max-width: 480px) { .drawer header { padding-left: 64px; } }
  @media (prefers-reduced-motion: reduce) { .drawer, .fade, .hint, .toast { transition: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="A clear acrylic mold on a dark table. Drag it to tilt the resin inside; once it sets, drag the stone slab to turn it in the light."></canvas>
<h1 class="name">Marble</h1>
<p class="sub" id="sub">Choose your resins</p>
<button class="pill show-btn" id="showBtn" type="button" aria-controls="drawer" aria-expanded="false">Showcase <span class="count" id="count">0</span></button>

<div class="dock">
  <p class="toast" id="toast" role="status" hidden></p>
  <p class="hint" id="hint"></p>
  <button class="pill" id="motion" type="button" hidden style="background: var(--glass)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4.5 8.5a6 6 0 0 0 0 7M19.5 8.5a6 6 0 0 1 0 7"/></svg><span id="motionLabel">Tilt with your phone</span></button>
  <section class="panel" aria-label="Controls">
    <div class="stage" data-stage="idle">
      <div class="presets" id="presets" role="radiogroup" aria-label="Recipes"></div>
      <div class="row wrap">
        <div class="cups" id="cups"></div>
        <div class="grow"></div>
        <button class="pill" id="shuffle" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button>
        <button class="pill solid" id="pour" type="button">Pour</button>
      </div>
    </div>
    <div class="stage" data-stage="work" hidden>
      <div class="row">
        <div class="mini" id="mini" aria-hidden="true"></div>
        <div class="grow"><p class="status" id="status" aria-live="polite">Pouring</p><div class="bar"><i id="bar"></i></div></div>
        <button class="pill" id="harden" type="button">Harden now</button>
      </div>
    </div>
    <div class="stage" data-stage="done" hidden>
      <div class="row acts">
        <div class="grow"><p class="piece" id="pieceName"></p><p class="meta" id="pieceMeta"></p></div>
        <button class="pill" id="again" type="button">Pour another</button>
        <button class="pill solid" id="save" type="button">Save to showcase</button>
      </div>
    </div>
    <div class="stage" data-stage="view" hidden>
      <div class="row acts">
        <div class="grow"><p class="piece" id="viewName"></p><p class="meta" id="viewMeta"></p></div>
        <button class="pill icon" id="prev" type="button" aria-label="Previous piece"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="pill icon" id="next" type="button" aria-label="Next piece"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="pill" id="del" type="button">Delete</button>
        <button class="pill solid" id="back" type="button">Back to the studio</button>
      </div>
    </div>
  </section>
</div>

<div class="pop" id="pop" role="dialog" aria-label="Change this resin" hidden>
  <h3 id="popTitle">Color</h3>
  <div class="swatches" id="swatches"></div>
  <div class="fins" id="fins" role="radiogroup" aria-label="Finish"></div>
</div>

<aside class="drawer" id="drawer" aria-label="Showcase">
  <header><h2>Showcase</h2><button class="pill icon" id="closeDrawer" type="button" aria-label="Close the showcase"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
  <div class="scroll"><p class="empty" id="empty">Nothing here yet.<br>Pour a slab, let it set, and save it.</p><ul class="grid" id="grid"></ul></div>
  <p class="fine" id="usage">Kept in this browser's local storage.</p>
</aside>
<div class="fade" id="fade"></div>

<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
const SPEED = Number(Q.get('speed')) || 1;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeIn = t => t * t * t;
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = (rng, a) => a[Math.floor(rng() * a.length)];

/* ---------- the mold, in metres ---------- */
const W = 0.24, D = 0.16;                  // inside of the mold: width along x, depth along z (and the slab it makes)
const WALL = 0.005, BASE = 0.006, RIM = 0.03;

const SLAB_T = FILL;
const G = 4.9;                             // gravity and viscosity are scaled together (half each): same creeping flow, fewer sim steps
const NU0 = 4.5e-4;                        // runny epoxy, ~900 cSt at full gravity
const FALL_H = 0.5, V0 = 0.35;             // the cup is ~50 cm up and the resin leaves it at ~35 cm/s
const FALL_T = (-V0 + Math.sqrt(V0 * V0 + 2 * 9.81 * FALL_H)) / 9.81;
const V_SURF = Math.sqrt(V0 * V0 + 2 * 9.81 * FALL_H);

/* ---------- renderer ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

renderer.toneMappingExposure = 1.0;

const SMALL = Math.min(screen.width, screen.height) < 600;
const NX = SMALL ? 180 : 240, NY = NX * 2 / 3, DX = W / NX;   // shallow-water grid, 1–1.3 mm cells
const TW = SMALL ? 768 : 1152, TH = TW * 2 / 3;               // color grid (and the slab's texture)
const PS = 256, NP = PS * PS;                                   // flecks

/* ---------- recipes ---------- */
// finish: 0 plain, 1 pearl, 2 metallic, 3 flecks (granite crystals), 4 glitter (metal flakes)
const FINISH = ['Plain', 'Pearl', 'Metallic', 'Flecks', 'Glitter'];
const L = (name, hex, finish = 0) => ({ name, hex, finish });
const PRESETS = [
  { name: 'Carrara', liquids: [L('Bianco', '#e6e4df'), L('Nuvola', '#b3b7bc'), L('Bardiglio', '#737a82'), L('Grafite', '#3b4047')] },
  { name: 'Calacatta Oro', liquids: [L('Bianco', '#f2eee7'), L('Greige', '#cdc5b8'), L('Taupe', '#716a63'), L('Oro', '#d0a449', 2)] },
  { name: 'Nero Marquina', liquids: [L('Nero', '#141518'), L('Fumo', '#2e2f34'), L('Neve', '#ece9e3'), L('Perla', '#c4bfb5', 1)] },
  { name: 'Verde Alpi', liquids: [L('Verde', '#1d382f'), L('Salvia', '#355e4b'), L('Latte', '#dbe4db'), L('Bosco', '#0c1814')] },
  { name: 'Rosso Levanto', liquids: [L('Rosso', '#6a1e24'), L('Mattone', '#98463d'), L('Avorio', '#e7d9d0'), L('Serpentino', '#3f5d50')] },
  { name: 'Azul Bahia', liquids: [L('Blu', '#1b3a76'), L('Cielo', '#3767ac'), L('Neve', '#e9eff6'), L('Notte', '#0d1c3b')] },
  { name: 'Nero Portoro', liquids: [L('Nero', '#111111'), L('Carbone', '#252321'), L('Oro', '#d8ab4e', 2), L('Paglia', '#e6d6ae')] },
  { name: 'Lapis', liquids: [L('Lapis', '#1e2d78'), L('Oltremare', '#2f47a6'), L('Calcite', '#d9dee8'), L('Pirite', '#d6b35c', 4)] },
  { name: 'Rosa Granite', style: 'speckled', liquids: [L('Rosa', '#b89b92', 3), L('Ardesia', '#5f5754', 3), L('Quarzo', '#e2dbd5', 3), L('Mica', '#9a958e', 4)] },
  { name: 'Honey Onyx', style: 'banded', liquids: [L('Miele', '#dca55a', 1), L('Ambra', '#b56b28'), L('Crema', '#f5e4c2'), L('Tabacco', '#5d3316')] },
  { name: 'Madreperla', liquids: [L('Perla', '#ece5e6', 1), L('Cipria', '#d9b9bd', 1), L('Argento', '#b7bbc3', 2), L('Lilla', '#857790')] },
  { name: 'Emperador', liquids: [L('Marrone', '#4d3224'), L('Nocciola', '#7a543b'), L('Crema', '#d8c0a4'), L('Ebano', '#22150e')] },
];
const PALETTE = ['#f2eee7', '#e6e4df', '#d6cfc3', '#b3b7bc', '#858a90', '#4c5157', '#26282c', '#111111', '#d0a449', '#b8784a', '#c2c5ca',

  const z = camZoom; camZoom = 1.12; frameCamera(w, h, true); camZoom = z;
  poseSlab(clock, 1);
  renderer.setRenderTarget(null); renderer.render(scene, camera);
  const url = compact(canvas, 0.82);
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight, false); frameCamera(innerWidth, innerHeight);
  poseSlab(clock, 1);
  renderer.render(scene, camera);                       // put the real frame back before the browser shows this one
  stream.visible = wasStream;
  return url;
}
function saveCurrent() {
  if (!current || current.saved) return;
  const a = readTarget(ALB, TW, TH), p = readTarget(PRP, TW, TH);
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const half = document.createElement('canvas'); half.width = TW / 2; half.height = TH / 2; half.getContext('2d').drawImage(p.canvas, 0, 0, TW / 2, TH / 2);
  const data = { a: compact(a.canvas, 0.88), p: p.any ? half.toDataURL('image/png') : null, pearl: current.recipe.liquids.some(l => l.finish === 1) }, thumb = thumbnail();
  const meta = { id, name: current.name, recipe: current.recipe, created: current.created };
  pieces = loadIndex();                                // another tab may have saved or deleted pieces
  try {
    localStorage.setItem(PIECE(id), JSON.stringify(data));
    localStorage.setItem(THUMB(id), thumb);
    localStorage.setItem(IDX, JSON.stringify([meta, ...pieces]));
  } catch (err) {
    try { localStorage.removeItem(PIECE(id)); localStorage.removeItem(THUMB(id)); } catch {}
    const full = err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014);
    toast(full ? 'Your showcase is full. Delete a piece to make room.' : "This browser isn't letting the page save anything.");
    return;
  }
  pieces = [meta, ...pieces]; current.saved = true;
  $('save').disabled = true; $('save').textContent = 'Saved';
  renderShowcase();
  toast(`${current.name} is in your showcase`);
}
$('save').addEventListener('click', saveCurrent);

const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmtDate = ms => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
function renderShowcase() {
  $('count').textContent = pieces.length;
  $('empty').hidden = pieces.length > 0;
  $('grid').innerHTML = pieces.map((m, i) => {
    let t = ''; try { t = localStorage.getItem(THUMB(m.id)) || ''; } catch {}
    const img = t.startsWith('data:image/') ? `<img alt="" src="${t}">` : '<img alt="">';
    return `<li><button class="card" type="button" data-i="${i}" aria-current="${viewing === i}">${img}<b>${esc(m.name)}</b><small>${fmtDate(m.created)}</small></button></li>`;
  }).join('');
  let bytes = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('marble.')) bytes += (localStorage.getItem(k) || '').length; } } catch {}
  $('usage').textContent = `Kept in this browser's local storage · ${pieces.length} ${pieces.length === 1 ? 'piece' : 'pieces'}, ${(bytes / 1e6).toFixed(1)} MB`;
}
const drawer = $('drawer');
function openDrawer(on) {
  drawer.classList.toggle('open', on); $('showBtn').setAttribute('aria-expanded', String(on));
  if (on) { if (phase !== 'view') pieces = loadIndex(); renderShowcase(); $('closeDrawer').focus(); }
}
$('showBtn').addEventListener('click', () => openDrawer(!drawer.classList.contains('open')));
$('closeDrawer').addEventListener('click', () => openDrawer(false));
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!pop.hidden) closePop(); else if (drawer.classList.contains('open')) openDrawer(false); } });

let returnTo = null;                                   // what to go back to after looking at saved pieces
const loadedTex = [];
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function viewPiece(i) {
  const busy = ['pour', 'flow', 'cure', 'demold'].includes(phase);
  if (busy) { toast('Let this one set first'); return; }
  const m = pieces[i]; if (!m) return;
  let data; try { data = JSON.parse(localStorage.getItem(PIECE(m.id))); } catch {}
  if (!data) { toast("That piece couldn't be read"); return; }
  const [a, p] = await Promise.all([loadImage(data.a), data.p ? loadImage(data.p) : null]);
  crossfade(() => {
    if (phase !== 'view') returnTo = phase;
    for (const t of loadedTex.splice(0)) t.dispose();
    const mk = img => { const t = new THREE.Texture(img); t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = maxAniso; t.needsUpdate = true; loadedTex.push(t); return t; };
    const ta = mk(a), tp = p ? mk(p) : blackTex;
    const U = slabMat.userData.u; U.uAlbedo.value = ta; U.uProps.value = tp; U.uPolish.value = 5;
    slabMat.iridescence = data.pearl ? 1 : 0;
    placeWalls(1); stream.visible = false; liquid.visible = false; slab.visible = true;
    startPose.p.copy(presentPos); startPose.q.copy(presentQ);
    turn.yaw = turn.pitch = turn.vyaw = turn.vpitch = 0;
    viewing = i;
    setPhase('view');
    $('viewName').textContent = m.name;
    $('viewMeta').textContent = `${fmtDate(m.created)} · ${m.recipe.liquids.map(l => l.name).join(' · ')}`;
    sub.textContent = m.name;
    $('prev').disabled = pieces.length < 2; $('next').disabled = pieces.length < 2;
    renderShowcase();
  });
}
const blackTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); blackTex.needsUpdate = true;
$('grid').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) { viewPiece(Number(b.dataset.i)); if (innerWidth < 700) openDrawer(false); } });
$('prev').addEventListener('click', () => viewPiece((viewing - 1 + pieces.length) % pieces.length));
$('next').addEventListener('click', () => viewPiece((viewing + 1) % pieces.length));
$('back').addEventListener('click', leaveView);
function leaveView() {
  crossfade(() => {
    viewing = null;
    for (const t of loadedTex.splice(0)) t.dispose();
    if (returnTo === 'done' && current) {
      const U = slabMat.userData.u; U.uAlbedo.value = ALB.texture; U.uProps.value = PRP.texture; U.uPolish.value = 5;
      slabMat.iridescence = current.recipe.liquids.some(l => l.finish === 1) ? 1 : 0;
      setPhase('done');
    } else {
      slab.visible = false; liquid.visible = true; placeWalls(0); poseMoldReset(); setPhase('idle'); renderRecipe();
    }
    renderShowcase();
  });
}
let delArmed = false;
$('del').addEventListener('click', () => {
  if (!delArmed) { delArmed = true; $('del').textContent = 'Really delete?'; setTimeout(() => { delArmed = false; $('del').textContent = 'Delete'; }, 3000); return; }
  delArmed = false; $('del').textContent = 'Delete';
  const m = pieces[viewing]; if (!m) return;
  try { localStorage.removeItem(PIECE(m.id)); localStorage.removeItem(THUMB(m.id)); } catch {}
  pieces = pieces.filter(x => x.id !== m.id);
  try { localStorage.setItem(IDX, JSON.stringify(pieces)); } catch {}
  toast(`${m.name} was deleted`);
  if (pieces.length) viewPiece(Math.min(viewing, pieces.length - 1)); else leaveView();
});

/* ---------- input ---------- */
let drag = null;
const keys = new Set();
canvas.addEventListener('pointerdown', e => {
  if (!pop.hidden) closePop();
  const mode = phase === 'done' || phase === 'view' ? 'turn' : 'tilt';
  drag = { id: e.pointerId, mode, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, lt: performance.now() };
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('held'); lastInput = performance.now();
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY; lastInput = performance.now();
  if (drag.mode === 'turn') {
    const dt = Math.max(1, performance.now() - drag.lt) / 1000;
    const dyaw = (e.clientX - drag.lx) * 0.006, dp = (e.clientY - drag.ly) * 0.004;
    turn.yaw += dyaw; turn.pitch = clamp(turn.pitch + dp, PITCH_MIN, PITCH_MAX);
    turn.vyaw = dyaw / dt; turn.vpitch = 0;
  }
  drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = performance.now();
});
const endDrag = e => { if (drag && e.pointerId === drag.id) { drag = null; canvas.classList.remove('held'); } };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  if (!e.key.startsWith('Arrow') || e.target.closest('input')) return;
  if (phase === 'view' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && pieces.length > 1 && document.activeElement === canvas) { viewPiece((viewing + (e.key === 'ArrowLeft' ? -1 : 1) + pieces.length) % pieces.length); return; }
  if (document.activeElement !== canvas && document.activeElement !== document.body) return;
  keys.add(e.key); lastInput = performance.now(); e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key));
addEventListener('blur', () => keys.clear());

// tilting the phone tilts the mold
const tiltDevice = { available: 'DeviceOrientationEvent' in window && matchMedia('(pointer: coarse)').matches, on: false, b: 0, g: 0, b0: null, g0: null };
addEventListener('deviceorientation', e => {
  if (!tiltDevice.on || e.beta == null) return;
  if (tiltDevice.b0 === null) { tiltDevice.b0 = e.beta; tiltDevice.g0 = e.gamma; }
  tiltDevice.b = e.beta - tiltDevice.b0; tiltDevice.g = e.gamma - tiltDevice.g0; lastInput = performance.now();
});
$('motion').addEventListener('click', async () => {
  if (tiltDevice.on) { tiltDevice.on = false; $('motionLabel').textContent = 'Tilt with your phone'; return; }
  try { if (typeof DeviceOrientationEvent.requestPermission === 'function' && await DeviceOrientationEvent.requestPermission() !== 'granted') return; } catch { return; }
  tiltDevice.on = true; tiltDevice.b0 = tiltDevice.g0 = null; $('motionLabel').textContent = 'Stop tilting with the phone';
});

/* ---------- main loop ---------- */
let last = performance.now(), clock = 0, frozen = false;
let slowT = 0;
function frame(now) {
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  // on a slow GPU, draw fewer pixels rather than let the resin stutter
  slowT = raw > 0.034 && raw < 0.5 ? slowT + raw : Math.max(0, slowT - raw * 0.5);
  if (slowT > 2 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() - 0.5)); resize(); slowT = 0; }
  tick(dt);
  requestAnimationFrame(frame);
}
function tick(dt, draw = true) {
  clock += dt;
  camZoomT = phase === 'done' || phase === 'view' || (phase === 'demold' && phaseT > 0.9) ? 1.18 : 1;
  if (Math.abs(camZoomT - camZoom) > 1e-4) { camZoom += (camZoomT - camZoom) * (1 - Math.exp(-dt * 2.5)); frameCamera(innerWidth, innerHeight); }
  scene.environmentIntensity = lerp(1, 1.45, clamp((camZoom - 1) / 0.18, 0, 1));   // more light on the slab you hold up
  phaseT += dt;
  if (!frozen) moveMold(dt, clock);
  const working = (phase === 'pour' || phase === 'flow' || phase === 'cure') && !frozen;
  if (working) {
    const sdt = dt * SPEED;
    simulate(sdt);
    composite();
    if (phase === 'pour' && simT >= plan.end) setPhase('flow');
    else if (phase === 'flow' && phaseT * SPEED >= FLOW_T) setPhase('cure');
    else if (phase === 'cure') {
      const k = cureK();
      liquidMat.userData.u.uCure.value = k;
      liquidMat.userData.u.uMen.value = 0.0011 * (1 - 0.6 * k);
      if (k >= 1) beginDemold();
    }
  }
  const e = updateStream(simT);
  // panel readouts
  if (phase === 'pour') {
    const l = e ? recipe.liquids[matAt(e, simT - FALL_T)] : null;
    $('status').textContent = l ? `Pouring ${l.name}` : 'Pouring';
    $('bar').style.width = (100 * clamp(simT / plan.end, 0, 1)).toFixed(1) + '%';
  } else if (phase === 'flow') {
    $('status').textContent = `Still runny · ${Math.ceil(FLOW_T - phaseT * SPEED)} s`;
    $('bar').style.width = (100 * (1 - clamp(phaseT * SPEED / FLOW_T, 0, 1))).toFixed(1) + '%';
  } else if (phase === 'cure') {
    const k = cureK();
    $('status').textContent = `Setting · ${Math.round(k * 100)}%`;
    $('bar').style.width = (100 * k).toFixed(1) + '%';
  }
  if (working) [...$('mini').children].forEach((d, i) => d.querySelector('i').style.setProperty('--empty', (100 * clamp(poured[i] / Math.max(planned[i], 1e-9), 0, 1)).toFixed(0) + '%'));

  if (phase === 'demold') {
    const t = phaseT;
    $('status').textContent = t < 2.3 ? 'Demolding' : 'Polishing';
    $('bar').style.width = (100 * clamp(t / 4.2, 0, 1)).toFixed(1) + '%';
    placeWalls(clamp(t / 1.3, 0, 1));
    if (t > 0.5 && !slab.visible) { slab.visible = true; liquid.visible = false; }
    poseSlab(clock, (t - 0.9) / 1.5);
    slabMat.userData.u.uPolish.value = t < 2.4 ? -0.2 : lerp(-0.15, 1.35, clamp((t - 2.4) / 1.6, 0, 1));
    if (t >= 4.2) { slabMat.userData.u.uPolish.value = 5; setPhase('done'); }
  } else if (phase === 'done' || phase === 'view') {
    if (!drag) { turn.yaw += turn.vyaw * dt; turn.vyaw *= Math.exp(-dt * 3); turn.pitch *= Math.exp(-dt * 1.5); }
    poseSlab(clock, 1);
  }
  if (!draw) return;
  renderer.setRenderTarget(null); renderer.render(scene, camera);
}

/* ---------- start ---------- */
renderRecipe();
renderShowcase();
resetSim();
setPhase('idle');
resize();
// ?demo (for the preview image): a fixed pour, fast-forwarded to the gold going in; ?demo=done runs on to the polished slab
if (DEMO) {
  presetIndex = 1; recipe = cloneRecipe(PRESETS[1]); renderRecipe(); startPour();
  const until = Q.get('demo') === 'done' ? () => phase === 'done' : () => simT >= Number(Q.get('t') || 14.1);
  for (let i = 0; i < 4000 && !until(); i++) tick(1 / 60, false);
  frozen = Q.get('demo') !== 'done';                    // hold this moment, whatever the frame rate
  hint.style.transition = 'none'; hint.classList.add('gone');
}
requestAnimationFrame(frame);
window.toyboxReady?.();                                // clears the Toy Box loading bar once that first frame is up
</script>
</body>
</html>
