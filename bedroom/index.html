<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Small Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #0a0c16; overflow: hidden; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #motes { pointer-events: none; mix-blend-mode: screen; }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: overlay; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(130% 110% at 45% 48%, transparent 55%, rgba(4, 5, 14, .5) 100%); }
  .name { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 60px; margin: 0; pointer-events: none;
    font: italic 500 28px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .01em; color: rgba(214, 224, 250, .72);
    text-shadow: 0 1px 16px rgba(4, 6, 20, .5); }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A dark bedroom at night, painted. Moonlight falls through a window of small panes and lies across the floorboards in a pale square of light, slowly creeping across the room and up the wall as the moon moves."></canvas>
<canvas id="motes" aria-hidden="true"></canvas>
<div class="grain" id="grain"></div>
<div class="vignette"></div>
<p class="name">Small Hours</p>
<script>
(() => {
'use strict';
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => { c = typeof c === 'string' ? hex(c) : c; return `rgba(${clamp(c[0], 0, 255) | 0},${clamp(c[1], 0, 255) | 0},${clamp(c[2], 0, 255) | 0},${+a.toFixed(3)})`; };
const tone = (c, k, a = 1) => rgba((typeof c === 'string' ? hex(c) : c).map(v => v * k), a);   // a colour, lighter or darker
// vectors are plain [x, y, z] arrays
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const scl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => scl(a, 1 / Math.hypot(a[0], a[1], a[2]));

/* ---------- the room ----------
   Metres. x runs to the right, y up, z away from the viewer, who stands in the doorway.
   The window is in the left wall; the moon is outside it, high and out of sight. */
const XL = -1.9, XR = 2.05, ZF = -0.8, ZB = 3.9, HC = 2.6;
const WIN = { z0: 2.05, z1: 3.2, y0: 0.8, y1: 2.16 };   // the opening, at the room face of the wall
const XG = XL - 0.13;                                     // the glass sits this far back in the wall
const EYE = [0.2, 1.52, -0.6];

// The sashes: six panes over six. Rectangles [z, y, w, h] in the plane of the glass.
const FRAME = 0.05, STILE = 0.038, MUNTIN = 0.019, MEET = 0.022;
const SASH = (() => {
  const z0 = WIN.z0 + FRAME + STILE, z1 = WIN.z1 - FRAME - STILE, yb = WIN.y0 + FRAME, yt = WIN.y1 - FRAME, ym = (yb + yt) / 2 + 0.03;
  return { z0, z1, yb, yt, ym, lo: [yb + 0.075, ym - MEET], hi: [ym + MEET, yt - 0.045] };
})();
const PANES = (() => {
  const out = [];

    const pw = (SASH.z1 - SASH.z0 - 2 * MUNTIN) / 3, ph = (yz - ya - MUNTIN) / 2;
    for (let j = 0; j < 2; j++) for (let i = 0; i < 3; i++) out.push([SASH.z0 + i * (pw + MUNTIN), ya + j * (ph + MUNTIN), pw, ph]);
  }
  return out;
})();

// Furniture, shared by the painting and the shadows it throws.
const BED = { x0: 0.5, x1: 2.03, z0: 1.8, z1: 3.84, top: 0.59, turn: 3.18 };
const HEAD = { x0: 0.46, x1: 2.05, z0: 3.83, h: 1.1 };
const PILLOWS = [[0.6, 1.25], [1.3, 1.95]];
const STAND = { x0: -0.16, x1: 0.34, z0: 3.46, z1: 3.88, h: 0.56 };
const LAMP = { x: 0.02, z: 3.68, r0: 0.07, rb: 0.17, rt: 0.115, y1: 0.74, y2: 0.96 };
const CHAIR = { x: -0.8, z0: 3.43, z1: 3.84, w: 0.44, seat: 0.46, back: 0.96 };
const DRESSER = { x0: XL, x1: XL + 0.46, z0: 0.72, z1: 1.62, h: 0.86 };
const RUG = { x0: -1.25, x1: 0.3, z0: 0.95, z1: 2.95 };
const SLIPPERS = [[0.2, 2.22, -8], [0.33, 2.3, 4]];     // x, z of the heel, turn in degrees
const OCCLUDERS = [
  [[STAND.x0, 0.08, STAND.z0], [STAND.x1, STAND.h, STAND.z1]],
  [[LAMP.x - 0.07, STAND.h, LAMP.z - 0.07], [LAMP.x + 0.07, LAMP.y1, LAMP.z + 0.07]],
  [[LAMP.x - 0.15, LAMP.y1, LAMP.z - 0.15], [LAMP.x + 0.15, LAMP.y2, LAMP.z + 0.15]],
  [[0.13, STAND.h, 3.52], [0.3, STAND.h + 0.07, 3.76]],
  [[CHAIR.x - 0.22, CHAIR.seat - 0.03, CHAIR.z0], [CHAIR.x + 0.22, CHAIR.seat, CHAIR.z1]],
  [[CHAIR.x - 0.21, CHAIR.seat, CHAIR.z1 - 0.06], [CHAIR.x + 0.21, CHAIR.back, CHAIR.z1]],
  [[CHAIR.x - 0.21, 0, CHAIR.z0], [CHAIR.x - 0.175, CHAIR.seat, CHAIR.z0 + 0.035]],
  [[CHAIR.x + 0.175, 0, CHAIR.z0], [CHAIR.x + 0.21, CHAIR.seat, CHAIR.z0 + 0.035]],
  [[CHAIR.x - 0.21, 0, CHAIR.z1 - 0.035], [CHAIR.x - 0.175, CHAIR.seat, CHAIR.z1]],
  [[CHAIR.x + 0.175, 0, CHAIR.z1 - 0.035], [CHAIR.x + 0.21, CHAIR.seat, CHAIR.z1]],
  [[BED.x0, 0.12, BED.z0], [BED.x1, BED.top, BED.z1]],
  [[PILLOWS[0][0], BED.top - 0.03, 3.36], [PILLOWS[1][1], BED.top + 0.15, 3.82]],
  [[HEAD.x0, 0, HEAD.z0], [HEAD.x1, HEAD.h, ZB]],
  [[0.12, 0, 2.18], [0.42, 0.07, 2.5]],                  // the slippers
];

/* ---------- the moon ----------
   A real arc across a southern sky (latitude, declination, hour angle), run faster than life: the pool of
   light drifts about a pane's width every couple of minutes, reaches the back wall and climbs it before moonset. */
const Q = new URLSearchParams(location.search);
const START = clamp(Number(Q.get('t')) || 0, 0, 36000);   // ?t=600 starts ten minutes in
const RATE = clamp(Number(Q.get('rate')) || 1, 0.1, 600);   // ?rate=20 fast-forwards, for checking the pacing
const LAT = -35 * DEG, DECL = -8 * DEG;
const WIN_FACES = 305 * DEG;                                // compass bearing the window looks out on
const LAPSE = 8;                                            // moon time per real second
const H0 = 40 * DEG;                                        // hour angle when the page opens
const N_OUT = [Math.sin(WIN_FACES), Math.cos(WIN_FACES), 0];
const RX = scl(N_OUT, -1), RZ = cross(N_OUT, [0, 0, 1]);   // room axes in east/north/up
function moonDir(t) {                                       // unit vector toward the moon, room axes
  const H = H0 + t * LAPSE * 15 * DEG / 3600, cd = Math.cos(DECL), sd = Math.sin(DECL), cp = Math.cos(LAT), sp = Math.sin(LAT);
  const enu = [-cd * Math.sin(H), sd * cp - cd * Math.cos(H) * sp, sd * sp + cd * Math.cos(H) * cp];
  return [dot(enu, RX), enu[2], dot(enu, RZ)];
}

/* ---------- camera ---------- */
let cam = null;
const NEAR = 0.04;
function makeCam(W, H) {
  // The camera is kept level, so walls and the window stay upright as a painter would draw them; the frame is
  // shifted down instead of the view being tipped. It aims for a 64° wide view, but never more than 74° tall
  // (phones) or less than 40° (very wide screens), and the narrower the view, the more it turns toward the light.
  const half = deg => Math.tan(deg * DEG / 2);
  const F = Math.min(Math.max((W / 2) / half(64), (H / 2) / half(74)), (H / 2) / half(40));
  const k = smoothstep(38, 64, 2 * Math.atan(W / 2 / F) / DEG);
  const yaw = lerp(-14, -19, k) * DEG, look = lerp(-11, -9, k) * DEG;
  const f = [Math.sin(yaw), 0, Math.cos(yaw)], r = [Math.cos(yaw), 0, -Math.sin(yaw)], u = [0, 1, 0];
  return { pos: EYE, f, r, u, F, cx: W / 2, cy: H / 2 + F * Math.tan(look), W, H };
}
function toCam(p) { const d = sub(p, cam.pos); return [dot(d, cam.r), dot(d, cam.u), dot(d, cam.f)]; }
const projC = c => [cam.cx + cam.F * c[0] / c[2], cam.cy - cam.F * c[1] / c[2]];
function sp(p) { const c = toCam(p); return c[2] > NEAR ? projC(c) : null; }
const spDir = d => { const c = [dot(d, cam.r), dot(d, cam.u), dot(d, cam.f)]; return c[2] > 1e-4 ? projC(c) : null; };

const pxAt = (m, p) => m * cam.F / depthOf(p);              // screen pixels spanned by m metres at p
function clipNear(poly) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], ai = a[2] >= NEAR, bi = b[2] >= NEAR;
    if (ai) out.push(a);
    if (ai !== bi) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t), NEAR]); }
  }

}
const projPoly = poly => clipNear(poly.map(toCam)).map(projC);

/* ---------- surfaces ----------
   Every painted surface belongs to a plane. The plane buffer tells the shader which plane each pixel shows,
   so it can find the point in the room and ask whether the moon can see it through the window. */
const SKY = 0, SILHOUETTE = 1;                  // ids for the view through the glass
let planes = [];
function plane(n, p, a = {}) {
  n = norm(n);
  const d = -dot(n, p), row = [n[0], n[1], n[2], d, a.gloss ?? 0, a.direct ?? 1, a.bounce ?? 1, a.sky ?? 1];
  const key = row.map(v => v.toFixed(4)).join();
  let i = planes.findIndex(r => r.key === key);
  if (i < 0) { i = planes.length; row.key = key; planes.push(row); }

}
function resetPlanes() { planes = []; plane([0, 0, 1], [0, 0, 1e4], { direct: 0, bounce: 0, sky: 0 }); plane([0, 0, 1], [0, 0, 2e4], { direct: 0, bounce: 0, sky: 0 }); }
// Plane ids go in the red channel, with a check code in green and blue: anti-aliased edges fail the check and are repaired.
const codeG = id => (id * 73 + 41) & 255, codeB = id => (id * 151 + 17) & 255;
const idCol = id => `rgb(${id},${codeG(id)},${codeB(id)})`;
// A plane facing the viewer across the floor, for round things.
const facing = p => { const d = sub(cam.pos, p); d[1] = 0; return norm(d); };

/* ---------- painting ----------
   The scene is painted three times with the same strokes: the colours as they'd be by day, the plane ids, and
   an occlusion layer (soft darkness in corners and under things, which dims the ambient light but not the moon). */
let G = null, MODE = 'alb';
function pathOf(pts) {

  G.beginPath(); G.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) G.lineTo(pts[i][0], pts[i][1]);
  G.closePath(); return true;
}
const poly3 = pts3 => pathOf(projPoly(pts3));
// Smooth closed curve through screen points (Catmull-Rom).
function curvePath(pts, closed = true) {
  const n = pts.length; if (n < 3) return false;
  G.beginPath(); G.moveTo(pts[0][0], pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const a = closed || i > 0 ? p0 : p1, d = closed || i < n - 2 ? p3 : p2;

  }

const curve3 = (pts3, closed = true) => { const pts = pts3.map(sp); return pts.every(Boolean) && curvePath(pts, closed); };
// Fill whatever path build() makes: its colour by day, its plane id, or white in the occlusion pass.
// detail() paints on top, clipped to it.
function shape(build, id, style, detail) {
  if (!build()) return;
  G.lineWidth = 0.75; G.lineJoin = 'round';
  if (MODE === 'id') { G.fillStyle = G.strokeStyle = idCol(id); G.fill(); G.stroke(); return; }
  if (MODE === 'ao') { G.fillStyle = G.strokeStyle = '#fff'; G.fill(); G.stroke(); return; }
  G.fillStyle = G.strokeStyle = typeof style === 'function' ? style() : style; G.fill(); G.stroke();
  if (detail) { G.save(); G.clip(); detail(); G.restore(); }
}
const surf = (pts3, id, style, detail) => shape(() => poly3(pts3), id, style, detail);
const ALB = () => MODE === 'alb';
// A soft, blurred fill (shadowBlur works everywhere canvas filters don't).
function softFill(build, color, blurPx) {
  G.save(); G.shadowColor = color; G.shadowBlur = Math.max(0.5, blurPx); G.shadowOffsetX = 20000; G.translate(-20000, 0);
  if (build()) { G.fillStyle = '#000'; G.fill(); }
  G.restore();
}
// Occlusion pass only: soft darkness over a patch of floor or wall.
function ao(pts3, alpha, blurM) {
  if (MODE !== 'ao') return;
  const c = pts3.reduce((s, p) => add(s, scl(p, 1 / pts3.length)), [0, 0, 0]);
  softFill(() => poly3(pts3), `rgba(0,0,0,${alpha})`, pxAt(blurM, c));
}
function grad3(a, b, stops) {
  const pa = sp(a) || [0, 0], pb = sp(b) || [0, 1];
  const gr = G.createLinearGradient(pa[0], pa[1], pb[0] + 1e-3, pb[1]);
  for (const [t, c] of stops) gr.addColorStop(t, c);
  return gr;

// A stroke through 3D points; width in metres, measured at the first point.
function line3(pts3, wM, style, cap = 'round') {
  const pts = pts3.map(sp); if (pts.some(p => !p)) return;
  G.strokeStyle = style; G.lineWidth = Math.max(0.5, pxAt(wM, pts3[0])); G.lineCap = G.lineJoin = cap;
  G.beginPath(); G.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) G.lineTo(pts[i][0], pts[i][1]); G.stroke();
}
// Draws fn() in the flat metric frame of a plane at p (axes U, V): small marks come out in perspective.
function onPlane(p, U, V, fn) {
  const s = sp(p), e = 0.01, a = sp(add(p, scl(U, e))), b = sp(add(p, scl(V, e)));
  if (!s || !a || !b) return;
  G.save(); G.transform((a[0] - s[0]) / e, (a[1] - s[1]) / e, -(b[0] - s[0]) / e, -(b[1] - s[1]) / e, s[0], s[1]); fn(); G.restore();

// Soft round dab of colour at a 3D point, radius in metres.
function dab(p, rM, col, a) {

  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));

// An axis-aligned box: paints the faces that face the viewer. mats maps face keys (l r b t f k) to styles, def is the fallback.
function box(a, b, mats, attrs = {}, details = {}, oneId = null) {
  const [x0, y0, z0] = a, [x1, y1, z1] = b;
  const faces = [
    ['l', [-1, 0, 0], [[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]]],
    ['r', [1, 0, 0], [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]]],
    ['b', [0, -1, 0], [[x0, y0, z0], [x0, y0, z1], [x1, y0, z1], [x1, y0, z0]]],
    ['t', [0, 1, 0], [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]],
    ['f', [0, 0, -1], [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]]],
    ['k', [0, 0, 1], [[x0, y0, z1], [x0, y1, z1], [x1, y1, z1], [x1, y0, z1]]],

  for (const [key, n, pts] of faces) {
    if (dot(n, sub(cam.pos, pts[0])) <= 1e-6) continue;
    const m = mats[key] ?? mats.def;
    surf(pts, oneId ?? plane(n, pts[0], attrs[key] || attrs.def || {}), typeof m === 'function' ? () => m(pts) : m, details[key] && (() => details[key](pts)));

}
// A vertical cylinder or cone frustum: fills its outline (the hull of its two rims).
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], hi = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (hi.length >= 2 && cr(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
  return lo.slice(0, -1).concat(hi.slice(0, -1));
}
const ring = (x, y, z, r, n = 28) => Array.from({ length: n }, (_, i) => [x + r * Math.cos(i / n * TAU), y, z + r * Math.sin(i / n * TAU)]);
function cyl(x, z, y0, y1, r0, r1, id, style, detail) {
  const pts = [...ring(x, y0, z, r0), ...ring(x, y1, z, r1)].map(sp);
  if (pts.some(p => !p)) return;
  shape(() => pathOf(hull(pts)), id, style, detail);
}

/* ---------- colours by day ----------
   The shader lights these with moonlight, sky and bounce, then grades everything toward night. */
const C = {
  wall: '#a9b1b1', wallStripe: '#a6aeaf', sprig: '#94a09c',
  ceiling: '#dddbd4', trim: '#e6e3da',
  floor: '#b88c5f', seam: '#3b2a1c', grain: '#8a6440',
  walnut: '#5e3f2b', walnutLight: '#7d573c', oak: '#a37b52', oakLight: '#bf966a',
  linen: '#ebe8e0', linenShade: '#cfccc4', turn: '#b9c3cf',
  throwKnit: '#b58d4c', pillow2: '#8f9f94',
  rugField: '#9b574d', rugBorder: '#3d4865', rugCream: '#d4c6a6', rugRust: '#ad7349', rugTeal: '#6f8a86',
  lampBase: '#9fb4aa', shade: '#e4ddca',
  knit: '#a9776a',
  curtain: '#d6cebd',
  dresser: '#6d5040',
  leaf: '#4f6f45', pot: '#a8623f',
};

/* ---------- the night outside ----------
   Painted as seen (the shader doesn't light it, but adds the stars): sky and thin cloud, far hills, rooftops with a
   lit window or two, and the dark gardens below. */
function paintOutside() {
  const glass = [[XG, WIN.y0, WIN.z0], [XG, WIN.y1, WIN.z0], [XG, WIN.y1, WIN.z1], [XG, WIN.y0, WIN.z1]];
  const gp = projPoly(glass);
  if (!pathOf(gp)) return;
  if (MODE === 'ao') { G.fillStyle = '#fff'; G.fill(); return; }
  G.fillStyle = MODE === 'id' ? idCol(SKY) : '#1d2c52'; G.fill();
  G.save(); pathOf(gp); G.clip();
  const th0 = Math.atan2(WIN.z0 - EYE[2], XG - EYE[0]) + 0.35, th1 = Math.atan2(WIN.z1 - EYE[2], XG - EYE[0]) - 0.35;
  const dir = (th, el) => [Math.cos(th) * Math.cos(el), Math.sin(el), Math.sin(th) * Math.cos(el)];
  const thMid = (th0 + th1) / 2;
  const rng = mulberry32(91);
  // Skyline from azimuth/elevation samples, filled down to well below the window.
  const skyline = (elFn, id, col, n = 90) => {
    G.beginPath();
    for (let i = 0; i <= n; i++) { const th = lerp(th0, th1, i / n), p = spDir(dir(th, elFn(th, i / n))); if (p) i ? G.lineTo(p[0], p[1]) : G.moveTo(p[0], p[1]); }
    const b1 = spDir(dir(th1, -40 * DEG)), b0 = spDir(dir(th0, -40 * DEG));
    if (b1) G.lineTo(b1[0], b1[1]); if (b0) G.lineTo(b0[0], b0[1]);
    G.closePath(); G.fillStyle = MODE === 'id' ? idCol(id) : col; G.fill();
  };
  if (ALB()) {
    const h = spDir(dir(thMid, 0)), z = spDir(dir(thMid, 14 * DEG));
    const gr = G.createLinearGradient(z[0], z[1], h[0], h[1]);
    gr.addColorStop(0, '#15244a'); gr.addColorStop(0.55, '#2a3f6c'); gr.addColorStop(0.88, '#4b5d88'); gr.addColorStop(1, '#6a6d8e');
    G.fillStyle = gr; G.fillRect(0, 0, G.canvas.width, G.canvas.height);
    // soft bands of cloud, lit from above
    for (let i = 0; i < 7; i++) {
      const el = lerp(3, 12, rng()) * DEG, th = lerp(th0, th1, rng()), a = spDir(dir(th, el)), b = spDir(dir(th - 0.25, el + 0.4 * DEG));
      if (!a || !b) continue;
      G.save(); G.globalAlpha = 0.18 + rng() * 0.18; G.strokeStyle = '#7d8db4'; G.lineCap = 'round'; G.lineWidth = pxAt(0.02, [XG, 1.5, 2.6]) * (0.4 + rng());
      G.filter = 'blur(2px)'; G.beginPath(); G.moveTo(a[0], a[1]); G.lineTo(b[0], b[1]); G.stroke(); G.restore();
    }
  }
  // far hills, then the town's roofs and trees, then the dark garden below
  skyline(th => (0.6 + 1.1 * (0.5 + 0.5 * fbm2(th * 9, 3.1))) * DEG, SILHOUETTE, '#34406a');
  skyline((th, f) => {
    const roof = Math.max(0, 1 - Math.abs(f - 0.3) / 0.12) * 2.2 + Math.max(0, 1 - Math.abs(f - 0.72) / 0.09) * 1.6;
    return (-0.8 + 1.4 * (0.5 + 0.5 * fbm2(th * 30, 7.7)) + roof) * DEG;
  }, SILHOUETTE, '#212a4e');
  if (ALB()) for (const [f, el] of [[0.45, -1.4], [0.47, -1.3], [0.56, -0.9]]) {
    const p = spDir(dir(lerp(th0, th1, f), el * DEG)); if (!p) continue;
    const r = Math.max(1, cam.F * 0.0011);   // a far window, still lit
    const g = G.createRadialGradient(p[0], p[1], 0, p[0], p[1], r * 5);
    g.addColorStop(0, 'rgba(255,205,130,1)'); g.addColorStop(0.2, 'rgba(255,180,100,0.45)'); g.addColorStop(1, 'rgba(255,160,80,0)');
    G.fillStyle = g; G.fillRect(p[0] - r * 5, p[1] - r * 5, r * 10, r * 10);
  }
  skyline(th => (-3.5 + 5 * Math.max(0, fbm2(th * 14, 1.3) + 0.2)) * DEG, SILHOUETTE, '#141a38');
  if (ALB()) {
    // a faint sheen on the old glass
    const a = sp([XG, WIN.y1, WIN.z0]), b = sp([XG, WIN.y0, WIN.z1]);
    if (a && b) { const g = G.createLinearGradient(a[0], a[1], b[0], b[1]); g.addColorStop(0, 'rgba(200,215,255,0.07)'); g.addColorStop(0.45, 'rgba(200,215,255,0.015)'); g.addColorStop(0.55, 'rgba(200,215,255,0.04)'); g.addColorStop(1, 'rgba(200,215,255,0)'); G.fillStyle = g; G.fillRect(0, 0, G.canvas.width, G.canvas.height); }
  }
  G.restore();
}

/* ---------- walls, floor, window ---------- */
// Wallpaper: faint stripes and small sprigs, painted flat on the wall plane.
function paper(o, U, V, w, h, seed) {
  const rng = mulberry32(seed), at = (u, v) => add(o, add(scl(U, u), scl(V, v)));

  for (let j = 0, v = 0.1; v < h; j++, v += 0.19) {
    for (let u = (j % 2) * 0.08 + 0.02; u < w; u += 0.16) {
      onPlane(at(u, v + (rng() - 0.5) * 0.01), U, V, () => {
        G.fillStyle = C.sprig; G.strokeStyle = C.sprig; G.lineWidth = 0.0035; G.lineCap = 'round';
        G.beginPath(); G.moveTo(0, -0.022); G.quadraticCurveTo(0.004, 0, -0.002, 0.024); G.stroke();
        for (const [x, y, a] of [[0.004, 0.006, -0.6], [-0.003, -0.004, 0.7], [0.002, 0.018, -0.3]]) {
          G.save(); G.translate(x, y); G.rotate(a); G.beginPath(); G.ellipse(0.007, 0, 0.008, 0.0035, 0, 0, TAU); G.fill(); G.restore();
        }

    }

  for (let i = 0; i < w * h * 9; i++) dab(at(rng() * w, rng() * h), 0.12 + rng() * 0.3, rng() < 0.5 ? '#bcc3c2' : '#949d9e', 0.08 + rng() * 0.08);
}
function paintShell() {
  // Ceiling, back wall, right wall, left wall (with the window cut out), floor.
  surf([[XL, HC, ZF], [XR, HC, ZF], [XR, HC, ZB], [XL, HC, ZB]], plane([0, -1, 0], [0, HC, 0]), C.ceiling, () => {
    const rng = mulberry32(5);
    for (let i = 0; i < 60; i++) dab([lerp(XL, XR, rng()), HC, lerp(ZF, ZB, rng())], 0.3 + rng() * 0.4, rng() < 0.5 ? '#e8e6df' : '#cfccc4', 0.1);
  });

  surf([[XR, 0, ZF], [XR, 0, ZB], [XR, HC, ZB], [XR, HC, ZF]], plane([-1, 0, 0], [XR, 0, 0]), C.wall, () => paper([XR - 0.001, 0, ZF], [0, 0, 1], [0, 1, 0], ZB - ZF, HC, 12));
  const outer = [[XL, 0, ZF], [XL, HC, ZF], [XL, HC, ZB], [XL, 0, ZB]], hole = [[XL, WIN.y0, WIN.z0], [XL, WIN.y1, WIN.z0], [XL, WIN.y1, WIN.z1], [XL, WIN.y0, WIN.z1]];
  const wallL = () => {
    G.beginPath();
    for (const pts of [projPoly(outer), projPoly(hole)]) { pts.forEach(([x, y], i) => i ? G.lineTo(x, y) : G.moveTo(x, y)); G.closePath(); }

  else { wallL(); G.fillStyle = MODE === 'id' ? idCol(idL) : '#fff'; G.fill('evenodd'); }

  ao([[XL, HC - 0.3, ZB], [XR, HC - 0.3, ZB], [XR, HC, ZB], [XL, HC, ZB]], 0.45, 0.3);
  ao([[XL, 0, ZB], [XL, HC, ZB], [XL + 0.3, HC, ZB], [XL + 0.3, 0, ZB]], 0.4, 0.25);
  ao([[XR - 0.3, 0, ZB], [XR - 0.3, HC, ZB], [XR, HC, ZB], [XR, 0, ZB]], 0.4, 0.25);
  ao([[XL, HC - 0.3, ZF], [XL, HC - 0.3, ZB], [XL, HC, ZB], [XL, HC, ZF]], 0.45, 0.3);
  ao([[XL, HC, ZF], [XL + 0.4, HC, ZF], [XL + 0.4, HC, ZB], [XL, HC, ZB]], 0.4, 0.3);
  ao([[XL, HC, ZB - 0.4], [XR, HC, ZB - 0.4], [XR, HC, ZB], [XL, HC, ZB]], 0.4, 0.3);
  ao([[XL, 0, ZB], [XL, 0.3, ZB], [XR, 0.3, ZB], [XR, 0, ZB]], 0.4, 0.15);

}

function paintBoards() {
  const rng = mulberry32(7), W = 0.14;
  const boards = [];
  for (let x = XL; x < XR - 1e-3; x += W) {
    let z = ZF - rng() * 2.5;
    while (z < ZB) {
      const z1 = Math.min(ZB, z + 1.1 + rng() * 2.4), k = 0.84 + rng() * 0.3, warm = rng();
      boards.push({ x, z0: Math.max(z, ZF), z1, k, warm });
      z = z1;
    }
  }
  for (const b of boards) {
    const col = mix(hex(C.floor), [196, 150, 98], b.warm * 0.35).map(v => v * b.k);
    G.fillStyle = rgba(col);
    poly3([[b.x, 0, b.z0], [b.x, 0, b.z1], [b.x + W, 0, b.z1], [b.x + W, 0, b.z0]]) && G.fill();
    // grain: long faint lines along the board, with the odd knot
    const n = 5 + (rng() * 4 | 0);
    for (let i = 0; i < n; i++) {
      const u = b.x + (0.1 + 0.8 * rng()) * W, wob = rng() * 10, pts = [];
      for (let z = b.z0; z <= b.z1 + 1e-6; z += 0.15) pts.push([u + 0.004 * Math.sin(z * 3 + wob), 0, z]);
      if (pts.length > 1) line3(pts, 0.0022, rgba(rng() < 0.6 ? C.grain : '#d3a878', 0.18 + rng() * 0.2), 'butt');
    }
    if (rng() < 0.18) { const kz = lerp(b.z0, b.z1, rng()), kx = b.x + W * (0.25 + 0.5 * rng()); onPlane([kx, 0, kz], [1, 0, 0], [0, 0, 1], () => { G.fillStyle = rgba(C.grain, 0.5); G.beginPath(); G.ellipse(0, 0, 0.008, 0.02, 0, 0, TAU); G.fill(); }); }
    if (b.z1 < ZB) line3([[b.x, 0, b.z1], [b.x + W, 0, b.z1]], 0.0025, rgba(C.seam, 0.4), 'butt');
  }
  for (let x = XL + W; x < XR; x += W) line3([[x, 0, 0.0], [x, 0, ZB]], 0.003, rgba(C.seam, 0.45), 'butt');
}

function paintWindow() {
  paintOutside();
  const T = { def: C.trim, r: tone(C.trim, 1.02), t: tone(C.trim, 0.9), b: tone(C.trim, 0.7), f: tone(C.trim, 0.8), k: tone(C.trim, 0.8) };

  // dark lattice, so they share a single plane (their thin sides would only flicker between planes).
  const sashId = plane([1, 0, 0], [XG + 0.03, 0, 0], { sky: 0 });
  const bar = (z0, z1, y0, y1, d0 = -0.012, d1 = 0.024) => box([XG + d0, y0, z0], [XG + d1, y1, z1], T, {}, {}, sashId);
  const zA = WIN.z0 + FRAME, zB = WIN.z1 - FRAME, yA = WIN.y0 + FRAME, yB = WIN.y1 - FRAME;
  const pw = PANES[0][2];
  for (const [ya, yz] of [SASH.lo, SASH.hi]) {
    const ph = (yz - ya - MUNTIN) / 2;
    bar(SASH.z0 + pw, SASH.z0 + pw + MUNTIN, ya, yz); bar(SASH.z0 + 2 * pw + MUNTIN, SASH.z0 + 2 * pw + 2 * MUNTIN, ya, yz);
    bar(SASH.z0, SASH.z1, ya + ph, ya + ph + MUNTIN);
  }
  bar(zA, zB, yA, SASH.lo[0], -0.012, 0.03); bar(zA, zB, SASH.lo[1], SASH.hi[0], -0.03, 0.03); bar(zA, zB, SASH.hi[1], yB);
  bar(zA, SASH.z0, yA, yB); bar(SASH.z1, zB, yA, yB);
  // the sash lock on the meeting rail
  box([XG + 0.03, SASH.ym - 0.004, (zA + zB) / 2 - 0.035], [XG + 0.045, SASH.ym + 0.012, (zA + zB) / 2 + 0.035], { def: '#8a7a5a' }, {}, {}, sashId);
  bar(WIN.z0, zA, WIN.y0, WIN.y1, -0.02, 0.045); bar(zB, WIN.z1, WIN.y0, WIN.y1, -0.02, 0.045);
  bar(WIN.z0, WIN.z1, yB, WIN.y1, -0.02, 0.045); bar(WIN.z0, WIN.z1, WIN.y0, yA, -0.02, 0.045);
  // The reveal: the thickness of the wall around the window.
  const rv = XG + 0.045;
  surf([[rv, WIN.y0, WIN.z1], [rv, WIN.y1, WIN.z1], [XL, WIN.y1, WIN.z1], [XL, WIN.y0, WIN.z1]], plane([0, 0, -1], [XL, 0, WIN.z1]), C.wall);
  surf([[rv, WIN.y0, WIN.z0], [XL, WIN.y0, WIN.z0], [XL, WIN.y1, WIN.z0], [rv, WIN.y1, WIN.z0]], plane([0, 0, 1], [XL, 0, WIN.z0]), C.wall);
  surf([[rv, WIN.y1, WIN.z0], [XL, WIN.y1, WIN.z0], [XL, WIN.y1, WIN.z1], [rv, WIN.y1, WIN.z1]], plane([0, -1, 0], [XL, WIN.y1, 0]), C.wall);
}
function paintWindowTrim() {
  const T = { def: C.trim };

  box([XG + 0.04, WIN.y0 - 0.032, WIN.z0 - 0.06], [XL + 0.045, WIN.y0, WIN.z1 + 0.06], T);
  box([XL, WIN.y0 - 0.11, WIN.z0 - 0.05], [XL + 0.016, WIN.y0 - 0.032, WIN.z1 + 0.05], T);

  box([XL, WIN.y1, WIN.z0 - 0.075], [XL + 0.02, WIN.y1 + 0.075, WIN.z1 + 0.075], T);
  box([XL, WIN.y1 + 0.075, WIN.z0 - 0.09], [XL + 0.03, WIN.y1 + 0.095, WIN.z1 + 0.09], T);

// A trailing plant in a clay pot at the end of the sill: its leaves throw shadows into the moonlight.
const PLANT = { x: XL - 0.055, z: 2.93, y: WIN.y0, r: 0.062, h: 0.11 };
const LEAVES = (() => {
  const rng = mulberry32(33), out = [];
  for (let i = 0; i < 26; i++) {
    const hang = i < 11, a = rng() * TAU;
    const along = hang ? 0.05 + rng() * 0.17 : 0.03 + rng() * 0.16;
    const dz = Math.cos(a) * (hang ? 0.07 + rng() * 0.05 : 0.02 + along * 0.4), dy = hang ? -along + 0.1 : PLANT.h + along;
    out.push({ z: PLANT.z + dz, y: PLANT.y + dy, s: 0.022 + rng() * 0.018, rot: hang ? (rng() - 0.5) * 1.2 + Math.PI / 2 : a, x: PLANT.x + Math.sin(a) * 0.05, k: 0.7 + rng() * 0.5 });
  }
  return out;
})();
function leafPath(g, s) { g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(s * 0.5, -s * 0.55, s * 1.05, -s * 0.3, s, 0); g.bezierCurveTo(s * 1.05, s * 0.3, s * 0.5, s * 0.55, 0, 0); g.closePath(); }
function paintPlant() {
  const id = plane([1, 0, 0], [PLANT.x + 0.03, 0, 0]);
  cyl(PLANT.x, PLANT.z, PLANT.y, PLANT.y + PLANT.h, PLANT.r * 0.8, PLANT.r, plane(facing([PLANT.x, 0, PLANT.z]), [PLANT.x + 0.05, 0, PLANT.z]), () => grad3([PLANT.x, 0.9, PLANT.z - 0.07], [PLANT.x, 0.9, PLANT.z + 0.07], [[0, tone(C.pot, 1.1)], [1, tone(C.pot, 0.7)]]));
  for (const L of LEAVES) {
    onPlane([L.x, L.y, L.z], [0, 0, 1], [0, 1, 0], () => {
      G.rotate(-L.rot); leafPath(G, L.s);
      G.fillStyle = MODE === 'id' ? idCol(id) : MODE === 'ao' ? '#fff' : tone(C.leaf, L.k); G.fill();
      if (ALB()) { G.strokeStyle = tone(C.leaf, 1.4, 0.5); G.lineWidth = 0.0015; G.beginPath(); G.moveTo(0, 0); G.lineTo(L.s * 0.9, 0); G.stroke(); }
    });
  }
}

/* ---------- the rug ---------- */
function paintRug() {
  // A worn Persian-style rug: guard stripes, a border with a running vine, a madder field with a lozenge medallion.
  const { x0, x1, z0, z1 } = RUG, y = 0.008, W = x1 - x0, D = z1 - z0;
  const at = (u, v) => [x0 + u, y, z0 + v];               // metres across and along the rug
  const id = plane([0, 1, 0], [0, y, 0]);
  const rect = (a, b, c, d) => [at(a, c), at(b, c), at(b, d), at(a, d)];
  const fillUV = (pts, col) => { G.fillStyle = col; poly3(pts.map(([u, v]) => at(u, v))) && G.fill(); };
  ao([[x0 - 0.04, 0, z0 - 0.04], [x1 + 0.04, 0, z0 - 0.04], [x1 + 0.04, 0, z1 + 0.04], [x0 - 0.04, 0, z1 + 0.04]], 0.22, 0.03);
  surf(rect(0, W, 0, D), id, C.rugCream, () => {
    const g = 0.028, B = 0.165, rng = mulberry32(21);
    fillUV([[g, g], [W - g, g], [W - g, D - g], [g, D - g]], C.rugBorder);
    // the border's vine: a wavy line round the rug with little rosettes on it
    const m = g + B / 2, loop = [];
    for (const [ua, va, ub, vb] of [[m, m, W - m, m], [W - m, m, W - m, D - m], [W - m, D - m, m, D - m], [m, D - m, m, m]]) {
      const L = Math.hypot(ub - ua, vb - va);
      for (let d = 0; d < L; d += 0.01) { const t = d / L, w = 0.03 * Math.sin(d / 0.14 * TAU), nu = -(vb - va) / L, nv = (ub - ua) / L; loop.push([lerp(ua, ub, t) + nu * w, lerp(va, vb, t) + nv * w]); }
    }
    line3(loop.map(([u, v]) => at(u, v)), 0.009, C.rugRust);
    for (let i = 0; i < loop.length; i += 14) {
      const [u, v] = loop[i];
      for (let k = 0; k < 6; k++) { const aa = k / 6 * TAU; fillUV([[u, v], [u + 0.022 * Math.cos(aa - 0.3), v + 0.022 * Math.sin(aa - 0.3)], [u + 0.03 * Math.cos(aa), v + 0.03 * Math.sin(aa)], [u + 0.022 * Math.cos(aa + 0.3), v + 0.022 * Math.sin(aa + 0.3)]], i % 28 ? C.rugCream : C.rugTeal); }
      fillUV([[u - 0.008, v], [u, v - 0.008], [u + 0.008, v], [u, v + 0.008]], C.rugRust);
    }
    fillUV([[g + B, g + B], [W - g - B, g + B], [W - g - B, D - g - B], [g + B, D - g - B]], C.rugRust);
    const f0 = g + B + 0.022, fu = W - f0, fv = D - f0;
    fillUV([[f0, f0], [fu, f0], [fu, fv], [f0, fv]], C.rugField);
    // small flowers scattered over the field in a lattice
    for (let v = f0 + 0.06, j = 0; v < fv - 0.04; v += 0.1, j++) for (let u = f0 + 0.05 + (j % 2) * 0.06; u < fu - 0.04; u += 0.12) {
      const c = rng() < 0.7 ? tone(C.rugField, 0.8) : tone(C.rugCream, 0.8, 0.8), r = 0.016;
      fillUV([[u - r, v], [u, v - r], [u + r, v], [u, v + r]], c);
    }
    // corner spandrels and the medallion, stepped the way knotted patterns are
    const cu = W / 2, cv = D / 2;
    const lozenge = (hu, hv, col, step = 0.03) => {
      const pts = [];
      for (let k = 0; k < 4; k++) {
        const [su, sv] = [[1, 1], [-1, 1], [-1, -1], [1, -1]][k];

/* Soft things are painted as meshes: a surface f(u, v) cut into small quads, each shaded by how it faces the

const LD = norm([-0.55, 0.75, -0.35]);
const form = (n, k = 0.42) => 1 - k + k * clamp(0.3 + 0.7 * dot(n, LD), 0, 1);
function mesh(f, nu, nv, col, pid) {
  const P = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) P.push(f(i / nu, j / nv));
  const quads = [];
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const k = j * (nu + 1) + i, a = P[k], b = P[k + 1], c = P[k + nu + 2], d = P[k + nu + 1];
    const n = norm(cross(sub(add(d, c), add(a, b)), sub(add(b, c), add(a, d))));
    const m = scl(add(add(a, b), add(c, d)), 0.25);
    quads.push({ q: [a, b, c, d], n, m, u: (i + 0.5) / nu, v: (j + 0.5) / nv, z: depthOf(m), back: dot(n, sub(cam.pos, m)) < 0 });
  }
  quads.sort((p, q) => q.z - p.z);

  for (const Q of quads) {
    const pts = projPoly(Q.q); if (pts.length < 3) continue;
    const fs = MODE === 'id' ? idCol(pid(Q)) : MODE === 'ao' ? '#fff' : rgba(col(Q));
    pathOf(pts); G.fillStyle = G.strokeStyle = fs; G.fill(); G.stroke();

const cloth = (base, Q, k = 0.42) => hex(base).map(v => v * (Q.back ? 0.55 : form(Q.n, k)));

function paintBed() {

  // the frame's legs and rail show below the covers
  for (const [lx, lz] of [[x0 + 0.03, z0 + 0.03], [x1 - 0.08, z0 + 0.03]]) box([lx, 0, lz], [lx + 0.05, 0.16, lz + 0.05], { def: C.walnut, t: C.walnutLight });
  box([x0 + 0.03, 0.12, z0 + 0.03], [x1 - 0.03, 0.26, BED.z1], { def: tone(C.walnut, 0.95), t: C.walnutLight });
  // the sheet between the turned-down cover and the pillows
  box([x0 + 0.02, top - 0.06, turn - 0.02], [x1 - 0.02, top - 0.035, BED.z1], { def: tone(C.linen, 0.96) });
  paintPillows();

  // The duvet, draped over the mattress: flat on top, rounded over the edges, hanging in folds at the side and foot.
  // a runs across the bed and b along it, both unrolled over the edge, so negative values are hanging down.
  const edge = q => q <= ARC ? [R * Math.sin(q / R), -R * (1 - Math.cos(q / R)), Math.min(q / R, Math.PI / 2)] : [R, -R - (q - ARC), Math.PI / 2];

    const qa = Math.max(0, -a) * (a < -ARC ? lerp(1, hemA, (-a - ARC) / HANG) : 1), qb = Math.max(0, -b) * (b < -ARC ? lerp(1, hemB, (-b - ARC) / HANG) : 1);
    const [ha, da, ta] = edge(qa), [hb, db, tb] = edge(qb);

/* ---------- the window mask ----------
   What the moon sees of the room through the window, laid flat in the plane of the glass: clear panes, the
   bars between them, and the plant on the sill. The shader blurs it more the farther the light travels. */
const MASK = { z0: WIN.z0 - 0.2, z1: WIN.z1 + 0.2, y0: WIN.y0 - 0.2, y1: WIN.y1 + 0.2, tpm: 600 };
function paintMask() {
  const w = Math.round((MASK.z1 - MASK.z0) * MASK.tpm), h = Math.round((MASK.y1 - MASK.y0) * MASK.tpm);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.setTransform(MASK.tpm, 0, 0, -MASK.tpm, -MASK.z0 * MASK.tpm, MASK.y1 * MASK.tpm);   // metres, y up
  // old glass: not quite even
  for (const [z, y, pw, ph] of PANES) {
    const gr = g.createLinearGradient(z, y, z + pw, y + ph);
    gr.addColorStop(0, '#f4f4f4'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, '#ececec');
    g.fillStyle = gr; g.fillRect(z, y, pw, ph);
  }
  g.fillStyle = '#000';
  g.fillRect((SASH.z0 + SASH.z1) / 2 - 0.035, SASH.ym - 0.004, 0.07, 0.016);
  for (const L of LEAVES) { g.save(); g.translate(L.z, L.y); g.rotate(L.rot); leafPath(g, L.s); g.fill(); g.restore(); }
  g.fillRect(PLANT.z - PLANT.r, PLANT.y, PLANT.r * 2, PLANT.h);
  return c;
}

uniform vec3 uC, uR, uU, uF;     // camera position and axes
uniform vec3 uL;                 // the way the moonlight travels
uniform vec3 uMoon;              // its colour and strength
uniform vec4 uMR;                // mask: z0, y1, texels per metre, softness
uniform vec4 uOp;                // window opening: z0, z1, y0, y1

    float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
    vec3 r = uRamp[0].rgb;
    for (int k = 1; k < 8; k++) r = mix(r, uRamp[k].rgb, smoothstep(uRamp[k - 1].w, uRamp[k].w, l));
    col = r + (col - l) * mix(0.4, uGrade.y, smoothstep(0.15, 0.6, l));
  }
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog = null;
const U = {}, tex = {};
function initGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(prog, i); U[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(prog, info.name); }
  gl.bindVertexArray(gl.createVertexArray());
  ['uAlb', 'uId', 'uAo', 'uWin', 'uPl'].forEach((k, i) => { tex[k] = { unit: i, t: gl.createTexture() }; gl.uniform1i(U[k], i); });
  gl.uniform3fv(U.uOA, OCCLUDERS.flatMap(b => b[0])); gl.uniform3fv(U.uOB, OCCLUDERS.flatMap(b => b[1]));
}
function upload(k, src, { nearest = false, mips = false, fmt } = {}) {
  const T = tex[k];
  gl.activeTexture(gl.TEXTURE0 + T.unit); gl.bindTexture(gl.TEXTURE_2D, T.t);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  if (fmt) gl.texImage2D(gl.TEXTURE_2D, 0, fmt.internal, fmt.w, fmt.h, 0, fmt.format, fmt.type, src);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  const f = nearest ? gl.NEAREST : gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

}

// Repairs anti-aliased edges in the plane buffer. A pixel is trusted when its check code is right (give or take the
// rounding of edges drawn over the same colour); the rest, where two planes blend, take a trusted neighbour's id.
function planeIds(c) {
  const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  const ids = new Uint8Array(w * h), ok = new Uint8Array(w * h);
  const near = (a, b) => { const e = Math.abs(a - b); return e <= 3 || e >= 253; };
  for (let i = 0, p = 0; i < w * h; i++, p += 4) {
    for (const r of [d[p], d[p] - 1, d[p] + 1]) if (r >= 0 && r < 256 && near(d[p + 1], codeG(r)) && near(d[p + 2], codeB(r))) { ids[i] = r; ok[i] = 1; break; }
  }
  // Edges between the room and the view outside go to the room: the view is shown as painted, unlit, and a
  // half-and-half pixel of white window frame would shine.
  for (let pass = 0, left = 1; left && pass < 40; pass++) {
    left = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (ok[i]) continue;
      let pick = -1;
      for (const j of [x > 0 ? i - 1 : -1, y > 0 ? i - w : -1, x < w - 1 ? i + 1 : -1, y < h - 1 ? i + w : -1]) {
        if (j < 0 || ok[j] !== 1) continue;
        if (ids[j] > SILHOUETTE) { pick = j; break; }
        if (pick < 0) pick = j;
      }
      if (pick < 0) { left++; continue; }
      ids[i] = ids[pick]; ok[i] = 2;
    }
    for (let i = 0; i < w * h; i++) if (ok[i] === 2) ok[i] = 1;
  }
  return ids;
}

/* ---------- layout ---------- */
let ready = false, maskDone = false;
function layout() {
  if (!innerWidth || !innerHeight) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  // Paint at the screen's resolution, but no more than about four million pixels.
  const ps = Math.min(1, Math.sqrt(4.2e6 / (cv.width * cv.height)));
  const W = Math.round(cv.width * ps), H = Math.round(cv.height * ps);
  cam = makeCam(W, H);
  resetPlanes();
  if (!gl) {
    // No WebGL: the room by night, still, without the moving light.
    G = cv.getContext('2d'); MODE = 'alb'; G.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); paintScene();
    G.setTransform(1, 0, 0, 1, 0, 0); G.globalCompositeOperation = 'multiply'; G.fillStyle = '#262c4c'; G.fillRect(0, 0, cv.width, cv.height);
    G.globalCompositeOperation = 'source-over';
    return;
  }
  const layers = {};
  for (const mode of ['alb', 'id', 'ao']) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    G = c.getContext('2d', { willReadFrequently: mode === 'id' }); MODE = mode;
    G.fillStyle = mode === 'id' ? idCol(SKY) : mode === 'ao' ? '#fff' : '#000'; G.fillRect(0, 0, W, H);
    paintScene();
    layers[mode] = c;
  }
  upload('uAlb', layers.alb, { mips: true });
  upload('uAo', layers.ao, { fmt: { internal: gl.R8, format: gl.RED, type: gl.UNSIGNED_BYTE, w: W, h: H } });
  upload('uId', planeIds(layers.id), { nearest: true, fmt: { internal: gl.R8, format: gl.RED, type: gl.UNSIGNED_BYTE, w: W, h: H } });
  const rows = new Float32Array(256 * 2 * 4);
  planes.forEach((r, i) => { rows.set(r.slice(0, 4), i * 4); rows.set(r.slice(4, 8), (256 + i) * 4); });
  upload('uPl', rows, { nearest: true, fmt: { internal: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT, w: 256, h: 2 } });
  if (!maskDone) { upload('uWin', paintMask(), { mips: true }); maskDone = true; }
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform4f(U.uK, cam.cx / W, cam.cy / H, cam.F / W, cam.F / H);
  gl.uniform3fv(U.uC, cam.pos); gl.uniform3fv(U.uR, cam.r); gl.uniform3fv(U.uU, cam.u); gl.uniform3fv(U.uF, cam.f);
  gl.uniform4f(U.uMR, MASK.z0, MASK.y1, MASK.tpm, Math.tan(0.27 * DEG) * 1.3);
  gl.uniform4f(U.uOp, WIN.z0, WIN.z1, WIN.y0, WIN.y1);
  gl.uniform2f(U.uX, XG, XL);
  gl.uniformMatrix3fv(U.uEnu, false, [...RX, 0, 0, 1, ...RZ]);
  gl.uniform1f(U.uPix, 1 / (cam.F / H * cv.height));
  mc.width = Math.round(innerWidth * Math.min(dpr, 1.5)); mc.height = Math.round(innerHeight * Math.min(dpr, 1.5));
  ready = true;
}

/* ---------- each frame ---------- */
// The night palette, from darkest to brightest: [colour, brightness it stands for].
const RAMP = new Float32Array([['#07080f', 0], ['#0f1224', 0.06], ['#1a1f3b', 0.14], ['#2a3152', 0.24], ['#474d6f', 0.36], ['#767a98', 0.5], ['#b3b6ca', 0.68], ['#edeef4', 0.92]]
  .flatMap(([c, p]) => [...hex(c).map(v => v / 255), p]));
const land = (o, L) => {                       // where a ray of moonlight from o first meets the floor or a wall
  let best = null;
  for (const [n, d] of [[[0, 1, 0], 0], [[0, 0, -1], ZB], [[-1, 0, 0], XR], [[0, 0, 1], -ZF]]) {
    const den = dot(n, L); if (den >= -1e-6) continue;
    const s = -(dot(n, o) + d) / den; if (s > 0 && (!best || s < best.s)) best = { s, n, p: add(o, scl(L, s)) };
  }
  return best;
};
// One night at the window lasts about half an hour: the light crosses the room, the moon sets, the room stays dark
// a while, then the moonlight comes gently back and it all begins again.
const CYCLE = 1740, RETURN = 60;
// Now and then a thin cloud goes over the moon and the light dims a little.
const cloud = t => 1 - 0.2 * smoothstep(0.3, 0.8, Math.sin(t / 97 + 2.2) * 0.5 + noise1(t / 41) * 0.5) * smoothstep(90, 150, t);
function moonAt(t) {
  const n = Math.floor(t / CYCLE), tc = t - n * CYCLE;
  const m = moonDir(tc), alt = Math.asin(clamp(m[1], -1, 1));
  const up = smoothstep(0, 6 * DEG, alt) * smoothstep(0, 0.05, -m[0]) * (n > 0 ? smoothstep(0, RETURN, tc) : 1) * cloud(t);
  return { m, alt, up, tc };
}
function draw(t, gpu = true) {
  if (!ready) return;
  const { m, alt, up, tc } = moonAt(t), L = scl(m, -1);
  drawMotes(t, L, up);
  if (!gpu) return;
  // Low down, the moon's light thins and warms.
  const warm = 1 - smoothstep(4 * DEG, 20 * DEG, alt), k = 1.5 * up;
  gl.uniform3fv(U.uL, L);
  gl.uniform3f(U.uMoon, k * lerp(0.74, 1.0, warm), k * lerp(0.84, 0.78, warm), k * lerp(1.0, 0.55, warm));
  gl.uniform3f(U.uSkyL, 0.16, 0.22, 0.42);
  gl.uniform3f(U.uAmb, 0.004, 0.005, 0.011);
  gl.uniform4f(U.uGrade, 1.25, 0.5, 0.0, 0.013);
  gl.uniform4fv(U.uRamp, RAMP);
  // The light lands on the floor and walls and lights the room a little: four points where it falls.
  const bp = new Float32Array(16), bn = new Float32Array(16), bc = new Float32Array(12), glow = new Float32Array(20);
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  const grow = p => { for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], p[i]); hi[i] = Math.max(hi[i], p[i]); } };
  [[WIN.y0, WIN.z0], [WIN.y0, WIN.z1], [WIN.y1, WIN.z1], [WIN.y1, WIN.z0]].forEach(([y, z]) => { grow([XG, y, z]); const h = land([XL, y, z], L); if (h) grow(h.p); });
  gl.uniform3f(U.uBA, lo[0], Math.max(0, lo[1]), lo[2]); gl.uniform3f(U.uBB, hi[0], Math.min(HC, hi[1]), hi[2]);
  [[0.3, 0.3], [0.7, 0.3], [0.3, 0.7], [0.7, 0.7]].forEach(([fy, fz], i) => {
    const h = land([XL, lerp(WIN.y0, WIN.y1, fy), lerp(WIN.z0, WIN.z1, fz)], L); if (!h) return;
    const onRug = h.n[1] > 0.5 && h.p[0] > RUG.x0 && h.p[0] < RUG.x1 && h.p[2] > RUG.z0 && h.p[2] < RUG.z1;
    bc.set((h.n[1] > 0.5 ? (onRug ? [1.25, 0.72, 0.68] : [1.25, 0.95, 0.72]) : [0.95, 1.0, 1.05]), i * 3);
    bp.set([...add(h.p, scl(h.n, 0.02)), 0.022 * Math.max(0, -dot(h.n, L))], i * 4); bn.set([...h.n, 0], i * 4);
    const s = sp(h.p); if (s) glow.set([s[0] / cam.W, s[1] / cam.H, 0.13, 0.006], i * 4);
  });
  gl.uniform4fv(U.uBP, bp); gl.uniform4fv(U.uBN, bn); gl.uniform3fv(U.uBC, bc);
  const wc = sp([XG, (WIN.y0 + WIN.y1) / 2, (WIN.z0 + WIN.z1) / 2]); if (wc) glow.set([wc[0] / cam.W, wc[1] / cam.H, 0.2, 0.02], 16);
  gl.uniform4fv(U.uGlow, glow);
  gl.uniform1f(U.uT, t);
  gl.uniform3f(U.uSky3, Math.sin(LAT), Math.cos(LAT), tc * LAPSE * 15 * DEG / 3600);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- dust in the moonbeam ----------
   A few specks drifting in the air, seen only while they're inside the light. */
const mc = document.getElementById('motes'), mg = mc.getContext('2d');
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTES = Array.from({ length: 150 }, (_, i) => { const r = mulberry32(900 + i); return { p: [lerp(XL + 0.05, 1.3, r()), lerp(0.1, 2.2, r()), lerp(1.9, ZB - 0.05, r())], ph: r() * TAU, f: 0.3 + r() * 0.9, s: 0.5 + r(), k: r() * 100 }; });
function lightAt(p, toMoon) {                 // does the moon see p through a pane? (0..1, soft at the edges)
  const s = (XG - p[0]) / toMoon[0]; if (s <= 0) return 0;
  const z = p[2] + toMoon[2] * s, y = p[1] + toMoon[1] * s, e = 0.004 + s * 0.005;
  let best = 0;
  for (const [pz, py, pw, ph] of PANES) best = Math.max(best, smoothstep(-e, e, Math.min(z - pz, pz + pw - z, y - py, py + ph - y)));
  return best;
}
function drawMotes(t, L, up) {
  mg.clearRect(0, 0, mc.width, mc.height);
  if (STILL || up < 0.02) return;
  const toMoon = scl(L, -1), ks = mc.width / cam.W;
  for (const d of MOTES) {
    // slow wandering on the room's faint air currents, wrapped into the box around the beam
    const q = d.p, w = t * 0.02 + d.k;
    const x = XL + 0.05 + ((q[0] + 0.05 * Math.sin(w * 1.3) + t * 0.003 - XL - 0.05) % 3.25 + 3.25) % 3.25;
    const y = 0.1 + ((q[1] + 0.06 * Math.sin(w * 0.9 + 1) + t * 0.004 - 0.1) % 2.1 + 2.1) % 2.1;
    const z = 1.9 + ((q[2] + 0.05 * Math.cos(w * 1.1) - 1.9) % 1.95 + 1.95) % 1.95;
    const lit = lightAt([x, y, z], toMoon); if (lit <= 0.01) continue;
    const s = sp([x, y, z]); if (!s) continue;
    const a = lit * up * (0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * d.f + d.ph), 3)) * 0.55;
    const r = Math.max(0.7, 0.0035 * cam.F / depthOf([x, y, z])) * d.s * ks;
    const g = mg.createRadialGradient(s[0] * ks, s[1] * ks, 0, s[0] * ks, s[1] * ks, r * 2);
    g.addColorStop(0, `rgba(230,236,255,${a.toFixed(3)})`); g.addColorStop(1, 'rgba(230,236,255,0)');
    mg.fillStyle = g; mg.fillRect(s[0] * ks - r * 2, s[1] * ks - r * 2, r * 4, r * 4);
  }
}

// Oil-on-canvas grain, laid over everything by CSS.
(() => {
  const n = 160, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), img = g.createImageData(n, n), r = mulberry32(3);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = (y * n + x) * 4, v = 128 + (r() - 0.5) * 56 + Math.sin(x * 1.9) * Math.sin(y * 1.9) * 14;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // and under it, faint marks of a brush, going every which way
  const m = 300, b = document.createElement('canvas'); b.width = b.height = m;
  const h = b.getContext('2d'), br = mulberry32(4);
  h.fillStyle = '#808080'; h.fillRect(0, 0, m, m); h.lineCap = 'round';
  for (let i = 0; i < 700; i++) {
    const x = br() * m, y = br() * m, a = br() * Math.PI, l = 8 + br() * 26, v = br() < 0.5 ? 110 : 146;
    h.strokeStyle = `rgba(${v},${v},${v},${(0.15 + br() * 0.25).toFixed(2)})`; h.lineWidth = 1.5 + br() * 3;
    for (const [ox, oy] of [[0, 0], [-m, 0], [0, -m], [-m, -m]]) {
      h.beginPath(); h.moveTo(x + ox, y + oy); h.quadraticCurveTo(x + ox + Math.cos(a) * l * 0.5 + (br() - 0.5) * 4, y + oy + Math.sin(a) * l * 0.5, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); h.stroke();
    }
  }
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()}), url(${b.toDataURL()})`;
})();

if (gl) initGL();
const T0 = performance.now(), clock = () => START + (performance.now() - T0) / 1000 * RATE;
let last = -1e9, lastGpu = -1e9, resizeTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 33) return;
  last = now;
  // The dust drifts at 30 frames a second; the light moves so slowly that ten repaints a second are plenty.
  const gpu = now - lastGpu > 95; if (gpu) lastGpu = now;
  draw(clock(), gpu);
}
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout(); draw(clock()); }, 150); });
layout(); draw(clock());
if (gl) requestAnimationFrame(frame);
window.toyboxReady?.();
})();
</script>
</body>
