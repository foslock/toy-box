<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

    text-shadow: 0 1px 16px rgba(4, 6, 20, .5); }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A dark bedroom at night, painted. Moonlight falls through a window of small panes in a pale square of light, across the floor in the evening and high on the back wall toward dawn, and dust drifts in the beam. A small alarm clock on the nightstand shows the time in red."></canvas>
<canvas id="motes" aria-hidden="true"></canvas>
<canvas id="clock" aria-hidden="true"></canvas>
<div class="grain" id="grain"></div>
<div class="vignette"></div>
<p class="name">Small Hours</p>
<script>
(() => {
'use strict';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- the room ----------
   Metres. x runs to the right, y up, z away from the viewer, who stands in the doorway.
   The window is in the left wall; the moon is outside it, high and out of sight. */
const XL = -1.9, XR = 2.05, ZF = -0.8, ZB = 3.9, HC = 2.6;
const WIN = { z0: 2.05, z1: 3.2, y0: 0.8, y1: 2.16 };   // the opening, at the room face of the wall
const XG = XL - 0.13;                                     // the glass sits this far back in the wall
const EYE = [0.2, 1.52, -0.6];

const SASH = (() => {

// Furniture, shared by the painting and the shadows it throws.
const BED = { x0: 0.5, x1: 2.03, z0: 1.8, z1: 3.84, top: 0.59, turn: 3.18 };

const CLOCK = { x0: 0.12, x1: 0.28, z0: 3.47, z1: 3.54, h: 0.075 };   // a small alarm clock at the front of the nightstand

  [[STAND.x0, 0.08, STAND.z0], [STAND.x1, STAND.h, STAND.z1]],
  [[LAMP.x - 0.07, STAND.h, LAMP.z - 0.07], [LAMP.x + 0.07, LAMP.y1, LAMP.z + 0.07]],
  [[LAMP.x - 0.15, LAMP.y1, LAMP.z - 0.15], [LAMP.x + 0.15, LAMP.y2, LAMP.z + 0.15]],
  [[0.13, STAND.h, 3.58], [0.31, STAND.h + 0.068, 3.82]],
  [[CLOCK.x0, STAND.h, CLOCK.z0], [CLOCK.x1, STAND.h + CLOCK.h, CLOCK.z1]],
  [[CHAIR.x - 0.22, CHAIR.seat - 0.03, CHAIR.z0], [CHAIR.x + 0.22, CHAIR.seat, CHAIR.z1]],
  ...[-1, 1].flatMap(s => [[[CHAIR.x + s * 0.191 - 0.017, 0, CHAIR.z1 - 0.034], [CHAIR.x + s * 0.191 + 0.017, CHAIR.back, CHAIR.z1]],
    [[CHAIR.x + s * 0.191 - 0.017, 0, CHAIR.z0], [CHAIR.x + s * 0.191 + 0.017, CHAIR.seat, CHAIR.z0 + 0.034]]]),
  ...CHAIR_RUNGS.map(y => [[CHAIR.x - 0.2, y - 0.022, CHAIR.z1 - 0.026], [CHAIR.x + 0.2, y + 0.022, CHAIR.z1 - 0.01]]),
  [[CHAIR.x - 0.24, 0.47, CHAIR.z1 - 0.08], [CHAIR.x + 0.05, 0.9, CHAIR.z1 - 0.02]],
  [[BED.x0, 0.12, BED.z0], [BED.x1, BED.top, BED.z1]],
  [[PILLOWS[0][0], BED.top - 0.03, 3.36], [PILLOWS[1][1], BED.top + 0.15, 3.82]],
  [[HEAD.x0, 0, HEAD.z0], [HEAD.x1, HEAD.h, ZB]],
  // each slipper as two small blocks along its length, kept inside it and below its top
  ...SLIPPERS.flatMap(([x, z, a]) => [0.3, 0.7].map(t => {
    const cx = x + 0.27 * t * Math.sin(a * DEG), cz = z - 0.27 * t * Math.cos(a * DEG);
    return [[cx - 0.034, 0, cz - 0.034], [cx + 0.034, 0.03, cz + 0.034]];
  })),
  [[XL + 0.03, 0.12, WIN.z0 + 0.1], [XL + 0.13, 0.66, WIN.z1 - 0.1]],   // the radiator
];

/* ---------- the moon ----------
   A real arc across a southern sky (latitude, declination, hour angle), slowed so that one night's arc fills the
   twelve hours from six in the evening to six in the morning. The room keeps the visitor's own time, but it's
   always night there: their clock is read as evening or the small hours (twenty to three in the afternoon is
   twenty to three in the morning here), so the light lies across the rug after dark and climbs the back wall
   toward dawn. */
const Q = new URLSearchParams(location.search);
const AT = /^(\d{1,2}):(\d{2})$/.exec(Q.get('at') || '');   // ?at=23:40 sets the clock, for checking
const RATE = clamp(Number(Q.get('rate')) || 1, 0.1, 3600);   // ?rate=600 runs it faster
const LAT = -35 * DEG, DECL = -8 * DEG;
const WIN_FACES = 305 * DEG;                                // compass bearing the window looks out on
const H0 = 40 * DEG, SPAN = 48 * DEG, NIGHT = 12 * 3600;   // hour angle at six in the evening; how far it turns by six in the morning
const N_OUT = [Math.sin(WIN_FACES), Math.cos(WIN_FACES), 0];

function moonDir(H) {                                       // unit vector toward the moon at hour angle H, room axes
  const cd = Math.cos(DECL), sd = Math.sin(DECL), cp = Math.cos(LAT), sp = Math.sin(LAT);
  const enu = [-cd * Math.sin(H), sd * cp - cd * Math.cos(H) * sp, sd * sp + cd * Math.cos(H) * cp];
  return [dot(enu, RX), enu[2], dot(enu, RZ)];

/* ---------- camera ---------- */
let cam = null;
const NEAR = 0.04;
function makeCam(W, H) {

  // shifted down instead of the view being tipped. It aims for a 64° wide view, but never more than 74° tall
  // (phones) or less than 44° (wide screens, so the head of the window and the first light on the floor both fit),
  // and the narrower the view, the more it turns toward the light.
  const half = deg => Math.tan(deg * DEG / 2);

const SKY = 0, SILHOUETTE = 1;                  // ids for the view through the glass

// A plane facing the viewer across the floor, for round things.
const facing = p => { const d = sub(cam.pos, p); d[1] = 0; return norm(d); };

/* ---------- painting ----------

// Fill whatever path build() makes: its colour by day, its plane id, or white in the occlusion pass.
// detail() paints on top, clipped to it.
function shape(build, id, style, detail) {

const surf = (pts3, id, style, detail) => shape(() => poly3(pts3), id, style, detail);
const ALB = () => MODE === 'alb';
// A soft, blurred fill (shadowBlur works everywhere canvas filters don't).
function softFill(build, color, blurPx) {

// Occlusion pass only: soft darkness over a patch of floor or wall.

function grad3(a, b, stops) {

// A stroke through 3D points; width in metres, measured at the first point.
function line3(pts3, wM, style, cap = 'round') {

  G.strokeStyle = style; G.lineWidth = Math.max(0.5, pxAt(wM, pts3[0])); G.lineCap = G.lineJoin = cap;

// Draws fn() in the flat metric frame of a plane at p (axes U, V): small marks come out in perspective.
function onPlane(p, U, V, fn) {

// Soft round dab of colour at a 3D point, radius in metres.

function box(a, b, mats, attrs = {}, details = {}, oneId = null) {

    ['r', [1, 0, 0], [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]]],
    ['b', [0, -1, 0], [[x0, y0, z0], [x0, y0, z1], [x1, y0, z1], [x1, y0, z0]]],
    ['t', [0, 1, 0], [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]],
    ['f', [0, 0, -1], [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]]],
    ['k', [0, 0, 1], [[x0, y0, z1], [x0, y1, z1], [x1, y1, z1], [x1, y0, z1]]],
  ];

    if (dot(n, sub(cam.pos, pts[0])) <= 1e-6) continue;
    const m = mats[key] ?? mats.def;
    surf(pts, oneId ?? plane(n, pts[0], attrs[key] || attrs.def || {}), typeof m === 'function' ? () => m(pts) : m, details[key] && (() => details[key](pts)));

// A vertical cylinder or cone frustum: fills its outline (the hull of its two rims).

  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (hi.length >= 2 && cr(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }

function cyl(x, z, y0, y1, r0, r1, id, style, detail) {

/* ---------- colours by day ----------
   The shader lights these with moonlight, sky and bounce, then grades everything toward night. */
const C = {
  wall: '#d3c9b6', wallStripe: '#cfc4b0', sprig: '#b3ab98',
  ceiling: '#dddbd4', trim: '#e6e3da',
  floor: '#b88c5f', seam: '#3b2a1c', grain: '#8a6440',
  walnut: '#5e3f2b', walnutLight: '#7d573c', oak: '#a37b52', oakLight: '#bf966a',
  linen: '#ebe8e0', linenShade: '#cfccc4', turn: '#b9c3cf',
  throwKnit: '#c2a87a', pillow2: '#8f9f94',
  rugField: '#9b574d', rugBorder: '#3d4865', rugCream: '#d4c6a6', rugRust: '#ad7349', rugTeal: '#6f8a86',
  lampBase: '#9fb4aa', shade: '#b4935a',
  knit: '#a9776a',
  curtain: '#d6cebd',
  dresser: '#6d5040',
  leaf: '#4f6f45', pot: '#a8623f',
};

/* ---------- the night outside ----------
   Painted as seen (the shader doesn't light it, but adds the stars): sky and thin cloud, far hills, rooftops with a
   lit window or two, and the dark gardens below. */
function paintOutside() {
  const glass = [[XG, WIN.y0, WIN.z0], [XG, WIN.y1, WIN.z0], [XG, WIN.y1, WIN.z1], [XG, WIN.y0, WIN.z1]];
  const gp = projPoly(glass);
  if (!pathOf(gp)) return;
  if (MODE === 'ao') { G.fillStyle = '#fff'; G.fill(); return; }
  G.fillStyle = MODE === 'id' ? idCol(SKY) : '#1d2c52'; G.fill();
  G.save(); pathOf(gp); G.clip();
  const th0 = Math.atan2(WIN.z0 - EYE[2], XG - EYE[0]) + 0.35, th1 = Math.atan2(WIN.z1 - EYE[2], XG - EYE[0]) - 0.35;
  const dir = (th, el) => [Math.cos(th) * Math.cos(el), Math.sin(el), Math.sin(th) * Math.cos(el)];
  const thMid = (th0 + th1) / 2;
  const rng = mulberry32(91);
  // Skyline from azimuth/elevation samples, filled down to well below the window.
  const skyline = (elFn, id, col, n = 90) => {
    G.beginPath();
    for (let i = 0; i <= n; i++) { const th = lerp(th0, th1, i / n), p = spDir(dir(th, elFn(th, i / n))); if (p) i ? G.lineTo(p[0], p[1]) : G.moveTo(p[0], p[1]); }
    const b1 = spDir(dir(th1, -40 * DEG)), b0 = spDir(dir(th0, -40 * DEG));
    if (b1) G.lineTo(b1[0], b1[1]); if (b0) G.lineTo(b0[0], b0[1]);
    G.closePath(); G.fillStyle = MODE === 'id' ? idCol(id) : col; G.fill();
  };
  if (ALB()) {
    const h = spDir(dir(thMid, 0)), z = spDir(dir(thMid, 14 * DEG));
    const gr = G.createLinearGradient(z[0], z[1], h[0], h[1]);
    gr.addColorStop(0, '#15244a'); gr.addColorStop(0.55, '#2a3f6c'); gr.addColorStop(0.88, '#4b5d88'); gr.addColorStop(1, '#6a6d8e');
    G.fillStyle = gr; G.fillRect(0, 0, G.canvas.width, G.canvas.height);
    // soft bands of cloud, lit from above
    for (let i = 0; i < 7; i++) {
      const el = lerp(3, 12, rng()) * DEG, th = lerp(th0, th1, rng()), a = spDir(dir(th, el)), b = spDir(dir(th - 0.25, el + 0.4 * DEG));
      if (!a || !b) continue;
      G.save(); G.globalAlpha = 0.18 + rng() * 0.18; G.strokeStyle = '#7d8db4'; G.lineCap = 'round'; G.lineWidth = pxAt(0.02, [XG, 1.5, 2.6]) * (0.4 + rng());
      G.filter = 'blur(2px)'; G.beginPath(); G.moveTo(a[0], a[1]); G.lineTo(b[0], b[1]); G.stroke(); G.restore();
    }
  }
  // far hills, then the town's roofs and trees, then the dark garden below
  skyline(th => (0.6 + 1.1 * (0.5 + 0.5 * fbm2(th * 9, 3.1))) * DEG, SILHOUETTE, '#1d2548');
  skyline((th, f) => {
    const roof = Math.max(0, 1 - Math.abs(f - 0.3) / 0.12) * 2.2 + Math.max(0, 1 - Math.abs(f - 0.72) / 0.09) * 1.6;
    return (-0.8 + 1.4 * (0.5 + 0.5 * fbm2(th * 30, 7.7)) + roof) * DEG;
  }, SILHOUETTE, '#11162e');
  if (ALB()) for (const [f, el] of [[0.45, -1.4], [0.47, -1.3], [0.56, -0.9]]) {
    const p = spDir(dir(lerp(th0, th1, f), el * DEG)); if (!p) continue;
    const r = Math.max(1, cam.F * 0.0011);   // a far window, still lit
    const g = G.createRadialGradient(p[0], p[1], 0, p[0], p[1], r * 5);
    g.addColorStop(0, 'rgba(255,205,130,1)'); g.addColorStop(0.2, 'rgba(255,180,100,0.45)'); g.addColorStop(1, 'rgba(255,160,80,0)');
    G.fillStyle = g; G.fillRect(p[0] - r * 5, p[1] - r * 5, r * 10, r * 10);
  }
  // a tree across the way, dark against the sky: its trunk and a few limbs, then the leaves
  const tree = mulberry32(17), tc = MODE === 'id' ? idCol(SILHOUETTE) : '#0a0e22';
  const at = (f, el) => spDir(dir(lerp(th0, th1, f), el * DEG));
  G.strokeStyle = tc; G.lineCap = 'round';
  const TF = 0.585;                                                  // where it stands across the view
  for (const [pts, w] of [[[[0.005, -3], [0, 1.5], [-0.007, 4.2]], 0.004], [[[0, 1.5], [0.013, 3.6], [0.025, 5.5]], 0.0022], [[[-0.004, 3.2], [-0.017, 5.4], [-0.025, 6.6]], 0.002]]) {
    const q = pts.map(([f, el]) => at(TF + f, el)); if (q.some(v => !v)) continue;
    G.lineWidth = Math.max(1, cam.F * w); G.beginPath(); q.forEach((v, i) => i ? G.lineTo(v[0], v[1]) : G.moveTo(v[0], v[1])); G.stroke();
  }
  // the crown: a few rounded masses of foliage, each a cloud of small leafy dabs, lacy where the sky gets in
  for (const [lf, le, rf, re] of [[0, 5, 0.028, 2.1], [0.02, 3.3, 0.02, 1.4], [-0.021, 3.9, 0.019, 1.5], [0.006, 6.9, 0.021, 1.4], [0.029, 6, 0.017, 1.3]]) {
    for (let i = 0; i < 110; i++) {
      const a = tree() * TAU, rr = Math.pow(tree(), 0.6);
      const f = TF + lf + Math.cos(a) * rr * rf, el = le + Math.sin(a) * rr * re;
      if (rr > 0.55 && fbm2(f * 150, el * 1.5, 2) < -0.05) continue;
      const p = at(f, el), q = at(f, el + 0.1 + tree() * 0.22);
      if (!p || !q) continue;
      const rp = Math.hypot(q[0] - p[0], q[1] - p[1]);
      G.fillStyle = tc; G.beginPath(); G.arc(p[0], p[1], rp, 0, TAU); G.fill();
      // leaves at the edge toward the moon catch a little of its light
      if (ALB() && rr > 0.75 && Math.sin(a) > 0 && Math.cos(a) < 0.3) { G.fillStyle = 'rgba(64,78,118,0.45)'; G.beginPath(); G.arc(p[0] - rp * 0.3, p[1] - rp * 0.3, rp * 0.6, 0, TAU); G.fill(); }
    }
  }
  skyline(th => (-3.5 + 5 * Math.max(0, fbm2(th * 14, 1.3) + 0.2)) * DEG, SILHOUETTE, '#090c1e');
  if (ALB()) {
    // a faint sheen on the old glass
    const a = sp([XG, WIN.y1, WIN.z0]), b = sp([XG, WIN.y0, WIN.z1]);
    if (a && b) { const g = G.createLinearGradient(a[0], a[1], b[0], b[1]); g.addColorStop(0, 'rgba(200,215,255,0.07)'); g.addColorStop(0.45, 'rgba(200,215,255,0.015)'); g.addColorStop(0.55, 'rgba(200,215,255,0.04)'); g.addColorStop(1, 'rgba(200,215,255,0)'); G.fillStyle = g; G.fillRect(0, 0, G.canvas.width, G.canvas.height); }
  }
  G.restore();
}

/* ---------- walls, floor, window ---------- */
// Wallpaper: faint stripes and small sprigs, painted flat on the wall plane.
function paper(o, U, V, w, h, seed) {
  const rng = mulberry32(seed), at = (u, v) => add(o, add(scl(U, u), scl(V, v)));
  G.fillStyle = C.wallStripe;
  for (let u = 0.05; u < w; u += 0.16) poly3([at(u, 0), at(u + 0.05, 0), at(u + 0.05, h), at(u, h)]) && G.fill();
  for (let j = 0, v = 0.1; v < h; j++, v += 0.19) {
    for (let u = (j % 2) * 0.08 + 0.02; u < w; u += 0.16) {
      onPlane(at(u, v + (rng() - 0.5) * 0.01), U, V, () => {
        G.fillStyle = C.sprig; G.strokeStyle = C.sprig; G.lineWidth = 0.0035; G.lineCap = 'round';
        G.beginPath(); G.moveTo(0, -0.022); G.quadraticCurveTo(0.004, 0, -0.002, 0.024); G.stroke();
        for (const [x, y, a] of [[0.004, 0.006, -0.6], [-0.003, -0.004, 0.7], [0.002, 0.018, -0.3]]) {
          G.save(); G.translate(x, y); G.rotate(a); G.beginPath(); G.ellipse(0.007, 0, 0.008, 0.0035, 0, 0, TAU); G.fill(); G.restore();
        }
      });
    }
  }
  // the painter's hand: broad, faint variations
  for (let i = 0; i < w * h * 9; i++) dab(at(rng() * w, rng() * h), 0.12 + rng() * 0.3, rng() < 0.5 ? '#e2d9c8' : '#b8ad99', 0.08 + rng() * 0.08);
}
function paintShell() {
  // Ceiling, back wall, right wall, left wall (with the window cut out), floor.
  surf([[XL, HC, ZF], [XR, HC, ZF], [XR, HC, ZB], [XL, HC, ZB]], plane([0, -1, 0], [0, HC, 0]), C.ceiling, () => {
    const rng = mulberry32(5);
    for (let i = 0; i < 60; i++) dab([lerp(XL, XR, rng()), HC, lerp(ZF, ZB, rng())], 0.3 + rng() * 0.4, rng() < 0.5 ? '#e8e6df' : '#cfccc4', 0.1);
  });
  surf([[XL, 0, ZB], [XL, HC, ZB], [XR, HC, ZB], [XR, 0, ZB]], plane([0, 0, -1], [0, 0, ZB]), C.wall, () => paper([XL, 0, ZB - 0.001], [1, 0, 0], [0, 1, 0], XR - XL, HC, 11));
  surf([[XR, 0, ZF], [XR, 0, ZB], [XR, HC, ZB], [XR, HC, ZF]], plane([-1, 0, 0], [XR, 0, 0]), C.wall, () => paper([XR - 0.001, 0, ZF], [0, 0, 1], [0, 1, 0], ZB - ZF, HC, 12));
  const outer = [[XL, 0, ZF], [XL, HC, ZF], [XL, HC, ZB], [XL, 0, ZB]], hole = [[XL, WIN.y0, WIN.z0], [XL, WIN.y1, WIN.z0], [XL, WIN.y1, WIN.z1], [XL, WIN.y0, WIN.z1]];
  const wallL = () => {
    G.beginPath();
    for (const pts of [projPoly(outer), projPoly(hole)]) { pts.forEach(([x, y], i) => i ? G.lineTo(x, y) : G.moveTo(x, y)); G.closePath(); }
    return true;
  };
  const idL = plane([1, 0, 0], [XL, 0, 0]);
  if (MODE === 'alb') { wallL(); G.fillStyle = C.wall; G.fill('evenodd'); G.save(); G.clip('evenodd'); paper([XL + 0.001, 0, ZB], [0, 0, -1], [0, 1, 0], ZB - ZF, HC, 13); G.restore(); }
  else { wallL(); G.fillStyle = MODE === 'id' ? idCol(idL) : '#fff'; G.fill('evenodd'); }
  surf([[XL, 0, ZF], [XL, 0, ZB], [XR, 0, ZB], [XR, 0, ZF]], plane([0, 1, 0], [0, 0, 0], { gloss: 1 }), C.floor, paintBoards);
  // Darkness gathers in the corners.
  ao([[XL, 0, ZF], [XL, 0, ZB], [XL + 0.25, 0, ZB], [XL + 0.25, 0, ZF]], 0.5, 0.2);
  ao([[XL, 0, ZB - 0.25], [XR, 0, ZB - 0.25], [XR, 0, ZB], [XL, 0, ZB]], 0.5, 0.2);
  ao([[XR - 0.25, 0, ZF], [XR - 0.25, 0, ZB], [XR, 0, ZB], [XR, 0, ZF]], 0.5, 0.2);
  ao([[XL, HC - 0.3, ZB], [XR, HC - 0.3, ZB], [XR, HC, ZB], [XL, HC, ZB]], 0.45, 0.3);
  ao([[XL, 0, ZB], [XL, HC, ZB], [XL + 0.3, HC, ZB], [XL + 0.3, 0, ZB]], 0.4, 0.25);
  ao([[XR - 0.3, 0, ZB], [XR - 0.3, HC, ZB], [XR, HC, ZB], [XR, 0, ZB]], 0.4, 0.25);
  ao([[XL, HC - 0.3, ZF], [XL, HC - 0.3, ZB], [XL, HC, ZB], [XL, HC, ZF]], 0.45, 0.3);
  ao([[XL, HC, ZF], [XL + 0.4, HC, ZF], [XL + 0.4, HC, ZB], [XL, HC, ZB]], 0.4, 0.3);
  ao([[XL, HC, ZB - 0.4], [XR, HC, ZB - 0.4], [XR, HC, ZB], [XL, HC, ZB]], 0.4, 0.3);
  ao([[XL, 0, ZB], [XL, 0.3, ZB], [XR, 0.3, ZB], [XR, 0, ZB]], 0.4, 0.15);
  ao([[XL, 0, ZF], [XL, 0.3, ZF], [XL, 0.3, ZB], [XL, 0, ZB]], 0.4, 0.15);
  // Skirting boards.
  const tb = { def: C.trim };
  box([XL, 0, ZB - 0.018], [XR, 0.13, ZB], tb);
  box([XL, 0, ZF], [XL + 0.018, 0.13, ZB], tb);
  box([XR - 0.018, 0, ZF], [XR, 0.13, ZB], tb);
}

function paintBoards() {
  const rng = mulberry32(7), W = 0.14;
  const boards = [];
  for (let x = XL; x < XR - 1e-3; x += W) {
    let z = ZF - rng() * 2.5;
    while (z < ZB) {
      const z1 = Math.min(ZB, z + 1.1 + rng() * 2.4), k = 0.84 + rng() * 0.3, warm = rng();
      boards.push({ x, z0: Math.max(z, ZF), z1, k, warm });
      z = z1;
    }
  }
  for (const b of boards) {
    const col = mix(hex(C.floor), [196, 150, 98], b.warm * 0.35).map(v => v * b.k);
    G.fillStyle = rgba(col);
    poly3([[b.x, 0, b.z0], [b.x, 0, b.z1], [b.x + W, 0, b.z1], [b.x + W, 0, b.z0]]) && G.fill();
    // grain: long faint lines along the board, with the odd knot
    const n = 5 + (rng() * 4 | 0);
    for (let i = 0; i < n; i++) {
      const u = b.x + (0.1 + 0.8 * rng()) * W, wob = rng() * 10, pts = [];
      for (let z = b.z0; z <= b.z1 + 1e-6; z += 0.15) pts.push([u + 0.004 * Math.sin(z * 3 + wob), 0, z]);
      if (pts.length > 1) line3(pts, 0.0022, rgba(rng() < 0.6 ? C.grain : '#d3a878', 0.18 + rng() * 0.2), 'butt');
    }
    if (rng() < 0.18) { const kz = lerp(b.z0, b.z1, rng()), kx = b.x + W * (0.25 + 0.5 * rng()); onPlane([kx, 0, kz], [1, 0, 0], [0, 0, 1], () => { G.fillStyle = rgba(C.grain, 0.5); G.beginPath(); G.ellipse(0, 0, 0.008, 0.02, 0, 0, TAU); G.fill(); }); }
    if (b.z1 < ZB) line3([[b.x, 0, b.z1], [b.x + W, 0, b.z1]], 0.0025, rgba(C.seam, 0.4), 'butt');
  }
  for (let x = XL + W; x < XR; x += W) line3([[x, 0, 0.0], [x, 0, ZB]], 0.003, rgba(C.seam, 0.45), 'butt');
}

function paintWindow() {
  paintOutside();
  const T = { def: C.trim, r: tone(C.trim, 1.02), t: tone(C.trim, 0.9), b: tone(C.trim, 0.7), f: tone(C.trim, 0.8), k: tone(C.trim, 0.8) };
  // The sashes and bars stand in the plane of the glass; the frame around them. Against the sky they read as one
  // dark lattice, so they share a single plane (their thin sides would only flicker between planes).
  const sashId = plane([1, 0, 0], [XG + 0.03, 0, 0], { sky: 0 });
  const bar = (z0, z1, y0, y1, d0 = -0.012, d1 = 0.024) => box([XG + d0, y0, z0], [XG + d1, y1, z1], T, {}, {}, sashId);
  const zA = WIN.z0 + FRAME, zB = WIN.z1 - FRAME, yA = WIN.y0 + FRAME, yB = WIN.y1 - FRAME;
  const pw = PANES[0][2];
  for (const [ya, yz] of [SASH.lo, SASH.hi]) {
    const ph = (yz - ya - MUNTIN) / 2;
    bar(SASH.z0 + pw, SASH.z0 + pw + MUNTIN, ya, yz); bar(SASH.z0 + 2 * pw + MUNTIN, SASH.z0 + 2 * pw + 2 * MUNTIN, ya, yz);
    bar(SASH.z0, SASH.z1, ya + ph, ya + ph + MUNTIN);
  }
  bar(zA, zB, yA, SASH.lo[0], -0.012, 0.03); bar(zA, zB, SASH.lo[1], SASH.hi[0], -0.03, 0.03); bar(zA, zB, SASH.hi[1], yB);
  bar(zA, SASH.z0, yA, yB); bar(SASH.z1, zB, yA, yB);
  // the sash lock on the meeting rail
  box([XG + 0.03, SASH.ym - 0.004, (zA + zB) / 2 - 0.035], [XG + 0.045, SASH.ym + 0.012, (zA + zB) / 2 + 0.035], { def: '#8a7a5a' }, {}, {}, sashId);
  bar(WIN.z0, zA, WIN.y0, WIN.y1, -0.02, 0.045); bar(zB, WIN.z1, WIN.y0, WIN.y1, -0.02, 0.045);
  bar(WIN.z0, WIN.z1, yB, WIN.y1, -0.02, 0.045); bar(WIN.z0, WIN.z1, WIN.y0, yA, -0.02, 0.045);
  // The reveal: the thickness of the wall around the window.
  const rv = XG + 0.045;
  surf([[rv, WIN.y0, WIN.z1], [rv, WIN.y1, WIN.z1], [XL, WIN.y1, WIN.z1], [XL, WIN.y0, WIN.z1]], plane([0, 0, -1], [XL, 0, WIN.z1]), C.wall);
  surf([[rv, WIN.y0, WIN.z0], [XL, WIN.y0, WIN.z0], [XL, WIN.y1, WIN.z0], [rv, WIN.y1, WIN.z0]], plane([0, 0, 1], [XL, 0, WIN.z0]), C.wall);
  surf([[rv, WIN.y1, WIN.z0], [XL, WIN.y1, WIN.z0], [XL, WIN.y1, WIN.z1], [rv, WIN.y1, WIN.z1]], plane([0, -1, 0], [XL, WIN.y1, 0]), C.wall);
}
function paintWindowTrim() {
  const T = { def: C.trim };
  // Sill board, apron below it, casing around the opening.
  box([XG + 0.04, WIN.y0 - 0.032, WIN.z0 - 0.06], [XL + 0.045, WIN.y0, WIN.z1 + 0.06], T);
  box([XL, WIN.y0 - 0.11, WIN.z0 - 0.05], [XL + 0.016, WIN.y0 - 0.032, WIN.z1 + 0.05], T);
  box([XL, WIN.y0, WIN.z0 - 0.075], [XL + 0.02, WIN.y1 + 0.075, WIN.z0], T);
  box([XL, WIN.y0, WIN.z1], [XL + 0.02, WIN.y1 + 0.075, WIN.z1 + 0.075], T);
  box([XL, WIN.y1, WIN.z0 - 0.075], [XL + 0.02, WIN.y1 + 0.075, WIN.z1 + 0.075], T);
  box([XL, WIN.y1 + 0.075, WIN.z0 - 0.09], [XL + 0.03, WIN.y1 + 0.095, WIN.z1 + 0.09], T);
  paintPlant();
}

// A trailing plant in a clay pot at the end of the sill: its leaves throw shadows into the moonlight.
const PLANT = { x: XL - 0.055, z: 2.93, y: WIN.y0, r: 0.062, h: 0.11 };
const LEAVES = (() => {
  const rng = mulberry32(33), out = [];
  for (let i = 0; i < 26; i++) {
    const hang = i < 11, a = rng() * TAU;
    const along = hang ? 0.05 + rng() * 0.17 : 0.03 + rng() * 0.16;
    const dz = Math.cos(a) * (hang ? 0.07 + rng() * 0.05 : 0.02 + along * 0.4), dy = hang ? -along + 0.1 : PLANT.h + along;
    out.push({ z: PLANT.z + dz, y: PLANT.y + dy, s: 0.022 + rng() * 0.018, rot: hang ? (rng() - 0.5) * 1.2 + Math.PI / 2 : a, x: PLANT.x + Math.sin(a) * 0.05, k: 0.7 + rng() * 0.5 });
  }
  return out;
})();
function leafPath(g, s) { g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(s * 0.5, -s * 0.55, s * 1.05, -s * 0.3, s, 0); g.bezierCurveTo(s * 1.05, s * 0.3, s * 0.5, s * 0.55, 0, 0); g.closePath(); }
function paintPlant() {
  const id = plane([1, 0, 0], [PLANT.x + 0.03, 0, 0]);
  cyl(PLANT.x, PLANT.z, PLANT.y, PLANT.y + PLANT.h, PLANT.r * 0.8, PLANT.r, plane(facing([PLANT.x, 0, PLANT.z]), [PLANT.x + 0.05, 0, PLANT.z]), () => grad3([PLANT.x, 0.9, PLANT.z - 0.07], [PLANT.x, 0.9, PLANT.z + 0.07], [[0, tone(C.pot, 1.1)], [1, tone(C.pot, 0.7)]]));
  for (const L of LEAVES) {
    onPlane([L.x, L.y, L.z], [0, 0, 1], [0, 1, 0], () => {
      G.rotate(-L.rot); leafPath(G, L.s);
      G.fillStyle = MODE === 'id' ? idCol(id) : MODE === 'ao' ? '#fff' : tone(C.leaf, L.k); G.fill();
      if (ALB()) { G.strokeStyle = tone(C.leaf, 1.4, 0.5); G.lineWidth = 0.0015; G.beginPath(); G.moveTo(0, 0); G.lineTo(L.s * 0.9, 0); G.stroke(); }
    });
  }
}

/* ---------- the rug ---------- */
function paintRug() {
  // A worn Persian-style rug: guard stripes, a border with a running vine, a madder field with a lozenge medallion.
  const { x0, x1, z0, z1 } = RUG, y = 0.008, W = x1 - x0, D = z1 - z0;
  const at = (u, v) => [x0 + u, y, z0 + v];               // metres across and along the rug
  const id = plane([0, 1, 0], [0, y, 0]);
  const rect = (a, b, c, d) => [at(a, c), at(b, c), at(b, d), at(a, d)];
  const fillUV = (pts, col) => { G.fillStyle = col; poly3(pts.map(([u, v]) => at(u, v))) && G.fill(); };
  ao([[x0 - 0.04, 0, z0 - 0.04], [x1 + 0.04, 0, z0 - 0.04], [x1 + 0.04, 0, z1 + 0.04], [x0 - 0.04, 0, z1 + 0.04]], 0.22, 0.03);
  surf(rect(0, W, 0, D), id, C.rugCream, () => {
    const g = 0.028, B = 0.165, rng = mulberry32(21);
    fillUV([[g, g], [W - g, g], [W - g, D - g], [g, D - g]], C.rugBorder);
    // the border's vine: a wavy line round the rug with little rosettes on it
    const m = g + B / 2, loop = [];
    for (const [ua, va, ub, vb] of [[m, m, W - m, m], [W - m, m, W - m, D - m], [W - m, D - m, m, D - m], [m, D - m, m, m]]) {
      const L = Math.hypot(ub - ua, vb - va);
      for (let d = 0; d < L; d += 0.01) { const t = d / L, w = 0.03 * Math.sin(d / 0.14 * TAU), nu = -(vb - va) / L, nv = (ub - ua) / L; loop.push([lerp(ua, ub, t) + nu * w, lerp(va, vb, t) + nv * w]); }
    }
    line3(loop.map(([u, v]) => at(u, v)), 0.009, C.rugRust);
    for (let i = 0; i < loop.length; i += 14) {
      const [u, v] = loop[i];
      for (let k = 0; k < 6; k++) { const aa = k / 6 * TAU; fillUV([[u, v], [u + 0.022 * Math.cos(aa - 0.3), v + 0.022 * Math.sin(aa - 0.3)], [u + 0.03 * Math.cos(aa), v + 0.03 * Math.sin(aa)], [u + 0.022 * Math.cos(aa + 0.3), v + 0.022 * Math.sin(aa + 0.3)]], i % 28 ? C.rugCream : C.rugTeal); }
      fillUV([[u - 0.008, v], [u, v - 0.008], [u + 0.008, v], [u, v + 0.008]], C.rugRust);
    }
    fillUV([[g + B, g + B], [W - g - B, g + B], [W - g - B, D - g - B], [g + B, D - g - B]], C.rugRust);
    const f0 = g + B + 0.022, fu = W - f0, fv = D - f0;
    fillUV([[f0, f0], [fu, f0], [fu, fv], [f0, fv]], C.rugField);
    // small flowers scattered over the field in a lattice
    for (let v = f0 + 0.06, j = 0; v < fv - 0.04; v += 0.1, j++) for (let u = f0 + 0.05 + (j % 2) * 0.06; u < fu - 0.04; u += 0.12) {
      const c = rng() < 0.7 ? tone(C.rugField, 0.8) : tone(C.rugCream, 0.8, 0.8), r = 0.016;
      fillUV([[u - r, v], [u, v - r], [u + r, v], [u, v + r]], c);
    }
    // corner spandrels and the medallion, stepped the way knotted patterns are
    const cu = W / 2, cv = D / 2;
    const lozenge = (hu, hv, col, step = 0.03) => {
      const pts = [];
      for (let k = 0; k < 4; k++) {
        const [su, sv] = [[1, 1], [-1, 1], [-1, -1], [1, -1]][k];
        for (let i = 0; i <= 8; i++) { const t = i / 8, uu = hu * (k % 2 ? t : 1 - t), vv = hv * (k % 2 ? 1 - t : t); pts.push([cu + su * (uu + (i % 2) * step * 0.3), cv + sv * vv]); }
      }
      fillUV(pts, col);
    };
    lozenge(0.38, 0.62, C.rugBorder); lozenge(0.3, 0.5, C.rugCream); lozenge(0.22, 0.38, tone(C.rugField, 1.1)); lozenge(0.1, 0.18, C.rugBorder); lozenge(0.04, 0.07, C.rugCream);
    for (const sv of [-1, 1]) fillUV([[cu - 0.05, cv + sv * 0.6], [cu, cv + sv * 0.73], [cu + 0.05, cv + sv * 0.6], [cu, cv + sv * 0.66]], C.rugBorder);
    for (const [su, sv] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
      const ou = su ? fu : f0, ov = sv ? fv : f0, du = su ? -1 : 1, dv = sv ? -1 : 1, pts = [[ou, ov]];
      for (let i = 0; i <= 10; i++) { const a = i / 10 * Math.PI / 2; pts.push([ou + du * 0.26 * Math.cos(a) * (1 + 0.1 * (i % 2)), ov + dv * 0.3 * Math.sin(a) * (1 + 0.1 * (i % 2))]); }
      fillUV(pts, C.rugBorder);
    }
    // pile, wear and a little fading toward the window
    for (let i = 0; i < 1400; i++) dab(at(rng() * W, rng() * D), 0.006 + rng() * 0.02, rng() < 0.5 ? '#e6dac0' : '#2a2030', 0.06 + rng() * 0.08);
    for (let i = 0; i < 30; i++) dab(at(rng() * W, rng() * D), 0.08 + rng() * 0.15, '#d8ccb2', 0.1);
  });
  // fringe at the two short ends
  if (ALB()) {
    const rng = mulberry32(22);
    for (const [v, sg] of [[0, -1], [D, 1]]) for (let u = 0.012; u < W - 0.01; u += 0.011) {
      const a = at(u, v), l = 0.04 + rng() * 0.025;
      line3([a, [a[0] + (rng() - 0.5) * 0.015, 0.003, a[2] + sg * l]], 0.0035, rgba(C.rugCream, 0.85));
    }
  }
}

/* ---------- on the back wall ---------- */

function paintPictures() {
  // A pressed fern in a thin dark frame, above the chair.
  picture(-1.02, -0.58, 1.36, 1.92, '#2e2824', (x0, x1, y0, y1, z) => {
    const rng = mulberry32(8), mat = 0.035;
    G.fillStyle = '#ebe5d4'; poly3([[x0 + mat, y0 + mat, z - 0.0005], [x1 - mat, y0 + mat, z - 0.0005], [x1 - mat, y1 - mat, z - 0.0005], [x0 + mat, y1 - mat, z - 0.0005]]) && G.fill();
    const stem = t => [lerp(x0, x1, 0.5) + 0.02 * Math.sin(t * 2.5) - 0.01, lerp(y0 + 0.06, y1 - 0.05, t), z - 0.001];
    line3(Array.from({ length: 12 }, (_, i) => stem(i / 11)), 0.0025, '#5d5a3c');
    for (let i = 0; i < 22; i++) {
      const t = 0.08 + 0.9 * i / 21, len = 0.012 + 0.11 * Math.sin(Math.PI * Math.pow(t, 0.8)) * (1 - 0.3 * t), p = stem(t);
      for (const sg of [-1, 1]) {

          G.rotate(sg > 0 ? 0.55 : Math.PI - 0.55); G.fillStyle = tone('#6d7a4e', 0.85 + rng() * 0.3);
          // each frond piece is a row of little lobes, smaller toward its tip
          for (let k = 0; k < 7; k++) { const q = k / 7, r = len * 0.11 * (1 - q * 0.7); G.beginPath(); G.ellipse(len * q, 0, r * 1.2, r, 0, 0, TAU); G.fill(); }
        });

    }
  });
  // A small seascape in a gilt frame, above the bed.
  picture(0.86, 1.72, 1.36, 1.86, '#a3864f', (x0, x1, y0, y1, z) => {
    const at = (u, v) => [lerp(x0, x1, u), lerp(y0, y1, v), z];
    G.fillStyle = grad3(at(0.5, 1), at(0.5, 0.4), [[0, '#8fa3b8'], [1, '#d8cdb4']]); poly3([at(0, 0.4), at(1, 0.4), at(1, 1), at(0, 1)]) && G.fill();
    G.fillStyle = grad3(at(0.5, 0.4), at(0.5, 0), [[0, '#5d7890'], [1, '#34495e']]); poly3([at(0, 0), at(1, 0), at(1, 0.4), at(0, 0.4)]) && G.fill();
    G.fillStyle = '#e8dcc0'; poly3([at(0.62, 0.38), at(0.66, 0.62), at(0.69, 0.38)]) && G.fill();
    G.fillStyle = '#3c4a3a'; poly3([at(0, 0), at(0.35, 0), at(0.28, 0.2), at(0.12, 0.32), at(0, 0.3)]) && G.fill();
  });
}

/* ---------- the chair and the jumper over it ---------- */
function paintChair() {
  // A ladder-back chair against the wall: two tall posts, three curved rungs, a seat, stretchers between the legs.
  const { x, z0, z1, w, seat, back } = CHAIR, h = w / 2, t = 0.034, W = { def: C.oak, t: C.oakLight, l: tone(C.oak, 1.08) };
  ao([[x - h - 0.06, 0, z0 - 0.06], [x + h + 0.06, 0, z0 - 0.06], [x + h + 0.06, 0, z1], [x - h - 0.06, 0, z1]], 0.45, 0.08);
  ao([[x - h, 0, ZB], [x + h, 0, ZB], [x + h, back, ZB], [x - h, back, ZB]], 0.28, 0.06);
  for (const sx of [-1, 1]) {
    const px = x + sx * (h - 0.012 - t / 2);
    box([px - t / 2, 0, z1 - t], [px + t / 2, back, z1], W);
    box([px - t / 2 - 0.005, back, z1 - t - 0.005], [px + t / 2 + 0.005, back + 0.025, z1 + 0.005], { def: C.oakLight });   // a turned cap
  }
  for (const y of CHAIR_RUNGS) box([x - h + 0.02, y - 0.022, z1 - t + 0.008], [x + h - 0.02, y + 0.022, z1 - 0.01], W);
  box([x - h + 0.02, 0.15, z0 + 0.012], [x + h - 0.02, 0.172, z0 + 0.028], W);
  for (const sx of [-1, 1]) box([x + sx * (h - 0.03) - 0.009, 0.21, z0 + 0.02], [x + sx * (h - 0.03) + 0.009, 0.228, z1 - 0.02], W);
  box([x - h, seat - 0.03, z0], [x + h, seat, z1 + 0.005], { def: C.oak, t: C.oakLight, f: tone(C.oak, 0.88) }, {}, {
    t: () => { for (let i = 1; i < 12; i++) { const u = lerp(x - h, x + h, i / 12); line3([[u, seat + 0.001, z0 + 0.01], [u, seat + 0.001, z1 - 0.01]], 0.0025, tone(C.oak, 0.8, 0.45), 'butt'); } },
  });
  for (const sx of [-1, 1]) { const px = x + sx * (h - 0.012 - t / 2); box([px - t / 2, 0, z0], [px + t / 2, seat - 0.03, z0 + t], W); }
  paintJumper();
}
function paintJumper() {
  // A knitted cardigan hung over one corner of the top rung, one sleeve hanging lower down the post.
  const { x, z1, w } = CHAIR, ry = CHAIR_RUNGS[2] + 0.022, rz = z1 - 0.02, r = 0.024, L = 0.4, cx = x - w / 2 + 0.13;
  const id = plane([0, 0, -1], [0, 0, rz - r - 0.012]);
  const rib = Q => 0.9 + 0.1 * Math.abs(Math.sin(Q.u * 26 * Math.PI));
  mesh((u, v) => {
    // v runs from the front hem (0) up over the rung (1)
    const hem = 1 + 0.1 * Math.sin(u * 7 + 1) + 0.05 * Math.sin(u * 19);
    const px = cx + (u - 0.5) * 0.27 * (1 + 0.18 * (1 - v));
    if (v > 0.84) { const ph = (1 - v) / 0.16 * Math.PI / 2; return [px, ry + r * Math.cos(ph), rz - r * Math.sin(ph)]; }
    const d = (0.84 - v) / 0.84 * L * hem;
    return [px, ry - d, rz - r - 0.028 * Math.sin(u * 13 + 0.5) * (d / L) - 0.012 * Math.sin(u * 31) * (d / L) - 0.014 * (d / L)];
  }, 22, 22, Q => cloth(C.knit, Q, 0.7).map(c => c * rib(Q) * (Q.v < 0.07 ? 0.84 : 1)), () => id);
  // the sleeve, a soft tube hanging down beside the post
  const a0 = [x - w / 2 + 0.035, ry - 0.02, rz - r - 0.03], a1 = [x - w / 2 + 0.01, ry - 0.55, rz - r - 0.06];
  mesh((u, v) => {
    const ang = Math.PI * (0.1 + 0.8 * u), c = add(scl(a0, 1 - v), scl(a1, v)), rr = 0.036 * (1 - 0.2 * v) * (1 + 0.1 * Math.sin(v * 20));
    return add(c, [-Math.cos(ang) * rr, 0, -Math.sin(ang) * rr]);
  }, 10, 16, Q => cloth(C.knit, Q, 0.7).map(c => c * (0.9 + 0.1 * Math.abs(Math.sin(Q.v * 30)))), () => id);
}

/* ---------- nightstand, lamp, books, a glass of water ---------- */
function paintNightstand() {
  const { x0, x1, z0, z1, h } = STAND, W = { def: C.walnut, t: C.walnutLight };
  ao([[x0 - 0.06, 0, z0 - 0.08], [x1 + 0.06, 0, z0 - 0.08], [x1 + 0.06, 0, z1], [x0 - 0.06, 0, z1]], 0.5, 0.08);
  ao([[x0 - 0.04, 0, ZB], [x1 + 0.04, 0, ZB], [x1 + 0.04, h + 0.1, ZB], [x0 - 0.04, h + 0.1, ZB]], 0.35, 0.08);
  for (const [lx, lz] of [[x0 + 0.02, z0 + 0.02], [x1 - 0.06, z0 + 0.02], [x0 + 0.02, z1 - 0.06], [x1 - 0.06, z1 - 0.06]]) box([lx, 0, lz], [lx + 0.04, 0.1, lz + 0.04], W);
  box([x0, 0.1, z0 + 0.01], [x1, h - 0.03, z1], W, {}, {
    f: pts => {
      // two drawers with small brass knobs
      for (const [ya, yb] of [[0.13, 0.3], [0.32, 0.5]]) {
        line3([[x0 + 0.02, ya, z0 + 0.009], [x1 - 0.02, ya, z0 + 0.009], [x1 - 0.02, yb, z0 + 0.009], [x0 + 0.02, yb, z0 + 0.009], [x0 + 0.02, ya, z0 + 0.009]], 0.004, tone(C.walnut, 0.6));
        onPlane([(x0 + x1) / 2, (ya + yb) / 2, z0 + 0.008], [1, 0, 0], [0, 1, 0], () => { G.fillStyle = '#b8965a'; G.beginPath(); G.arc(0, 0, 0.011, 0, TAU); G.fill(); G.fillStyle = '#e0c68a'; G.beginPath(); G.arc(-0.003, 0.003, 0.004, 0, TAU); G.fill(); });
      }
      for (let i = 0; i < 14; i++) { const yy = lerp(0.12, h - 0.04, i / 13); line3([[x0, yy, z0 + 0.009], [x1, yy + 0.01, z0 + 0.009]], 0.002, tone(C.walnut, 1.25, 0.18)); }
    },
  });
  box([x0 - 0.015, h - 0.03, z0 - 0.005], [x1 + 0.015, h, z1], { def: C.walnut, t: C.walnutLight, f: tone(C.walnut, 1.1) });
  // books, a glass of water, the clock
  box([0.13, h, 3.58], [0.31, h + 0.035, 3.82], { def: '#6d3b36', t: '#d9d2bf' });
  box([0.14, h + 0.035, 3.6], [0.3, h + 0.068, 3.81], { def: '#2f4a5a', t: '#d9d2bf', f: '#e6dfcc' });
  // (a glass shows mostly what's behind it: only its edges catch the light)
  cyl(-0.1, 3.53, h, h + 0.11, 0.032, 0.036, plane(facing([-0.1, 0, 3.53]), [-0.1, 0, 3.53]), () => grad3([-0.136, 0.6, 3.53], [-0.064, 0.6, 3.53], [[0, 'rgba(225,235,242,0.8)'], [0.18, 'rgba(160,178,192,0.22)'], [0.75, 'rgba(160,178,192,0.18)'], [1, 'rgba(232,240,246,0.7)']]), () => {
    line3([[-0.135, h + 0.075, 3.53], [-0.065, h + 0.075, 3.53]], 0.0025, 'rgba(225,235,242,0.45)');   // the water's surface
  });
  paintClock();
  paintLamp();
}
function paintClock() {
  // Dark plastic, a smoked window in front for the digits (lit on their own canvas), a snooze bar along the top.
  const { x0, x1, z0, z1 } = CLOCK, y0 = STAND.h, y1 = y0 + CLOCK.h;
  ao([[x0 - 0.02, y0, z0 - 0.02], [x1 + 0.02, y0, z0 - 0.02], [x1 + 0.02, y0, z1 + 0.02], [x0 - 0.02, y0, z1 + 0.02]], 0.5, 0.015);
  box([x0, y0, z0], [x1, y1, z1], { def: '#2a282e', t: '#3a383f', f: '#26242a' }, {}, {
    f: () => {
      const w = [[x0 + 0.011, y0 + 0.013, z0 - 0.0005], [x1 - 0.011, y0 + 0.013, z0 - 0.0005], [x1 - 0.011, y1 - 0.013, z0 - 0.0005], [x0 + 0.011, y1 - 0.013, z0 - 0.0005]];
      G.fillStyle = '#140a0b'; poly3(w) && G.fill();
      line3([...w, w[0]], 0.0015, 'rgba(120,110,120,0.5)');
    },
  });
  box([x0 + 0.03, y1, z0 + 0.012], [x1 - 0.03, y1 + 0.008, z1 - 0.012], { def: '#34323a', t: '#4a4852' });
}
function paintLamp() {
  const { x, z, r0, rb, rt, y1, y2 } = LAMP, h = STAND.h;
  const idB = plane(facing([x, 0, z]), [x, 0, z]), idS = plane(facing([x, 0, z]), add([x, 0, z], scl(facing([x, 0, z]), 0.1)));
  ao([[x - 0.3, h + 0.3, ZB], [x + 0.3, h + 0.3, ZB], [x + 0.3, y2 + 0.1, ZB], [x - 0.3, y2 + 0.1, ZB]], 0.3, 0.1);
  cyl(x, z, h, h + 0.03, r0 * 1.1, r0 * 1.1, idB, tone(C.lampBase, 0.8));
  // a round-bellied ceramic base: stacked rings of a bulb
  const belly = [];
  for (let i = 0; i <= 10; i++) { const t = i / 10; belly.push([h + 0.03 + t * (y1 - h - 0.06), r0 * (0.45 + 0.75 * Math.sin(Math.PI * (0.15 + 0.7 * t)))]); }
  const pts = []; for (const [yy, rr] of belly) pts.push(...ring(x, yy, z, rr, 20));
  const sps = pts.map(sp);
  if (sps.every(Boolean)) shape(() => pathOf(hull(sps)), idB, () => grad3([x - r0, 0.7, z], [x + r0, 0.7, z], [[0, tone(C.lampBase, 1.12)], [0.6, C.lampBase], [1, tone(C.lampBase, 0.7)]]), () => {
    const s = sp([x - r0 * 0.4, h + 0.12, z - r0]); if (s) { G.fillStyle = 'rgba(255,255,255,0.35)'; G.beginPath(); G.ellipse(s[0], s[1], pxAt(0.008, [x, h, z]), pxAt(0.03, [x, h, z]), 0, 0, TAU); G.fill(); }
  });
  line3([[x, y1 - 0.03, z], [x, y1 + 0.02, z]], 0.008, '#8a7550');
  cyl(x, z, y1, y2, rb, rt, idS, () => grad3([x - rb, 0.85, z], [x + rb, 0.85, z], [[0, tone(C.shade, 1.05)], [0.55, C.shade], [1, tone(C.shade, 0.82)]]), () => {
    // pleats
    for (let i = 0; i < 18; i++) { const a = Math.PI * (0.05 + 0.9 * i / 17), cx = Math.cos(a + Math.PI), sz = -Math.sin(a); line3([[x + cx * rb, y1 + 0.003, z + sz * rb], [x + cx * rt, y2 - 0.003, z + sz * rt]], 0.003, tone(C.shade, 0.88, 0.45)); }
    const bt = [...ring(x, y1, z, rb, 32)].map(sp).filter(Boolean);
    G.strokeStyle = tone(C.shade, 0.75, 0.6); G.lineWidth = 1.2; G.beginPath(); bt.forEach((p, i) => i ? G.lineTo(p[0], p[1]) : G.moveTo(p[0], p[1])); G.closePath(); G.stroke();
  });
}

/* ---------- the bed ---------- */
function paintHeadboard() {
  const { x0, x1, z0, h } = HEAD, W = { def: C.walnut, t: C.walnutLight, f: tone(C.walnut, 1.05) };
  ao([[x0 - 0.05, 0, ZB], [x1, 0, ZB], [x1, h + 0.06, ZB], [x0 - 0.05, h + 0.06, ZB]], 0.4, 0.05);
  box([x0, 0, z0 + 0.012], [x1, h - 0.04, ZB], W, {}, {
    f: () => {
      // a raised panel: a lighter bevel and a shadow line, and the grain
      const zz = z0 + 0.011, a = 0.09;
      line3([[x0 + a, 0.62, zz], [x1 - a, 0.62, zz], [x1 - a, h - 0.12, zz], [x0 + a, h - 0.12, zz], [x0 + a, 0.62, zz]], 0.006, tone(C.walnut, 0.62));
      line3([[x0 + a + 0.01, 0.63, zz], [x1 - a - 0.01, 0.63, zz]], 0.004, tone(C.walnut, 1.35, 0.6));
      const rng = mulberry32(61);
      for (let i = 0; i < 30; i++) { const yy = lerp(0.1, h - 0.06, rng()); line3([[x0, yy, zz], [lerp(x0, x1, 0.5), yy + (rng() - 0.5) * 0.02, zz], [x1, yy + (rng() - 0.5) * 0.02, zz]], 0.002, tone(C.walnut, 1.3, 0.16)); }
    },
  });
  box([x0 - 0.02, h - 0.04, z0], [x1 + 0.0, h, ZB], { def: C.walnut, t: C.walnutLight, f: tone(C.walnut, 1.12) });
}
/* Soft things are painted as meshes: a surface f(u, v) cut into small quads, each shaded by how it faces the

const LD = norm([-0.55, 0.75, -0.35]);

    const rib = 0.86 + 0.14 * Math.abs(Math.sin(Q.v * 14 * Math.PI)), st = 1 + 0.06 * Math.sin(Q.u * 700);

function paintPillows() {

    const V = norm([0, yt - yb, zt - zb]), Ux = [1, 0, 0], N = cross(V, Ux), d = Math.hypot(yt - yb, zt - zb), c = [cx, (yb + yt) / 2, (zb + zt) / 2];

      const s = u * 2 - 1, t = v * 2 - 1, pinch = 1 - 0.05 * (1 - t * t);
      const h = puff * Math.pow(Math.max(0, 1 - Math.abs(s) ** 2.6), 0.45) * Math.pow(Math.max(0, 1 - Math.abs(t) ** 2.6), 0.45);
      const wr = 0.006 * Math.sin(s * 9 + seed) * Math.sin(t * 7 + seed * 2) * (Math.abs(s) + Math.abs(t));
      return add(add(add(c, scl(Ux, s * w / 2 * pinch)), scl(V, t * d / 2)), scl(N, h + wr));

  for (const [x, z, a] of SLIPPERS) {

/* ---------- curtains ---------- */

  const xw = XL + 0.1, yTop = WIN.y1 + 0.13;

/* ---------- the chest of drawers by the door ---------- */

/* ---------- the window mask ----------
   What the moon sees of the room through the window, laid flat in the plane of the glass: clear panes, the
   bars between them, and the plant on the sill. The shader blurs it more the farther the light travels. */
const MASK = { z0: WIN.z0 - 0.2, z1: WIN.z1 + 0.2, y0: WIN.y0 - 0.2, y1: WIN.y1 + 0.2, tpm: 600 };
function paintMask() {
  const w = Math.round((MASK.z1 - MASK.z0) * MASK.tpm), h = Math.round((MASK.y1 - MASK.y0) * MASK.tpm);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.setTransform(MASK.tpm, 0, 0, -MASK.tpm, -MASK.z0 * MASK.tpm, MASK.y1 * MASK.tpm);   // metres, y up
  // old glass: not quite even
  for (const [z, y, pw, ph] of PANES) {
    const gr = g.createLinearGradient(z, y, z + pw, y + ph);
    gr.addColorStop(0, '#f4f4f4'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, '#ececec');
    g.fillStyle = gr; g.fillRect(z, y, pw, ph);
  }
  g.fillStyle = '#000';
  g.fillRect((SASH.z0 + SASH.z1) / 2 - 0.035, SASH.ym - 0.004, 0.07, 0.016);
  for (const L of LEAVES) { g.save(); g.translate(L.z, L.y); g.rotate(L.rot); leafPath(g, L.s); g.fill(); g.restore(); }
  g.fillRect(PLANT.z - PLANT.r, PLANT.y, PLANT.r * 2, PLANT.h);
  return c;
}

  gl.uniform3f(U.uMoon, k * lerp(0.7, 1.0, warm), k * lerp(0.82, 0.78, warm), k * lerp(1.0, 0.55, warm));
  gl.uniform3f(U.uSkyL, 0.25, 0.43, 0.68);
  gl.uniform3f(U.uAmb, 0.0037, 0.0043, 0.0105);
  gl.uniform4f(U.uGrade, 1.52, 0.62, 0.48, 0.02);
  gl.uniform4fv(U.uRamp, RAMP);
  // The light lands on the floor and walls and lights the room a little: four points where it falls.
  const bp = new Float32Array(20), bn = new Float32Array(20), bc = new Float32Array(15), glow = new Float32Array(20);
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  const grow = p => { for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], p[i]); hi[i] = Math.max(hi[i], p[i]); } };
  [[WIN.y0, WIN.z0], [WIN.y0, WIN.z1], [WIN.y1, WIN.z1], [WIN.y1, WIN.z0]].forEach(([y, z]) => { grow([XG, y, z]); const h = land([XL, y, z], L); if (h) grow(h.p); });
  gl.uniform3f(U.uBA, lo[0], Math.max(0, lo[1]), lo[2]); gl.uniform3f(U.uBB, hi[0], Math.min(HC, hi[1]), hi[2]);
  let nb = 0;
  [[0.3, 0.3], [0.7, 0.3], [0.3, 0.7], [0.7, 0.7]].forEach(([fy, fz], i) => {
    const h = land([XL, lerp(WIN.y0, WIN.y1, fy), lerp(WIN.z0, WIN.z1, fz)], L); if (!h) return;
    const onRug = h.n[1] > 0.5 && h.p[0] > RUG.x0 && h.p[0] < RUG.x1 && h.p[2] > RUG.z0 && h.p[2] < RUG.z1;
    bc.set((h.n[1] > 0.5 ? (onRug ? [1.25, 0.72, 0.68] : [1.25, 0.95, 0.72]) : [0.95, 1.0, 1.05]), i * 3);
    bp.set([...add(h.p, scl(h.n, 0.02)), 0.13 * Math.max(0, -dot(h.n, L))], i * 4); bn.set([...h.n, 0], i * 4);
    for (let k = 0; k < 3; k++) { bp[16 + k] += h.p[k]; bc[12 + k] += bc[i * 3 + k]; }
    bp[19] += bp[i * 4 + 3]; nb++;
    const s = sp(h.p); if (s) glow.set([s[0] / cam.W, s[1] / cam.H, 0.13, 0.009], i * 4);
  });
  // The ceiling catches that light in turn and sends it down again, softly, onto everything that faces up.
  // (It spreads the light wide, so it's placed a little above the ceiling and kept away from the walls.)
  if (nb) {
    for (let k = 0; k < 3; k++) { bp[16 + k] /= nb; bc[12 + k] /= nb; }
    bp[16] = clamp(bp[16], XL + 0.7, XR - 0.7); bp[17] = HC + 0.5; bp[18] = clamp(bp[18], ZF + 0.7, ZB - 0.7); bp[19] *= 0.875;
  }
  bn.set([0, -1, 0, 0], 16);
  gl.uniform4fv(U.uBP, bp); gl.uniform4fv(U.uBN, bn); gl.uniform3fv(U.uBC, bc);
  const wc = sp([XG, (WIN.y0 + WIN.y1) / 2, (WIN.z0 + WIN.z1) / 2]); if (wc) glow.set([wc[0] / cam.W, wc[1] / cam.H, 0.15, 0.022], 16);
  gl.uniform4fv(U.uGlow, glow);
  gl.uniform1f(U.uT, t);
  gl.uniform1f(U.uMoonUp, up);
  gl.uniform3f(U.uSky3, Math.sin(LAT), Math.cos(LAT), turned);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- dust in the moonbeam ----------
   Specks of dust adrift in the shaft of light, rising slowly on the warmth from the radiator and wandering as they
   go. They show only while they're in the light: most just glow faintly, but every so often a flake turns its face
   to the moon and glints. */
const mc = document.getElementById('motes'), mg = mc.getContext('2d');
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTES = Array.from({ length: 170 }, (_, i) => {
  const r = mulberry32(900 + i);
  return {
    a: r(), b: r(), c: r(),                     // across the glass, up it, and how far along the light
    rise: 0.0015 + r() * 0.005, ph: r() * TAU, w: [0.05 + r() * 0.1, 0.04 + r() * 0.08, 0.05 + r() * 0.1],
    size: 0.7 + r() * 0.6, glow: 0.3 + r() * 0.3, tw: 0.3 + r() * 0.9, flake: r() < 0.16, spin: 1.2 + r() * 2, seed: r() * 100,
  };
});
const sprite = (n, paint) => { const c = document.createElement('canvas'); c.width = c.height = n; paint(c.getContext('2d'), n / 2); return c; };
const SPECK = sprite(32, (g, h) => {
  const gr = g.createRadialGradient(h, h, 0, h, h, h);
  gr.addColorStop(0, 'rgba(236,241,255,1)'); gr.addColorStop(0.25, 'rgba(226,233,255,0.55)'); gr.addColorStop(1, 'rgba(216,226,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 2 * h, 2 * h);
});
const GLINT = sprite(64, (g, h) => {                // a glint: a bright point with four fine rays
  for (const [dx, dy] of [[1, 0], [0, 1]]) {
    const gr = g.createLinearGradient(h - dx * h, h - dy * h, h + dx * h, h + dy * h);
    gr.addColorStop(0, 'rgba(232,238,255,0)'); gr.addColorStop(0.5, 'rgba(242,246,255,0.9)'); gr.addColorStop(1, 'rgba(232,238,255,0)');
    g.fillStyle = gr; g.fillRect(dx ? 0 : h - 1, dy ? 0 : h - 1, dx ? 2 * h : 2, dy ? 2 * h : 2);
  }
  const c = g.createRadialGradient(h, h, 0, h, h, h * 0.3);
  c.addColorStop(0, 'rgba(246,249,255,1)'); c.addColorStop(1, 'rgba(236,241,255,0)');
  g.fillStyle = c; g.fillRect(0, 0, 2 * h, 2 * h);
});
function lightAt(p, toMoon) {                 // does the moon see p through a pane? (0..1, soft at the edges)
  const s = (XG - p[0]) / toMoon[0]; if (s <= 0) return 0;
  const z = p[2] + toMoon[2] * s, y = p[1] + toMoon[1] * s, e = 0.004 + s * 0.005;
  let best = 0;
  for (const [pz, py, pw, ph] of PANES) best = Math.max(best, smoothstep(-e, e, Math.min(z - pz, pz + pw - z, y - py, py + ph - y)));
  return best;
}
function blocked(p, d, far) {                 // does any of the furniture stand between p and far along d?
  for (const [A, B] of OCCLUDERS) {
    let t0 = 0, t1 = far;
    for (let k = 0; k < 3 && t0 <= t1; k++) {
      if (Math.abs(d[k]) < 1e-9) { if (p[k] < A[k] || p[k] > B[k]) t1 = -1; continue; }
      const ta = (A[k] - p[k]) / d[k], tb = (B[k] - p[k]) / d[k];
      t0 = Math.max(t0, Math.min(ta, tb)); t1 = Math.min(t1, Math.max(ta, tb));
    }
    if (t0 <= t1) return true;
  }
  return false;
}
function drawMotes(t, L, up) {
  mg.clearRect(0, 0, mc.width, mc.height);
  if (STILL || up < 0.02) return;
  const toMoon = scl(L, -1), ks = mc.width / cam.W;
  for (const d of MOTES) {
    // where it is: a place on the glass, carried in along the light, then its own slow wandering
    const b = (d.b + d.rise * t) % 1, a = d.a + 0.02 * Math.sin(t * d.w[0] + d.ph);
    const W = [XG, lerp(SASH.lo[0], SASH.hi[1], b), lerp(SASH.z0, SASH.z1, a)], hit = land(W, L);
    if (!hit) continue;
    const c = clamp(d.c + 0.04 * Math.sin(t * d.w[1] + 2 * d.ph), 0.02, 0.98);
    const p = add(add(W, scl(L, lerp(0.25, hit.s - 0.04, c))), [0.02 * Math.sin(t * d.w[2] + d.seed), 0, 0.02 * Math.cos(t * d.w[0] * 1.3 + d.seed)]);
    const lit = lightAt(p, toMoon) * smoothstep(0, 0.06, b) * smoothstep(1, 0.94, b);
    if (lit < 0.02) continue;
    const s = sp(p), eye = sub(cam.pos, p), de = Math.hypot(eye[0], eye[1], eye[2]);
    if (!s || blocked(p, scl(eye, 1 / de), de) || blocked(p, toMoon, (XL - p[0]) / toMoon[0])) continue;
    // a faint slow shimmer, and for the flakes, now and then a glint
    const shimmer = 0.6 + 0.4 * Math.pow(0.5 + 0.5 * Math.sin(t * d.tw + d.ph), 2);
    const glint = d.flake ? Math.pow(Math.max(0, Math.sin(t * d.spin + d.seed)), 60) * smoothstep(0.1, 0.5, noise1(t * 0.15 + d.seed)) : 0;
    // (never much under a pixel across, or a speck would thin out to nothing)
    const k = lit * up, r = clamp(0.003 * cam.F / depthOf(p), 0.75, 2.4) * d.size * ks, x = s[0] * ks, y = s[1] * ks;
    const rr = r * (1.6 + 1.2 * glint);
    mg.globalAlpha = Math.min(1, k * (d.glow * shimmer + glint));
    mg.drawImage(SPECK, x - rr, y - rr, 2 * rr, 2 * rr);
    if (glint > 0.3) { const g = r * 7; mg.globalAlpha = k * (glint - 0.3) * 0.6; mg.drawImage(GLINT, x - g, y - g, 2 * g, 2 * g); }
  }
  mg.globalAlpha = 1;
}

/* ---------- the clock on the nightstand ----------
   Red seven-segment digits on a small canvas of their own over the clock's window, drawn flat on its face: the
   visitor's time on a twelve-hour clock, the colon blinking the seconds away. */
const ck = document.getElementById('clock'), cg = ck.getContext('2d');
const SEGS = [0x3f, 0x06, 0x5b, 0x4f, 0x66, 0x6d, 0x7d, 0x07, 0x7f, 0x6f];   // which of the segments a–g each digit lights
let clockXf = null, clockShown = '';
function placeClock(dpr) {
  // The middle of the clock's window, and where a step along its face, right or up, lands on the screen.
  const o = [(CLOCK.x0 + CLOCK.x1) / 2, STAND.h + CLOCK.h / 2, CLOCK.z0 - 0.001];
  const s = sp(o), a = sp(add(o, [0.01, 0, 0])), b = sp(add(o, [0, 0.01, 0]));
  clockXf = null; clockShown = '';
  if (!s || !a || !b) { ck.style.display = 'none'; return; }
  const css = innerWidth / cam.W, k = dpr;                        // CSS pixels per painted pixel, device pixels per CSS pixel
  const u = [(a[0] - s[0]) * 100 * css, (a[1] - s[1]) * 100 * css], v = [(b[0] - s[0]) * 100 * css, (b[1] - s[1]) * 100 * css];
  const half = Math.ceil(Math.hypot(u[0], u[1]) * 0.11) + 2;     // enough for the digits and their glow
  Object.assign(ck.style, { display: '', left: `${s[0] * css - half}px`, top: `${s[1] * css - half}px`, width: `${2 * half}px`, height: `${2 * half}px` });
  ck.width = ck.height = Math.round(2 * half * k);
  clockXf = [u[0] * k, u[1] * k, v[0] * k, v[1] * k, half * k, half * k];   // metres on the face (y up) to canvas pixels
}
function drawClock(now) {
  if (!clockXf) return;
  const hh = now.getHours() % 12 || 12, mm = now.getMinutes(), colon = STILL || now.getMilliseconds() < 500;
  const shown = `${hh}:${mm}:${colon}`;
  if (shown === clockShown) return;
  clockShown = shown;
  cg.setTransform(1, 0, 0, 1, 0, 0); cg.clearRect(0, 0, ck.width, ck.height);
  cg.setTransform(...clockXf);
  // Everything from here is in metres on the clock's face, from the middle of its window.
  const DW = 0.019, DH = 0.034, T = 0.0042, gap = 0.0006, SLANT = 0.12;
  const px = Math.hypot(clockXf[2], clockXf[3]);                  // canvas pixels per metre, upward
  const halo = cg.createRadialGradient(0, 0, 0, 0, 0, 0.1);
  halo.addColorStop(0, 'rgba(255,40,24,0.13)'); halo.addColorStop(0.45, 'rgba(255,30,16,0.04)'); halo.addColorStop(1, 'rgba(255,30,16,0)');
  cg.fillStyle = halo; cg.fillRect(-0.1, -0.1, 0.2, 0.2);
  cg.fillStyle = 'rgba(255,40,30,0.07)'; cg.fillRect(-0.068, -0.0235, 0.136, 0.047);   // the smoked window, lit from within
  const bar = (ax, ay, bx, by) => {                                // a segment, pointed at both ends, leaning like the rest
    const l = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / l, uy = (by - ay) / l, nx = -uy * T / 2, ny = ux * T / 2, e = T / 2;
    const pts = [[ax, ay], [ax + ux * e + nx, ay + uy * e + ny], [bx - ux * e + nx, by - uy * e + ny], [bx, by], [bx - ux * e - nx, by - uy * e - ny], [ax + ux * e - nx, ay + uy * e - ny]];
    cg.beginPath(); pts.forEach(([x, y], i) => i ? cg.lineTo(x + y * SLANT, y) : cg.moveTo(x + y * SLANT, y)); cg.closePath(); cg.fill();
  };
  const digit = (cx, n, lit, has) => {
    const w = DW / 2, h = DH / 2, on = n < 0 ? 0 : SEGS[n];
    [[cx - w + gap, h, cx + w - gap, h], [cx + w, h - gap, cx + w, gap], [cx + w, -gap, cx + w, -h + gap], [cx + w - gap, -h, cx - w + gap, -h],
      [cx - w, -h + gap, cx - w, -gap], [cx - w, gap, cx - w, h - gap], [cx - w + gap, 0, cx + w - gap, 0]]
      .forEach((s, i) => { if ((has >> i & 1) && !!(on >> i & 1) === lit) bar(...s); });
  };
  // The first place only ever shows a 1, so like a real clock's it only has the two segments of one.
  const digits = [[-0.047, hh >= 10 ? 1 : -1, 0x06], [-0.022, hh % 10, 0x7f], [0.018, Math.floor(mm / 10), 0x7f], [0.043, mm % 10, 0x7f]];
  cg.fillStyle = 'rgba(255,50,36,0.06)';                           // the unlit segments, just there behind the glass
  for (const [cx, n, has] of digits) digit(cx, n, false, has);
  cg.shadowColor = 'rgba(255,36,20,0.85)'; cg.shadowBlur = DH * px * 0.3;
  cg.fillStyle = 'rgba(255,66,46,0.92)';
  for (const [cx, n, has] of digits) digit(cx, n, true, has);
  if (colon) for (const y of [-0.0075, 0.0075]) { cg.beginPath(); cg.arc(-0.002 + y * SLANT, y, 0.0022, 0, TAU); cg.fill(); }
  cg.shadowBlur = 0;
}

// Oil-on-canvas grain, laid over everything by CSS.
(() => {
  const n = 160, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), img = g.createImageData(n, n), r = mulberry32(3);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = (y * n + x) * 4, v = 128 + (r() - 0.5) * 56 + Math.sin(x * 1.9) * Math.sin(y * 1.9) * 14;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // and under it, faint marks of a brush, going every which way
  const m = 300, b = document.createElement('canvas'); b.width = b.height = m;
  const h = b.getContext('2d'), br = mulberry32(4);
  h.fillStyle = '#808080'; h.fillRect(0, 0, m, m); h.lineCap = 'round';
  for (let i = 0; i < 700; i++) {
    const x = br() * m, y = br() * m, a = br() * Math.PI, l = 8 + br() * 26, v = br() < 0.5 ? 110 : 146;
    h.strokeStyle = `rgba(${v},${v},${v},${(0.15 + br() * 0.25).toFixed(2)})`; h.lineWidth = 1.5 + br() * 3;
    for (const [ox, oy] of [[0, 0], [-m, 0], [0, -m], [-m, -m]]) {
      h.beginPath(); h.moveTo(x + ox, y + oy); h.quadraticCurveTo(x + ox + Math.cos(a) * l * 0.5 + (br() - 0.5) * 4, y + oy + Math.sin(a) * l * 0.5, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); h.stroke();
    }
  }
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()}), url(${b.toDataURL()})`;
})();

if (gl) initGL();
let last = -1e9, lastGpu = -1e9, resizeTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 33) return;
  last = now;
  // The dust drifts at 30 frames a second; the light moves so slowly that ten repaints a second are plenty.
  const gpu = now - lastGpu > 95; if (gpu) lastGpu = now;
  draw(gpu);
}
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout(); draw(); }, 150); });
layout(); draw();
requestAnimationFrame(frame);
window.toyboxReady?.();
})();
</script>
</body>
</html>
