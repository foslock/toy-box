<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Harrowing</title>
<meta name="description" content="A deckbuilder where you share one deck with the demons: every card you add, they can draw too.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:ital,wght@0,500;0,600;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f6ead2; --ink2: rgba(246, 234, 210, .72); --ink3: rgba(246, 234, 210, .45); --gold: #f2c45a; --gold2: #b8821c; --red: #ff5a3a; --blood: #8a1410;
    --glass: rgba(18, 10, 14, .72); --line: rgba(242, 196, 90, .28); --heaven: #fff3c4; --T: "Cinzel", Georgia, serif; --B: "Alegreya Sans", "Gill Sans", system-ui, sans-serif; }
  html, body { height: 100%; margin: 0; }
  body { background: #07050a; color: var(--ink); font: 500 16px/1.35 var(--B); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -.2em; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0, 0, 0, .55) 100%); }
  #flashScreen { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; }
  #flashScreen.hurt { background: radial-gradient(100% 100% at 30% 50%, transparent 40%, rgba(255, 30, 10, .45)); opacity: 1; transition: none; }
  #flashScreen.ice { background: rgba(200, 240, 255, .6); opacity: 1; transition: none; }

  /* ---------- top bar ---------- */
  #top { position: fixed; top: 0; left: 0; right: 0; height: 52px; padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 60px; display: flex; align-items: center; gap: 8px; z-index: 20; pointer-events: none;
    background: linear-gradient(180deg, rgba(6, 3, 6, .85), rgba(6, 3, 6, 0)); }
  #top > * { pointer-events: auto; }
  .tb-title { font: 700 18px/1 var(--T); letter-spacing: .12em; color: var(--gold); text-shadow: 0 2px 10px #000; margin-right: 6px; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px 0 8px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); font: 800 16px/1 var(--B); white-space: nowrap; }
  .pill .ic { width: 20px; height: 20px; }
  .pill.depth { font: 700 13px/1 var(--T); letter-spacing: .05em; color: var(--ink2); }
  #charms { display: flex; gap: 2px; flex-wrap: nowrap; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; padding: 2px; }
  #charms::-webkit-scrollbar { display: none; }
  .charm { width: 34px; height: 34px; flex: none; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a2a1e, #120a08); box-shadow: inset 0 0 0 1.5px rgba(242, 196, 90, .45); display: grid; place-items: center; cursor: help; position: relative; }
  .charm img { width: 26px; height: 26px; }
  .charm b { position: absolute; right: -2px; bottom: -3px; font: 800 11px/1 var(--B); background: #000; border-radius: 6px; padding: 1px 3px; }
  .charm.flash { animation: charmFlash .8s; }
  @keyframes charmFlash { 30% { transform: scale(1.35); box-shadow: 0 0 18px 4px rgba(255, 220, 120, .9), inset 0 0 0 2px #fff; } }
  .hbtn { height: 36px; min-width: 36px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font: 800 15px/1 var(--B); flex: none; }
  .hbtn:hover { background: rgba(60, 36, 24, .85); }
  .hbtn img { width: 22px; height: 22px; }
  @media (max-width: 640px) { .tb-title { display: none; } .pill.depth { display: none; } #top { gap: 5px; padding-left: 58px; } .pill { padding: 0 8px 0 6px; font-size: 15px; } .hbtn { padding: 0 7px; } }

  /* ---------- the battle ---------- */
  #battleHud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #battleHud > * { position: absolute; left: 0; top: 0; }
  .plate { position: absolute; left: 0; top: 0; min-width: 104px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: opacity .5s; }
  .plate.gone { opacity: 0; }
  .pname { font: 700 13px/1.1 var(--T); color: #ffe2d0; text-shadow: 0 1px 4px #000, 0 0 8px #000; white-space: nowrap; text-align: center; letter-spacing: .02em; }
  .pname .traits { display: block; font: italic 600 11.5px/1.2 var(--B); color: #ffb08a; letter-spacing: 0; }
  .pname .draws { font: 900 9px/1 var(--B); color: #ff8a5a; letter-spacing: 1px; vertical-align: 2px; }
  .bar { position: relative; width: 112px; height: 15px; border-radius: 8px; background: #1a0606; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .8), 0 2px 6px rgba(0, 0, 0, .6); overflow: visible; }
  .plate.angel .bar { width: 136px; }
  .bar .fill, .bar .lag { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; transition: width .25s; }
  .bar .lag { background: #ffcf8a; transition: width .6s .1s; }
  .bar .fill { background: linear-gradient(180deg, #ff6a4a, #b01a10); }
  .plate.angel .bar .fill { background: linear-gradient(180deg, #ffe58a, #d08a1a); }
  .bar .hp { position: absolute; inset: 0; display: grid; place-items: center; font: 800 12px/1 var(--B); color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  .bar .ward { position: absolute; left: -18px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; }
  .bar .ward img { width: 28px; height: 28px; filter: drop-shadow(0 0 4px rgba(120, 200, 255, .8)); }
  .bar .ward b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 12px/1 var(--B); color: #fff; text-shadow: 0 1px 2px #000; }
  .plate.warded .bar { box-shadow: 0 0 0 2px #7fc8ff, 0 0 10px rgba(127, 200, 255, .7); }
  .plate.warded .bar .fill { background: linear-gradient(180deg, #a8d8ff, #3a7ab8); }
  .sts { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 160px; }
  .st { position: relative; display: inline-flex; align-items: center; }
  .st img { width: 22px; height: 22px; filter: drop-shadow(0 1px 2px #000); }
  .st b { position: absolute; right: -4px; bottom: -3px; font: 900 11px/1 var(--B); color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .plate.hoarding::after { content: attr(data-hoard); font: 800 11px/1 var(--B); color: #ffd86a; background: rgba(0, 0, 0, .6); padding: 2px 6px; border-radius: 6px; }
  .intent { position: absolute; left: 0; top: 0; display: flex; gap: 4px; pointer-events: none; }
  .chips { display: inline-flex; gap: 2px; padding: 2px 5px; border-radius: 999px; background: rgba(20, 4, 4, .82); box-shadow: inset 0 0 0 1px rgba(255, 110, 70, .5); }
  .chips.up { box-shadow: inset 0 0 0 1px rgba(200, 168, 255, .6); }
  .chip { display: inline-flex; align-items: center; gap: 1px; font: 900 14px/1 var(--B); color: #fff; }
  .chip img { width: 17px; height: 17px; }
  .chip.atk b { color: #ffb4a0; } .chip.holy b { color: #ffe58a; } .chip.def b { color: #a8d8ff; } .chip.heal b { color: #a8ffb4; } .chip.none { color: var(--ink3); padding: 0 4px; }
  #seenLabels > div { position: absolute; left: 0; top: 0; font: 800 11px/1 var(--B); padding: 3px 6px; border-radius: 6px; white-space: nowrap; }
  .seen.demon { background: rgba(120, 16, 10, .9); color: #ffd8c8; }
  .seen.you { background: rgba(30, 60, 100, .9); color: #d8ecff; }
  .pilelabel { position: absolute; font: 800 12px/1 var(--B); color: var(--ink2); background: rgba(10, 4, 6, .7); padding: 3px 8px; border-radius: 8px; white-space: nowrap; pointer-events: auto; cursor: pointer; }
  .pilelabel b { color: var(--ink); font-size: 13px; }
  .aiming .pilelabel, .aiming #seenLabels { opacity: 0; }
  .pilelabel, #seenLabels { transition: opacity .2s; }
  #grace { position: absolute; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; align-content: center;
    background: radial-gradient(circle at 38% 32%, #ffffff, #bfe7ff 30%, #3a84c8 70%, #123a6a); box-shadow: 0 0 0 3px #e2b04a, 0 0 0 5px rgba(0, 0, 0, .6), 0 0 26px 6px rgba(140, 200, 255, .5); }
  #grace b { font: 900 30px/1 var(--T); color: #fff; text-shadow: 0 2px 4px #0a2a50, 0 0 3px #0a2a50; }
  #grace small { position: absolute; right: 9px; bottom: 15px; font: 800 13px/1 var(--B); color: #e8f6ff; text-shadow: 0 1px 2px #0a2a50; }
  #grace span { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font: 700 11px/1 var(--T); letter-spacing: .12em; color: var(--gold); text-shadow: 0 1px 3px #000; }
  #grace::before { content: ''; position: absolute; left: 50%; top: -9px; width: 40px; height: 11px; transform: translateX(-50%); border-radius: 50%; border: 3px solid rgba(255, 236, 170, .95); box-shadow: 0 0 10px rgba(255, 230, 150, .9); }
  #grace.empty { filter: grayscale(.8) brightness(.6); }
  #grace.pop { animation: pop .45s; }
  @keyframes pop { 40% { transform: var(--t, none) scale(1.2); } }
  #endTurn { position: absolute; height: 48px; padding: 0 20px; border: 0; border-radius: 12px; pointer-events: auto; cursor: pointer; font: 900 16px/1 var(--T); letter-spacing: .06em; color: #2a1600;
    background: linear-gradient(180deg, #ffe9a0, #e0a83a 60%, #a8701a); box-shadow: 0 6px 20px -6px rgba(255, 200, 90, .8), inset 0 1px 0 rgba(255, 255, 255, .7), 0 0 0 2px rgba(0, 0, 0, .5); white-space: nowrap; transition: filter .2s, opacity .2s; }
  #endTurn:disabled { filter: grayscale(1) brightness(.55); cursor: default; }
  #endTurn.ready { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 6px 28px -2px rgba(255, 210, 110, 1), inset 0 1px 0 rgba(255, 255, 255, .7), 0 0 0 2px rgba(0, 0, 0, .5); } }
  #prompt { left: 50% !important; top: 64px !important; transform: translateX(-50%); max-width: min(560px, calc(100% - 24px)); padding: 10px 18px; border-radius: 12px; background: rgba(10, 6, 20, .9); box-shadow: inset 0 0 0 1px rgba(160, 210, 255, .55), 0 8px 30px rgba(0, 0, 0, .6); font: 600 16px/1.3 var(--B); text-align: center; }
  #prompt em, #tip em { font-style: normal; font-weight: 800; color: var(--gold); }
  #prompt b, #tip b { font-weight: 900; }
  #foreseeDone { left: 50% !important; top: auto !important; bottom: 34%; transform: translateX(-50%); height: 46px; padding: 0 30px; border: 0; border-radius: 12px; cursor: pointer; pointer-events: auto; font: 900 16px/1 var(--T); color: #102030; background: linear-gradient(180deg, #e8f6ff, #8fc8f0); box-shadow: 0 8px 24px -8px rgba(140, 200, 255, .9); }
  #arrow { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .12s; overflow: visible; }
  #arrow.on { opacity: 1; }
  #arrow #arrowPath { fill: none; stroke: #ffc65a; stroke-width: 11; stroke-linecap: round; stroke-dasharray: 16 10; animation: dash .45s linear infinite; filter: drop-shadow(0 0 8px rgba(255, 200, 100, .95)); }
  #arrow #arrowCore { fill: none; stroke: rgba(255, 255, 255, .85); stroke-width: 3; stroke-linecap: round; }
  #arrow.hot #arrowPath { stroke-width: 13; filter: drop-shadow(0 0 12px rgba(255, 120, 60, 1)); }
  #arrow #arrowHead { fill: #fff3c4; filter: drop-shadow(0 0 6px rgba(255, 210, 120, 1)); }
  @keyframes dash { to { stroke-dashoffset: -26; } }
  #reticle { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px dashed rgba(255, 230, 160, .9); opacity: 0; transition: opacity .15s; animation: spin 3s linear infinite; }
  #reticle.on { opacity: 1; }
  @keyframes spin { to { rotate: 360deg; } }
  #round { left: auto !important; right: max(12px, env(safe-area-inset-right)); top: 58px !important; font: 700 12px/1 var(--T); letter-spacing: .1em; color: var(--ink3); }
  #floaters { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
  .floater { position: absolute; transform: translate(-50%, -50%); font: 900 30px/1 var(--T); color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0, 0, 0, .9); white-space: nowrap; animation: floatUp 1.4s cubic-bezier(.2, .7, .3, 1) forwards; }
  .floater.big { font-size: 46px; } .floater.small { font-size: 18px; font-family: var(--B); font-weight: 800; }
  .floater.hurt { color: #ff6a4a; } .floater.dmg { color: #fff2d8; } .floater.heal { color: #8fffa8; } .floater.ward { color: #a8d8ff; font-size: 24px; } .floater.blocked { color: #a8d8ff; }
  .floater.holy { color: #ffe58a; } .floater.demon { color: #ff9a7a; } .floater.say { font: 800 20px/1 var(--B); font-style: italic; }
  .floater.status { color: #ffd0b0; } .floater.status.faith, .floater.status.thorns { color: #c8ffc8; }
  .floater .ic { width: .8em; height: .8em; }
  @keyframes floatUp { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 12% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 30% { transform: translate(-50%, -70%) scale(1); } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -170%) scale(.9); opacity: 0; } }
  #banner { position: fixed; left: 0; right: 0; top: 34%; z-index: 14; pointer-events: none; text-align: center; opacity: 0; }
  #banner .bt { display: inline-block; font: 900 clamp(30px, 6vw, 56px)/1 var(--T); letter-spacing: .08em; padding: 14px 60px; color: #fff3c4;
    background: linear-gradient(90deg, transparent, rgba(10, 6, 4, .75) 20%, rgba(10, 6, 4, .75) 80%, transparent); text-shadow: 0 0 24px rgba(255, 200, 100, .7), 0 2px 0 #000; }
  #banner.demon .bt { color: #ffb4a0; text-shadow: 0 0 24px rgba(255, 60, 30, .8), 0 2px 0 #000; }
  #banner .bs { font: italic 600 16px/1.2 var(--B); color: var(--ink2); margin-top: 6px; text-shadow: 0 1px 4px #000; }
  #banner.show { animation: bannerIn 1.2s ease both; }
  #banner.hide { animation: bannerOut .4s ease both; }
  @keyframes bannerIn { 0% { opacity: 0; transform: scaleX(.6); } 15% { opacity: 1; transform: none; } 100% { opacity: 1; } }
  @keyframes bannerOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-14px); } }
  #tip { position: fixed; left: 0; top: 0; z-index: 30; max-width: 280px; padding: 10px 12px; border-radius: 10px; background: rgba(14, 8, 10, .94); box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, .7); font: 500 14px/1.32 var(--B); pointer-events: none; }
  #tip .kw { margin-top: 5px; color: var(--ink2); } #tip .kw b { color: var(--gold); }
  #tip .kw.dim { color: var(--ink3); font-style: italic; }
  #tip .tt-rev, #tip .tt-held { color: #ffd2c0; } #tip .tt-rev span { color: #ff9a7a; font-weight: 800; }
  #tip .tt-name { font: 700 16px/1.2 var(--T); color: #ffe2d0; } #tip .tt-name small { display: block; font: italic 500 13px/1.2 var(--B); color: var(--ink3); }
  #tip b.up { color: #8fffa8; } #tip b.down { color: #ff8a7a; }

  /* ---------- screens ---------- */
  #screen { position: fixed; inset: 0; z-index: 15; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #screen.dim { background: radial-gradient(120% 100% at 50% 30%, rgba(20, 8, 10, .82), rgba(4, 2, 4, .96)); backdrop-filter: blur(3px); }
  .scr { min-height: 100%; box-sizing: border-box; padding: 70px 16px 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .scr h1 { margin: 0; font: 900 clamp(30px, 6vw, 52px)/1.05 var(--T); letter-spacing: .06em; color: var(--heaven); text-shadow: 0 0 30px rgba(255, 190, 90, .5), 0 3px 0 #000; }
  .scr h2 { margin: 0; font: 700 clamp(20px, 3.4vw, 28px)/1.15 var(--T); color: var(--gold); letter-spacing: .04em; text-shadow: 0 2px 10px #000; }
  .scr p { margin: 0; max-width: 560px; color: var(--ink2); font-size: 17px; }
  .scr .lede { font: italic 500 18px/1.4 var(--B); color: var(--ink2); max-width: 520px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; cursor: pointer; font: 800 17px/1.1 var(--B); transition: transform .1s, filter .15s; }
  .btn:active { transform: translateY(1px); }
  .btn.gold { color: #2a1600; background: linear-gradient(180deg, #ffe9a0, #e0a83a 60%, #b07a1c); box-shadow: 0 8px 26px -8px rgba(255, 200, 90, .8), inset 0 1px 0 rgba(255, 255, 255, .7); font-family: var(--T); font-weight: 900; letter-spacing: .04em; }
  .btn.ghost { color: var(--ink); background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.ghost:hover, .btn.gold:hover { filter: brightness(1.1); }
  .btn.glassy { background: rgba(14, 8, 10, .82); }
  .titlebox { margin-top: 3vh !important; }
  .btn:disabled { opacity: .45; cursor: default; filter: grayscale(.6); }
  .btn small { font-weight: 600; opacity: .8; font-size: 14px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(520px, 100%); }
  /* a card on the page */
  .pcard { position: relative; width: var(--w, 170px); aspect-ratio: 5 / 7; perspective: 700px; cursor: pointer; flex: none; transition: transform .2s; }
  .pcard .in { position: absolute; inset: 0; border-radius: 6%; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .15s; box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .9); transform-style: preserve-3d; }
  .pcard canvas { width: 100%; height: 100%; border-radius: 6%; display: block; }
  .pcard .sheen { position: absolute; inset: 0; border-radius: 6%; pointer-events: none; mix-blend-mode: overlay; background: radial-gradient(60% 40% at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, .5), transparent 60%); opacity: 0; transition: opacity .2s; }
  .pcard.rare .sheen { mix-blend-mode: color-dodge; background: linear-gradient(115deg, transparent 20%, rgba(255, 120, 200, .35) 35%, rgba(120, 255, 220, .35) 50%, rgba(255, 240, 120, .35) 65%, transparent 80%); background-size: 220% 220%; background-position: var(--mx, 50%) var(--my, 50%); }
  .pcard:hover .sheen { opacity: 1; }
  .pcard:hover { transform: translateY(-6px) scale(1.04); z-index: 2; }
  .pcard.picked .in { box-shadow: 0 0 0 3px var(--gold), 0 0 30px rgba(255, 210, 110, .8); }
  .pcard .flip { position: absolute; right: -8px; top: -8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 900 16px/1 var(--B); color: #ffd8c8; cursor: pointer; border: 0; background: radial-gradient(circle at 40% 35%, #8a1a10, #2a0404); box-shadow: 0 0 0 1.5px rgba(255, 140, 100, .7), 0 4px 10px rgba(0, 0, 0, .6); z-index: 3; }
  .pcard .flip:hover { filter: brightness(1.3); }
  .pcard.turned .in { transform: rotateZ(180deg); }
  .pcard .price { position: absolute; left: 50%; bottom: -28px; transform: translateX(-50%); font: 900 17px/1 var(--B); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .pcard .price.sale { color: #8fffa8; }
  .pcard .price.poor { color: #ff7a6a; }
  .pcard.sold { opacity: .25; pointer-events: none; }
  .cards-row { display: flex; gap: clamp(8px, 2vw, 22px); justify-content: center; flex-wrap: wrap; padding: 10px 0 36px; }
  .deckgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--w, 130px), 1fr)); gap: 14px 10px; width: min(1100px, 100%); justify-items: center; }
  .notice { font: italic 600 15px/1.3 var(--B); color: #ffb49a; }
  .charmcard { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 14px; background: rgba(30, 16, 12, .8); box-shadow: inset 0 0 0 1px var(--line); max-width: 460px; }
  .charmcard > img { width: 56px; height: 56px; flex: none; filter: drop-shadow(0 0 10px rgba(255, 210, 120, .5)); }
  .charmcard .price img { width: 18px; height: 18px; vertical-align: -3px; }
  .charmrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: min(980px, 100%); }
  .charmrow .charmcard { flex: 1 1 280px; max-width: 320px; }
  .charmcard b { font: 700 18px/1.1 var(--T); color: var(--gold); display: block; margin-bottom: 3px; }
  .charmcard span { color: var(--ink2); font-size: 15px; }
  .charmcard.buy { cursor: pointer; }
  .charmcard.buy:hover { background: rgba(60, 30, 18, .9); }
  .reward { display: flex; align-items: center; gap: 12px; width: min(420px, 100%); padding: 12px 16px; border-radius: 12px; background: rgba(30, 16, 12, .8); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; font: 700 18px/1.2 var(--B); text-align: left; border: 0; color: var(--ink); }
  .reward img { width: 36px; height: 36px; }
  .reward:hover { background: rgba(60, 30, 18, .9); }
  .reward.taken { opacity: .35; pointer-events: none; }
