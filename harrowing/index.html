<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Harrowing</title>
<meta name="description" content="A deckbuilder where you share one deck with the demons: every card you add, they can draw too.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500&display=swap" rel="stylesheet">
<style>
  /* One look for everything on the page: printed placards of black paper ruled in gilt, ivory type, the odd
     ivory ticket for what you press. No gloss, no gradients: the scene behind is the only thing that glows. */
  :root { --paper: #0d0a0b; --paper2: #1a1312; --bone: #f1e7d0; --ink: var(--bone); --ink2: rgba(241, 231, 208, .74); --ink3: rgba(241, 231, 208, .46);
    --gilt: #caa45c; --gilt2: #ead08e; --rule: rgba(202, 164, 92, .55); --rule2: rgba(202, 164, 92, .22); --ember: #e2643c; --blood: #a02a1c; --sky: #a8cde6; --gold: var(--gilt2);
    --T: "IM Fell English SC", "IM Fell English", Georgia, serif; --I: "IM Fell English", Georgia, serif; --B: "Alegreya Sans", "Gill Sans", system-ui, sans-serif;
    --placard: var(--paper); --frame: inset 0 0 0 1px var(--rule), inset 0 0 0 4px var(--paper), inset 0 0 0 5px var(--rule2); }
  html, body { height: 100%; margin: 0; }
  body { background: #07050a; color: var(--ink); font: 500 16px/1.35 var(--B); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -.2em; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 42%, transparent 58%, rgba(0, 0, 0, .6) 100%); }
  #flashScreen { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; }
  #flashScreen.hurt { background: radial-gradient(100% 100% at 30% 50%, transparent 40%, rgba(200, 30, 10, .45)); opacity: 1; transition: none; }
  #flashScreen.ice { background: rgba(220, 240, 255, .55); opacity: 1; transition: none; }

  /* ---------- top bar: a strip of black paper with a gilt rule ---------- */
  #top { position: fixed; top: 0; left: 0; right: 0; height: 50px; padding: max(0px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 60px; display: flex; align-items: center; gap: 6px; z-index: 20; pointer-events: none;
    background: var(--paper); box-shadow: 0 1px 0 var(--rule), 0 4px 0 var(--paper), 0 5px 0 var(--rule2), 0 10px 24px rgba(0, 0, 0, .45); }
  #top > * { pointer-events: auto; }
  .tb-title { font: 400 21px/1 var(--T); letter-spacing: .1em; color: var(--gilt2); margin-right: 8px; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 6px; font: 800 16px/1 var(--B); white-space: nowrap; position: relative; }
  .pill + .pill::before, .pill.hp::before { content: ''; }
  .pill::after { content: ''; position: absolute; right: -4px; top: 50%; width: 5px; height: 5px; background: var(--gilt); transform: translateY(-50%) rotate(45deg); opacity: .7; }
  .pill .ic { width: 20px; height: 20px; }
  .pill.depth { font: 400 15px/1 var(--T); letter-spacing: .06em; color: var(--ink2); }
  .pill.depth::after { display: none; }
  #charms { display: flex; gap: 3px; flex-wrap: nowrap; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; padding: 2px 2px 2px 8px; }
  #charms::-webkit-scrollbar { display: none; }
  .charm { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--paper2); box-shadow: inset 0 0 0 1px var(--rule); display: grid; place-items: center; cursor: help; position: relative; }
  .charm img { width: 24px; height: 24px; }
  .charm b { position: absolute; right: -2px; bottom: -3px; font: 800 11px/1 var(--B); background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule); padding: 1px 3px; }
  .charm.flash { animation: charmFlash .8s; }
  @keyframes charmFlash { 30% { transform: scale(1.35); box-shadow: 0 0 0 2px var(--gilt2), 0 0 18px 4px rgba(234, 208, 142, .8); } }
  .hbtn { height: 34px; min-width: 34px; padding: 0 9px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--rule2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font: 800 15px/1 var(--B); flex: none; }
  .hbtn:hover { box-shadow: inset 0 0 0 1px var(--rule); background: var(--paper2); }
  .hbtn img { width: 22px; height: 22px; }
  @media (max-width: 640px) { .tb-title { display: none; } .pill.depth { display: none; } #top { gap: 4px; padding-left: 58px; } .pill { padding: 0 8px 0 4px; font-size: 15px; } .hbtn { padding: 0 6px; } }

  /* ---------- the battle ---------- */
  #battleHud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #battleHud > * { position: absolute; left: 0; top: 0; }
  .plate { position: absolute; left: 0; top: 0; min-width: 104px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: opacity .5s; }
  .plate.gone { opacity: 0; }
  .pname { font: 400 15px/1.05 var(--T); color: var(--bone); text-shadow: 0 1px 2px #000, 0 0 8px #000, 0 0 14px rgba(0, 0, 0, .8); white-space: nowrap; text-align: center; letter-spacing: .03em; }
  .pname .traits { display: block; font: italic 400 13px/1.2 var(--I); color: var(--gilt2); letter-spacing: 0; }
  .pname .draws { font: 900 9px/1 var(--B); color: var(--ember); letter-spacing: 1px; vertical-align: 2px; }
  .bar { position: relative; width: 112px; height: 13px; background: var(--paper); box-shadow: 0 0 0 1px var(--rule), 0 2px 8px rgba(0, 0, 0, .6); overflow: visible; }
  .plate.angel .bar { width: 136px; }
  .bar .fill, .bar .lag { position: absolute; left: 0; top: 0; bottom: 0; transition: width .25s; }
  .bar .lag { background: var(--bone); opacity: .55; transition: width .6s .1s; }
  .bar .fill { background: var(--blood); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); }
  .plate.angel .bar .fill { background: var(--gilt); }
  .bar .hp { position: absolute; inset: 0; display: grid; place-items: center; font: 800 11.5px/1 var(--B); color: #fff; letter-spacing: .02em; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  .bar .ward { position: absolute; left: -19px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; }
  .bar .ward img { width: 28px; height: 28px; filter: drop-shadow(0 1px 2px #000); }
  .bar .ward b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 12px/1 var(--B); color: var(--paper); }
  .plate.warded .bar { box-shadow: 0 0 0 1px var(--sky), 0 0 10px rgba(168, 205, 230, .5); }
  .plate.warded .bar .fill { background: #5f8fb4; }
  .sts { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 160px; }
  .st { position: relative; display: inline-flex; align-items: center; }
  .st img { width: 22px; height: 22px; filter: drop-shadow(0 1px 1px #000); }
  .st b { position: absolute; right: -4px; bottom: -3px; font: 900 11px/1 var(--B); color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .plate.hoarding::after { content: attr(data-hoard); font: 800 11px/1 var(--B); color: var(--gilt2); background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule2); padding: 3px 6px; }
  .intent { position: absolute; left: 0; top: 0; display: flex; gap: 4px; pointer-events: none; }
  .chips { display: inline-flex; gap: 3px; padding: 3px 6px; background: var(--paper); box-shadow: inset 0 0 0 1px rgba(226, 100, 60, .6); }
  .chips.up { box-shadow: inset 0 0 0 1px rgba(190, 170, 240, .65); }
  .chip { display: inline-flex; align-items: center; gap: 1px; font: 900 14px/1 var(--B); color: #fff; }
  .chip img { width: 17px; height: 17px; }
  .chip.atk b { color: #f6b19a; } .chip.holy b { color: var(--gilt2); } .chip.def b { color: var(--sky); } .chip.heal b { color: #b4e4a8; } .chip.none { color: var(--ink3); padding: 0 4px; }
  #seenLabels > div { position: absolute; left: 0; top: 0; font: 400 12px/1 var(--T); letter-spacing: .03em; padding: 4px 7px 3px; white-space: nowrap; }
  .seen.demon { background: var(--paper); color: #f6b19a; box-shadow: inset 0 0 0 1px rgba(226, 100, 60, .7); }
  .seen.you { background: var(--paper); color: var(--sky); box-shadow: inset 0 0 0 1px rgba(168, 205, 230, .7); }
  .pilelabel { position: absolute; font: 400 13px/1 var(--T); letter-spacing: .03em; color: var(--ink2); background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule2); padding: 5px 9px 4px; white-space: nowrap; pointer-events: auto; cursor: pointer; }
  .pilelabel b { color: var(--bone); font: 800 13px/1 var(--B); }
  .aiming .pilelabel, .aiming #seenLabels { opacity: 0; }
  .pilelabel, #seenLabels { transition: opacity .2s; }
  /* grace: a gilt sunburst around an ivory disc */
  #grace { position: absolute; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: var(--bone); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--gilt), 0 0 30px 6px rgba(234, 208, 142, .35); }
  #grace::before { content: ''; position: absolute; inset: -17px; border-radius: 50%; z-index: -1; background: repeating-conic-gradient(var(--gilt) 0 4deg, transparent 4deg 15deg); -webkit-mask: radial-gradient(circle, transparent 52%, #000 53%, #000 70%, transparent 71%); mask: radial-gradient(circle, transparent 52%, #000 53%, #000 70%, transparent 71%); animation: spin 40s linear infinite; }
  #grace b { font: 900 32px/1 var(--B); color: var(--paper); margin-top: -1px; }
  #grace small { position: absolute; right: 12px; bottom: 15px; font: 800 12px/1 var(--B); color: rgba(13, 10, 11, .65); }
  #grace span { position: absolute; bottom: -27px; left: 50%; transform: translateX(-50%); font: 400 14px/1 var(--T); letter-spacing: .14em; color: var(--gilt2); text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #grace.empty { background: var(--paper2); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--rule2); }
  #grace.empty b { color: var(--ink3); } #grace.empty small { color: var(--ink3); } #grace.empty::before { opacity: .25; }
  #grace.pop { animation: pop .45s; }
  @keyframes pop { 40% { transform: var(--t, none) scale(1.2); } }
  /* the ivory ticket you press */
  #endTurn { position: absolute; height: 50px; padding: 0 22px; border: 0; pointer-events: auto; cursor: pointer; font: 400 21px/1 var(--T); letter-spacing: .05em; color: var(--paper);
    background: var(--bone); box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 3px var(--bone), inset 0 0 0 4px rgba(13, 10, 11, .45), 0 0 0 1px var(--gilt), 0 8px 22px -6px rgba(0, 0, 0, .9); white-space: nowrap; transition: filter .2s, opacity .2s, background .2s; }
  #endTurn:hover:not(:disabled) { background: #fff8e6; }
  #endTurn:disabled { background: var(--paper2); color: var(--ink3); box-shadow: inset 0 0 0 1px var(--rule2), 0 0 0 1px var(--paper); cursor: default; }
  #endTurn.ready { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 3px var(--bone), inset 0 0 0 4px rgba(13, 10, 11, .45), 0 0 0 1px var(--gilt2), 0 0 28px 4px rgba(234, 208, 142, .6); } }
  #prompt { left: 50% !important; top: 64px !important; transform: translateX(-50%); max-width: min(560px, calc(100% - 24px)); padding: 11px 20px; background: var(--paper); box-shadow: var(--frame), 0 8px 30px rgba(0, 0, 0, .6); font: 600 16px/1.3 var(--B); text-align: center; }
  #prompt em, #tip em { font-style: normal; font-weight: 800; color: var(--gilt2); }
  #prompt b, #tip b { font-weight: 900; }
  #foreseeDone { left: 50% !important; top: auto !important; bottom: 34%; transform: translateX(-50%); height: 46px; padding: 0 30px; border: 0; cursor: pointer; pointer-events: auto; font: 400 20px/1 var(--T); color: var(--paper); background: var(--bone); box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 3px var(--bone), inset 0 0 0 4px rgba(13, 10, 11, .45), 0 0 0 1px var(--gilt), 0 8px 24px -8px #000; }
  #arrow { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .12s; overflow: visible; }
  #arrow.on { opacity: 1; }
  #arrow #arrowPath { fill: none; stroke: var(--gilt2); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 2 13; animation: dash .45s linear infinite; filter: drop-shadow(0 0 3px rgba(0, 0, 0, .9)); }
  #arrow #arrowCore { fill: none; stroke: rgba(241, 231, 208, .35); stroke-width: 1.5; stroke-linecap: round; }
  #arrow.hot #arrowPath { stroke: #fff4d6; stroke-width: 9; filter: drop-shadow(0 0 8px rgba(255, 200, 120, .9)); }
  #arrow #arrowHead { fill: var(--bone); stroke: var(--paper); stroke-width: 2; filter: drop-shadow(0 0 4px rgba(0, 0, 0, .8)); }
  @keyframes dash { to { stroke-dashoffset: -15; } }
  #reticle { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 1.5px dashed rgba(234, 208, 142, .9); opacity: 0; transition: opacity .15s; animation: spin 3s linear infinite; }
  #reticle.on { opacity: 1; }
  @keyframes spin { to { rotate: 360deg; } }
  #round { left: auto !important; right: max(12px, env(safe-area-inset-right)); top: 60px !important; font: 400 14px/1 var(--T); letter-spacing: .12em; color: var(--ink2); text-shadow: 0 1px 4px #000; }
  #floaters { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
  .floater { position: absolute; transform: translate(-50%, -50%); font: 900 32px/1 var(--B); color: #fff; -webkit-text-stroke: 1px rgba(0, 0, 0, .55); text-shadow: 0 2px 0 #000, 0 0 12px rgba(0, 0, 0, .9); white-space: nowrap; animation: floatUp 1.4s cubic-bezier(.2, .7, .3, 1) forwards; }
  .floater.big { font-size: 48px; } .floater.small { font-size: 18px; font-family: var(--B); font-weight: 800; }
  .floater.hurt { color: #ff7e5c; } .floater.dmg { color: #fff4dc; } .floater.heal { color: #b4e8a8; } .floater.ward { color: var(--sky); font-size: 24px; } .floater.blocked { color: var(--sky); }
  .floater.holy { color: var(--gilt2); } .floater.demon { color: #f6a88c; } .floater.say { font: italic 400 22px/1 var(--I); -webkit-text-stroke: 0; }
  .floater.status { color: #f6d2b8; } .floater.status.faith, .floater.status.thorns { color: #c8ecc0; }
  .floater .ic { width: .8em; height: .8em; }
  @keyframes floatUp { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 12% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 30% { transform: translate(-50%, -70%) scale(1); } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -170%) scale(.9); opacity: 0; } }
  /* the turn banner: a band of black paper between two gilt rules */
  #banner { position: fixed; left: 0; right: 0; top: 34%; z-index: 14; pointer-events: none; text-align: center; opacity: 0; }
  #banner .bt { display: block; font: 400 clamp(32px, 6vw, 58px)/1 var(--T); letter-spacing: .1em; padding: 16px 20px 13px; color: var(--bone); background: rgba(13, 10, 11, .9);
    box-shadow: 0 -1px 0 var(--rule), 0 -5px 0 rgba(13, 10, 11, .9), 0 -6px 0 var(--rule2), 0 1px 0 var(--rule), 0 5px 0 rgba(13, 10, 11, .9), 0 6px 0 var(--rule2); }
  #banner.demon .bt { color: #f6b19a; }
  #banner .bs { display: inline-block; font: italic 400 18px/1.2 var(--I); color: var(--ink2); margin-top: 12px; text-shadow: 0 1px 4px #000, 0 0 10px #000; }
  #banner.show { animation: bannerIn 1.2s ease both; }
  #banner.hide { animation: bannerOut .4s ease both; }
  @keyframes bannerIn { 0% { opacity: 0; transform: scaleY(.2); } 14% { opacity: 1; transform: none; } 100% { opacity: 1; } }
  @keyframes bannerOut { from { opacity: 1; } to { opacity: 0; transform: scaleY(.6); } }
  #tip { position: fixed; left: 0; top: 0; z-index: 30; max-width: 280px; padding: 11px 13px; background: var(--paper); box-shadow: var(--frame), 0 10px 30px rgba(0, 0, 0, .7); font: 500 14px/1.32 var(--B); pointer-events: none; }
  #tip .kw { margin-top: 5px; color: var(--ink2); } #tip .kw b { color: var(--gilt2); }
  #tip .kw.dim { color: var(--ink3); font-style: italic; }
  #tip .tt-rev, #tip .tt-held { color: #f6d2c0; } #tip .tt-rev span { color: #f6a88c; font-weight: 800; }
  #tip .tt-name { font: 400 18px/1.15 var(--T); color: var(--bone); } #tip .tt-name small { display: block; font: italic 400 14px/1.2 var(--I); color: var(--ink3); }
  #tip b.up { color: #b4e8a8; } #tip b.down { color: #f6a88c; }

  /* ---------- screens ---------- */
  #screen { position: fixed; inset: 0; z-index: 15; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #screen.dim { background: radial-gradient(120% 100% at 50% 30%, rgba(13, 10, 11, .84), rgba(5, 3, 4, .97)); backdrop-filter: blur(3px); }
  .scr { min-height: 100%; box-sizing: border-box; padding: 70px 16px 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .scr h1 { margin: 0; font: 400 clamp(34px, 6.5vw, 58px)/1.02 var(--T); letter-spacing: .06em; color: var(--bone); text-shadow: 0 2px 0 #000, 0 0 30px rgba(0, 0, 0, .7); }
  .scr h2 { margin: 0; font: 400 clamp(24px, 3.8vw, 32px)/1.1 var(--T); color: var(--gilt2); letter-spacing: .05em; text-shadow: 0 2px 10px #000; }
  .scr h1 + .lede, .scr h2 + .lede { position: relative; padding-top: 12px; }
  .scr h1 + .lede::before, .scr h2 + .lede::before { content: '— ✦ —'; display: block; font: 400 12px/1 var(--B); letter-spacing: .3em; color: var(--gilt); margin-bottom: 10px; }
  .scr p { margin: 0; max-width: 560px; color: var(--ink2); font-size: 17px; }
  .scr.veil { background: radial-gradient(70% 45% at 50% 34%, rgba(8, 5, 6, .78), rgba(8, 5, 6, .25) 70%, transparent); }
  .scr .lede { font: italic 400 19px/1.4 var(--I); color: var(--ink2); max-width: 520px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; cursor: pointer; font: 800 17px/1.1 var(--B); transition: transform .1s, filter .15s, background .15s; }
  .btn:active { transform: translateY(1px); }
  .btn.gold { color: var(--paper); background: var(--bone); box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 3px var(--bone), inset 0 0 0 4px rgba(13, 10, 11, .45), 0 0 0 1px var(--gilt), 0 10px 26px -10px #000; font: 400 21px/1.1 var(--T); letter-spacing: .05em; }
  .btn.gold:hover { background: #fff8e6; }
  .btn.ghost { color: var(--ink); background: var(--paper); box-shadow: var(--frame); }
  .btn.ghost:hover { background: var(--paper2); }
  .btn.glassy { background: var(--paper); }
  .titlebox { margin-top: 3vh !important; }
  .btn:disabled { opacity: .45; cursor: default; filter: grayscale(.6); }
  .btn small { font-weight: 600; opacity: .8; font-size: 14px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(520px, 100%); }
  /* a card on the page */
  .pcard { position: relative; width: var(--w, 170px); aspect-ratio: 5 / 7; perspective: 700px; cursor: pointer; flex: none; transition: transform .2s; }
  .pcard .in { position: absolute; inset: 0; border-radius: 5%; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .15s; box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .9); transform-style: preserve-3d; }
  .pcard canvas { width: 100%; height: 100%; border-radius: 5%; display: block; }
  .pcard .sheen { position: absolute; inset: 0; border-radius: 5%; pointer-events: none; mix-blend-mode: soft-light; background: radial-gradient(60% 40% at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, .45), transparent 60%); opacity: 0; transition: opacity .2s; }
  .pcard.rare .sheen { mix-blend-mode: color-dodge; background: linear-gradient(115deg, transparent 25%, rgba(255, 220, 150, .3) 45%, rgba(255, 240, 200, .35) 55%, transparent 75%); background-size: 220% 220%; background-position: var(--mx, 50%) var(--my, 50%); }
  .pcard:hover .sheen { opacity: 1; }
  .pcard:hover { transform: translateY(-6px) scale(1.04); z-index: 2; }
  .pcard.picked .in { box-shadow: 0 0 0 3px var(--gilt2), 0 0 30px rgba(234, 208, 142, .7); }
  .pcard .flip { position: absolute; right: -9px; top: -9px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 0; background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule), 0 4px 10px rgba(0, 0, 0, .6); z-index: 3; }
  .pcard .flip:hover { background: var(--paper2); box-shadow: inset 0 0 0 1px var(--gilt2), 0 4px 10px rgba(0, 0, 0, .6); }
  .pcard.turned .in { transform: rotateZ(180deg); }
  .pcard .price { position: absolute; left: 50%; bottom: -28px; transform: translateX(-50%); font: 900 17px/1 var(--B); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .pcard .price.sale { color: #b4e8a8; }
  .pcard .price.poor { color: #f6866a; }
  .pcard.sold { opacity: .25; pointer-events: none; }
  .cards-row { display: flex; gap: clamp(8px, 2vw, 22px); justify-content: center; flex-wrap: wrap; padding: 10px 0 20px; }
