<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowmoss Hollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --ground:#06050b;
    --line:#1c1936;
    --ink:#7fe6d6;
    --dim:#56608a;
  }
  html,body{height:100%; margin:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Pixelify Sans", ui-monospace, Menlo, monospace;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .stage{position:relative; flex:1; min-height:0}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; outline:none;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
  canvas:focus-visible{box-shadow:inset 0 0 0 2px rgba(127,230,214,.5)}
  .bar{box-sizing:border-box; width:100%; margin:0 auto; display:flex; align-items:baseline; gap:4px 14px; flex-wrap:wrap;
    padding:2px 16px max(16px, env(safe-area-inset-bottom)); transition:max-width .9s ease}
  .title{font-family:"Silkscreen", ui-monospace, Menlo, monospace; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink)}
  .count{font-size:13px; color:var(--dim)}
  .out{font:inherit; font-size:13px; color:var(--ink); background:none; border:1px solid var(--line); border-radius:999px; padding:1px 10px 2px; cursor:pointer;
    transition:border-color .2s, background-color .2s}
  .out:hover{border-color:#3a3670; background:rgba(127,230,214,.06)}
  .out:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .out[hidden]{display:none}
  .cap{margin-left:auto; font-size:15px; color:var(--dim); transition:color .8s ease; text-align:right}
  .cap.on{color:var(--ink)}
  .cap.hint{color:#8f86c8}
  @media (max-width: 520px){ .cap{margin-left:0; width:100%; text-align:left} }
  @media (prefers-reduced-motion: reduce){ .cap, .bar{transition:none} }
</style>
<main style="display:contents">
  <div class="stage" id="stage">
    <canvas id="world" tabindex="0" role="img" aria-label="Nine pixel-art places with glowing plants and small animals, starting from a cave. Click a creature to wake it, click the glowing crack or gap in a place to open the way to the next one, and click or scroll to zoom in on a place. Keys: arrows move between places, Space wakes a creature, N opens the next passage, Escape zooms out."></canvas>
  </div>
  <div class="bar" id="bar">
    <span class="title" id="place">Glowmoss Hollow</span>
    <span class="count" id="count"></span>
    <button class="out" id="out" type="button" hidden>See every place</button>
    <span class="cap" id="cap" aria-live="polite">The hollow is quiet</span>
  </div>
</main>
<script src="engine.js"></script>
<script src="scenes/hollow.js"></script>
<script src="scenes/wood.js"></script>
<script src="scenes/peaks.js"></script>
<script src="scenes/barrens.js"></script>
<script src="scenes/grove.js"></script>
<script src="scenes/dunes.js"></script>
<script src="scenes/deep.js"></script>
<script src="scenes/reef.js"></script>
<script src="scenes/bayou.js"></script>
<script src="world.js"></script>
</html>
