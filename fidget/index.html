<body>
<canvas id="c" tabindex="0" aria-label="A wooden switchboard toy full of switches, buttons and dials. Press Tab to move between controls, then Space or Enter to use one, or the arrow keys to turn a dial."></canvas>
<p class="name">Fidget Board</p>
<button class="sound" id="sound" type="button" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="cross" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/></svg>
  <span id="soundLabel">Sound on</span>
</button>
<p class="hint">Click the switches, buttons and dials. Drag a dial to turn it.</p>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + Math.random() * (b - a);
const ease = (cur, target, dt, speed) => cur + (target - cur) * (1 - Math.exp(-dt * speed));

/* ---------- layout: board units are roughly centimetres; x right, y up, the face at z = 0 ---------- */
const BW = 42, BH = 26, BT = 2.4;
const L = {
  beaconBtn: [-18.3, 10.2], plate: [-8.2, 10.2, 14, 3.8], seg: [1.6, 10.2], frame: [6.0, 10.2], numKnob: [11.4, 10.2], night: [17.6, 10.2],
  toggles: [[-19, 2.6], [-16.4, 2.6], [-13.8, 2.6]], leds: [[-19, 6.0], [-16.4, 6.0], [-13.8, 6.0]],
  gauge: [-6.6, 3.9], radar: [2.2, 3.9], dome: [10.6, 3.9], rocket: [17.7, 0.6, 4.4, 13.2],
  traffic: [-19.3, -2.4], slider: [-16.4, [-6.0, -4.2, -2.4, -0.6]], gaugeKnob: [-6.6, -1.6], bars: [-6.6, -4.6],
  key: [2.2, -1.9], domeRocker: [8.2, -1.9], colorKnob: [12.6, -1.9],
  music: [[-18.6, -9.6], [-15.4, -9.6], [-12.2, -9.6], [-9.0, -9.6]], horn: [-4.6, -9.6], speaker: [-0.6, -9.6],
  fan: [5.2, -9.2], fanRocker: [9.9, -9.6], lever: [14.4, -9.4], reset: [19.0, -10.2],
};
const TRAFFIC_Y = [-0.6, -2.4, -4.2];                       // red, yellow, green lamps
const DOME_COLORS = ['#fff4e0', '#ff4d4d', '#ff9a1f', '#ffe135', '#3ddc6e', '#3aa0ff', '#b56bff'];
const MUSIC = [{ col: '#ff4b4b', f: 523.25 }, { col: '#ffc629', f: 659.25 }, { col: '#3ccf68', f: 783.99 }, { col: '#3d8bff', f: 1046.5 }];

/* ---------- sound: everything is synthesised, nothing is loaded ---------- */
let ac = null, master = null, noiseBuf = null, muted = false;
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.6;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function envelope(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function tone(f, { type = 'sine', dur = 0.25, vol = 0.2, a = 0.005, to = 0, delay = 0 } = {}) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  envelope(g, t, a, vol, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function hiss({ dur = 0.03, vol = 0.2, hp = 2000, lp = 9000, delay = 0 } = {}) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + delay, s = c.createBufferSource(), h = c.createBiquadFilter(), l = c.createBiquadFilter(), g = c.createGain();
  s.buffer = noiseBuf; h.type = 'highpass'; h.frequency.value = hp; l.type = 'lowpass'; l.frequency.value = lp;
  envelope(g, t, 0.002, vol, dur); s.connect(h); h.connect(l); l.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
// A continuous sound whose loudness is set every frame (fan, rocket, horn).
function sustained(build) {
  let n = null;
  return (level, param = 0) => {
    if (!ac || (!n && level < 0.002)) return;
    if (!n) n = build(ac);
    n.gain.gain.setTargetAtTime(Math.max(0, level), ac.currentTime, 0.04);
    if (n.update) n.update(param);
  };
}
const noiseSource = c => { const s = c.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(); return s; };
const fanSound = sustained(c => {
  const f = c.createBiquadFilter(), g = c.createGain(); f.type = 'bandpass'; f.Q.value = 0.8; g.gain.value = 0;
  noiseSource(c).connect(f); f.connect(g); g.connect(master);
  return { gain: g, update: sp => f.frequency.setTargetAtTime(250 + 900 * sp, c.currentTime, 0.1) };
});
const rocketSound = sustained(c => {
  const f = c.createBiquadFilter(), g = c.createGain(); f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = 0;
  noiseSource(c).connect(f); f.connect(g); g.connect(master);
  return { gain: g, update: p => f.frequency.setTargetAtTime(260 + 700 * p, c.currentTime, 0.1) };
});
const hornSound = sustained(c => {
  const f = c.createBiquadFilter(), g = c.createGain(); f.type = 'lowpass'; f.frequency.value = 1500; g.gain.value = 0;
  for (const hz of [370, 466]) { const o = c.createOscillator(); o.type = 'square'; o.frequency.value = hz; o.connect(f); o.start(); }
  f.connect(g); g.connect(master);
  return { gain: g };
});
const SFX = {
  toggle: on => { hiss({ dur: 0.02, vol: 0.5, hp: 3000 }); tone(on ? 2400 : 1900, { type: 'square', dur: 0.012, vol: 0.04 }); },
  rocker: on => { hiss({ dur: 0.035, vol: 0.45, hp: 900, lp: 6000 }); tone(on ? 330 : 262, { type: 'triangle', dur: 0.07, vol: 0.14 }); },
  press: () => hiss({ dur: 0.02, vol: 0.32, hp: 1500, lp: 7000 }),
  tick: () => hiss({ dur: 0.012, vol: 0.28, hp: 4000 }),
  key: on => { hiss({ dur: 0.05, vol: 0.35, hp: 2500 }); tone(on ? 3300 : 2700, { dur: 0.06, vol: 0.05 }); },
  clunk: () => { hiss({ dur: 0.06, vol: 0.4, hp: 300, lp: 3000 }); tone(150, { type: 'triangle', dur: 0.1, vol: 0.2 }); },
  note: f => { tone(f, { dur: 1.0, vol: 0.26, a: 0.004 }); tone(f * 2, { type: 'triangle', dur: 0.4, vol: 0.06 }); tone(f * 4, { dur: 0.12, vol: 0.04 }); },
  ping: () => tone(1318, { dur: 0.55, vol: 0.05 }),
  boing: () => tone(220, { to: 700, dur: 0.3, vol: 0.1, type: 'triangle' }),
  night: on => [0, 1, 2].forEach(i => tone((on ? [784, 587, 392] : [392, 587, 784])[i], { dur: 0.22, vol: 0.12, delay: i * 0.09, type: 'triangle' })),
  launch: () => hiss({ dur: 1.6, vol: 0.25, hp: 400, lp: 2500 }),
  reset: () => [1046, 784, 659, 523, 392].forEach((f, i) => tone(f, { dur: 0.2, vol: 0.13, delay: i * 0.08, type: 'triangle' })),
};
$('sound').addEventListener('click', () => {
  muted = !muted;
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.6, ac.currentTime, 0.02);
  $('sound').setAttribute('aria-pressed', String(!muted));
  $('soundLabel').textContent = muted ? 'Sound off' : 'Sound on';
  $('waves').style.display = muted ? 'none' : ''; $('cross').style.display = muted ? '' : 'none';
});

/* ---------- renderer and a little photo studio ---------- */
await Promise.race([document.fonts.load('700 64px Fredoka'), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
const DAY_BG = new THREE.Color('#cdd6df'), NIGHT_BG = new THREE.Color('#101a2e');
scene.background = DAY_BG.clone();
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose(); }
const camera = new THREE.PerspectiveCamera(30, 1, 1, 1200);
const sun = new THREE.DirectionalLight('#fff6ea', 1.15);
sun.position.set(-26, 62, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -26, near: 10, far: 220 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
sun.target.position.set(0, 12, 0);
scene.add(sun, sun.target);

// A seamless curved backdrop: floor sweeping up into a wall.
{
  const prof = [];
  for (let z = 150; z > -20; z -= 10) prof.push([z, 0]);
  for (let i = 0; i <= 16; i++) { const a = -Math.PI / 2 - i / 16 * Math.PI / 2; prof.push([-20 + 30 * Math.cos(a), 30 + 30 * Math.sin(a)]); }
  for (let y = 50; y <= 250; y += 25) prof.push([-50, y]);
  const pos = [], idx = [], NX = 8, n = prof.length;
  for (let i = 0; i <= NX; i++) { const x = -260 + i / NX * 520; for (const [z, y] of prof) pos.push(x, y, z); }
  for (let i = 0; i < NX; i++) for (let j = 0; j < n - 1; j++) { const a = i * n + j, b = a + n; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  var backdrop = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: '#c3cedb', roughness: 0.95, side: THREE.DoubleSide }));
  backdrop.receiveShadow = true;
  scene.add(backdrop);
}
// Stars that come out on the wall when the lights go off.
const starPts = [];
for (let i = 0; i < 420; i++) starPts.push(rr(-200, 200), rr(34, 170), -49 + rr(0, 0.5));
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPts, 3));
const starMat = new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: true, transparent: true, opacity: 0, depthWrite: false, color: new THREE.Color(3, 3, 3.3),
  map: (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, '#fff'); gr.addColorStop(0.3, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); })() });
scene.add(new THREE.Points(starGeo, starMat));

/* ---------- materials ---------- */
const MAT = {
  chrome: new THREE.MeshStandardMaterial({ color: '#f2f2f4', metalness: 1, roughness: 0.13 }),
  steel: new THREE.MeshStandardMaterial({ color: '#c8cbd0', metalness: 1, roughness: 0.32 }),
  black: new THREE.MeshStandardMaterial({ color: '#1a1a1c', roughness: 0.42 }),
  gloss: new THREE.MeshPhysicalMaterial({ color: '#141416', roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08 }),
  brass: new THREE.MeshStandardMaterial({ color: '#d9b45f', metalness: 1, roughness: 0.24 }),
  white: new THREE.MeshPhysicalMaterial({ color: '#f6f6f2', roughness: 0.3, clearcoat: 0.6 }),
  glass: new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.04, transparent: true, opacity: 0.16, clearcoat: 1, depthWrite: false }),
  hit: new THREE.MeshBasicMaterial({ visible: false }),
};
const plastic = (hex, o = {}) => new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.18, ...o });
// A lamp lens: coloured plastic whose glow is turned up and down each frame.
// `dim` darkens the unlit plastic so switching a lamp on is an obvious change.
const lens = (hex, { dim = 0.38, ...o } = {}) => new THREE.MeshPhysicalMaterial({ color: new THREE.Color(hex).multiplyScalar(dim), roughness: 0.18, clearcoat: 1, emissive: new THREE.Color(hex), emissiveIntensity: 0, ...o });

/* ---------- geometry helpers: everything stands on the board with its axis along +z ---------- */
const G = {
  cyl: (r, h, seg = 32, rTop = r) => new THREE.CylinderGeometry(rTop, r, h, seg).rotateX(Math.PI / 2).translate(0, 0, h / 2),
  dome: (r, seg = 32) => new THREE.SphereGeometry(r, seg, seg / 2, 0, TAU, 0, Math.PI / 2).rotateX(Math.PI / 2),
  rbox: (w, h, d, r = 0.12, s = 3) => new RoundedBoxGeometry(w, h, d, s, Math.min(r, w / 2, h / 2, d / 2)).translate(0, 0, d / 2),
  torus: (r, t, seg = 64) => new THREE.TorusGeometry(r, t, 12, seg),
  knurl(r, h, ridges = 30) {
    const g = new THREE.CylinderGeometry(r, r, h, ridges * 2, 1).rotateX(Math.PI / 2).translate(0, 0, h / 2), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), d = Math.hypot(x, y);
      if (d > r * 0.9) { const k = Math.round(Math.atan2(y, x) / TAU * ridges * 2) % 2 ? 0.93 : 1; p.setXY(i, x * k, y * k); }
    }
    g.computeVertexNormals(); return g;
  },
};
const mesh = (geo, mat, x = 0, y = 0, z = 0, shadow = true) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; return m; };
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const FONT = '"Fredoka", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif';

/* ---------- the board: birch plywood, leaning back a little ---------- */
const LEAN = THREE.MathUtils.degToRad(9);
const pivot = new THREE.Group(); pivot.rotation.x = -LEAN; scene.add(pivot);        // pivots on its back bottom edge
const board = new THREE.Group(); board.position.set(0, BH / 2, BT); pivot.add(board);

const PX = 48, TW = BW * PX, TH = BH * PX;
const px = (x, y) => [(x + BW / 2) * PX, (BH / 2 - y) * PX];
const polar = (cx, cy, r, deg) => [cx + r * Math.sin(deg * Math.PI / 180), cy + r * Math.cos(deg * Math.PI / 180)];   // deg clockwise from up
// Burned-in lines that wire each control to the thing it drives, plus labels, notes and number rings.
function engrave(g, ink, paint) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  const path = pts => { g.beginPath(); pts.forEach(([x, y], i) => { const [u, v] = px(x, y); i ? g.lineTo(u, v) : g.moveTo(u, v); }); };
  const stroke = (pts, w = 0.075) => { path(pts); g.lineWidth = w * PX; g.strokeStyle = ink; g.stroke(); };
  const ring = (x, y, r, w = 0.06) => { const [u, v] = px(x, y); g.beginPath(); g.arc(u, v, r * PX, 0, TAU); g.lineWidth = w * PX; g.strokeStyle = ink; g.stroke(); };
  const wire = pts => { stroke(pts); ring(...pts[0], 0.13); ring(...pts[pts.length - 1], 0.13); };
  const text = (s, x, y, size = 0.5) => { const [u, v] = px(x, y); g.font = `600 ${size * PX}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = ink; g.fillText(s, u, v); };
  const arc = (cx, cy, r, from, to) => { const pts = []; for (let i = 0; i <= 24; i++) pts.push(polar(cx, cy, r, lerp(from, to, i / 24))); stroke(pts); };
  const rays = (cx, cy, r0, r1, from, to, n) => { for (let i = 0; i < n; i++) { const d = lerp(from, to, i / (n - 1)); stroke([polar(cx, cy, r0, d), polar(cx, cy, r1, d)], 0.07); } };
  const note = (x, y, double) => {
    const [u, v] = px(x, y); g.save(); g.translate(u, v); g.fillStyle = ink; g.strokeStyle = ink; g.lineWidth = 0.07 * PX;
    const head = (hx, hy) => { g.beginPath(); g.ellipse(hx, hy, 0.2 * PX, 0.14 * PX, -0.4, 0, TAU); g.fill(); g.beginPath(); g.moveTo(hx + 0.18 * PX, hy); g.lineTo(hx + 0.18 * PX, hy - 0.85 * PX); g.stroke(); };
    head(0, 0);
    if (double) { head(0.55 * PX, -0.12 * PX); g.lineWidth = 0.13 * PX; g.beginPath(); g.moveTo(0.18 * PX, -0.85 * PX); g.lineTo(0.73 * PX, -0.97 * PX); g.stroke(); }
    else { g.beginPath(); g.moveTo(0.18 * PX, -0.85 * PX); g.quadraticCurveTo(0.55 * PX, -0.55 * PX, 0.42 * PX, -0.25 * PX); g.stroke(); }
    g.restore();
  };
  { const [u, v] = px(-BW / 2 + 0.8, BH / 2 - 0.8); g.beginPath(); g.roundRect(u, v, (BW - 1.6) * PX, (BH - 1.6) * PX, 1.2 * PX); g.lineWidth = 0.05 * PX; g.strokeStyle = ink; g.stroke(); }
  L.toggles.forEach(([x, y], i) => {
    text('ON', x, y + 1.45, 0.42); text('OFF', x, y - 1.45, 0.42);
    wire([[x, y + 1.85], [x, L.leds[i][1] - 0.75]]);
    rays(x, L.leds[i][1], 0.9, 1.2, -70, 70, 5);
  });
  wire([[L.beaconBtn[0], L.beaconBtn[1] + 1.2], [L.beaconBtn[0], BH / 2 - 0.35]]);
  for (let n = 0; n < 10; n++) text(String(n), ...polar(L.numKnob[0], L.numKnob[1], 2.05, -135 + n * 30), 0.55);
  wire([[L.seg[0], 8.2], [L.seg[0], 7.7], [L.numKnob[0], 7.7], [L.numKnob[0], 8.55]]); stroke([[L.frame[0], 7.7], [L.frame[0], 8.95]]); ring(L.frame[0], 8.95, 0.13);
  text('LIGHTS', L.night[0], 8.5, 0.46);
  const [gx, gy] = L.gaugeKnob;
  rays(gx, gy, 1.45, 1.72, -135, 135, 11); text('0', ...polar(gx, gy, 2.15, -135), 0.42); text('10', ...polar(gx, gy, 2.2, 135), 0.42);
  wire([[gx - 1.75, gy], [-9.7, gy], [-9.7, 2.3]]); wire([[gx + 1.75, gy], [-3.2, gy], [-3.2, -3.95]]);
  const [kx, ky] = L.key;
  text('OFF', kx, ky + 1.5, 0.42); text('ON', kx + 1.6, ky, 0.42); arc(kx, ky, 1.25, 10, 80);
  wire([[kx - 1.25, ky], [-0.3, ky], [-0.3, 1.35]]);
  wire([[L.domeRocker[0], L.domeRocker[1] + 1.15], [L.domeRocker[0], 1.2]]);
  wire([[L.colorKnob[0], L.colorKnob[1] + 2.1], [L.colorKnob[0], 1.25]]);

/* ---------- interaction ---------- */
function setValue(c, v, silent = false) {
  v = c.kind === 'step' ? ((v % c.n) + c.n) % c.n : v ? 1 : 0;
  if (v === c.value) return;
  c.value = v;
  if (!silent && c.sound) c.sound(v);
  c.onChange?.(v);
}
function activate(c) { if (c.kind === 'switch') setValue(c, 1 - c.value); else if (c.kind === 'step') setValue(c, c.value + 1); }
function press(c, down) { if (c.pressed === down) return; c.pressed = down; if (down) { SFX.press(); c.onPress?.(); } }
function resetAll() {
  SFX.reset();
  controls.filter(c => c !== resetBtn && c.value !== 0).forEach((c, i) => setTimeout(() => setValue(c, 0), 110 + i * 90));
}
musicBtns.forEach((b, i) => { b.onPress = () => { SFX.note(MUSIC[i].f); popNote(L.music[i], MUSIC[i].col); }; });
resetBtn.onPress = resetAll;

// Keyboard: Tab between controls, Space/Enter to use one, arrows to turn a dial.

// Soft glowing rings: one follows the pointer, one shows keyboard focus, and when nobody has

const ringMat = col => new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });

board.add(hoverRing, focusRing);
const ringSize = c => Array.isArray(c.ring) ? c.ring : [c.ring, c.ring];

/* ---------- render ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.4, 1.3);   // only things that really glow
composer.addPass(bloom);
composer.addPass(new OutputPass());
const _q = new THREE.Quaternion();
function fit() {

  camera.aspect = w / h;
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const dist = Math.max((BH + 7) / 2 / Math.tan(vf / 2), (BW + 5) / 2 / Math.tan(hf / 2));
  const c = board.localToWorld(new THREE.Vector3(0, 0.9, 0)), n = new THREE.Vector3(0, 0, 1).applyQuaternion(board.getWorldQuaternion(_q));

addEventListener('resize', fit);
fit();
// ?demo switches a few things on (used for the preview image).
if (new URLSearchParams(location.search).has('demo')) {
  [toggles[0], toggles[2], keySw, domeSw, fanSw, beaconBtn, rocketLever].forEach(c => setValue(c, 1, true));
  setValue(gaugeKnob, 7, true); setValue(numKnob, 5, true); setValue(trafficSlider, 1, true); setValue(colorKnob, 5, true);
}

Object.assign(rocketFx, { vel: 0, puffT: 0, pn: 0 });
function puff(R) {
  const p = R.puffs[R.pn++ % R.puffs.length];
  p.t = 0; p.vx = rr(-1.3, 1.3); p.s.position.set(rr(-0.25, 0.25), R.rocket.position.y - 1.05, 1.3);
}
const WALL_DAY = new THREE.Color('#c3cedb'), WALL_NIGHT = new THREE.Color('#4a5870');

  speakerFx.rings.forEach(r => { r.t += dt; const k = r.t / 0.9; r.m.visible = k < 1; if (k < 1) { r.m.scale.setScalar(1.9 + k * 2.6); r.m.material.opacity = (1 - k) * 0.7; } });

  beaconFx.spin.getWorldPosition(_a); beaconFx.spot.target.getWorldPosition(_b); _b.sub(_a).normalize();

  notes.forEach(n => { n.t += dt; const k = n.t / 1.5; n.s.visible = k < 1; if (k < 1) { n.s.position.y += dt * 2.2; n.s.position.x += n.vx * dt; n.s.material.opacity = Math.min(1, k * 6) * (1 - k); n.s.scale.setScalar(1.0 + k * 0.7); n.s.material.rotation = Math.sin(n.t * 6) * 0.3; } });

  sun.intensity = lerp(1.15, 0.55, night);
  renderer.toneMappingExposure = lerp(1.0, 1.12, night); sun.color.lerpColors(SUN_DAY, SUN_NIGHT, night);
  scene.background.lerpColors(DAY_BG, NIGHT_BG, night);

  bloom.strength = lerp(0.3, 0.75, night);
  if ((night > 0.5) !== nightClass) { nightClass = night > 0.5; document.body.classList.toggle('night', nightClass); }

}
